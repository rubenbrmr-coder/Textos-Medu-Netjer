rirá ni lo que hará el dios cuando castigue.", "an": "n rḫ.n.tw: «no se sabe». ḫprt: participio; jrrt nṯr: forma relativa imperfectiva («lo que hace el dios»).", "id": "24.16"}, {"t": "tt", "g": "𓏎 𓁹𓏏𓈖 𓎢 𓈖 𓀀 𓄤𓆑𓂋𓏏", "ref": "Corpus del TLA, Reino Medio (dinastía XIII)", "vo": [["jnj", "traer"]], "tr": "jnj jrt.n.k n.j nfrt", "es": "Trae lo bueno que has hecho por mí.", "an": "jrt.n.k: forma relativa sustantivada. nfrt concuerda con ella: «lo que hiciste por mí (que es) bueno».", "id": "24.17"}, {"t": "tt", "g": "𓄂𓂝 𓅓 𓋴𓃀𓇼𓇋𓇋𓏏𓏛 𓁹𓏏𓈖 𓆑 𓐍𓂋 𓄟𓋴𓅱𓀀𓏥 𓆑", "ref": "Corpus del TLA, Reino Medio (principios de la dinastía XIII)", "vo": [["ḥꜣt-ꜥ", "comienzo"], ["sbꜣyt", "enseñanza"]], "tr": "ḥꜣt-ꜥ m sbꜣyt jrt.n.f ḫr msw.f", "es": "Comienzo de la enseñanza que hizo para sus hijos.", "an": "jrt.n.f: forma relativa femenina que concuerda con sbꜣyt.", "id": "24.18"}, {"t": "tt", "g": "𓎗𓅱𓏏𓏛𓈖 𓍛𓏤 𓎡 𓆣𓂋𓏛𓏥", "ref": "Corpus del TLA, Reino Medio (dinastía XIII)", "vo": [["wḏ", "ordenar"]], "tr": "wḏt.n ḥm.k ḫpr", "es": "Lo que tu Majestad ha ordenado es lo que sucede.", "an": "wḏt.n ḥm.k: forma relativa sustantivada como sujeto; ḫpr: participio «lo que sucede».", "id": "24.19"}, {"t": "tt", "g": "𓐍𓅓𓏏𓂜𓈖 𓆑 𓁷𓂋𓇋𓇋𓎅𓈐 𓋴𓏏 𓂋 𓁹𓏏 𓌳𓐙𓂝𓏏", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "vo": [["ḫm", "ignorar"], ["ḥrj", "estar lejos"]], "tr": "ḫmt.n.f ḥrj st r jrt mꜣꜥt", "es": "Lo que él no conoce, está lejos de hacer lo justo.", "an": "ḫmt.n.f: forma relativa («lo que ignoró»). ḥrj st: adjetivo-predicado + pronombre dependiente.", "id": "24.20"}, {"t": "tt", "g": "𓂜𓈖 𓈙𓂋𓅪 𓁹𓏏𓈖 𓀀 𓁶𓏤 𓇾𓈇𓏤", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "vo": [["šrj", "ser pequeño"]], "tr": "nn šrj jrt.n.j tp tꜣ", "es": "Lo que hice en la tierra no será pequeño.", "an": "nn + sḏm.f (šrj): negación futura. jrt.n.j: forma relativa sustantivada como sujeto.", "id": "24.21"}]}, {"id": "D", "title": "Ahmose hijo de Abana (Urk. IV)", "items": [{"t": "tr", "ref": "Autobiografía de Ahmose hijo de Abana, l. 3–4 (Urk. IV 1–11)", "vo": [["qn", "valiente"], ["ḥtm", "perecer"]], "tr": "jw rn n qn m jrt.n.f nn ḥtm m tꜣ pn ḏt", "es": "El nombre del valiente está en lo que ha hecho; no perecerá en esta tierra jamás.", "an": "jrt.n.f: forma relativa sustantivada («lo que hizo»). nn ḥtm: negación futura con el sḏm.f de ḥtm.", "id": "24.22"}]}]}, "25": {"intro": "Usos especiales de las formas relativas: oraciones sustantivas y oraciones enfáticas que ponen de relieve un complemento.", "secs": [{"id": "A", "title": "Análisis de frases reales", "items": [{"t": "mc", "ref": "Fórmula autobiográfica (tema 24): jr.n.j mrrt rmṯ «hice lo que la gente ama»", "q": "En jr.n.j mrrt rmṯ, ¿qué función cumple la forma relativa mrrt rmṯ?", "op": ["Es un sustantivo: el objeto de jr.n.j («lo que la gente ama»)", "Es un adjetivo que califica a un sustantivo anterior", "Es el predicado de una oración nominal", "Es una oración circunstancial"], "ok": 0, "an": "La forma relativa sin antecedente funciona como sustantivo (uso no atributivo): aquí es el complemento directo.", "id": "25.1", "g": "𓁹𓈖𓀀 𓌻𓂋𓂋𓏏 𓂋𓅓𓍿𓀀𓁐𓏥"}, {"t": "mc", "ref": "Estela de Semna (tema 7): kꜣꜣt jb.j pw ḫprt m ꜥ.j", "q": "¿Qué es kꜣꜣt jb.j en esta oración?", "op": ["Una forma relativa sustantivada que funciona como sujeto de A pw B", "Un infinitivo", "Un participio activo concertado", "Un imperativo"], "ok": 0, "an": "«Lo que planea mi corazón» es una forma relativa usada como sustantivo; ḫprt m ꜥ.j es un participio sustantivado («lo que sucede por mi mano»).", "id": "25.2", "g": "𓂓𓄿𓄿𓏏𓀁 𓄣𓏤𓀀 𓊪𓅱 𓆣𓂋𓏏 𓅓 𓂝𓀀"}, {"t": "mc", "ref": "Fórmula de ofrenda (tema 24): ḫt nbt nfrt wꜥbt dd pt", "q": "En ḫt nbt nfrt wꜥbt dd pt, ¿el uso de la forma relativa dd es atributivo o no atributivo?", "op": ["Atributivo: califica a ḫt («que da el cielo»)", "No atributivo: es una oración enfática", "No atributivo: es el sujeto", "No es una forma relativa"], "ok": 0, "an": "Tiene antecedente (ḫt) y lo califica: es el uso normal, atributivo. Los usos especiales del tema 25 son los que no tienen antecedente.", "id": "25.3", "g": "𓐍𓏏 𓎟𓏏 𓄤𓏏 𓃂𓏏 𓂞𓂧 𓊪𓏏𓇯"}]}, {"id": "B", "title": "Teoría", "items": [{"t": "mc", "q": "¿Qué caracteriza a una oración enfática (forma relativa no atributiva)?", "op": ["El verbo pasa a ser el tema y la información nueva está en un complemento adverbial", "Siempre empieza por jw", "No tiene sujeto", "Es una pregunta"], "ok": 0, "an": "En mrr.f sw m ḥrw «es en la cara donde lo ama», lo que importa es m ḥrw, no el hecho de amar.", "id": "25.4"}]}, {"id": "C", "title": "Más textos reales", "items": [{"t": "tt", "ref": "Sinuhé B 28", "vo": [["wḥwt", "tribu, aldea"]], "tr": "šm.n.j ḥnꜥ.f n wḥwt.f nfr jrt.n.sn", "es": "Fui con él a su tribu. Lo que hicieron (por mí) fue bueno.", "an": "nfr jrt.n.sn: oración adjetival cuyo sujeto es una forma relativa sustantivada (jrt.n.sn «lo que hicieron»).", "id": "25.5", "g": "𓈝𓂻𓈖𓀀 𓎛𓈖𓂝𓆑 𓈖 𓅱𓎛𓅱𓏏𓊖𓆑 𓄤 𓁹𓏏𓈖𓋴𓈖𓏥"}, {"t": "tt", "g": "𓏲𓍑𓄿𓂻 𓊪𓏲 𓁹𓈖 𓍛𓏤𓅆 𓆑 𓂋 𓉥𓂝𓉐 𓆑", "ref": "Corpus del TLA, Reino Medio (dinastía XIII)", "vo": [["wḏꜣ", "ir, partir"], ["ꜥḥ", "palacio"]], "tr": "wḏꜣ pw jr.n ḥm.f r ꜥḥ.f|wḏꜣ pw jrj.n ḥm.f r ꜥḥ.f", "es": "Su Majestad partió hacia su palacio.", "an": "Construcción narrativa infinitivo + pw + forma relativa jr.n.f: «partir fue lo que hizo Su Majestad».", "id": "25.6"}, {"t": "tt", "g": "𓆷𓄿𓊃𓂻 𓊪𓏲 𓁹𓈖 𓋴", "ref": "Corpus del TLA, Reino Medio (dinastía XIII)", "vo": [["šꜣs", "marcharse"]], "tr": "šꜣs pw jr.n.s|šꜣs pw jrj.n.s", "es": "Ella se marchó.", "an": "Infinitivo + pw + jr.n.s: «marcharse fue lo que hizo».", "id": "25.7"}, {"t": "tt", "ref": "Enseñanza para Merikare E 131", "vo": [["dr", "repeler"], ["snk", "voracidad, monstruo"]], "tr": "dr.n.f snk n mw", "es": "Repelió al monstruo de las aguas.", "an": "Perfecto narrativo en una serie de alabanzas al dios creador.", "id": "25.8", "g": "𓂧𓂋𓂡𓈖𓆑 𓋴𓈖𓎡𓆊 𓈖 𓈗"}, {"t": "tt", "ref": "Enseñanza para Merikare E 136", "vo": [["ḥkꜣw", "magia"], ["ꜥḥꜥw", "armas"], ["ḫsf", "rechazar"], ["ꜥ", "golpe"], ["ḫprt", "lo que sucede"]], "tr": "jr.n.f n.sn ḥkꜣw r ꜥḥꜥw r ḫsf ꜥ n ḫprt", "es": "Para ellos hizo la magia, como arma para rechazar el golpe de lo que sucede.", "an": "Puede leerse como enfática: el peso de la frase recae en el complemento («es como arma… para lo que la hizo»). ḫprt es un participio femenino sustantivado.", "id": "25.9", "g": "𓁹𓈖𓆑 𓈖𓋴𓈖𓏥 𓎛𓂓𓄿𓏛 𓂋 𓊢𓂝𓅱𓌡𓏥 𓂋 𓐍𓋴𓆑𓂡 𓂝 𓈖 𓆣𓂋𓏏"}, {"t": "tt", "ref": "Enseñanza para Merikare E 132", "vo": [["snnw", "imagen, copia"], ["prw", "salidos"]], "tr": "snnw.f pw prw m ḥꜥw.f", "es": "Son sus imágenes, salidas de su cuerpo.", "an": "Oración nominal con pw. prw: participio plural que califica a snnw.f.", "id": "25.10", "g": "𓌢𓈖𓈖𓅱𓀾𓏥𓆑 𓊪𓅱 𓉐𓂋𓅱𓂻𓏥 𓅓 𓎛𓂝𓅱𓄹𓏥𓆑"}, {"t": "tt", "g": "𓆷𓊃𓂻 𓊪𓏲 𓁹𓈖 𓏏𓄿 𓍏𓃀𓅡𓄿𓏏𓏛𓁐 𓃹𓈖𓉿𓂡𓈖 𓊃 𓏏𓄿 𓂝𓏏𓉐", "ref": "Papiro Westcar (la sirvienta de Reddyedet)", "vo": [["wbꜣyt", "sirvienta"], ["ꜥt", "estancia, cámara"]], "tr": "šꜣs pw jr.n tꜣ wbꜣyt wn.n.s tꜣ ꜥt", "es": "La sirvienta se marchó y abrió la estancia.", "an": "šꜣs pw jr.n + sujeto: «marcharse fue lo que hizo». wn.n.s: sḏm.n.f que continúa la narración.", "id": "25.11"}, {"t": "tt", "g": "𓅧𓈎𓂻 𓊪𓏲 𓁹𓈖 𓋴𓈖𓏥 𓁶𓏤𓅓 𓂋𓂧𓌗𓏛𓊽𓂧𓏏𓁐", "ref": "Papiro Westcar (las diosas ante Reddyedet)", "vo": [["ꜥq", "entrar"]], "tr": "ꜥq pw jr.n.sn tp-m rwd-ḏdt", "es": "Entraron ante Reddyedet.", "an": "Infinitivo + pw + jr.n.sn: «entrar fue lo que hicieron». tp-m: «delante de».", "id": "25.12"}, {"t": "tt", "g": "𓎢𓊃𓏏𓀗 𓊪𓏲 𓁹𓈖 𓍏𓃀𓅡𓄿𓏛𓇋𓈖𓂋𓊌𓀀", "ref": "Papiro Westcar (el cuento de Ubainer)", "vo": [["ksj", "inclinarse"]], "tr": "ksj pw jr.n wbꜣ-jnr", "es": "Ubainer se inclinó.", "an": "Infinitivo + pw + jr.n + sujeto nominal.", "id": "25.13"}, {"t": "tt", "g": "𓅱𓍑𓄿𓂻 𓊪𓅱 𓁹𓈖 𓍛𓏤 𓆑 𓂋 𓉐𓏤𓏛𓏏𓏤", "ref": "Estela de Neferhotep I (Abidos)", "vo": [["pr-mḏꜣt", "casa de los libros, archivo"]], "tr": "wḏꜣ pw jr.n ḥm.f r pr-mḏꜣt", "es": "Su Majestad fue a la Casa de los Libros.", "an": "Infinitivo + pw + jr.n.f.", "id": "25.14"}, {"t": "tt", "g": "𓂻𓅱𓏏 𓊪𓏲 𓁹𓈖 𓅡𓎢𓀀𓇋𓅓 𓅓𓏃𓈖𓏏𓇋𓇋𓏏𓊛", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "vo": [["ḫntyt", "viaje río arriba"], ["bꜣk-jm", "este servidor (= yo)"]], "tr": "jwt pw jr.n bꜣk-jm m ḫntyt", "es": "Este servidor vino río arriba.", "an": "jwt pw jr.n + sujeto. bꜣk-jm «este servidor» es una forma humilde de decir «yo».", "id": "25.15"}]}]}, "26": {"intro": "Pasajes más largos para reunir todo lo aprendido. Translitera y traduce cada pasaje completo; las soluciones analizan las construcciones principales.", "secs": [{"id": "A", "title": "Lecturas", "items": [{"t": "tt", "ref": "Fórmulas autobiográficas de tumbas y estelas (Imperio Antiguo – Reino Medio), reunidas en un solo pasaje", "vo": [["ḥqr", "hambriento"], ["ḥbs", "ropa"], ["ḥꜣy", "desnudo"], ["ḏꜣ", "transportar"], ["mḫnt", "barca"], ["mrrt", "lo que ama"], ["ḥzzt", "lo que alaba"]], "tr": "rdj.n.j tꜣ n ḥqr ḥbs n ḥꜣy ḏꜣ.n.j jwtj mḫnt.f jr.n.j mrrt rmṯ ḥzzt nṯrw|rdj.n.j tꜣ n ḥqr ḥbsw n ḥꜣy ḏꜣ.n.j jwtj mḫnt.f jr.n.j mrrt rmṯ ḥzzt nṯrw", "es": "Di pan al hambriento y ropa al desnudo; transporté al que no tenía barca; hice lo que la gente ama y lo que los dioses alaban.", "an": "Perfectos (tema 18), preposición n (tema 8), jwtj (tema 12) y formas relativas sustantivadas (temas 24 y 25).", "id": "26.1", "g": "𓂋𓂞𓈖𓀀 𓏏𓄿𓏐 𓈖 𓎛𓈎𓂋𓀁 𓎛𓃀𓋴𓋳 𓈖 𓎛𓄿𓇋𓇋𓀀 𓍑𓄿𓇋𓇋𓊛𓈖𓀀 𓇋𓅱𓏏𓏭 𓅓𓐍𓈖𓏏𓊛𓆑 𓁹𓈖𓀀 𓌻𓂋𓂋𓏏 𓂋𓅓𓍿𓀀𓁐𓏥 𓎿𓋴𓋴𓏏 𓊹𓊹𓊹"}, {"t": "tt", "ref": "Libro de los Muertos, cap. 30B", "vo": [["ḥꜣtj", "corazón (otra palabra)"], ["ḫprw", "formas, transformaciones"], ["mtrw", "testigo"], ["ḏꜣḏꜣt", "tribunal"]], "tr": "jb.j n mwt.j jb.j n mwt.j ḥꜣtj.j n ḫprw.j m ꜥḥꜥ r.j m mtrw m ḫsf r.j m ḏꜣḏꜣt", "es": "¡Mi corazón de mi madre, mi corazón de mi madre, mi corazón de mis transformaciones! ¡No te levantes contra mí como testigo, no te opongas a mí en el tribunal!", "an": "Vocativos (tema 16) e imperativos negativos con m (tema 16). Se inscribía en el escarabeo de corazón.", "id": "26.2", "g": "𓄣𓏤𓀀 𓈖 𓅐𓏏𓁐𓀀 𓄣𓏤𓀀 𓈖 𓅐𓏏𓁐𓀀 𓄂𓏏𓏭𓄣𓀀 𓈖 𓆣𓂋𓅱𓏥𓀀 𓅓𓂝 𓊢𓂝𓂻 𓂋𓀀 𓅓 𓅓𓏏𓂋𓅱𓀀𓏥 𓅓𓂝 𓐍𓋴𓆑𓂡 𓂋𓀀 𓅓 𓆓𓄿𓆓𓄿𓏏𓉐"}, {"t": "tt", "ref": "Llamada a los vivos (estelas del Reino Medio)", "vo": [["mrrw", "que aman"], ["msḏḏw", "que odian"], ["ḫpt", "muerte"], ["ḏd.ṯn", "que digáis"], ["jmꜣḫy", "venerado"]], "tr": "j ꜥnḫw tpjw tꜣ mrrw ꜥnḫ msḏḏw ḫpt ḏd.ṯn ḫꜣ m t ḥnqt ḫꜣ m kꜣ ꜣpd n kꜣ n jmꜣḫy", "es": "¡Oh vivos que estáis sobre la tierra, que amáis la vida y odiáis la muerte: decid «mil de pan y cerveza, mil de bueyes y aves para el ka del venerado»!", "an": "Vocativo con participios (temas 16 y 23) y subjuntivo de petición ḏd.ṯn (tema 19).", "id": "26.3", "g": "𓇋𓀁 𓋹𓈖𓐍𓅱𓀀𓏥 𓁶𓊪𓅱𓏭𓏥 𓇾𓏤 𓌻𓂋𓂋𓅱𓀀𓏥 𓋹𓈖𓐍 𓅓𓋴𓆓𓆓𓅱𓅪 𓐍𓊪𓏏𓀐 𓆓𓂧𓍿𓈖𓏥 𓆼 𓅓 𓏐 𓏊 𓆼 𓅓 𓃾 𓅾 𓈖 𓂓𓏤 𓈖 𓄪𓇋𓇋"}, {"t": "tt", "ref": "Estela de Semna de Senuseret III (Berlín 1157), final", "vo": [["grt", "además"], ["srwḏ.tj.fj", "que mantenga"], ["tꜣš", "frontera"], ["fḫ.tj.fj", "quien la pierda"]], "tr": "jr grt zꜣ.j nb srwḏ.tj.fj tꜣš pn jrj.n ḥm.j zꜣ.j pw jr grt fḫ.tj.fj sw n zꜣ.j js n ms.tw.f n.j js|jr grt sꜣ.j nb srwḏ.tj.fj tꜣš pn jrj.n ḥm.j sꜣ.j pw jr grt fḫ.tj.fj sw n sꜣ.j js n ms.tw.f n.j js", "es": "En cuanto a todo hijo mío que mantenga esta frontera que ha hecho Mi Majestad, ése es mi hijo. Pero quien la pierda no es mi hijo, no ha nacido de mí.", "an": "sḏmtj.fj (tema 22), forma relativa jrj.n (tema 24), oración nominal con pw (tema 7), negación n … js (tema 11) y pasivo ms.tw.f (tema 21).", "id": "26.4", "g": "𓇋𓂋 𓎼𓂋𓏏 𓅭𓀀 𓎟 𓋴𓂋𓅱𓆓𓂡𓏏𓏭𓆑𓏭 𓏏𓄿𓈙𓈇 𓊪𓈖 𓁹𓂋𓈖 𓍛𓀀 𓅭𓀀 𓊪𓅱 𓇋𓂋 𓎼𓂋𓏏 𓆑𓐍𓏏𓏭𓆑𓏭 𓇓𓅱 𓂜 𓅭𓀀 𓇋𓋴 𓂜 𓄟𓋴𓏏𓅱𓆑 𓈖𓀀 𓇋𓋴"}, {"t": "tt", "ref": "Gran Himno a Atón (tumba de Ay en Amarna)", "vo": [["wbn", "alzarse"], ["ḥtp", "ponerse (el sol)"], ["jmntt", "occidental"], ["kkw", "oscuridad"], ["sḫr", "manera"]], "tr": "wbn.k nfr m ꜣḫt nt pt ḥtp.k m ꜣḫt jmntt tꜣ m kkw m sḫr mt", "es": "Te alzas hermoso en el horizonte del cielo… Cuando te pones en el horizonte occidental, la tierra queda en tinieblas, a la manera de la muerte.", "an": "sḏm.f de acción general (tema 20), sḏm.f circunstancial y oración adverbial sin jw (tema 10).", "id": "26.5", "g": "𓅱𓃀𓈖𓇳𓎡 𓄤𓆑𓂋 𓅓 𓅜𓐍𓏏𓈌 𓈖𓏏 𓊪𓏏𓇯 𓊵𓏏𓊪𓎡 𓅓 𓅜𓐍𓏏𓈌 𓋀𓏏 𓇾𓏤 𓅓 𓎡𓎡𓅱𓇰 𓅓 𓋴𓐍𓂋𓏛 𓅓𓏏𓀐"}, {"t": "tt", "ref": "El náufrago 25–27 y 30–31", "vo": [["hꜣ.kw", "bajé"], ["ꜣw", "longitud"], ["sḫw", "anchura"], ["sr", "predecir"], ["ḏꜥ", "tormenta"], ["nšnj", "tempestad"]], "tr": "hꜣ.kw r wꜣḏ-wr m dpt nt mḥ 120 m ꜣw.s mḥ 40 m sḫw.s sr.sn ḏꜥ n jjt.f nšnj n ḫprt.f", "es": "Bajé al mar en un barco de 120 codos de largo y 40 de ancho… Predecían la tormenta antes de que llegara, la tempestad antes de que se produjera.", "an": "Estativo de 1.ª persona hꜣ.kw (tema 17), números (tema 9) y n sḏmt.f «antes de que» (tema 22): jjt.f, ḫprt.f.", "id": "26.6", "g": "𓉔𓄿𓂻𓎡𓅱 𓂋 𓇅𓅨𓂋𓈗 𓅓 𓂧𓊪𓏏𓊛 𓈖𓏏 𓂣 𓍢𓎆𓎆 𓅓 𓄿𓅱𓏛𓋴 𓂣 𓎆𓎆𓎆𓎆 𓅓 𓋴𓐍𓅱𓏛𓋴 𓋴𓂋𓃱𓋴𓈖𓏥 𓆓𓂝𓈖𓇯 𓈖 𓇍𓏏𓂻𓆑 𓈖𓈙𓈖𓇋𓃩 𓈖 𓆣𓂋𓏏𓆑"}]}, {"id": "B", "title": "Más textos reales", "items": [{"t": "tt", "ref": "Papiro Edwin Smith: los tres veredictos posibles del médico", "vo": [["mr", "enfermedad"], ["ꜥḥꜣ", "luchar"]], "tr": "mr jrj.j mr ꜥḥꜣ.j ḥnꜥ.f mr n jrw.f", "es": "Una enfermedad que trataré. Una enfermedad con la que lucharé. Una enfermedad que no se tratará.", "an": "Tres relativas sin marca con prospectivo (tema 21): activo, activo con pronombre de retorno y pasivo negado.", "id": "26.7", "g": "𓌻𓂋𓐎 𓁹𓂋𓇋𓀀 𓌻𓂋𓐎 𓂚𓀀 𓎛𓈖𓂝𓆑 𓌻𓂋𓐎 𓂜 𓁹𓂋𓅱𓆑"}, {"t": "tt", "ref": "Libro de los Muertos, cap. 125", "vo": [["ḫr", "ante"], ["dr", "expulsar"], ["ꜥwꜣ", "robar"], ["grg", "mentira"]], "tr": "jj.n.j ḫr.k nb.j jn.n.j n.k mꜣꜥt dr.n.j n.k jsft n ꜥwꜣ.j n ḏd.j grg", "es": "He venido ante ti, señor mío. Te he traído la verdad, he expulsado para ti la injusticia. No he robado, no he dicho mentiras.", "an": "Perfectos (tema 18) y n sḏm.f (tema 20): el difunto se presenta ante el tribunal de Osiris.", "id": "26.8", "g": "𓇍𓇋𓂻𓈖𓀀 𓐍𓂋𓎡 𓎟𓀀 𓏎𓈖𓈖𓀀 𓈖𓎡 𓆄𓏏 𓂧𓂋𓈖𓀀 𓈖𓎡 𓇋𓋴𓆑𓏏𓅪 𓂜 𓂝𓅱𓄿𓀜𓀀 𓂜 𓆓𓂧𓀀 𓎼𓂋𓎼𓏛"}, {"t": "tt", "ref": "Gran Himno a Atón (el amanecer)", "vo": [["ḥb", "fiesta"], ["rs", "despertar"], ["r-ḏr.f", "entera"], ["kꜣt", "trabajo"]], "tr": "tꜣwj m ḥb rs.w ꜥḥꜥ.w ḥr rdwj tꜣ r-ḏr.f ḥr jrt kꜣt.sn", "es": "Las Dos Tierras están de fiesta, despiertas y de pie… La tierra entera hace su trabajo.", "an": "Oración adverbial (tema 10), estativos (tema 17) y construcción pseudoverbal (tema 15).", "id": "26.9", "g": <script>
/* ================= Medu Netjer · Textos reales ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const H=s=>`<span class="hg">${esc(s)}</span>`;
const T=s=>`<span class="tr">${esc(s)}</span>`;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1700)}
const MDC={A:'ꜣ',a:'ꜥ',i:'j',H:'ḥ',x:'ḫ',X:'ẖ',S:'š',T:'ṯ',D:'ḏ',z:'s',Z:'s'};
function canon(s,mdc){s=(s||'').normalize('NFC');let o='';for(const ch of s){if(mdc&&MDC[ch]){o+=MDC[ch];continue}const l=ch.toLowerCase();if(l==='z'){o+='s';continue}if(l==='i'||l==='ꞽ'){o+='j';continue}if(/[a-zꜣꜥḥḫẖšṯḏ0-9]/.test(l))o+=l}return o}
function foldTr(s){return s.replace(/[ꜣꜥ]/g,'a').replace(/[ḥḫẖ]/g,'h').replace(/š/g,'s').replace(/ṯ/g,'t').replace(/ḏ/g,'d').replace(/q/g,'k').replace(/y/g,'j').replace(/u/g,'w').replace(/[eo]/g,'')}
function digraphs(s){return s.toLowerCase().replace(/sh/g,'š').replace(/kh/g,'ḫ').replace(/dj/g,'ḏ').replace(/tch|ch/g,'ṯ')}
/* 2 = exacta, 1 = correcta sin diacríticos, 0 = incorrecta */
function trScore(a,sol){
 const alts=sol.split('|');let best=0;
 for(const b of alts){
  const e=canon(b,false);const c=[canon(a,ST.mdc),canon(a,false)];
  if(c.includes(e))return 2;
  const f=foldTr(e);if([...c,canon(digraphs(a),false)].some(x=>x&&foldTr(x)===f))best=1;
 }
 return best;
}
const dayNum=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5);
/* ================= estado ================= */
const LSK='mnej.textos.v1';
let ST={mdc:true,theme:'',r:{},last:null};
try{const s=JSON.parse(localStorage.getItem(LSK)||'null');if(s)Object.assign(ST,s)}catch(e){}
let DOC=null,saveT=null;
function save(){
 try{localStorage.setItem(LSK,JSON.stringify(ST))}catch(e){}
 clearTimeout(saveT);saveT=setTimeout(async()=>{if(DOC){try{await DOC.set({json:JSON.stringify(ST),updated:Date.now()})}catch(e){}}},1200);
}
async function initDB(){
 try{
  if(!window.claude||!claude.use)return;
  const db=await claude.use('db'),user=await claude.use('user');if(!db||!user)return;
  const id=await user.id();if(!id)return;
  DOC=db.doc('data/users/'+id+'/textos/estado');
  const snap=await DOC.get();const d=snap&&(typeof snap.data==='function'?snap.data():snap);
  if(d&&d.json){
   const r=JSON.parse(d.json);
   if(Object.keys(r.r||{}).length>Object.keys(ST.r).length){ST=Object.assign(ST,r);try{localStorage.setItem(LSK,JSON.stringify(ST))}catch(e){};applyTheme();route()}
   else save();
  }else save();
 }catch(e){}
}
function applyTheme(){document.documentElement.dataset.theme=ST.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
function toggleTheme(){ST.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';applyTheme();save()}
/* ================= datos ================= */
const ITEMS={};
for(const n in DATA)for(const s of DATA[n].secs)for(const it of s.items){it.les=+n;it.sec=s.id;ITEMS[it.id]=it}
const lesItems=n=>DATA[n]?DATA[n].secs.flatMap(s=>s.items):[];
const IV=[0,1,3,7,16,35,80];
function rate(id,q){ /* q: 0 mal, 1 casi, 2 bien */
 const r=ST.r[id]||{lv:0,n:0,ok:0};r.n++;
 if(q===2){r.lv=Math.min(r.lv+1,IV.length-1);r.ok++}else if(q===1){r.lv=Math.max(1,Math.min(r.lv,1))}else r.lv=0;
 r.q=q;r.due=dayNum()+(q===0?0:IV[r.lv]||1);ST.r[id]=r;save();
}
function lesProg(n){const it=lesItems(n);if(!it.length)return null;const done=it.filter(x=>ST.r[x.id]).length,good=it.filter(x=>ST.r[x.id]&&ST.r[x.id].q===2).length;return{tot:it.length,done,good}}
const dueList=()=>Object.keys(ST.r).filter(id=>ITEMS[id]&&ST.r[id].due<=dayNum());
/* ================= navegación ================= */
const VIEWS={home:viewHome,tema:viewTema,ej:viewEj,repaso:viewRepaso,info:viewInfo,ajustes:viewAjustes};
function go(h){location.hash=h}
function route(){
 const [v,a,b]=(location.hash.slice(1)||'home').split('/');
 (VIEWS[v]||viewHome)(a,b);
 document.querySelectorAll('[data-nav]').forEach(e=>e.classList.toggle('on',e.dataset.nav===(v==='tema'||v==='ej'?'home':v)));
 const n=dueList().length;document.querySelectorAll('.duec').forEach(e=>e.textContent=n?` (${n})`:'');
 window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
function render(h){$('#main').innerHTML=`<div class="wrap">${h}</div>`}
/* ================= vistas ================= */
function viewHome(){
 let h=`<div class="hero">${H('𓂋𓈖𓏏𓏭𓊹')}<div><h1>Textos reales</h1><p>Ejercicios de lectura sacados de inscripciones y papiros egipcios, ordenados por los 26 temas de Medu Netjer.</p></div></div>`;
 const nd=dueList().length;
 if(nd)h+=`<div class="card row" style="justify-content:space-between;margin-bottom:14px"><div><b>Tienes ${nd} ejercicio${nd>1?'s':''} para repasar hoy.</b><div class="small muted">Los que fallaste o marcaste como dudosos vuelven en el momento oportuno.</div></div><button class="btn gold" onclick="go('repaso')">Repasar</button></div>`;
 h+=`<div class="list">`;
 for(const L of TITLES){
  const p=lesProg(L.n);
  if(p){const pc=Math.round(100*p.good/p.tot);
   h+=`<a class="les" href="#tema/${L.n}"><div class="num">${L.n}</div><div style="flex:1;min-width:0"><div class="ti">${esc(L.title)}</div><div class="small muted">${p.tot} ejercicios · ${p.done} hechos · ${p.good} bien</div><div class="bar"><i style="width:${pc}%"></i></div></div></a>`;
  }else h+=`<div class="les off"><div class="num">${L.n}</div><div style="flex:1"><div class="ti">${esc(L.title)}</div><div class="small muted">En preparación</div></div></div>`;
 }
 render(h+`</div>`);
}
function viewTema(n){
 n=+n;const L=TITLES.find(x=>x.n===n),D=DATA[n];if(!D)return go('home');
 let h=`<p><a href="#home">← Temas</a></p><h2>Tema ${n}. ${esc(L.title)}</h2><p class="muted">${esc(D.intro)}</p>`;
 const p=lesProg(n);
 h+=`<div class="row" style="margin:10px 0 18px"><button class="btn gold" onclick="startRun(${n},'todo')">Hacer el tema completo</button><button class="btn ghost" onclick="startRun(${n},'pend')">Solo pendientes y fallados</button></div>`;
 for(const s of D.secs){
  h+=`<h3>${esc(s.id)}. ${esc(s.title)}</h3><div class="list" style="margin-bottom:16px">`;
  s.items.forEach((it,i)=>{
   const r=ST.r[it.id];const tg=!r?'':r.q===2?'<span class="tag ok">bien</span>':r.q===1?'<span class="tag gold">casi</span>':'<span class="tag bad">mal</span>';
   const head=it.g?`<span class="hg exg${it.mir?' mir':''}">${esc(it.g)}</span>`:`<span class="tr">${esc(it.t==='tr'?it.tr.split('|')[0]:it.q||'')}</span>`;
   h+=`<a class="exrow" href="#ej/${it.id}"><span class="exn">${i+1}</span><span class="exm">${head}<span class="small muted exref">${esc(it.t==='t'?(it.q||''):(it.ref||''))}</span></span>${tg}</a>`;
  });
  h+=`</div>`;
 }
 render(h);
}
/* ---- recorrido ---- */
let RUN=null;
function startRun(n,mode){
 let ids=lesItems(n).map(x=>x.id);
 if(mode==='pend')ids=ids.filter(id=>!ST.r[id]||ST.r[id].q!==2);
 if(!ids.length){toast('No hay ejercicios pendientes en este tema');return}
 RUN={ids,i:0,back:'tema/'+n,ok:0};go('ej/'+ids[0]);
}
function nextInRun(){
 if(RUN&&RUN.i<RUN.ids.length-1){RUN.i++;go('ej/'+RUN.ids[RUN.i]);return}
 if(RUN){const b=RUN.back,tot=RUN.ids.length;RUN=null;render(`<div class="card qbox"><div class="sumbig">✓</div><h2>Has terminado</h2><p class="muted">${tot} ejercicio${tot>1?'s':''}. Los que marcaste como «casi» o «mal» volverán en el repaso.</p><button class="btn gold" onclick="go('${b}')">Volver</button></div>`);return}
 history.back();
}
function viewEj(id){
 const it=ITEMS[id];if(!it)return go('home');
 if(RUN&&RUN.ids[RUN.i]!==id){const k=RUN.ids.indexOf(id);if(k<0)RUN=null;else RUN.i=k}
 const L=TITLES.find(x=>x.n===it.les);
 let top=`<div class="qtop"><a href="#${RUN?RUN.back:'tema/'+it.les}">✕</a>`;
 if(RUN)top+=`<div class="bar"><i style="width:${Math.round(100*RUN.i/RUN.ids.length)}%"></i></div><span class="small muted">${RUN.i+1}/${RUN.ids.length}</span>`;
 else top+=`<span class="small muted">Tema ${it.les} · ${esc(L.title)}</span>`;
 top+=`</div>`;
 let h=`<div class="quiz">${top}<div class="card qbox">`;
 const ins=it.t==='tt'?'Translitera y traduce':it.t==='t'?'Translitera':it.t==='tr'?'Traduce (texto en transliteración)':'Elige la respuesta';
 h+=`<div class="qprompt">${ins}</div>`;
 if(it.g)h+=`<div class="qbig"><span class="hg${it.mir?' mir':''}">${esc(it.g)}</span></div>`;
 if(it.t==='tr')h+=`<div class="qbig"><span class="qtr" style="font-size:1.25em">${esc(it.tr.split('|')[0])}</span></div>`;
 if(it.t==='t'&&it.q)h+=`<div class="qes">${esc(it.q)}</div>`;
 if(it.t==='mc'&&it.q)h+=`<div class="qes">${esc(it.q)}</div>`;
 if(it.ref&&it.t!=='t')h+=`<div class="src">${esc(it.ref)}</div>`;
 if(it.vo&&it.vo.length){
  const tv=it.t!=='mc'&&it.t!=='tr';
  h+=`<div class="gl">${it.vo.map(v=>`<span>${tv&&/[a-zꜣꜥḥḫẖšṯḏ]/i.test(v[0])?`<i class="vt">${esc(v[0])}</i>`:`<i>${esc(v[0])}</i>`} ${esc(v[1])}</span>`).join('')}</div>`;
  if(tv&&it.vo.some(v=>/[a-zꜣꜥḥḫẖšṯḏ]/i.test(v[0])))h+=`<button class="btn ghost sm" style="margin-top:6px" onclick="document.querySelectorAll('.vt').forEach(e=>e.classList.add('on'));this.remove()">Mostrar la transliteración de las pistas</button>`;
 }
 if(it.t==='mc'){
  const ord=shuffle(it.op.map((o,i)=>i));
  h+=`<div class="opts">${ord.map(i=>`<button class="opt" data-i="${i}" onclick="ansMC('${id}',${i},this)">${esc(it.op[i])}</button>`).join('')}</div><div id="fb"></div>`;
 }else{
  if(it.t==='tr')h+=`<div style="text-align:left;margin-top:14px"><label class="small muted">Traducción</label><textarea id="ies" class="inp" placeholder="Tu traducción"></textarea>`;
  else h+=`<div style="text-align:left;margin-top:14px"><label class="small muted">Transliteración</label><input id="itr" class="inp trin" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="${ST.mdc?'p. ej. ḏd.f  o  Dd.f':'p. ej. ḏd.f'}">${kb()}`;
  if(it.t==='tt')h+=`<label class="small muted">Traducción</label><textarea id="ies" class="inp" placeholder="Tu traducción"></textarea>`;
  h+=`</div><div class="row" style="justify-content:center;margin-top:12px"><button class="btn" id="chk" onclick="checkEj('${id}')">Comprobar</button><button class="btn ghost" onclick="checkEj('${id}',true)">Ver solución</button></div><div id="fb"></div>`;
 }
 h+=`</div></div>`;render(h);
 const i=$('#itr');if(i){i.addEventListener('keydown',e=>{if(e.key==='Enter'&&it.t==='t'){e.preventDefault();checkEj(id)}});if(matchMedia('(min-width:821px)').matches)i.focus()}
}
function kb(){
 const k=['ꜣ','j','y','ꜥ','w','b','p','f','m','n','r','h','ḥ','ḫ','ẖ','z','s','š','q','k','g','t','ṯ','d','ḏ','.','-','␣','⌫'];
 return `<div class="kb">${k.map(c=>`<button type="button" onmousedown="event.preventDefault()" onclick="kbPress('${c}')">${c}</button>`).join('')}</div>`;
}
function kbPress(c){
 const i=$('#itr');if(!i)return;const a=i.selectionStart??i.value.length,b=i.selectionEnd??i.value.length;
 if(c==='⌫'){if(a===b&&a>0){i.value=i.value.slice(0,a-1)+i.value.slice(b);i.setSelectionRange(a-1,a-1)}else{i.value=i.value.slice(0,a)+i.value.slice(b);i.setSelectionRange(a,a)}}
 else{const t=c==='␣'?' ':c;i.value=i.value.slice(0,a)+t+i.value.slice(b);i.setSelectionRange(a+t.length,a+t.length)}
 i.focus();
}
function solBox(it){
 return `<div class="sol"><div class="qtr">${esc(it.tr.split('|')[0])}</div>${it.es?`<div class="qes">${esc(it.es)}</div>`:''}${it.an?`<div class="an">${esc(it.an)}</div>`:''}${it.ref&&it.t==='t'?'':''}</div>`;
}
function checkEj(id,reveal){
 const it=ITEMS[id];const a=$('#itr')?$('#itr').value.trim():'';
 const sc=it.t==='tr'?1:(reveal?0:trScore(a,it.tr));
 let msg;
 if(reveal||it.t==='tr')msg=`<b class="t">Solución</b>`;
 else if(sc===2)msg=`<b class="t">✓ Transliteración correcta</b>`;
 else if(sc===1)msg=`<b class="t">✓ Correcta, salvo los signos especiales</b><div class="small">Revisa los puntos y rayas: ḥ/h, ḫ/ẖ, ꜣ/ꜥ, š/s…</div>`;
 else msg=`<b class="t">✗ La transliteración no coincide</b>${a?`<div class="small">Has escrito: ${T(a)}</div>`:''}`;
 let rateH='';
 if(it.t==='tt'||it.t==='tr'){
  const yours=($('#ies')||{}).value||'';
  rateH=`${yours.trim()?`<div class="small" style="margin-top:8px">Tu traducción: <i>${esc(yours)}</i></div>`:''}<div class="small muted" style="margin-top:10px">Compara tu traducción con la solución y valora tu respuesta:</div><div class="row" style="justify-content:center;margin-top:6px"><button class="btn green sm" onclick="rateGo('${id}',2)">Bien</button><button class="btn gold sm" onclick="rateGo('${id}',1)">Casi</button><button class="btn red sm" onclick="rateGo('${id}',0)">Mal</button></div>`;
 }else{
  rate(id,sc===2?2:sc===1?1:0);
  rateH=`<div class="row" style="justify-content:center;margin-top:10px"><button class="btn" onclick="nextInRun()">Siguiente →</button></div>`;
 }
 $('#fb').innerHTML=`<div class="fb ${sc?'ok':'ko'}">${msg}${solBox(it)}${rateH}</div>`;
 $('#chk')&&($('#chk').disabled=true);
 $('#fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function rateGo(id,q){rate(id,q);nextInRun()}
function ansMC(id,i,el){
 const it=ITEMS[id];if(document.querySelector('.opt[disabled]'))return;
 document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(+b.dataset.i===it.ok)b.classList.add('right')});
 const ok=i===it.ok;if(!ok)el.classList.add('wrong');
 rate(id,ok?2:0);
 $('#fb').innerHTML=`<div class="fb ${ok?'ok':'ko'}"><b class="t">${ok?'✓ Correcto':'✗ No es esa'}</b>${it.an?`<div class="an">${esc(it.an)}</div>`:''}<div class="row" style="justify-content:center;margin-top:10px"><button class="btn" onclick="nextInRun()">Siguiente →</button></div></div>`;
}
function viewRepaso(){
 const ids=dueList();
 if(!ids.length){render(`<h2>Repaso</h2><div class="card"><p>No tienes nada pendiente hoy.</p><p class="muted small">Aquí vuelven los ejercicios que fallaste o marcaste como «casi», y más adelante también los que te salieron bien, cada vez más espaciados.</p></div>`);return}
 render(`<h2>Repaso</h2><div class="card"><p><b>${ids.length}</b> ejercicio${ids.length>1?'s':''} para hoy, de ${new Set(ids.map(i=>ITEMS[i].les)).size} tema(s).</p><button class="btn gold" onclick="startRep()">Empezar</button></div>`);
}
function startRep(){const ids=shuffle(dueList());RUN={ids,i:0,back:'repaso'};go('ej/'+ids[0])}
function viewInfo(){
 render(`<h2>Sobre los ejercicios</h2><div class="card prose">
 <p><b>De dónde salen.</b> Todas las frases son egipcias auténticas: inscripciones reales, estelas, títulos y nombres de reyes, y pasajes de obras como <i>El náufrago</i>, <i>Sinuhé</i>, <i>El campesino elocuente</i>, la <i>Enseñanza para Merikare</i>, la estela de Semna, los Textos de los Sarcófagos y el Libro de los Muertos. Cada ejercicio indica su fuente. En los primeros temas hay además ejercicios de práctica con palabras sueltas.</p>
 <p><b>Cómo se cita.</b> Las referencias siguen la numeración habitual de las ediciones: El náufrago por líneas (p. ej. «El náufrago 25–27»), Sinuhé por manuscrito y línea («Sinuhé B 84»), El campesino elocuente por manuscrito («R 1,1», «B1, 62»), Merikare por la línea del papiro de San Petersburgo («E 32»). Así puedes buscar cada frase en una edición o en el Thesaurus Linguae Aegyptiae.</p>
 <p><b>Corpus del TLA.</b> Parte de las frases (las marcadas «Corpus del TLA») y la comprobación de muchas otras proceden del corpus de frases del <i>Thesaurus Linguae Aegyptiae</i> (Berlin-Brandenburgische Akademie der Wissenschaften / Sächsische Akademie der Wissenschaften zu Leipzig), publicado con licencia CC BY-SA 4.0. De él se toman los jeroglíficos y la datación; la transliteración se adapta a las convenciones de Allen, y las traducciones al español y los análisis son propios. Cuando el texto exacto no es seguro se indica solo el periodo.</p>
 <p><b>Ahmose hijo de Abana.</b> Los ejercicios de traducción de la autobiografía de Ahmose hijo de Abana (<i>Urkunden IV</i> 1–11) parten de la transliteración del St Andrews Corpus (M.-J. Nederhof, licencia CC BY 4.0), que sigue la copia de K. Sethe, <i>Urkunden der 18. Dynastie</i> I (1906/1927); la transliteración se adapta a la convención de Allen y las traducciones y análisis son propios. Estos ejercicios no muestran jeroglíficos: se traducen a partir de la transliteración.</p>
 <p><b>La escritura.</b> Los jeroglíficos están en grafía normalizada: se respetan las palabras y su ortografía habitual, pero en una sola línea de izquierda a derecha, sin la disposición en cuadrados del original. Muchos textos literarios están en hierático, de modo que cualquier versión en jeroglíficos es ya una transcripción.</p>
 <p><b>Las soluciones.</b> La transliteración y la traducción de la solución son las mías. Las traducciones egiptológicas varían. Si la tuya dice lo mismo con otras palabras, márcala como bien. Si algo te parece un error, compruébalo con la referencia.</p>
 <p><b>Cómo trabajar.</b> Haz primero el tema en Medu Netjer y el Cuaderno. Luego ven aquí y trata cada frase como en un manual: transliteración y traducción completas antes de mirar la solución, con papel y lápiz si quieres.</p>
 </div>`);
}
function viewAjustes(){
 render(`<h2>Ajustes</h2><div class="card list">
 <label class="row"><input type="checkbox" ${ST.mdc?'checked':''} onchange="ST.mdc=this.checked;save()"> Aceptar transliteración con teclado normal (Manuel de Codage: A=ꜣ, a=ꜥ, H=ḥ, x=ḫ, X=ẖ, S=š, T=ṯ, D=ḏ)</label>
 <div class="row"><button class="btn ghost" onclick="toggleTheme()">Cambiar tema claro/oscuro</button></div>
 <div class="row"><button class="btn red sm" onclick="if(confirm('¿Borrar todo tu progreso en esta app?')){ST.r={};save();toast('Progreso borrado')}">Borrar progreso</button></div></div>`);
}

document.addEventListener('focusin',e=>{if(e.target.matches('input,textarea')){e.target.setAttribute('autocapitalize','none');e.target.setAttribute('autocorrect','off')}});
applyTheme();route();initDB();
