emas anteriores. Identifica la clase.", "secs": [{"id": "A", "title": "¿A qué clase pertenece?", "items": [{"t": "mc", "q": "sḏm «oír»", "op": ["Trilítero fuerte", "Tercera débil", "Segunda geminada", "Anómalo"], "ok": 0, "an": "Tres radicales fuertes s-ḏ-m: no cambia en ninguna forma.", "id": "13.1", "g": "𓄔𓅓"}, {"t": "mc", "q": "mrj «amar»", "op": ["Tercera débil (3ae inf.)", "Bilítero", "Segunda geminada", "Cuatrilítero"], "ok": 0, "an": "La tercera radical j es débil: desaparece en muchas formas (mr.f) y se duplica la r en otras (mrr.f).", "id": "13.2", "g": "𓌻𓂋𓀁"}, {"t": "mc", "q": "mꜣꜣ «ver», como en mꜣ.sn pt (El náufrago 28)", "op": ["Segunda geminada (2ae gem.)", "Tercera débil", "Trilítero fuerte", "Causativo"], "ok": 0, "an": "La segunda radical se repite: mꜣꜣ. En algunas formas aparece mꜣ.f y en otras mꜣꜣ.f.", "id": "13.3", "g": "𓌳𓄿𓁹"}, {"t": "mc", "q": "rdj «dar, poner», como en rdj.n.j tꜣ n ḥqr", "op": ["Anómalo", "Trilítero fuerte", "Bilítero", "Segunda geminada"], "ok": 0, "an": "rdj alterna con dj según la forma: es uno de los verbos anómalos, junto con jj/jwj «venir».", "id": "13.4", "g": "𓂋𓂞"}, {"t": "mc", "q": "jj «venir», como en jj.n.j m njwt.j", "op": ["Anómalo", "Tercera débil regular", "Bilítero", "Causativo"], "ok": 0, "an": "jj y jwj se reparten las formas del verbo «venir»: anómalo.", "id": "13.5", "g": "𓇍𓇋𓂻"}, {"t": "mc", "q": "sꜥnḫ «hacer vivir», como en el Himno a Hapy", "op": ["Causativo (s- + ꜥnḫ)", "Cuatrilítero", "Tercera débil", "Bilítero"], "ok": 0, "an": "El prefijo s- forma causativos: ꜥnḫ «vivir» → sꜥnḫ «hacer vivir».", "id": "13.6", "g": "𓋴𓋹𓈖𓐍"}, {"t": "mc", "q": "prj «salir», como en prt m hrw «salir de día»", "op": ["Tercera débil", "Trilítero fuerte", "Segunda geminada", "Anómalo"], "ok": 0, "an": "pr-j: la j final débil hace aparecer la -t en el infinitivo (prt).", "id": "13.7", "g": "𓉐𓂋𓂻"}, {"t": "mc", "q": "ḏd «decir»", "op": ["Bilítero", "Tercera débil", "Segunda geminada", "Anómalo"], "ok": 0, "an": "Dos radicales fuertes: ḏ-d.", "id": "13.8", "g": "𓆓𓂧𓀁"}, {"t": "mc", "q": "ḫpr «llegar a ser»", "op": ["Trilítero fuerte", "Tercera débil", "Cuatrilítero", "Causativo"], "ok": 0, "an": "ḫ-p-r: tres radicales fuertes.", "id": "13.9", "g": "𓆣𓂋"}, {"t": "mc", "q": "jrj «hacer», como en jr.n.j sbt n nṯrw", "op": ["Tercera débil", "Bilítero", "Anómalo", "Segunda geminada"], "ok": 0, "an": "jr-j: en jr.n.j la j débil no se escribe; en el infinitivo aparece jrt.", "id": "13.10", "g": "𓁹𓂋"}]}, {"id": "B", "title": "Translitera la forma verbal", "items": [{"t": "t", "q": "«encontré» (El náufrago 47)", "tr": "gm.n.j", "an": "gmj «encontrar» (tercera débil) + n del perfecto + sufijo .j.", "id": "13.11", "g": "𓅠𓅓𓈖𓀀"}, {"t": "t", "q": "«hizo» (Enseñanza para Merikare)", "tr": "jr.n.f", "an": "jrj + n + .f: la j final no se escribe.", "id": "13.12", "g": "𓁹𓈖𓆑"}, {"t": "t", "q": "«el que ama, amado de» (fórmula autobiográfica)", "tr": "mrr", "an": "Forma geminada de mrj: se duplica la segunda radical.", "id": "13.13", "g": "𓌻𓂋𓂋"}]}, {"id": "C", "title": "Más textos reales", "items": [{"t": "mc", "q": "wnm «comer», como en la frase del papiro Westcar sobre el mago Dyedi", "op": ["Trilítero fuerte", "Tercera débil", "Segunda geminada", "Anómalo"], "ok": 0, "an": "w-n-m: tres radicales fuertes.", "id": "13.14", "g": "𓅱𓈖𓅓𓀁"}, {"t": "mc", "q": "qbb «estar fresco» (Papiro Ebers, passim)", "op": ["Segunda geminada", "Trilítero fuerte", "Tercera débil", "Cuatrilítero"], "ok": 0, "an": "La b se repite: qbb.", "id": "13.15", "g": "𓈎𓃀𓃀𓈗"}, {"t": "mc", "q": "gmj «encontrar», como en gm.n.j (El náufrago 47)", "op": ["Tercera débil", "Bilítero", "Segunda geminada", "Causativo"], "ok": 0, "an": "gm-j: la j final es débil y desaparece ante -n.", "id": "13.16", "g": "𓅠𓅓"}, {"t": "mc", "q": "sꜥḥꜥ «erigir, levantar (un monumento)», frecuente en inscripciones reales", "op": ["Causativo (s- + ꜥḥꜥ)", "Trilítero simple", "Cuatrilítero", "Tercera débil"], "ok": 0, "an": "s- + ꜥḥꜥ «estar de pie» = «poner de pie».", "id": "13.17", "g": "𓋴𓊢𓂝"}, {"t": "mc", "q": "nḏnḏ «consultar, conversar»", "op": ["Cuatrilítero (raíz reduplicada)", "Bilítero", "Segunda geminada", "Anómalo"], "ok": 0, "an": "Raíz nḏ duplicada: n-ḏ-n-ḏ.", "id": "13.18", "g": "𓈖𓆓𓈖𓆓𓀁"}, {"t": "mc", "q": "šsp «recibir, tomar»", "op": ["Trilítero fuerte", "Tercera débil", "Bilítero", "Causativo"], "ok": 0, "an": "š-s-p: tres radicales fuertes.", "id": "13.19", "g": "𓊏𓊪"}]}]}, "14": {"intro": "El infinitivo: títulos de capítulos del Libro de los Muertos, enseñanzas y relatos. Fíjate en la -t de los verbos débiles y en el infinitivo negativo tm.", "secs": [{"id": "A", "title": "Translitera y traduce", "items": [{"t": "tt", "ref": "Libro de los Muertos, título general y de varios capítulos", "vo": [["rꜣ", "fórmula, capítulo (literalmente «boca»)"], ["hrw", "día"]], "tr": "rꜣ n prt m hrw|r n prt m hrw|rꜣw nw prt m hrw", "es": "Fórmula para salir de día", "an": "prt: infinitivo de prj (tercera débil, con -t), regido por n.", "id": "14.1", "g": "𓂋𓏤 𓈖 𓉐𓂋𓏏𓂻 𓅓 𓉔𓂋𓅱𓇳"}, {"t": "tt", "ref": "Libro de los Muertos, cap. 125, título", "vo": [["ꜥq", "entrar"], ["wsḫt", "sala"], ["mꜣꜥtj", "las Dos Verdades"]], "tr": "rꜣ n ꜥq r wsḫt tn nt mꜣꜥtj|r n ꜥq r wsḫt tn nt mꜣꜥtj", "es": "Fórmula para entrar en esta sala de las Dos Verdades", "an": "ꜥq: infinitivo de un verbo bilítero, sin -t.", "id": "14.2", "g": "𓂋𓏤 𓈖 𓅧𓈎𓂻 𓂋 𓅱𓋴𓐍𓏏𓉐 𓏏𓈖 𓈖𓏏 𓐙𓏏𓆄𓆄"}, {"t": "tt", "ref": "Libro de los Muertos, cap. 30B, título", "vo": [["tm", "no (infinitivo negativo)"], ["ḫsf", "oponerse"], ["ẖrt-nṯr", "la necrópolis"]], "tr": "rꜣ n tm rdj ḫsf jb n zj r.f m ẖrt-nṯr|r n tm rdj ḫsf jb n zj r.f m ẖrt-nṯr", "es": "Fórmula para no permitir que el corazón de un hombre se le oponga en la necrópolis", "an": "tm + rdj: infinitivo negativo «no dar, no permitir». rdj rige a su vez un subjuntivo (ḫsf jb…).", "id": "14.3", "g": "𓂋𓏤 𓈖 𓍃𓅓 𓂋𓂞 𓐍𓋴𓆑𓂡 𓄣𓏤 𓈖 𓊃𓇋𓀀 𓂋𓆑 𓅓 𓊹 𓄡𓂋𓏏"}, {"t": "tt", "ref": "El campesino elocuente R 1,3–4", "vo": [["jnt", "traer"], ["ꜥqw", "provisiones"], ["ẖrdw", "hijos"]], "tr": "r jnt ꜥqw jm n ẖrdw.j", "es": "para traer de allí provisiones para mis hijos", "an": "r + infinitivo: finalidad. jnt, infinitivo de jnj (tercera débil): por eso lleva -t.", "id": "14.4", "g": "𓂋 𓏎𓈖𓏏 𓂝𓈎𓅱𓏒𓏥 𓇋𓅓 𓈖 𓄡𓂋𓂧𓀔𓏥𓀀"}]}, {"id": "B", "title": "Análisis", "items": [{"t": "mc", "q": "¿Por qué prt «salir» lleva -t y ꜥq «entrar» no?", "op": ["Porque prj es tercera débil, y esos verbos forman el infinitivo en -t", "Porque prt es femenino plural", "Porque ꜥq está en pasado", "Es una variación sin regla"], "ok": 0, "an": "Los verbos de tercera débil (prj, jrj, jnj, mrj…) añaden -t en el infinitivo: prt, jrt, jnt, mrt.", "id": "14.5"}]}, {"id": "C", "title": "Más textos reales", "items": [{"t": "tt", "ref": "Libro de los Muertos, cap. 99, título", "vo": [["mḫnt", "barca de pasaje"]], "tr": "rꜣ n jnt mḫnt|r n jnt mḫnt", "es": "Fórmula para traer la barca de pasaje", "an": "jnt: infinitivo de jnj (tercera débil) con -t.", "id": "14.6", "g": "𓂋𓏤 𓈖 𓏎𓈖𓏏 𓅓𓐍𓈖𓏏𓊛"}, {"t": "tt", "ref": "Libro de los Muertos, cap. 89, título", "vo": [["ẖnm", "unirse"], ["ẖꜣt", "cadáver"]], "tr": "rꜣ n rdjt ẖnm bꜣ m ẖꜣt.f|r n rdjt ẖnm bꜣ m ẖꜣt.f", "es": "Fórmula para hacer que el ba se una a su cadáver", "an": "rdjt: infinitivo de rdj con -t, seguido de subjuntivo (ẖnm bꜣ).", "id": "14.7", "g": "𓂋𓏤 𓈖 𓂋𓂞𓏏 𓎸𓈖𓅓 𓅡 𓅓 𓄡𓄿𓏏𓁀𓆑"}, {"t": "tt", "ref": "Libro de los Muertos, cap. 154, título", "vo": [["ḥwꜣ", "pudrirse"], ["ḥꜥw", "cuerpo"]], "tr": "rꜣ n tm rdj ḥwꜣ ḥꜥw|r n tm rdj ḥwꜣ ḥꜥw", "es": "Fórmula para no dejar que el cuerpo se pudra", "an": "tm + infinitivo: negación del infinitivo.", "id": "14.8", "g": "𓂋𓏤 𓈖 𓍃𓅓 𓂋𓂞 𓎛𓅱𓄿𓐎 𓎛𓂝𓅱𓄹𓏥"}, {"t": "tt", "ref": "Libro de los Muertos, cap. 77, título", "vo": [["ḫprw", "forma, transformación"], ["bjk", "halcón"]], "tr": "rꜣ n jrt ḫprw m bjk n nbw|r n jrt ḫprw m bjk n nbw", "es": "Fórmula para transformarse en un halcón de oro", "an": "jrt: infinitivo de jrj; jrt ḫprw «hacer la forma, transformarse».", "id": "14.9", "g": "𓂋𓏤 𓈖 𓁹𓏏 𓆣𓂋𓅱𓏥 𓅓 𓅃 𓈖 𓋞"}, {"t": "tt", "ref": "Libro de los Muertos, cap. 81, título", "vo": [["sšn", "loto"]], "tr": "rꜣ n jrt ḫprw m sšn|r n jrt ḫprw m sšn", "es": "Fórmula para transformarse en un loto", "an": "Misma construcción con otro complemento.", "id": "14.10", "g": "𓂋𓏤 𓈖 𓁹𓏏 𓆣𓂋𓅱𓏥 𓅓 𓆸"}, {"t": "tt", "ref": "Libro de los Muertos, cap. 23, título", "vo": [["wpt", "abrir"]], "tr": "rꜣ n wpt-r|r n wpt r|rꜣ n wpt r", "es": "Fórmula para abrir la boca", "an": "wpt: infinitivo de wpj (tercera débil) + objeto r «boca». Es el rito de la «apertura de la boca».", "id": "14.11", "g": "𓂋𓏤 𓈖 𓄋𓏏 𓂋𓏤"}, {"t": "tt", "ref": "Libro de los Muertos, cap. 15 (encabezado de los himnos al sol)", "vo": [["dwꜣ", "adorar"], ["ḫft", "cuando"]], "tr": "dwꜣ rꜥ ḫft wbn.f", "es": "Adorar a Ra cuando sale", "an": "Infinitivo como título. ḫft + sḏm.f: «cuando él sale».", "id": "14.12", "g": "𓇼𓄿𓀢 𓂋𓂝𓇳 𓏏𓐍𓏏 𓅱𓃀𓈖𓇳𓆑"}, {"t": "tt", "ref": "Papiro matemático Rhind, passim", "vo": [["mj ḫpr", "como ocurre"]], "tr": "jrt mj ḫpr", "es": "el procedimiento correcto (literalmente «hacer como sucede»)", "an": "Infinitivo jrt + mj + sḏm.f. Así empiezan las soluciones de los problemas.", "id": "14.13", "g": "𓁹𓏏 𓏇𓇋 𓆣𓂋"}, {"t": "tt", "ref": "Libro de los Muertos, cap. 125, título", "vo": [["ꜥq", "entrar"], ["wsḫt", "sala"], ["mꜣꜥtj", "las Dos Verdades"]], "tr": "rꜣ n ꜥq r wsḫt mꜣꜥtj|r n ꜥq r wsḫt mꜣꜥtj", "es": "Fórmula para entrar en la sala de las Dos Verdades", "an": "ꜥq: infinitivo de un verbo bilítero, sin -t.", "id": "14.14", "g": "𓂋𓏤 𓈖 𓅧𓈎𓂻 𓂋 𓅱𓋴𓐍𓏏𓉐 𓐙𓏏𓆄𓆄"}, {"t": "tt", "ref": "Enseñanzas de Ptahhotep, título", "vo": [["sbꜣ", "enseñar"], ["ẖmw", "ignorantes"]], "tr": "m sbꜣ ẖmw r rḫ", "es": "enseñando a los ignorantes a saber", "an": "m + infinitivo sbꜣ: «en el enseñar», es decir, «enseñando». r rḫ: r + infinitivo de finalidad («para que sepan»).", "id": "14.15", "g": "𓅓 𓋴𓃀𓄿𓇼 𓄡𓅓𓅱𓀀𓏥 𓂋 𓂋𓐍𓏛"}, {"t": "tt", "g": "𓅜𓐍𓏛 𓄔𓅓 𓈖 𓅭𓀀 𓄔𓅓𓅱", "ref": "Enseñanza de Ptahhotep (epílogo)", "vo": [["ꜣḫ", "útil"]], "tr": "ꜣḫ sḏm n zꜣ sḏmw", "es": "Escuchar es útil para el hijo que escucha.", "an": "sḏm: infinitivo como sujeto de una oración adjetival (ꜣḫ). sḏmw: participio («el que escucha»).", "id": "14.16"}, {"t": "tt", "g": "𓈎𓈖𓏏𓀜 𓊪𓅱 𓄿𓂧𓆊 𓄡𓊃𓏏𓅭 𓊪𓅱 𓈞𓅓 𓆱𓐍𓏏𓂽", "ref": "Estela de Semna de Senuseret III (Berlín 1157)", "vo": [["qnt", "valentía"], ["ẖzt", "cobardía"], ["ꜣd", "atacar"]], "tr": "qnt pw ꜣd ẖzt pw ḥm ḫt|qnt pw ꜣd ẖzt pw ḥmj ḫt", "es": "Atacar es valentía, retroceder es cobardía.", "an": "Dos oraciones con pw: los infinitivos ꜣd y ḥm (ḫt) son sujeto; qnt y ẖzt, predicado.", "id": "14.17"}]}]}, "15": {"intro": "La construcción pseudoverbal: sujeto + ḥr/m + infinitivo (acción en curso) y sujeto + r + infinitivo (futuro).", "secs": [{"id": "A", "title": "Translitera y traduce", "items": [{"t": "tt", "ref": "El náufrago 6 (llegada a casa)", "vo": [["ḥpt", "abrazar"], ["snnw", "compañero"]], "tr": "s nb ḥr ḥpt snnw.f|zj nb ḥr ḥpt snnw.f|z nb ḥr ḥpt snnw.f", "es": "Cada uno abraza a su compañero.", "an": "Sujeto (s nb) + ḥr + infinitivo (ḥpt) + objeto: acción que está ocurriendo.", "id": "15.1", "g": "𓊃𓀀 𓎟 𓁷𓏤 𓎛𓊪𓏏𓂘 𓌢𓈖𓈖𓅱𓀀𓆑"}, {"t": "tt", "ref": "Autobiografía de Ahmose hijo de Abana (El Kab)", "vo": [["jty", "el soberano"], ["rdwj", "los dos pies"]], "tr": "jw.j ḥr šms jty ḥr rdwj.j|jw.j ḥr šms nswt ḥr rdwj.j", "es": "Yo seguía al soberano a pie.", "an": "jw + sujeto (.j) + ḥr + infinitivo: narración de una acción continuada en el pasado.", "id": "15.2", "g": "𓃛𓅱𓀀 𓁷𓏤 𓌞𓋴𓂻 𓍘𓇋𓅆 𓁷𓏤 𓂾𓂾𓀀"}]}, {"id": "B", "title": "Análisis", "items": [{"t": "mc", "q": "¿Qué diferencia hay entre jw.f ḥr sḏm y jw.f r sḏm?", "op": ["ḥr expresa acción en curso («está oyendo»); r, futuro («oirá»)", "Ninguna", "ḥr es pasado y r presente", "r expresa acción habitual"], "ok": 0, "an": "Son las dos variantes principales de la construcción pseudoverbal. También existe m + infinitivo con verbos de movimiento: jw.f m jjt «viene».", "id": "15.3"}, {"t": "mc", "q": "¿Por qué esta construcción se llama «pseudoverbal»?", "op": ["Porque tiene la forma de una oración adverbial (sujeto + preposición + sustantivo), aunque el sustantivo sea un infinitivo", "Porque no tiene sujeto", "Porque solo se usa con verbos falsos", "Porque es una forma del imperativo"], "ok": 0, "an": "ḥr sḏm es literalmente «sobre oír»: estructura adverbial con valor verbal.", "id": "15.4"}]}, {"id": "C", "title": "Más textos reales", "items": [{"t": "tt", "ref": "Gran Himno a Atón (el amanecer)", "vo": [["r-ḏr.f", "entera"], ["kꜣt", "trabajo"]], "tr": "tꜣ r-ḏr.f ḥr jrt kꜣt.sn", "es": "La tierra entera hace su trabajo.", "an": "Sujeto + ḥr + infinitivo: acción en curso. El sufijo .sn se refiere a sus habitantes.", "id": "15.5", "g": "𓇾𓏤 𓂋 𓇥𓂋𓆑 𓁷𓏤 𓁹𓏏 𓂓𓏏𓀋𓏥𓋴𓈖𓏥"}, {"t": "tt", "ref": "El náufrago 120–121 (la serpiente predice el rescate)", "vo": [["jjt", "venir"], ["ẖnw", "la Residencia"]], "tr": "jw dpt r jjt m ẖnw", "es": "Un barco vendrá de la Residencia.", "an": "jw + sujeto + r + infinitivo: futuro (construcción pseudoverbal).", "id": "15.6", "g": "𓃛𓅱 𓂧𓊪𓏏𓊛 𓂋 𓇍𓏏𓂻 𓅓 𓄚𓈖𓏌𓅱𓉐"}, {"t": "tt", "g": "𓇋𓏲 𓆑 𓂋 𓂋𓂝𓏏 𓈖 𓎛𓎿𓊃𓊃𓇋𓇋𓏛 𓆑", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "vo": [["ḥsy", "favorecido"]], "tr": "jw.f r rdjt n ḥsy.f|jw.f r rdjt n ḥssy.f", "es": "Dará a quien goza de su favor.", "an": "jw + pronombre + r + infinitivo (rdjt): futuro. ḥsy.f: «su favorecido».", "id": "15.7"}, {"t": "tt", "g": "𓇋𓏲 𓀀 𓂋 𓈝𓅓𓏏𓂻 𓄭𓂋𓀁 𓀀 𓁷𓂋𓏤 𓎢 𓈖 𓇋𓈖𓊪𓅱𓃥𓅆", "ref": "El campesino elocuente", "vo": [["spr", "acudir, apelar"], ["jnpw", "Anubis"]], "tr": "jw.j r šmt spr.j ḥr.k n jnpw", "es": "Iré a apelar contra ti ante Anubis.", "an": "jw.j r šmt: futuro pseudoverbal. spr.j: sḏm.f subjuntivo de finalidad («para que apele»). spr ḥr X n Y: «reclamar por X ante Y».", "id": "15.8"}, {"t": "tt", "g": "𓇋𓏲 𓋴𓂋𓅱𓀙𓀀𓏥 𓁷𓏤 𓂋𓂝𓏏 𓏎𓈖 𓎢", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "vo": [["srw", "funcionarios"], ["jnj", "traer, adquirir"]], "tr": "jw srw ḥr rdjt jnj.k", "es": "Los funcionarios hacen que adquieras (bienes).", "an": "ḥr + infinitivo: acción en curso. rdjt + sḏm.f subjuntivo (jnj.k): «hacer que traigas».", "id": "15.9"}, {"t": "tt", "g": "𓇋𓏲 𓍍𓀀𓏥 𓆈𓄿𓏥 𓁷𓏤 𓊅𓀢𓂝 𓆑", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "vo": [["ḥmww", "artesanos"], ["qd", "construir"]], "tr": "jw ḥmww ꜥšꜣw ḥr qd.f", "es": "Muchos artesanos lo estaban construyendo.", "an": "jw + sujeto + ḥr + infinitivo. El sufijo .f del infinitivo es su objeto («su construir» = «construirlo»).", "id": "15.10"}, {"t": "tt", "g": "𓇋𓏲 𓂝𓃹𓈖𓂝𓄣𓏤 𓎢 𓂋 𓊃𓏲𓆼𓄿𓅪 𓎢", "ref": "El campesino elocuente", "vo": [["ꜥwn-jb", "codicia"], ["swḫꜣ", "volver necio"]], "tr": "jw ꜥwn-jb.k r swḫꜣ.k|jw ꜥwn jb.k r swḫꜣ.k", "es": "Tu codicia te volverá necio.", "an": "jw + sujeto + r + infinitivo: futuro. swḫꜣ es causativo de wḫꜣ «ser necio»; el sufijo .k es su objeto.", "id": "15.11"}, {"t": "tt", "g": "𓇋𓏲 𓋴 𓂋 𓄟𓋴𓏏𓁒", "ref": "Corpus del TLA, Reino Medio (finales de la dinastía XII)", "vo": [["msj", "dar a luz"]], "tr": "jw.s r msjt", "es": "Ella dará a luz.", "an": "jw + sufijo + r + infinitivo: futuro.", "id": "15.12"}, {"t": "tt", "ref": "Autobiografía de Ahmose hijo de Abana (Elkab)", "vo": [["šms", "seguir"], ["nb ꜥnḫ wḏꜣ snb", "el soberano (¡vida, prosperidad, salud!)"], ["rdwj", "los dos pies"]], "tr": "jw.j ḥr šms nb ꜥnḫ wḏꜣ snb ḥr rdwj.j|jw.j ḥr šms nb ꜥ.w.s. ḥr rdwj.j|jw.j ḥr šms nb ꜥws ḥr rdwj.j", "es": "Yo seguía al soberano a pie.", "an": "jw.j ḥr + infinitivo: acción en curso o repetida. ḥr rdwj.j: «sobre mis dos pies» (dual), es decir, a pie, frente a quien iba en carro.", "id": "15.13", "g": "𓇋𓅱𓀀 𓁷𓏤 𓌞𓋴𓂻 𓎟 𓋹𓍑𓋴 𓁷𓏤 𓂋𓂧𓂾𓂾𓀀"}, {"t": "tt", "g": "𓃹𓈖𓇋𓈖 𓅯𓄿𓇋𓇋 𓋴 𓂋𓏠𓈖𓂢𓁐𓏥 𓎼𓂋𓀁 𓂜𓈖 𓂙𓈖𓏏𓊛𓀜", "ref": "Papiro Westcar (las remeras del rey Snefru)", "vo": [["rmn", "fila, hilera"], ["ẖnj", "remar"]], "tr": "wn.jn pꜣy.s rmn gr nn ẖnt", "es": "Entonces su hilera se quedó callada, sin remar.", "an": "wn.jn + sujeto + estativo gr: «quedó en silencio». nn + infinitivo ẖnt: «sin remar».", "id": "15.14"}, {"t": "tt", "g": "𓃹𓈖𓇋𓈖 𓎸𓅓𓏲𓅆 𓁷𓏤 𓋴𓏲𓍑𓄿𓏛 𓂝𓏏𓄹𓏥 𓆑", "ref": "Papiro Westcar (el nacimiento de los reyes)", "vo": [["swḏꜣ", "dar salud"], ["ꜥwt", "miembros"]], "tr": "wn.jn ẖnmw ḥr swḏꜣ ꜥwt.f", "es": "Entonces Jnum dio salud a sus miembros.", "an": "wn.jn + sujeto + ḥr + infinitivo: narración. swḏꜣ: causativo de wḏꜣ «estar sano».", "id": "15.15"}, {"t": "tt", "g": "𓇋𓏲 𓀀 𓂋 𓈝𓅓𓏏𓂻 𓏲𓍿𓊃𓍞𓀁 𓀀", "ref": "Papiro Westcar (la sirvienta enfadada)", "vo": [["wṯs", "denunciar, revelar"]], "tr": "jw.j r šmt wṯs.j", "es": "Voy a ir a denunciarlo.", "an": "jw + sujeto + r + infinitivo: futuro. wṯs.j: subjuntivo de finalidad («para que denuncie»).", "id": "15.16"}, {"t": "tt", "g": "𓇋𓈖 𓇋𓏲 𓅓𓂝𓆼𓄿𓏏𓍸𓆱 𓁷𓏤 𓂋𓂝𓏏 𓁷𓏤 𓐞", "ref": "El campesino elocuente", "vo": [["mḫꜣt", "balanza"], ["gs", "lado"]], "tr": "jn jw mḫꜣt ḥr rdjt ḥr gs", "es": "¿Acaso se inclina la balanza hacia un lado?", "an": "jn jw + sujeto + ḥr + infinitivo: pregunta sobre una acción habitual.", "id": "15.17"}, {"t": "tt", "g": "𓇋𓏲 𓆑 𓂋𓐍𓏛 𓋭𓊃𓍢𓂡 𓁶𓏤 𓎛𓋴𓈎𓏴𓂡", "ref": "Papiro Westcar (el mago Dyedi)", "vo": [["ṯs", "unir, atar"], ["ḥsq", "cortar"]], "tr": "jw.f rḫ ṯs tp ḥsq", "es": "Sabe volver a unir una cabeza cortada.", "an": "jw + sujeto + rḫ + infinitivo ṯs. ḥsq: participio pasivo («cortada»).", "id": "15.18"}, {"t": "tt", "g": "𓋴𓂋𓏲𓀔𓀀𓏥 𓁷𓏤 𓁹𓏏 𓇍𓇋𓇋𓏏𓅪𓏥", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "vo": [["jyt", "mal, injusticia"]], "tr": "srw ḥr jrt jyt", "es": "Los funcionarios cometen injusticia.", "an": "Sujeto + ḥr + infinitivo (sin jw): construcción pseudoverbal.", "id": "15.19"}, {"t": "tt", "g": "𓂋𓂧𓂾𓂾 𓀀 𓁷𓏤 𓉔𓏲𓉔𓏲𓂻", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "vo": [["hwhw", "huir, correr"]], "tr": "rdwj.j ḥr hwhw", "es": "Mis pies huían.", "an": "Sujeto + ḥr + infinitivo.", "id": "15.20"}]}, {"id": "D", "title": "Ahmose hijo de Abana (Urk. IV)", "items": [{"t": "tr", "ref": "Autobiografía de Ahmose hijo de Abana, l. 5–6 (Urk. IV 1–11)", "vo": [["ḏbꜣ", "sustituir; r ḏbꜣ «en lugar de»"], ["smꜣ", "toro salvaje"], ["hꜣw", "tiempo, época"]], "tr": "ꜥḥꜥ.n.j ḥr jrt wꜥw r ḏbꜣ.f m pꜣ dpt n pꜣ-smꜣ m hꜣw nb tꜣwj nb-pḥtj-rꜥ mꜣꜥ-ḫrw", "es": "Entonces serví como soldado en su lugar en el barco «El Toro Salvaje», en tiempos del señor de las Dos Tierras Nebpehtira, justificado.", "an": "ꜥḥꜥ.n + sujeto + ḥr + infinitivo: narración. r ḏbꜣ.f: «en sustitución de él». m hꜣw: «en tiempos de».", "id": "15.21"}, {"t": "tr", "ref": "Autobiografía de Ahmose hijo de Abana, l. 14 (Urk. IV 1–11)", "vo": [["ḥꜣq", "saquear"], ["ḥꜣqt", "botín"]], "tr": "wn.jn.tw ḥr ḥꜣq ḥwt-wꜥrt wn.jn.j ḥr jnt ḥꜣqt jm", "es": "Se saqueó Ávaris y yo me llevé botín de allí.", "an": "wn.jn + sujeto + ḥr + infinitivo, dos veces. ḥꜣqt: «botín».", "id": "15.22"}, {"t": "tr", "ref": "Autobiografía de Ahmose hijo de Abana, l. 17 (Urk. IV 1–11)", "vo": [["ḫꜣyt", "matanza"]], "tr": "wn.jn ḥm.f ḥr jrt ḫꜣyt ꜥꜣt jm.sn", "es": "Entonces su Majestad hizo una gran matanza entre ellos.", "an": "wn.jn + ḥr + infinitivo. ḫꜣyt ꜥꜣt: sustantivo + adjetivo concordado.", "id": "15.23"}, {"t": "tr", "ref": "Autobiografía de Ahmose hijo de Abana, l. 29 (Urk. IV 1–11)", "vo": [["ꜥḥꜣwtj", "guerrero"], ["ḥqꜣ", "soberano"]], "tr": "wn.jn.tw ḥr rdjt.j r ꜥḥꜣwtj n ḥqꜣ", "es": "Me nombraron guerrero del soberano.", "an": "rdjt.j: infinitivo con sufijo objeto («ponerme»). r: «como».", "id": "15.24"}]}]}, "16": {"intro": "Imperativo, imperativo negativo, vocativos y partículas en himnos, fórmulas funerarias y textos de las pirámides.", "secs": [{"id": "A", "title": "Translitera y traduce", "items": [{"t": "tt", "ref": "Libro de los Muertos, cap. 30B (inscrito en escarabeos de corazón)", "tr": "jb.j n mwt.j jb.j n mwt.j", "es": "¡Mi corazón de mi madre! ¡Mi corazón de mi madre!", "an": "Vocativo sin partícula. n mwt.j: genitivo indirecto.", "id": "16.1", "g": "𓄣𓏤𓀀 𓈖 𓅐𓏏𓁐𓀀 𓄣𓏤𓀀 𓈖 𓅐𓏏𓁐𓀀"}, {"t": "tt", "ref": "Libro de los Muertos, cap. 30B", "vo": [["m", "¡no! (imperativo negativo)"], ["ꜥḥꜥ", "levantarse"], ["mtrw", "testigo"]], "tr": "m ꜥḥꜥ r.j m mtrw", "es": "¡No te levantes contra mí como testigo!", "an": "m (imperativo negativo de jmj) + complemento verbal: «no hagas…».", "id": "16.2", "g": "𓅓𓂝 𓊢𓂝𓂻 𓂋𓀀 𓅓 𓅓𓏏𓂋𓅱𓀀𓏥"}, {"t": "tt", "ref": "Libro de los Muertos, cap. 30B", "vo": [["ḫsf", "oponerse"], ["ḏꜣḏꜣt", "tribunal"]], "tr": "m ḫsf r.j m ḏꜣḏꜣt", "es": "¡No te opongas a mí en el tribunal!", "an": "Misma construcción. El difunto pide a su corazón que no lo acuse en el juicio.", "id": "16.3", "g": "𓅓𓂝 𓐍𓋴𓆑𓂡 𓂋𓀀 𓅓 𓆓𓄿𓆓𓄿𓏏𓉐"}, {"t": "tt", "ref": "Llamada a los vivos, en estelas y tumbas del Reino Medio", "vo": [["j", "¡oh!"], ["tpjw", "que están sobre (nisbe)"]], "tr": "j ꜥnḫw tpjw tꜣ", "es": "¡Oh vivos que estáis sobre la tierra!", "an": "j: partícula de vocativo. ꜥnḫw «los vivos» (participio sustantivado) + nisbe tpjw.", "id": "16.4", "g": "𓇋𓀁 𓋹𓈖𓐍𓅱𓀀𓏥 𓁶𓊪𓅱𓏭𓏥 𓇾𓏤"}, {"t": "tt", "ref": "Himno a Hapy, primera línea", "tr": "jnḏ ḥr.k ḥꜥpj|jnḏ-ḥr.k ḥꜥpj", "es": "¡Salve a ti, Hapy!", "an": "Fórmula fija de saludo con la que empiezan muchos himnos.", "id": "16.5", "g": "𓇋𓈖𓂧 𓎛𓁷𓏤𓎡 𓎛𓂝𓊪𓇋𓈗"}]}, {"id": "B", "title": "Análisis", "items": [{"t": "mc", "q": "¿Cómo se forma el imperativo negativo?", "op": ["Con m (imperativo de jmj) + complemento verbal: m ꜥḥꜥ", "Con nn + infinitivo", "Con n + sḏm.f", "Con tm + imperativo"], "ok": 0, "an": "m «¡no hagas!» va seguido de una forma verbal especial (el complemento negativo o el infinitivo, según el análisis).", "id": "16.6"}]}, {"id": "C", "title": "Más textos reales", "items": [{"t": "tt", "ref": "Textos de las Pirámides, conjuro 373 (Pyr. 654)", "vo": [["hꜣ", "¡oh!"], ["ṯs", "levantar"]], "tr": "hꜣ ttj ṯs tw|hꜣ ttj ts tw", "es": "¡Oh Teti, levántate!", "an": "hꜣ: interjección de vocativo. ṯs: imperativo; tw: pronombre dependiente reflexivo «a ti mismo».", "id": "16.7", "g": "𓉔𓄿 𓍹 𓏏𓏏𓇋 𓍺 𓋭𓋴 𓏏𓅱"}, {"t": "tt", "ref": "Himnos al sol del Libro de los Muertos (cap. 15)", "tr": "jnḏ ḥr.k rꜥ m wbn.f|jnḏ-ḥr.k rꜥ m wbn.f", "es": "¡Salve a ti, Ra, cuando sale!", "an": "Fórmula de saludo + m + infinitivo con sufijo («en su salir»).", "id": "16.8", "g": "𓇋𓈖𓂧 𓎛𓁷𓏤𓎡 𓂋𓂝𓇳 𓅓 𓅱𓃀𓈖𓇳𓆑"}, {"t": "tt", "g": "𓄔𓅓 𓂋 𓎢 𓈖 𓀀 𓄂𓂝𓀀", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "vo": [["ḥꜣtj-ꜥ", "gobernador"]], "tr": "sḏm r.k n.j ḥꜣtj-ꜥ", "es": "¡Escúchame, gobernador!", "an": "Imperativo sḏm reforzado con r.k. n.j: «a mí». ḥꜣtj-ꜥ es un vocativo.", "id": "16.9"}, {"t": "tt", "g": "𓋴𓂋𓅱𓂧𓌗𓏛 𓌳𓐙𓂝𓏏𓏯𓏛𓏥 𓋹𓈖𓐍 𓄟𓋴𓅱𓁓𓀀𓁐𓏥 𓎢", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "vo": [["srwd", "afianzar"], ["msw", "hijos"]], "tr": "srwd mꜣꜥt ꜥnḫ msw.k", "es": "¡Afianza la Maat y tus hijos vivirán!", "an": "srwd: imperativo de un causativo (s + rwd). ꜥnḫ msw.k: sḏm.f subjuntivo de consecuencia tras el imperativo.", "id": "16.10"}, {"t": "tt", "g": "𓎔𓏛 𓄡𓏏𓏤 𓋴", "ref": "Enseñanza de Ptahhotep (máxima sobre la esposa)", "vo": [["mḥ", "llenar"]], "tr": "mḥ ẖt.s", "es": "¡Llena su vientre!", "an": "Imperativo con objeto ẖt.s («su vientre»).", "id": "16.11"}, {"t": "tt", "g": "𓎛𓃀𓋴𓋳 𓐟𓏤 𓋴", "ref": "Enseñanza de Ptahhotep (máxima sobre la esposa)", "vo": [["ḥbs", "vestir"]], "tr": "ḥbs sꜣ.s|ḥbs zꜣ.s", "es": "¡Viste su espalda!", "an": "Imperativo con objeto sꜣ.s. Junto a la frase anterior: alimentarla y vestirla.", "id": "16.12"}, {"t": "tt", "g": "𓊃𓈖𓂝𓂝𓏞𓏛 𓄣𓏤 𓋴 𓅓 𓆣𓂋𓏏𓏥 𓈖 𓎢", "ref": "Enseñanza de Ptahhotep (máxima sobre la esposa)", "vo": [["snꜥꜥ", "alegrar, complacer"], ["ḫprt", "lo que sucede"]], "tr": "snꜥꜥ jb.s m ḫprt n.k", "es": "¡Alegra su corazón con lo que te ha llegado!", "an": "snꜥꜥ: imperativo de un causativo. ḫprt n.k: participio femenino sustantivado, «lo que te ha sucedido / te ha tocado».", "id": "16.13"}, {"t": "tt", "g": "𓅓𓂡 𓎀𓊃𓍞 𓍿𓅱", "ref": "Corpus del TLA, Reino Medio (finales de la dinastía XII)", "vo": [["mj", "¡ven!"], ["ṯz", "levantar"]], "tr": "mj ṯz ṯw|mj ṯs ṯw", "es": "¡Ven, levántate!", "an": "mj: imperativo irregular de «venir». ṯz ṯw: imperativo + pronombre dependiente reflexivo («levántate a ti mismo»).", "id": "16.14"}, {"t": "tt", "g": "𓏎𓈖 𓈖 𓎢 𓅯𓄿𓇋𓇋 𓎢", "ref": "Corpus del TLA, Reino Medio (dinastía XIII)", "vo": [["pꜣy.k", "lo tuyo"]], "tr": "jnj n.k pꜣy.k|jn n.k pꜣy.k", "es": "¡Llévate lo tuyo!", "an": "Imperativo jnj + dativo reflexivo n.k («para ti»). pꜣy.k: posesivo sustantivado.", "id": "16.15"}, {"t": "tt", "g": "𓉔𓄿𓂻 𓏎𓈖 𓇋𓅓 𓆑", "ref": "Corpus del TLA, Reino Medio (dinastía XIII)", "vo": [["hꜣj", "bajar"]], "tr": "hꜣj jnj jm.f|hꜣ jnj jm.f", "es": "¡Baja y trae de él!", "an": "Dos imperativos seguidos sin conjunción. jm.f: partitivo, «de él».", "id": "16.16"}, {"t": "tt", "g": "𓂧𓂋𓀜 𓋴𓐟𓄿𓇋𓂋𓌗𓅪𓏥 𓀀", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "vo": [["sꜣr", "necesidad"]], "tr": "dr sꜣr.j|dr sꜣjr.j", "es": "¡Aparta mi necesidad!", "an": "Imperativo dr con objeto sꜣr.j.", "id": "16.17"}, {"t": "tt", "g": "𓋴𓇛𓈖𓆓𓅓𓏛 𓈖 𓀀 𓋀𓏏𓈉", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "vo": [["snḏm", "hacer agradable"], ["jmnt", "el Occidente (el más allá)"]], "tr": "snḏm n.j jmnt", "es": "¡Hazme agradable el Occidente!", "an": "snḏm: imperativo causativo de nḏm «ser agradable». n.j: «para mí».", "id": "16.18"}, {"t": "tt", "g": "𓅓 𓁹 𓇉𓅱𓏛𓏥𓁷𓏤 𓌃𓂧𓂧𓅱𓏏𓀁𓏥", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "vo": [["ḥꜣw-ḥr", "más allá de"], ["mddwt", "lo que se dice"]], "tr": "m jrj ḥꜣw-ḥr mddwt|m jr ḥꜣw-ḥr mddwt", "es": "¡No hagas más de lo que se dice!", "an": "Imperativo negativo: m (imperativo de jmj) + complemento negativo jrj.", "id": "16.19"}, {"t": "tt", "g": "𓁹 𓇓𓅱𓏏 𓋹𓈖𓐍 𓈞𓏏𓁐 𓆑 𓎛𓈖𓂝 𓄡𓂋𓂧𓏲𓀔𓀀𓁑𓏥 𓆑", "ref": "El campesino elocuente (orden del rey)", "vo": [["swt", "pero"], ["ẖrdw", "hijos"]], "tr": "jrj swt ꜥnḫ ḥmt.f ḥnꜥ ẖrdw.f", "es": "¡Pero provee al sustento de su mujer y sus hijos!", "an": "Imperativo jrj + enclítico swt. ꜥnḫ es aquí el sustantivo «sustento» (lo que hace vivir).", "id": "16.20"}, {"t": "tt", "g": "𓂝 𓊃𓐍𓂋𓏛 𓎢 𓅓 𓋴𓎛𓉲𓏛 𓈖 𓎟𓀀 𓎢", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "vo": [["sḫr", "consejo"], ["sḥ", "sala de consejo"]], "tr": "dj sḫr.k m sḥ n nb.k|ḏj sḫr.k m sḥ n nb.k|jmj sḫr.k m sḥ n nb.k", "es": "¡Da tu consejo en la sala de consejo de tu señor!", "an": "dj: imperativo de rdj (también jmj). Objeto sḫr.k.", "id": "16.21"}, {"t": "tt", "g": "𓎛𓆰𓈖𓎨𓏛 𓂝𓏤 𓎢", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "vo": [["ḥn", "dominar, contener"], ["ꜥ", "brazo"]], "tr": "ḥn ꜥ.k", "es": "¡Domina tu brazo!", "an": "Imperativo con objeto ꜥ.k.", "id": "16.22"}, {"t": "tt", "g": "𓅓 𓂝𓃀𓂝𓀁 𓇋𓅓", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "vo": [["ꜥbꜥ", "jactarse"]], "tr": "m ꜥbꜥ jm", "es": "¡No te jactes de ello!", "an": "m + complemento negativo: imperativo negativo. jm: «de ello».", "id": "16.23"}, {"t": "tt", "g": "𓅓 𓉻𓂝𓄿𓏛 𓄣𓏤 𓎢 𓁷𓏤 𓂋𓐍𓏛 𓎢", "ref": "Enseñanza de Ptahhotep (primera máxima)", "vo": [["ꜥꜣ jb", "ser altivo (literalmente «ser grande de corazón»)"], ["rḫ", "saber, conocimiento"]], "tr": "m ꜥꜣ jb.k ḥr rḫ.k|m ꜥꜣj jb.k ḥr rḫ.k", "es": "¡No te enorgullezcas de tu saber!", "an": "m ꜥꜣ: imperativo negativo. jb.k es el sujeto lógico: «que no sea grande tu corazón». ḥr rḫ.k: «a causa de tu saber».", "id": "16.24"}, {"t": "tt", "g": "𓅓 𓊪𓊃𓎛𓄑𓀁 𓏲𓀀", "ref": "Corpus del TLA, Reino Medio (finales de la dinastía XII)", "vo": [["psḥ", "morder"]], "tr": "m psḥ wj", "es": "¡No me muerdas!", "an": "Imperativo negativo m + complemento negativo psḥ, con objeto pronominal dependiente wj. Conjuro contra un animal.", "id": "16.25"}, {"t": "tt", "g": "𓌉𓆓𓇳 𓁷𓏤 𓎢 𓏏𓂋𓆵𓇳 𓈖 𓃹𓈖𓈖 𓎢", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "vo": [["ḥḏ ḥr", "ser generoso (literalmente «iluminar la cara»)"], ["tr", "tiempo"]], "tr": "ḥḏ ḥr.k tr n wnn.k", "es": "¡Sé generoso mientras existas!", "an": "Imperativo ḥḏ. tr n wnn.k: «el tiempo de tu existir» (wnn.k: forma sḏm.f de wnn).", "id": "16.26"}, {"t": "tt", "g": "𓅓 𓋴𓏏𓄝𓅱𓌕 𓇓𓅱 𓅓 𓅠𓅓𓎛𓁹 𓆈𓄿𓏥", "ref": "Enseñanza de Ptahhotep", "vo": [["stj", "disparar, asaetear"], ["gmḥ", "mirada"]], "tr": "m stj sw m gmḥ ꜥšꜣ", "es": "No lo acoses con muchas miradas.", "an": "m + complemento negativo stj: imperativo negativo. gmḥ «mirada».", "id": "16.27"}, {"t": "tt", "g": "𓋴𓏇𓇋𓀁 𓋴𓌮𓅓𓏛𓏥 𓎢 𓂜𓈖 𓂝𓅓𓀁𓄣𓏤", "ref": "Enseñanza de Ptahhotep", "vo": [["smj", "informar"], ["sšm", "asunto, conducta"], ["ꜥm-jb", "negligencia"]], "tr": "smj sšm.k nn ꜥm-jb", "es": "Informa de tu asunto sin negligencia.", "an": "smj: imperativo. nn + sustantivo: «sin».", "id": "16.28"}]}]}, "17": {"intro": "El estativo: estados resultantes y, con verbos intransitivos, acciones completadas. Fíjate en las terminaciones .kw, .tj, .w.", "secs": [{"id": "A", "title": "Translitera y traduce", "items": [{"t": "tt", "ref": "El náufrago 36–37", "vo": [["ꜥḥꜥ.n", "entonces"], ["mt", "morir"]], "tr": "ꜥḥꜥ.n dpt mt.tj", "es": "Entonces el barco pereció.", "an": "mt.tj: estativo 3.ª persona femenina (dpt es femenino). ꜥḥꜥ.n + sujeto + estativo es un esquema narrativo frecuente.", "id": "17.1", "g": "𓊢𓂝𓈖 𓂧𓊪𓏏𓊛 𓅓𓏏𓏏𓏭𓀐"}, {"t": "tt", "ref": "Textos de los Sarcófagos (CT I 187e)", "vo": [["šm.n.k", "te has ido"]], "tr": "šm.n.k ꜥnḫ.tj", "es": "Te has ido vivo.", "an": "ꜥnḫ.tj: estativo de 2.ª persona como complemento de estado («estando vivo»).", "id": "17.2", "g": "𓈙𓅓𓂻𓈖𓎡 𓋹𓈖𓐍𓏏𓏭"}, {"t": "tt", "ref": "Tras los nombres de las reinas (p. ej., Nefertiti)", "tr": "ꜥnḫ.tj ḏt", "es": "viva para siempre", "an": "Estativo de 3.ª persona femenina: «estando viva».", "id": "17.3", "g": "𓋹𓈖𓐍𓏏𓏭 𓆓𓏏𓇿"}, {"t": "tt", "ref": "Libro de los Muertos, cap. 125 (el difunto ante Osiris)", "tr": "rḫ.kw ṯw rḫ.kw rn.k", "es": "Te conozco, conozco tu nombre.", "an": "rḫ.kw: estativo de 1.ª persona. Con rḫ «llegar a saber», el estativo significa «sé»: el estado que resulta de haber aprendido.", "id": "17.4", "g": "𓂋𓐍𓏛𓎡𓅱 𓍿𓅱 𓂋𓐍𓏛𓎡𓅱 𓂋𓈖𓎡"}, {"t": "tt", "ref": "Libro de los Muertos, cap. 17", "vo": [["sf", "ayer"], ["dwꜣw", "mañana"]], "tr": "jnk sf jw.j rḫ.kw dwꜣw", "es": "Yo soy el ayer y conozco el mañana.", "an": "jw.j rḫ.kw: jw + sujeto + estativo.", "id": "17.5", "g": "𓇋𓈖𓎡 𓋴𓆑𓇳 𓃛𓅱𓀀 𓂋𓐍𓏛𓎡𓅱 𓇼𓅱𓇳"}, {"t": "tt", "ref": "Nombre de nacimiento de Amenhotep III", "vo": [["ḥqꜣ", "soberano"]], "tr": "jmn-ḥtp ḥqꜣ wꜣst|jmn ḥtp ḥqꜣ wꜣst", "es": "Amenhotep («Amón está satisfecho»), soberano de Tebas", "an": "jmn ḥtp(.w): sujeto + estativo. El nombre es una oración.", "id": "17.6", "g": "𓍹 𓇋𓏠𓈖 𓊵𓏏𓊪 𓋾 𓋆𓏏𓊖 𓍺"}]}, {"id": "B", "title": "Análisis", "items": [{"t": "mc", "q": "¿Qué terminación de estativo corresponde a la 1.ª persona del singular?", "op": [".kw", ".tj", ".w", ".n"], "ok": 0, "an": ".kw (1.ª sg.), .tj (2.ª sg. y 3.ª fem.), .w o sin terminación (3.ª masc.).", "id": "17.7"}]}, {"id": "C", "title": "Más textos reales", "items": [{"t": "tt", "ref": "Gran Himno a Atón (el amanecer)", "vo": [["ḥb", "fiesta"], ["rs", "despertar"], ["ꜥḥꜥ", "estar de pie"]], "tr": "tꜣwj m ḥb rs.w ꜥḥꜥ.w ḥr rdwj", "es": "Las Dos Tierras están de fiesta, despiertas y de pie.", "an": "rs.w, ꜥḥꜥ.w: estativos de 3.ª persona (estados resultantes).", "id": "17.8", "g": "𓇾𓇾 𓅓 𓎱 𓂋𓋴𓅱 𓊢𓂝𓂻𓅱 𓁷𓏤 𓂾𓂾"}, {"t": "tt", "ref": "Nombre de la reina Nefertiti", "tr": "nfrt-jj.tj|nfrt jj.tj", "es": "La bella ha llegado (Nefertiti)", "an": "jj.tj: estativo 3.ª femenina de jj «venir»: «ha llegado, está aquí».", "id": "17.9", "g": "𓄤𓏏 𓇍𓇋𓏏𓏭"}, {"t": "tt", "g": "𓊢𓂝𓈖 𓀀 𓈝𓅓𓂻𓎢𓏲𓀀", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "vo": [["šm", "ir"]], "tr": "ꜥḥꜥ.n.j šm.kw", "es": "Entonces me puse en marcha.", "an": "ꜥḥꜥ.n + sujeto + estativo (šm.kw, 1.ª persona): narración en pasado.", "id": "17.10"}, {"t": "tt", "g": "𓈖𓇋𓀁𓈖 𓏏𓏲 𓈖 𓌡𓂝𓏤 𓇋𓅓 𓇋𓋴𓏏 𓏲𓀀 𓊢𓂝𓂻𓎢𓏲𓀀", "ref": "Corpus del TLA, Reino Medio (finales de la dinastía XII)", "vo": [["njs", "llamar"], ["jst", "y, mientras (partícula)"]], "tr": "njs.n.tw n wꜥ jm jst wj ꜥḥꜥ.kw", "es": "Llamaron a uno de ellos mientras yo estaba allí de pie.", "an": "njs.n.tw: sḏm.n.f impersonal. jst + pronombre dependiente wj + estativo ꜥḥꜥ.kw: cláusula circunstancial.", "id": "17.11"}, {"t": "tt", "g": "𓊃𓂧𓋳𓂝𓎢𓅱𓀀 𓅓 𓆁𓈎𓏏𓏯𓋳𓏥", "ref": "Sinuhé B 291 (vuelta a la vida cortesana)", "vo": [["sd", "vestir"], ["pꜣqt", "lino fino"]], "tr": "sd.kw m pꜣqt", "es": "Fui vestido con lino fino.", "an": "Estativo de 1.ª persona (.kw) de un verbo transitivo: valor pasivo («estoy vestido»).", "id": "17.12"}, {"t": "tt", "g": "𓍘𓏲𓀁 𓇋𓏲 𓀀 𓂋𓐍𓏛𓎢𓏲𓀀 𓇋𓀁 𓍘𓇋𓇋𓅆 𓋹𓍑𓋴 𓎟𓅆 𓀀", "ref": "Papiro Westcar (el mago Dyedi ante Keops)", "vo": [["tjw", "sí"], ["jtj", "soberano"]], "tr": "tjw jw.j rḫ.kw j jtj nb.j|tjw jw.j rḫ.kw jtj nb.j", "es": "¡Sí, sé hacerlo, soberano, mi señor!", "an": "rḫ.kw: estativo de 1.ª persona («sé»). tjw: «sí». j jtj: vocativo con la interjección j.", "id": "17.13"}, {"t": "tt", "g": "𓈝𓅓𓂻𓎢𓅱𓀀 𓂋 𓃀𓇋𓈞𓄑𓈉 𓈖 𓆊𓆊𓅆", "ref": "El náufrago 23–24", "vo": [["bjꜣ", "mina"], ["jtj", "soberano"]], "tr": "šm.kw r bjꜣ n jtj", "es": "Había ido a las minas del soberano.", "an": "šm.kw: estativo de 1.ª persona de un verbo de movimiento («he ido, estaba de camino»).", "id": "17.14"}, {"t": "tt", "g": "𓂝𓏤𓅱𓏭𓇋𓇋 𓀀 𓐍𓆼𓄿𓅓𓂢 𓅓𓃀𓅡𓄿𓎛𓂺𓏛 𓆑 𓆓𓂧 𓀀 𓈖 𓆑", "ref": "El náufrago (encuentro con la serpiente)", "vo": [["ḫꜣm", "doblar, inclinar"]], "tr": "ꜥwj.j ḫꜣm m-bꜣḥ.f ḏd.j n.f", "es": "Con los brazos inclinados ante él, le dije:", "an": "ꜥwj.j ḫꜣm: oración de estativo usada como circunstancial («estando mis brazos doblados»).", "id": "17.15"}, {"t": "tt", "g": "𓋴𓈖𓃀𓏏 𓊗𓏻 𓈖𓆓𓊃𓅪𓀀 𓂋 𓉐𓏤 𓎢", "ref": "El náufrago (despedida de la serpiente)", "vo": [["snb", "estar sano"], ["nḏs", "pequeño"]], "tr": "snb.tj zp 2 nḏs r pr.k|snb.tj snb.tj nḏs r pr.k", "es": "¡Adiós, adiós, pequeño, hasta tu casa!", "an": "snb.tj: estativo con valor de deseo («¡que estés sano!»). zp 2: «dos veces».", "id": "17.16"}, {"t": "tt", "g": "𓇾𓈇𓏤 𓊃𓊪𓊗 𓈖 𓁹𓅱𓏥 𓇋𓋴𓆑𓏏𓅪𓏥", "ref": "Diálogo del desesperado con su ba (Berlín 3024)", "vo": [["spj", "quedar"], ["jsft", "mal"]], "tr": "tꜣ spj n jrw jsft", "es": "La tierra ha quedado para los que hacen el mal.", "an": "spj: estativo («ha quedado, abandonada»). jrw: participio («los que hacen»).", "id": "17.17"}, {"t": "tt", "g": "𓇋𓏲 𓎢 𓋴𓃀𓇼𓄿𓏏𓀜", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "vo": [["sbꜣ", "enseñar"]], "tr": "jw.k sbꜣ.tj", "es": "Estás instruido.", "an": "Estativo de 2.ª persona (.tj).", "id": "17.18"}, {"t": "tt", "g": "𓇋𓅱 𓎢 𓂧𓈖𓋴𓏏𓍖𓏛", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "vo": [["dns", "ser pesado"]], "tr": "jw.k dns.tj", "es": "Eres de peso.", "an": "Estativo de 2.ª persona de un verbo de cualidad.", "id": "17.19"}, {"t": "tt", "g": "𓎛𓂝𓄹𓏥 𓎢 𓆓𓆑𓄿𓅬𓏛𓏥", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "vo": [["ḥꜥw", "cuerpo"], ["ḏfꜣ", "estar provisto"]], "tr": "ḥꜥw.k ḏfꜣ", "es": "Tu cuerpo está provisto.", "an": "Sujeto + estativo (ḏfꜣ).", "id": "17.20"}, {"t": "tt", "g": "𓌳𓄿𓇋𓂋𓌗𓅪𓏥 𓀀 𓇥𓂋𓀜 𓐍𓏏𓆑𓁷𓏤 𓎢", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "vo": [["mꜣjr", "desdicha"], ["ḏr", "acabar"]], "tr": "mꜣjr.j ḏr ḫft-ḥr.k", "es": "Mi desdicha ha terminado ante ti.", "an": "Sujeto + estativo ḏr («ha acabado»).", "id": "17.21"}]}, {"id": "D", "title": "Ahmose hijo de Abana (Urk. IV)", "items": [{"t": "tr", "ref": "Autobiografía de Ahmose hijo de Abana, l. 2–3 (Urk. IV 1–11)", "vo": [["jwꜥ", "recompensar"], ["ḫft-ḥr", "a la vista de"], ["r-ḏr.f", "entero"]], "tr": "jwꜥ.kw m nbw zp 7 ḫft-ḥr n tꜣ r-ḏr.f", "es": "Fui recompensado con oro siete veces a la vista de la tierra entera.", "an": "jwꜥ.kw: estativo de 1.ª persona de un verbo transitivo, con valor pasivo. zp 7: «siete veces».", "id": "17.22"}, {"t": "tr", "ref": "Autobiografía de Ahmose hijo de Abana, l. 3 (Urk. IV 1–11)", "vo": [["r-mjtt-jrj", "igualmente"], ["sꜣḥ", "dotar"], ["ꜣḥwt", "campos"]], "tr": "ḥmw ḥmwt r-mjtt-jrj sꜣḥ.kw m ꜣḥwt ꜥšꜣw wrt", "es": "Y también con siervos y siervas; fui dotado de muchísimos campos.", "an": "sꜣḥ.kw: estativo pasivo («fui dotado»). ꜥšꜣw wrt: «muy numerosos» (wrt, adverbio «mucho»).", "id": "17.23"}, {"t": "tr", "ref": "Autobiografía de Ahmose hijo de Abana, l. 7 (Urk. IV 1–11)", "vo": [["grg pr", "fundar una casa (casarse)"], ["jṯ", "tomar, llevar"], ["qnn", "valentía"]], "tr": "ḫr m-ḫt grg.n.j pr ꜥḥꜥ.n.j jṯ.kw r pꜣ dpt mḥtj ḥr qnn.j", "es": "Pero después de fundar un hogar, fui llevado al barco «El Norte» por mi valentía.", "an": "m-ḫt + sḏm.n.f: «después de que». jṯ.kw: estativo pasivo de 1.ª persona («fui tomado»).", "id": "17.24"}, {"t": "tr", "ref": "Autobiografía de Ahmose hijo de Abana, l. 9 (Urk. IV 1–11)", "vo": [["dhn", "nombrar, destinar"]], "tr": "ꜥḥꜥ.n.j dhn.kw r ḫꜥ-m-mn-nfr", "es": "Entonces fui destinado al barco «Que aparece en Menfis».", "an": "dhn.kw: estativo pasivo de 1.ª persona («fui nombrado, destinado»).", "id": "17.25"}, {"t": "tr", "ref": "Autobiografía de Ahmose hijo de Abana, l. 19 (Urk. IV 1–11)", "vo": [["ꜣw jb", "alegrarse"], ["rsjw", "los del sur"], ["mḥtjw", "los del norte"]], "tr": "jb.f ꜣw m qnt nḫt jṯ.n.f rsjw mḥtjw", "es": "Su corazón estaba alegre de valor y victoria: había conquistado a los del sur y a los del norte.", "an": "ꜣw: estativo (jb.f ꜣw «su corazón está dilatado = alegre»). jṯ.n.f: sḏm.n.f.", "id": "17.26"}, {"t": "tr", "ref": "Autobiografía de Ahmose hijo de Abana, l. 23 (Urk. IV 1–11)", "vo": [["ḫr", "caído, enemigo"], ["pf", "aquel"]], "tr": "ꜥḥꜥ.n ḫr pf jw ttjꜥn rn.f", "es": "Entonces vino aquel enemigo; Tetian era su nombre.", "an": "jw: estativo de jwj («vino»). ḫr pf: «aquel caído», forma despectiva de llamar al enemigo.", "id": "17.27"}, {"t": "tr", "ref": "Autobiografía de Ahmose hijo de Abana, l. 40 (Urk. IV 1–11)", "vo": [["tnj", "envejecer"], ["jꜣwj", "vejez"]], "tr": "tnj.kw pḥ.n.j jꜣwj", "es": "He envejecido; he alcanzado la vejez.", "an": "tnj.kw: estativo de 1.ª persona. pḥ.n.j: sḏm.n.f.", "id": "17.28"}]}]}, "18": {"intro": "El perfecto sḏm.n.f: la acción completada, la forma narrativa de las autobiografías y de El náufrago.", "secs": [{"id": "A", "title": "Translitera y traduce", "items": [{"t": "tt", "ref": "El náufrago 9–10", "vo": [["pḥwj", "extremo, final"], ["wꜣwꜣt", "Uauat (Baja Nubia)"], ["zn", "pasar"], ["snmwt", "Senmut (isla de Bigga)"]], "tr": "pḥ.n.n pḥwj wꜣwꜣt zn.n.n snmwt|pḥ.n.n pḥwj wꜣwꜣt sn.n.n snmwt", "es": "Hemos alcanzado el extremo de Uauat, hemos pasado Senmut.", "an": "Dos perfectos de 1.ª plural: verbo + n del perfecto + sufijo .n «nosotros».", "id": "18.1", "g": "𓄖𓂻𓈖𓈖𓏥 𓄖𓅱𓏭 𓍯𓄿𓍯𓄿𓏏𓈉 𓊃𓈖𓂻𓈖𓈖𓏥 𓋴𓈖𓅓𓅱𓏏𓈉"}, {"t": "tt", "ref": "El náufrago 43–44", "vo": [["qnj", "abrazar"], ["šwyt", "sombra"]], "tr": "qnj.n.j šwyt", "es": "Me abracé a la sombra.", "an": "Perfecto de un verbo de tercera débil: la j final no aparece ante -n.", "id": "18.2", "g": "𓈎𓈖𓇋𓂘𓈖𓀀 𓈙𓅱𓏭𓏏𓋺"}, {"t": "tt", "ref": "El náufrago 55–56", "vo": [["šd", "sacar, tomar"], ["dꜣ", "taladro de fuego"]], "tr": "šd.n.j dꜣ jr.n.j ḫt", "es": "Saqué un taladro de fuego y encendí fuego.", "an": "Dos perfectos seguidos: acciones sucesivas completadas.", "id": "18.3", "g": "𓈙𓂧𓈖𓀀 𓂧𓄿𓍒 𓁹𓈖𓀀 𓐍𓏏𓊮"}, {"t": "tt", "ref": "Estela de Semna de Senuseret III (Berlín 1157)", "vo": [["ḥꜣw", "exceso, añadido"], ["swdt", "herencia, lo legado"]], "tr": "rdj.n.j ḥꜣw ḥr swdt n.j", "es": "Añadí a lo que se me había legado.", "an": "rdj.n.j: perfecto del verbo anómalo rdj.", "id": "18.4", "g": "𓂋𓂞𓈖𓀀 𓇉𓄿𓅱𓏛 𓁷𓏤 𓋴𓅱𓂧𓏏𓏛 𓈖𓀀"}, {"t": "tt", "ref": "Fórmula autobiográfica de tumbas provinciales (Imperio Antiguo y Primer Período Intermedio)", "vo": [["jj", "venir"], ["hꜣj", "bajar"], ["spꜣt", "provincia, nomo"]], "tr": "jj.n.j m njwt.j hꜣ.n.j m spꜣt.j", "es": "Vine de mi ciudad, bajé de mi provincia.", "an": "Perfectos de verbos de movimiento con m «desde».", "id": "18.5", "g": "𓇍𓇋𓂻𓈖𓀀 𓅓 𓊖𓏏𓀀 𓉔𓄿𓂻𓈖𓀀 𓅓 𓋴𓊪𓄿𓏏𓈈𓀀"}]}, {"id": "B", "title": "Más textos reales", "items": [{"t": "tt", "ref": "Libro de los Muertos, cap. 125 (introducción)", "vo": [["ḫr", "ante (una persona)"]], "tr": "jj.n.j ḫr.k nb.j", "es": "He venido ante ti, señor mío.", "an": "jj.n.j: perfecto de jj. ḫr.k: preposición ḫr con sufijo.", "id": "18.6", "g": "𓇍𓇋𓂻𓈖𓀀 𓐍𓂋𓎡 𓎟𓀀"}, {"t": "tt", "ref": "Libro de los Muertos, cap. 125 (introducción)", "vo": [["dr", "expulsar"]], "tr": "jn.n.j n.k mꜣꜥt dr.n.j n.k jsft", "es": "Te he traído la verdad, he expulsado para ti la injusticia.", "an": "Dos perfectos paralelos con n.k «para ti».", "id": "18.7", "g": "𓏎𓈖𓈖𓀀 𓈖𓎡 𓆄𓏏 𓂧𓂋𓈖𓀀 𓈖𓎡 𓇋𓋴𓆑𓏏𓅪"}, {"t": "tt", "ref": "Fórmula autobiográfica del Imperio Antiguo y del Primer Período Intermedio", "tr": "ḏd.n.j mꜣꜥt jr.n.j mꜣꜥt", "es": "Dije la verdad, practiqué la verdad.", "an": "Dos perfectos paralelos.", "id": "18.8", "g": "𓆓𓂧𓈖𓀀 𓆄𓏏 𓁹𓈖𓀀 𓆄𓏏"}, {"t": "tt", "ref": "Sinuhé B 25–26", "vo": [["ḫrw", "voz, ruido"], ["nmj", "mugido"], ["mnmnt", "ganado"], ["gmḥ", "divisar"], ["sṯtjw", "asiáticos"]], "tr": "sḏm.n.j ḫrw nmj n mnmnt gmḥ.n.j sṯtjw", "es": "Oí el mugido del ganado y divisé a unos asiáticos.", "an": "Dos perfectos de 1.ª persona: sḏm.n.j, gmḥ.n.j.", "id": "18.9", "g": "𓄔𓅓𓈖𓀀 𓐍𓂋𓅱𓀁 𓈖𓅓𓇋𓃒 𓈖 𓅓𓈖𓅓𓈖𓏏𓃒𓏥 𓎼𓅓𓎛𓁹𓈖𓀀 𓋴𓍿𓏏𓏭𓌙𓀀𓏥"}, {"t": "tt", "ref": "Sinuhé B 27–28", "vo": [["šbj", "cocer, hervir"], ["jrṯt", "leche"]], "tr": "rdj.n.f n.j mw šbj.n.f n.j jrṯt", "es": "Me dio agua y me hirvió leche.", "an": "Dos perfectos de 3.ª persona con n.j «para mí».", "id": "18.10", "g": "𓂋𓂞𓈖𓆑 𓈖𓀀 𓈗 𓈙𓃀𓇋𓈖𓆑 𓈖𓀀 𓇋𓂋𓍿𓏏𓏈"}, {"t": "tt", "ref": "Sinuhé B 28–29", "vo": [["fḫ", "partir"], ["kpnj", "Biblos"]], "tr": "rdj.n wj ḫꜣst n ḫꜣst fḫ.n.j r kpnj", "es": "Un país me entregó a otro país; partí hacia Biblos.", "an": "rdj.n wj: perfecto con sujeto nominal (ḫꜣst) y objeto dependiente wj. fḫ.n.j: perfecto.", "id": "18.11", "g": "𓂋𓂞𓈖 𓅱𓀀 𓆼𓄿𓋴𓏏𓈉 𓈖 𓆼𓄿𓋴𓏏𓈉 𓆑𓐍𓈖𓀀 𓂋 𓎡𓊪𓈖𓇋𓊖"}, {"t": "tt", "ref": "Enseñanza para Merikare E 131 (el dios creador y la humanidad)", "vo": [["n jb.sn", "por ellos, en su favor"]], "tr": "jr.n.f pt tꜣ n jb.sn", "es": "Hizo el cielo y la tierra por ellos.", "an": "jr.n.f: perfecto de jrj. n jb.sn es literalmente «por su corazón».", "id": "18.12", "g": "𓁹𓈖𓆑 𓊪𓏏𓇯 𓇾𓏤 𓈖 𓄣𓋴𓈖𓏥"}, {"t": "tt", "ref": "Enseñanza para Merikare E 132", "vo": [["ṯꜣw", "aliento"], ["n jb", "por, en favor de"], ["fnḏ", "nariz"]], "tr": "jr.n.f ṯꜣw n jb ꜥnḫ fnḏw.sn", "es": "Hizo el aliento por ellos, para que vivan sus narices.", "an": "jr.n.f: sḏm.n.f. n jb (sobreentendido «de ellos»). ꜥnḫ fnḏw.sn: sḏm.f subjuntivo de finalidad, «para que vivan sus narices».", "id": "18.13", "g": "𓁹𓈖𓆑 𓍿𓄿𓅱𓊡 𓈖 𓄣𓏤 𓋹𓈖𓐍 𓆑𓈖𓆓𓅱𓂉𓏥 𓋴𓈖𓏥"}, {"t": "tt", "g": "𓂋𓂝𓈖 𓀀 𓏏𓈖𓌰𓅓𓂻𓀀 𓁷𓏤 𓍯𓄿𓏏𓈐 𓈖𓈞𓅓𓂝𓈖 𓀀 𓂝𓍯𓄿𓂝𓀀", "ref": "Sinuhé B (Sinuhé, jefe en Retenu)", "vo": [["tnm", "extraviarse"], ["nḥm", "rescatar"]], "tr": "rdj.n.j tnm ḥr wꜣt nḥm.n.j ꜥwꜣ|rdj.n.j tnm ḥr wꜣt nḥm.n.j ꜥwꜣw", "es": "Ponía en el camino al extraviado y rescataba al despojado.", "an": "Dos sḏm.n.f en paralelo. tnm «el que se extravía» y ꜥwꜣ «el robado» son participios sustantivados.", "id": "18.14"}, {"t": "tt", "g": "𓊢𓂝𓈖 𓄿𓏏𓊪𓀋𓂝𓈖 𓀀 𓋴𓏏 𓂋 𓂧𓊪𓏏𓊛 𓏏𓈖", "ref": "El náufrago (el regreso)", "vo": [["ꜣtp", "cargar"], ["dpt", "barco"]], "tr": "ꜥḥꜥ.n ꜣtp.n.j st r dpt tn", "es": "Entonces los cargué en este barco.", "an": "ꜥḥꜥ.n + sḏm.n.f: narración en pasado. st: pronombre dependiente de objeto («los, ellos»).", "id": "18.15"}, {"t": "tt", "g": "𓊢𓂝𓈖 𓂋𓂝𓈖 𓆑 𓐍𓏏𓊮 𓇋𓅓 𓋴", "ref": "Papiro Westcar", "vo": [["ḫt", "fuego"]], "tr": "ꜥḥꜥ.n rdj.n.f ḫt jm.s", "es": "Entonces le prendió fuego.", "an": "rdj.n.f ḫt jm.s: «puso fuego en ella». jm.s: preposición m con sufijo (forma jm-).", "id": "18.16"}, {"t": "tt", "g": "𓊢𓂝𓈖 𓆓𓂧𓈖 𓊽𓊽𓇋𓏛𓀀", "ref": "Papiro Westcar (el mago Dyedi)", "vo": [["ḏdj", "Dyedi (el mago)"]], "tr": "ꜥḥꜥ.n ḏd.n ḏdj", "es": "Entonces dijo Dyedi:", "an": "ꜥḥꜥ.n + sḏm.n.f con sujeto nominal (el nombre propio).", "id": "18.17"}, {"t": "tt", "g": "𓄖𓂻𓈖 𓈖𓏥 𓄖𓅱𓏭 𓍯𓍯𓏏𓈉 𓊃𓈖𓏕𓂻𓈖 𓈖𓏥 𓊃𓈖𓅐𓏏𓈉", "ref": "El náufrago 9–10", "vo": [["pḥwj", "extremo"], ["wꜣwꜣt", "Uauat (Nubia)"], ["snj", "pasar"]], "tr": "pḥ.n.n pḥwj wꜣwꜣt sn.n.n snmwt", "es": "Hemos alcanzado el extremo de Uauat y hemos pasado Senmut.", "an": "sḏm.n.f de 1.ª plural (.n.n). sn.n.n: de snj «pasar de largo».", "id": "18.18"}, {"t": "tt", "g": "𓇋𓏲 𓌳𓁹𓄿𓈖 𓀀 𓊃𓏏𓁐𓈞𓏏𓁐 𓇋𓅓 𓆑", "ref": "Cuento del pastor (papiro de Berlín 3024)", "vo": [["zt-ḥmt", "mujer"]], "tr": "jw mꜣ.n.j zt-ḥmt jm.f", "es": "Vi a una mujer en ella (en la charca).", "an": "jw + sḏm.n.f: pasado con valor de relato en primera persona.", "id": "18.19"}, {"t": "tt", "g": "𓊢𓂝𓈖 𓍛𓏤 𓈖 𓇓𓏏𓆤𓏏 𓍹𓀗𓈖𓏭𓍺 𓏠𓈖𓇋𓌙𓏱𓈖 𓆑", "ref": "Enseñanza para Kagemni (papiro Prisse)", "vo": [["mnj", "atracar; morir"]], "tr": "ꜥḥꜥ.n ḥm n nswt-bjt ḥwnj mnj.n.f", "es": "Entonces la Majestad del rey Huni murió.", "an": "ꜥḥꜥ.n + sujeto + sḏm.n.f. mnj «atracar» es eufemismo de morir.", "id": "18.20"}, {"t": "tt", "g": "𓇋𓅱 𓂋𓂞𓈖 𓀀 𓇉𓅱𓏝𓏥 𓁷 𓋴𓎗𓅱𓏏𓏝 𓈖 𓀀", "ref": "Estela de Semna de Senuseret III (Berlín 1157)", "vo": [["ḥꜣw", "aumento"], ["swḏ", "legar"]], "tr": "jw rdj.n.j ḥꜣw ḥr swḏt n.j", "es": "He añadido a lo que me fue legado.", "an": "jw + sḏm.n.f. swḏt: participio pasivo femenino sustantivado («lo legado»).", "id": "18.21"}]}, {"id": "C", "title": "Ahmose hijo de Abana (Urk. IV)", "items": [{"t": "tr", "ref": "Autobiografía de Ahmose hijo de Abana, l. 4 (Urk. IV 1–11)", "vo": [["ḫprw", "formas, transformaciones"], ["dmj", "ciudad, población"]], "tr": "jr.n.j ḫprw.j m dmj n nḫb", "es": "Pasé mi juventud (literalmente «hice mis transformaciones») en la ciudad de Nejeb.", "an": "sḏm.n.f de jrj. ḫprw: «formas, crecimiento». nḫb: Nejeb (El-Kab).", "id": "18.22"}, {"t": "tr", "ref": "Autobiografía de Ahmose hijo de Abana, l. 12 (Urk. IV 1–11)", "vo": [["sqr-ꜥnḫ", "prisionero"], ["hꜣj", "bajar"]], "tr": "ꜥḥꜥ.n jn.n.j sqr-ꜥnḫ s hꜣ.n.j r pꜣ mw", "es": "Entonces traje un prisionero: un hombre. Había bajado al agua.", "an": "ꜥḥꜥ.n + sḏm.n.f. sqr-ꜥnḫ: «prisionero» (lit. «golpeado vivo»).", "id": "18.23"}, {"t": "tr", "ref": "Autobiografía de Ahmose hijo de Abana, l. 13 (Urk. IV 1–11)", "vo": [["ḏꜣj", "cruzar"]], "tr": "ḏꜣ.n.j ẖr.f ḥr mw", "es": "Lo atravesé (cargado) con él por el agua.", "an": "sḏm.n.f de ḏꜣj «cruzar». ẖr.f: «llevándolo» (preposición ẖr «bajo, cargado con»).", "id": "18.24"}]}]}, "19": {"intro": "El subjuntivo: deseos, finalidad, y como complemento de verbos como rdj «hacer que» o jmj «haz que».", "secs": [{"id": "A", "title": "Translitera y traduce", "items": [{"t": "tt", "ref": "Llamada a los vivos (estelas del Reino Medio)", "vo": [["ḏd.ṯn", "que digáis"], ["jmꜣḫy", "venerado"]], "tr": "ḏd.ṯn ḫꜣ m t ḥnqt ḫꜣ m kꜣ ꜣpd n kꜣ n jmꜣḫy", "es": "…que digáis: «Mil de pan y cerveza, mil de bueyes y aves, para el ka del venerado».", "an": "ḏd.ṯn: subjuntivo de deseo o petición («que digáis»), con sufijo de 2.ª plural .ṯn.", "id": "19.1", "g": "𓆓𓂧𓍿𓈖𓏥 𓆼 𓅓 𓏐 𓏊 𓆼 𓅓 𓃾 𓅾 𓈖 𓂓𓏤 𓈖 𓄪𓇋𓇋"}, {"t": "tt", "ref": "Enseñanza para Merikare E 46", "vo": [["wꜣḥ", "perdurar"], ["tp tꜣ", "sobre la tierra"]], "tr": "jr mꜣꜥt wꜣḥ.k tp tꜣ", "es": "Practica Maat, para que perdures sobre la tierra.", "an": "jr: imperativo. wꜣḥ.k: subjuntivo de finalidad.", "id": "19.2", "g": "𓁹𓂋 𓆄𓏏 𓎝𓎛𓎡 𓁶𓏤 𓇾𓏤"}]}, {"id": "B", "title": "Análisis", "items": [{"t": "mc", "q": "En jr mꜣꜥt wꜣḥ.k tp tꜣ, ¿qué valor tiene el subjuntivo wꜣḥ.k?", "op": ["Finalidad: «para que perdures»", "Pasado: «perduraste»", "Condición: «si perduras»", "Pregunta: «¿perduras?»"], "ok": 0, "an": "Tras un imperativo, el subjuntivo expresa la finalidad o la consecuencia deseada.", "id": "19.3"}, {"t": "mc", "q": "¿Qué forma tiene el subjuntivo de los verbos de tercera débil como mrj?", "op": ["Sin geminar: mr.f (con -j a veces escrita)", "Geminada: mrr.f", "Con -n: mr.n.f", "Con -t: mrt.f"], "ok": 0, "an": "El subjuntivo no gemina. La forma geminada mrr.f es imperfectiva.", "id": "19.4"}]}, {"id": "C", "title": "Más textos reales", "items": [{"t": "tt", "ref": "Papiros de Kahun 22,5 (fórmula de las cartas)", "vo": [["wḏꜣ jb", "estar contento; estar informado"]], "tr": "rdj wḏꜣ jb", "es": "informar (literalmente «hacer que el corazón esté bien»)", "an": "rdj + subjuntivo (wḏꜣ jb): «hacer que…». Con esta expresión empiezan muchas cartas.", "id": "19.5", "g": "𓂋𓂞 𓍑𓄿 𓄣𓏤"}, {"t": "tt", "ref": "Sinuhé B 156–157 (Sinuhé, ya viejo, ruega volver a Egipto)", "vo": [["šꜣ", "disponer, decretar"], ["wꜥrt", "huida"], ["ḥtp", "ser propicio"]], "tr": "nṯr nb šꜣ wꜥrt tn ḥtp.k dj.k wj r ẖnw", "es": "Oh dios, quienquiera que dispusiste esta huida: sé propicio y llévame a la Residencia.", "an": "ḥtp.k y dj.k: subjuntivos de deseo («que seas propicio, que me pongas»). šꜣ es un participio: «(tú) que dispusiste».", "id": "19.6", "g": "𓊹𓀭 𓎟 𓆷𓄿𓏛 𓅱𓂝𓂋𓏏𓂾 𓏏𓈖 𓊵𓏏𓊪𓎡 𓏙𓎡 𓅱𓀀 𓂋 𓄚𓈖𓏌𓅱𓉐"}, {"t": "tt", "g": "𓇋𓐝𓅓𓂝 𓉐𓂋𓂻 𓂋𓈖 𓎢", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "vo": [["prj", "salir, difundirse"]], "tr": "jmj prj rn.k|jmj pr rn.k", "es": "¡Haz que tu nombre se difunda!", "an": "jmj (imperativo de rdj) + sḏm.f subjuntivo prj rn.k: «haz que salga tu nombre».", "id": "19.7"}, {"t": "tt", "g": "𓇋𓐝𓅓𓂝 𓇓𓅱 𓂋 𓇾𓈇𓏤 𓍚𓀜 𓆑 𓈖 𓆑 𓆓𓊃 𓆑", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "vo": [["ḫsf", "castigar"], ["ḏs.f", "él mismo"]], "tr": "jmj sw r tꜣ ḫsf.f n.f ḏs.f", "es": "Ponlo en tierra: que se castigue él mismo.", "an": "jmj sw r tꜣ: imperativo con objeto. ḫsf.f: sḏm.f subjuntivo con valor de consecuencia o deseo.", "id": "19.8"}, {"t": "tt", "g": "𓂋𓂝 𓄿 𓊢𓂝𓂻 𓊃𓀀𓏤 𓂋 𓊃𓊪𓊗 𓆑 𓄤𓆑𓂋 𓈖 𓃹𓈖𓌳𓐙𓂝𓆀", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "vo": [["ꜣ", "pues (partícula)"], ["sp", "asunto, causa"], ["wn-mꜣꜥ", "verdad"]], "tr": "rdj ꜣ ꜥḥꜥ s r sp.f nfr n wn-mꜣꜥ|rdj ꜣ ꜥḥꜥ z r sp.f nfr n wn-mꜣꜥ", "es": "Haz, pues, que un hombre se presente por su buena causa de verdad.", "an": "rdj (imperativo) + ꜣ + sḏm.f subjuntivo ꜥḥꜥ s: «haz que un hombre se ponga en pie».", "id": "19.9"}, {"t": "tt", "g": "𓍯𓄿𓎛𓎝𓏛 𓄣𓏤 𓎢 𓂋𓐍𓏛 𓎢 𓌳𓐙𓂝𓏏𓏯𓏛", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "vo": [["wꜣḥ jb", "ser paciente, atento"]], "tr": "wꜣḥ jb.k rḫ.k mꜣꜥt", "es": "¡Sé atento y conocerás la verdad!", "an": "Imperativo wꜣḥ + sḏm.f subjuntivo rḫ.k de consecuencia («para que conozcas»).", "id": "19.10"}, {"t": "tt", "ref": "Enseñanzas de Ptahhotep, prólogo", "vo": [["mdw", "palabras"], ["sḏmjw", "los que escucharon"]], "tr": "ḏd.j n.f mdw sḏmjw|ḏd.j n.f mdw sḏmyw", "es": "…que yo le diga las palabras de los que escucharon.", "an": "ḏd.j: subjuntivo, dependiente de la petición al rey («permite que…»).", "id": "19.11", "g": "𓆓𓂧𓀀 𓈖𓆑 𓌃𓂧𓅱𓀁 𓄔𓅓𓅱𓀀𓏥"}, {"t": "tt", "g": "𓂝 𓎢 𓐍𓂋𓀒 𓋴𓐟𓄿𓄿𓀁 𓆑 𓁷𓏤 𓎟𓀀 𓆑", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "vo": [["sꜣꜣ", "sabiduría"]], "tr": "dj.k ḫr sꜣꜣ.f ḥr nb.f", "es": "Haz que su sabiduría recaiga sobre su señor.", "an": "dj.k + subjuntivo ḫr: «que hagas que caiga».", "id": "19.12"}, {"t": "tt", "g": "𓇋𓐝𓅓𓂝 𓂋 𓎢 𓏶𓀁 𓋴", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "vo": [["wnm", "comer"]], "tr": "jmj r.k wnm.s", "es": "¡Haz que coma!", "an": "jmj + subjuntivo wnm.s; r.k refuerza el imperativo.", "id": "19.13"}, {"t": "tt", "g": "𓂝 𓀀 𓊃𓈙𓄿𓏛 𓆑 𓅓 𓉻𓂝𓄿𓏛 𓎢", "ref": "Sinuhé B (respuesta de Sinuhé al príncipe Amunenshi)", "vo": [["sšꜣ", "conocer, saber"]], "tr": "dj.j sšꜣ.f m ꜥꜣ.k", "es": "Haré que conozca tu grandeza.", "an": "dj.j + subjuntivo sšꜣ.f.", "id": "19.14"}, {"t": "tt", "g": "𓂞 𓎡 𓃹𓈖 𓀀 𓅓 𓌞𓋴𓅱𓏏𓂻𓀭𓏥 𓍛𓀭 𓎡", "ref": "Corpus del TLA, Reino Medio (dinastía XIII)", "vo": [["šmswt", "séquito"]], "tr": "dj.k wn.j m šmswt ḥm.k", "es": "Haz que esté en el séquito de tu Majestad.", "an": "dj.k + subjuntivo wn.j.", "id": "19.15"}]}, {"id": "D", "title": "Ahmose hijo de Abana (Urk. IV)", "items": [{"t": "tr", "ref": "Autobiografía de Ahmose hijo de Abana, l. 2 (Urk. IV 1–11)", "vo": [["rmṯ", "gentes, personas"], ["ḥzwt", "favores"]], "tr": "ḏd.j n.ṯn rmṯ nbt dj.j rḫ.ṯn ḥzwt ḫprt n.j|ḏd.j n.ṯn rmṯ nb dj.j rḫ.ṯn ḥswt ḫprt n.j", "es": "Os hablo a vosotros, gentes todas, y os hago saber los favores que me sucedieron.", "an": "ḏd.j: sḏm.f (presente). dj.j rḫ.ṯn: rdj + subjuntivo («hago que sepáis»). ḫprt: participio femenino que califica a ḥzwt.", "id": "19.16"}]}]}, "20": {"intro": "Perfectivo e imperfectivo: n sḏm.f para negar el pasado y el sḏm.f en himnos y descripciones.", "secs": [{"id": "A", "title": "Translitera y traduce", "items": [{"t": "tt", "ref": "Libro de los Muertos, cap. 125 (declaración de inocencia)", "vo": [["jsft", "mal, injusticia"]], "tr": "n jr.j jsft r rmṯ", "es": "No he cometido injusticia contra la gente.", "an": "n + sḏm.f (perfectivo): negación de una acción pasada. Se traduce como pretérito o como pretérito perfecto.", "id": "20.1", "g": "𓂜 𓁹𓀀 𓇋𓋴𓆑𓏏𓅪 𓂋 𓂋𓅓𓍿𓀀𓁐𓏥"}, {"t": "tt", "ref": "Libro de los Muertos, cap. 125", "vo": [["ḥqr", "hambre"], ["rmj", "llanto"]], "tr": "n rdj.j ḥqr n rdj.j rmj", "es": "No he causado hambre, no he causado llanto.", "an": "Dos n sḏm.f con rdj «dar, causar».", "id": "20.2", "g": "𓂜 𓂋𓂞𓀀 𓎛𓈎𓂋𓀁 𓂜 𓂋𓂞𓀀 𓂋𓅓𓁿"}, {"t": "tt", "ref": "Gran Himno a Atón, primera línea", "vo": [["wbn", "alzarse, salir (el sol)"]], "tr": "wbn.k nfr m ꜣḫt nt pt", "es": "Te alzas hermoso en el horizonte del cielo.", "an": "wbn.k: sḏm.f de acción general o repetida (imperfectivo). nfr es un adjetivo usado como adverbio.", "id": "20.3", "g": "𓅱𓃀𓈖𓇳𓎡 𓄤𓆑𓂋 𓅓 𓅜𓐍𓏏𓈌 𓈖𓏏 𓊪𓏏𓇯"}]}, {"id": "B", "title": "Análisis", "items": [{"t": "mc", "q": "¿Qué expresa n sḏm.f?", "op": ["La negación de una acción pasada: «no oyó, no ha oído»", "Un mandato negativo", "Futuro negativo", "Una pregunta"], "ok": 0, "an": "n sḏm.f niega el pasado; n sḏm.n.f, en cambio, suele negar la capacidad o lo general («no puede oír»).", "id": "20.4"}, {"t": "mc", "q": "¿Cómo se distingue a menudo el imperfectivo del perfectivo en los verbos de tercera débil?", "op": ["Por la geminación: mrr.f (imperfectivo) frente a mr.f (perfectivo)", "Por la -n", "Por la -t", "No se pueden distinguir nunca"], "ok": 0, "an": "La geminación marca la acción repetida o continua.", "id": "20.5"}]}, {"id": "C", "title": "Más textos reales", "items": [{"t": "tt", "ref": "Libro de los Muertos, cap. 125 (declaración de inocencia)", "vo": [["ꜥwꜣ", "robar"]], "tr": "n ꜥwꜣ.j", "es": "No he robado.", "an": "n sḏm.f: negación del pasado.", "id": "20.6", "g": "𓂜 𓂝𓅱𓄿𓀜𓀀"}, {"t": "tt", "ref": "Libro de los Muertos, cap. 125", "vo": [["grg", "mentira"]], "tr": "n ḏd.j grg", "es": "No he dicho mentiras.", "an": "n sḏm.f + objeto.", "id": "20.7", "g": "𓂜 𓆓𓂧𓀀 𓎼𓂋𓎼𓏛"}, {"t": "tt", "ref": "Libro de los Muertos, cap. 125", "vo": [["smꜣ", "matar"]], "tr": "n smꜣ.j", "es": "No he matado.", "an": "n sḏm.f.", "id": "20.8", "g": "𓂜 𓋴𓌳𓄿𓌪𓀀"}, {"t": "tt", "g": "𓂜 𓈎𓅓𓂧𓀁 𓀀 𓋴", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "vo": [["qmd", "idear, inventar"]], "tr": "n qmd.j sj|n qmd.j s", "es": "No las he inventado yo.", "an": "n + sḏm.f: negación del pasado («no ideé»).", "id": "20.9"}, {"t": "tt", "g": "𓂜 𓄔𓅓 𓎢 𓇓𓅱", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "tr": "n sḏm.k sw", "vo": [["sw", "lo"]], "es": "Ni siquiera lo has oído.", "an": "n sḏm.f: pasado negativo.", "id": "20.10"}, {"t": "tt", "g": "𓂜 𓂋𓐍𓏛 𓀀 𓊖𓏏𓅂𓀀𓏥 𓇋𓊪𓈖", "ref": "Corpus del TLA, Reino Medio (dinastía XIII)", "vo": [["njwtjw", "habitantes de la ciudad"]], "tr": "n rḫ.j njwtjw jpn", "es": "No conozco a estos habitantes de la ciudad.", "an": "n rḫ.f: rḫ «llegar a saber», así que el pasado negativo equivale a «no sé / no conozco». njwtjw: nisbe de njwt.", "id": "20.11"}, {"t": "tt", "g": "𓂜 𓂋𓐍𓏛 𓀀 𓋴𓏏", "ref": "Corpus del TLA, Reino Medio (finales de la dinastía XII)", "tr": "n rḫ.j st", "es": "No lo sé.", "an": "n rḫ.f: pasado negativo de «llegar a saber», que equivale a un presente («no sé»).", "id": "20.12"}, {"t": "tt", "g": "𓂜 𓊃𓐍𓊃𓏏𓂻 𓏏 𓅓𓐟𓏤 𓀀", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "vo": [["zḫz", "perseguir"]], "tr": "n zḫz.tw m-sꜣ.j|n sḫs.tw m-sꜣ.j", "es": "No me persiguieron.", "an": "n sḏm.tw.f: pasado negativo impersonal («no se corrió tras de mí»).", "id": "20.13"}, {"t": "tt", "g": "𓂜 𓈝𓅓𓂻 𓀀", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "tr": "n šm.j", "es": "No fui.", "an": "n sḏm.f: pasado negativo.", "id": "20.14"}, {"t": "tt", "g": "𓂜 𓐍𓈖𓂧𓂾𓂻 𓎢 𓁷𓏤 𓎛𓃀𓋴𓏲𓋳𓏥 𓀀", "ref": "El campesino elocuente (la tela en el camino)", "vo": [["ḫnd", "pisar"], ["ḥbsw", "ropa, tela"]], "tr": "n ḫnd.k ḥr ḥbsw.j", "es": "¿No habrás pisado mi ropa?", "an": "n sḏm.f, pasado negativo, aquí en tono de pregunta-amenaza.", "id": "20.15"}, {"t": "tt", "g": "𓂜𓂜 𓆓𓂧 𓀀 𓋹𓈖𓐍 𓂋𓐟𓏤 𓇑𓇑", "ref": "Corpus del TLA, Reino Medio (dinastía XIII)", "vo": [["r-sꜣ", "después de"]], "tr": "n ḏd.j ꜥnḫ r-sꜣ nn", "es": "No pensé vivir después de esto.", "an": "n + sḏm.f: pasado negativo («no dije, no pensé»). ꜥnḫ: infinitivo.", "id": "20.16"}]}]}, "21": {"intro": "El prospectivo y las formas pasivas (sḏm.tw.f y el pasivo sḏm.f).", "secs": [{"id": "A", "title": "Translitera y traduce", "items": [{"t": "tt", "ref": "Estela de Semna de Senuseret III (Berlín 1157)", "vo": [["ms", "dar a luz, nacer"]], "tr": "ms.tw.f n ḥm.j", "es": "Ha nacido para Mi Majestad.", "an": "ms.tw.f: forma pasiva con -tw: «es dado a luz». ḥm.j «Mi Majestad».", "id": "21.1", "g": "𓄟𓋴𓏏𓅱𓆑 𓈖 𓍛𓀀"}, {"t": "tt", "ref": "Autobiografía de Ahmose hijo de Abana (El Kab)", "vo": [["nbw n qnt", "«el oro del valor» (condecoración militar)"]], "tr": "jw rdj.tw n.j nbw n qnt", "es": "Se me concedió el oro del valor.", "an": "rdj.tw: pasivo con -tw. El sujeto lógico es nbw n qnt.", "id": "21.2", "g": "𓃛𓅱 𓂋𓂞𓏏𓅱 𓈖𓀀 𓋞 𓈖 𓈎𓈖𓏏𓂡"}]}, {"id": "B", "title": "Análisis", "items": [{"t": "mc", "q": "¿Cuál es la marca de la mayoría de las formas pasivas del verbo?", "op": ["El sufijo -tw (sḏm.tw.f)", "La -n del perfecto", "La geminación", "La partícula jn"], "ok": 0, "an": "-tw puede añadirse a varias formas: sḏm.tw.f, sḏm.n.tw.f. Existe además un pasivo sḏm.f sin marca.", "id": "21.3"}, {"t": "mc", "q": "¿Qué expresa el prospectivo sḏm(w).f?", "op": ["Una acción futura o esperada: «oirá, que oiga»", "Una acción habitual", "Una acción pasada", "Un estado"], "ok": 0, "an": "El prospectivo mira hacia delante; en los verbos débiles puede llevar -w o -y.", "id": "21.4"}]}, {"id": "C", "title": "Más textos reales", "items": [{"t": "tt", "ref": "Papiro Edwin Smith, veredicto de los casos tratables (passim)", "vo": [["mr", "enfermedad"]], "tr": "mr jrj.j", "es": "Una enfermedad que trataré.", "an": "jrj.j: prospectivo en una relativa sin marca: «que yo haré (tratar)».", "id": "21.5", "g": "𓌻𓂋𓐎 𓁹𓂋𓇋𓀀"}, {"t": "tt", "ref": "Papiro Edwin Smith, veredicto de los casos dudosos (passim)", "vo": [["ꜥḥꜣ", "luchar"]], "tr": "mr ꜥḥꜣ.j ḥnꜥ.f", "es": "Una enfermedad con la que lucharé.", "an": "ꜥḥꜣ.j: prospectivo en relativa sin marca; ḥnꜥ.f «con ella» es el pronombre de retorno.", "id": "21.6", "g": "𓌻𓂋𓐎 𓂚𓀀 𓎛𓈖𓂝𓆑"}, {"t": "tt", "ref": "Papiro Edwin Smith, veredicto de los casos sin tratamiento (passim)", "tr": "mr n jrw.f", "es": "Una enfermedad que no se tratará.", "an": "n + prospectivo pasivo jrw.f: «no será tratada».", "id": "21.7", "g": "𓌻𓂋𓐎 𓂜 𓁹𓂋𓅱𓆑"}, {"t": "tt", "ref": "Sinuhé B 300–301 (el rey colma de honores a Sinuhé)", "vo": [["ḫws", "construir (con ladrillo o piedra)"], ["mr", "pirámide"], ["jnr", "piedra"], ["m-qꜣb", "en medio de"]], "tr": "jw ḫws n.j mr m jnr m-qꜣb mrw|jw ḫws n.j mr m jnr m qꜣb mrw", "es": "Se me construyó una pirámide de piedra en medio de las pirámides.", "an": "jw + pasivo sḏm.f ḫws («fue construida»), con sujeto mr. n.j «para mí». m-qꜣb: «en medio de».", "id": "21.8", "g": "𓇋𓏲 𓐍𓂝𓋴𓏲𓂝 𓈖 𓀀 𓍋𓅓𓂋𓉴 𓅓 𓇋𓈖𓂋𓊌 𓅓𓈎𓄿𓃀𓄲𓏛 𓍋𓅓𓂋𓅱𓉴𓏥"}, {"t": "tt", "ref": "El náufrago 122–123", "vo": [["ẖnw", "la Residencia"], ["njwt", "ciudad"]], "tr": "šm.k ḥnꜥ.sn r ẖnw mt.k m njwt.k", "es": "Irás con ellos a la Residencia y morirás en tu ciudad.", "an": "šm.k, mt.k: formas sḏm.f con sentido futuro (prospectivo), tras la predicción anterior.", "id": "21.9", "g": "𓈝𓂻𓎡 𓎛𓈖𓂝𓋴𓈖𓏥 𓂋 𓄚𓈖𓏌𓅱𓉐 𓅓𓏏𓀐𓎡 𓅓 𓊖𓏏𓎡"}, {"t": "tt", "g": "𓏶𓀁 𓇋𓈖 𓊃𓀀", "ref": "Corpus del TLA, Reino Medio (finales de la dinastía XII)", "vo": [["wnm", "comer"]], "tr": "wnm jn z|wnm jn s", "es": "Que lo coma el hombre.", "an": "Pasivo sḏm.f (o sḏm.tw.f) con agente introducido por jn: «sea comido por el hombre». Fórmula de receta médica.", "id": "21.10"}, {"t": "tt", "g": "𓂋𓂞𓈖𓍿𓅱 𓈖 𓆑 𓐙𓌳𓂝𓊤", "ref": "Corpus del TLA, Reino Medio (finales de la dinastía XII)", "vo": [["mꜣꜥ-ḫrw", "justificación"]], "tr": "rdj.n.tw n.f mꜣꜥ-ḫrw|rdj.n.ṯw n.f mꜣꜥ-ḫrw", "es": "Se le concedió la justificación.", "an": "sḏm.n.tw.f: pasivo perfectivo («se dio»). Sujeto mꜣꜥ-ḫrw.", "id": "21.11"}, {"t": "tt", "g": "𓂋𓂝𓈖𓏏 𓎢 𓂋 𓂧𓈖𓇋𓏏𓍸𓈇𓏤 𓈖 𓌳𓄿𓇋𓂋𓌗𓅪𓀀", "ref": "El campesino elocuente", "vo": [["dnjt", "dique"], ["mꜣjr", "desvalido"]], "tr": "rdj.n.tw.k r dnjt n mꜣjr", "es": "Has sido puesto como dique para el desvalido.", "an": "sḏm.n.tw.f pasivo con sufijo-sujeto .k. r + sustantivo: «como, en calidad de».", "id": "21.12"}, {"t": "tt", "g": "𓆓𓂧𓏏 𓈖 𓆑 𓇍𓅱 𓅓𓊵𓏏𓊪 𓇋𓈖 𓅨𓂋𓀀𓏥𓏌𓏤𓍋𓃀𓈋𓊖", "ref": "Corpus del TLA, Reino Medio (Primer Período Intermedio / inicios del Reino Medio)", "vo": [["jjw m ḥtp", "¡bienvenido!"], ["ꜣbḏw", "Abidos"]], "tr": "ḏd.tw n.f jjw m ḥtp jn wrw nw ꜣbḏw|ḏd.tw n.f jj.wj m ḥtp jn wrw nw ꜣbḏw", "es": "Que le digan «¡bienvenido!» los grandes de Abidos.", "an": "ḏd.tw: pasivo sḏm.tw.f subjuntivo (deseo). El agente va con jn.", "id": "21.13"}, {"t": "tt", "g": "𓀨𓈖𓍿𓅱 𓈖 𓀀 𓊪𓊖 𓊃𓈖𓍿𓍰𓈖𓍿𓅱 𓈖 𓀀 𓂧𓊪𓅱𓊖", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "vo": [["snṯ", "fundar"], ["p, dp", "Pe y Dep (Buto)"]], "tr": "qd.n.tw n.j p snṯ.n.tw n.j dp|qd.n.ṯw n.j p snṯ.n.ṯw n.j dp", "es": "Se me construyó Pe, se me fundó Dep.", "an": "Dos pasivos sḏm.n.tw.f en paralelo; los sujetos son los topónimos p y dp.", "id": "21.14"}]}, {"id": "D", "title": "Ahmose hijo de Abana (Urk. IV)", "items": [{"t": "tr", "ref": "Autobiografía de Ahmose hijo de Abana, l. 9 (Urk. IV 1–11)", "vo": [["ḥms ḥr", "asediar (lit. sentarse sobre)"], ["ḥwt-wꜥrt", "Ávaris"], ["qnt", "ser valiente"]], "tr": "jw ḥms.tw ḥr dmj n ḥwt-wꜥrt wn.ḫr.j ḥr qnt ḥr rdwj.j m-bꜣḥ ḥm.f", "es": "Cuando se asediaba la ciudad de Ávaris, yo actuaba con valentía a pie en presencia de su Majestad.", "an": "ḥms.tw: sḏm.tw.f impersonal («se sitiaba»). wn.ḫr.j ḥr qnt: acción repetida.", "id": "21.15"}, {"t": "tr", "ref": "Autobiografía de Ahmose hijo de Abana, l. 10 (Urk. IV 1–11)", "vo": [["smj", "informar"], ["wḥm-nswt", "heraldo real"]], "tr": "smj.tw n wḥm-nswt wn.jn.tw ḥr rdjt n.j nbw n qnt", "es": "Se informó al heraldo real y se me dio el oro del valor.", "an": "smj.tw: sḏm.tw.f pasivo-impersonal. nbw n qnt: condecoración militar.", "id": "21.16"}, {"t": "tr", "ref": "Autobiografía de Ahmose hijo de Abana, l. 16 (Urk. IV 1–11)", "vo": [["ḥꜣqt", "botín"]], "tr": "mk rdj.tw n.j ḥꜣqt r ḥmw", "es": "Mira, se me dio el botín como siervos.", "an": "rdj.tw: sḏm.tw.f pasivo de rdj.", "id": "21.17"}]}]}, "22": {"intro": "Las demás formas de la conjugación: sḏm.jn.f, sḏm.ḫr.f, sḏm.kꜣ.f y el participio prospectivo sḏmtj.fj.", "secs": [{"id": "A", "title": "Translitera y traduce", "items": [{"t": "tt", "ref": "Papiro Edwin Smith, comienzo de cada caso (passim)", "vo": [["ḫꜣj", "examinar"], ["ḏd.ḫr.k", "dirás (entonces)"]], "tr": "jr ḫꜣj.k zj ḏd.ḫr.k r.f|jr ḫꜣ.k zj ḏd.ḫr.k r.f|jr ḫꜣj.k sj ḏd.ḫr.k r.f", "es": "Si examinas a un hombre (con tal herida), entonces dirás acerca de él…", "an": "jr + sḏm.f: condición. sḏm.ḫr.f: consecuencia necesaria o habitual: «entonces dirás».", "id": "22.1", "g": "𓇋𓂋 𓆼𓄿𓇋𓇋𓏛𓎡 𓊃𓇋𓀀 𓆓𓂧𓐍𓂋𓎡 𓂋𓆑"}, {"t": "tt", "ref": "Estela de Semna de Senuseret III (Berlín 1157)", "vo": [["grt", "además, ahora bien"], ["srwḏ.tj.fj", "que mantenga (participio prospectivo)"], ["tꜣš", "frontera"], ["jrj.n", "que ha hecho (forma relativa)"]], "tr": "jr grt zꜣ.j nb srwḏ.tj.fj tꜣš pn jrj.n ḥm.j zꜣ.j pw|jr grt sꜣ.j nb srwḏ.tj.fj tꜣš pn jrj.n ḥm.j sꜣ.j pw", "es": "En cuanto a todo hijo mío que mantenga esta frontera que ha hecho Mi Majestad, ése es mi hijo.", "an": "srwḏ.tj.fj: sḏmtj.fj, participio prospectivo («que mantendrá»). jr … introduce el tema; zꜣ.j pw es la oración principal.", "id": "22.2", "g": "𓇋𓂋 𓎼𓂋𓏏 𓅭𓀀 𓎟 𓋴𓂋𓅱𓆓𓂡𓏏𓏭𓆑𓏭 𓏏𓄿𓈙𓈇 𓊪𓈖 𓁹𓂋𓈖 𓍛𓀀 𓅭𓀀 𓊪𓅱"}, {"t": "tt", "ref": "Estela de Semna de Senuseret III (Berlín 1157)", "vo": [["fḫ.tj.fj", "quien la pierda"], ["n … js", "no (negación de oración nominal)"]], "tr": "jr grt fḫ.tj.fj sw n zꜣ.j js n ms.tw.f n.j js|jr grt fḫ.tj.fj sw n sꜣ.j js n ms.tw.f n.j js", "es": "Pero quien la pierda no es mi hijo, no ha nacido de mí.", "an": "Otro sḏmtj.fj, con sw como objeto (la frontera, tꜣš, es masculino). n zꜣ.j js: oración nominal negada con n … js (tema 11).", "id": "22.3", "g": "𓇋𓂋 𓎼𓂋𓏏 𓆑𓐍𓏏𓏭𓆑𓏭 𓇓𓅱 𓂜 𓅭𓀀 𓇋𓋴 𓂜 𓄟𓋴𓏏𓅱𓆑 𓈖𓀀 𓇋𓋴"}]}, {"id": "B", "title": "Análisis", "items": [{"t": "mc", "q": "¿Qué indica la forma sḏm.ḫr.f en los textos médicos y legales?", "op": ["Una consecuencia necesaria o la acción que corresponde hacer: «entonces harás»", "Una acción pasada", "Un deseo", "Una pregunta"], "ok": 0, "an": "Es la forma de las instrucciones: «si ocurre X, entonces harás Y».", "id": "22.4"}, {"t": "mc", "q": "¿En qué se diferencian ꜥḥꜥ.n sḏm.n.f y sḏm.jn.f?", "op": ["Ambas narran acciones sucesivas en el pasado; sḏm.jn.f es una forma conjugada del propio verbo", "ꜥḥꜥ.n es futuro", "sḏm.jn.f es negativa", "Son formas pasivas"], "ok": 0, "an": "ꜥḥꜥ.n y la forma sḏm.jn.f («entonces oyó») hacen avanzar la narración.", "id": "22.5"}]}, {"id": "C", "title": "Más textos reales", "items": [{"t": "tt", "ref": "Papiro Ebers, recetas (passim)", "vo": [["jr.ḫr.k", "harás (entonces)"]], "tr": "jr.ḫr.k n.f", "es": "Entonces le harás (este remedio).", "an": "sḏm.ḫr.f: la instrucción que corresponde seguir.", "id": "22.6", "g": "𓁹𓐍𓂋𓎡 𓈖𓆑"}, {"t": "tt", "g": "𓆓𓂧𓎢𓄿 𓇋𓀀 𓅠𓅓𓏏𓈖 𓀀 𓇋𓅓", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "vo": [["gm", "encontrar"], ["jm", "allí"]], "tr": "ḏd.kꜣ.j gmt.n.j jm", "es": "Entonces diré lo que encontré allí.", "an": "ḏd.kꜣ.j: forma sḏm.kꜣ.f, consecuencia futura. gmt.n.j: forma relativa sustantivada, «lo que encontré».", "id": "22.7"}, {"t": "tt", "g": "𓐎𓏏𓐍𓂋 𓎢 𓇓𓏲 𓁷𓏤 𓃀𓍑𓄿𓏲𓊌𓏥 𓏌𓏤 𓋳𓏪", "ref": "Papiro Edwin Smith (caso de una clavícula)", "vo": [["wt", "vendar"], ["bḏꜣw", "rollos, almohadillas"]], "tr": "wt.ḫr.k sw ḥr bḏꜣw nw ḥbsw", "es": "Entonces lo vendarás sobre rollos de tela.", "an": "wt.ḫr.k: forma sḏm.ḫr.f, habitual o prescriptiva («entonces debes vendar»), típica de los textos médicos.", "id": "22.8"}, {"t": "tt", "g": "𓁹𓇋𓈖 𓎢 𓈖 𓆑 𓏏𓅓𓏏𓏲𓈒𓏥", "ref": "Corpus del TLA, Reino Medio (dinastía XIII)", "vo": [["tmtw", "polvo medicinal"]], "tr": "jrj.jn.k n.f tmtw|jr.jn.k n.f tmtw", "es": "Entonces le prepararás un polvo.", "an": "jrj.jn.k: forma sḏm.jn.f, acción consecutiva («y entonces haces»).", "id": "22.9"}, {"t": "tt", "g": "𓅓 𓌃𓂧𓅱𓀁 𓈖 𓆑 𓂋 𓇋𓄿𓈙𓏏𓀁 𓆑", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "vo": [["mdw", "hablar"], ["ꜣš", "llamar, dirigir la palabra"]], "tr": "m mdw n.f r ꜣšt.f", "es": "No le hables hasta que él te haya dirigido la palabra.", "an": "m mdw: imperativo negativo. r + sḏmt.f (ꜣšt.f): «hasta que haya llamado».", "id": "22.10"}, {"t": "tt", "g": "𓅓 𓍯𓄿𓀁 𓂜 𓈖𓏏𓏏 𓂜 𓇍𓇋𓏏𓂻", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "vo": [["wꜣ", "cavilar, tramar"], ["ntt", "lo que"]], "tr": "m wꜣ n ntt n jjt", "es": "No caviles sobre lo que aún no ha llegado.", "an": "ntt n jjt: relativo ntt + n sḏmt.f, «lo que aún no ha venido» (sḏmt.f negativo: «antes de que»).", "id": "22.11"}, {"t": "tt", "g": "𓏎𓈖𓇋𓈖𓏏𓏲 𓆑 𓈖 𓆑 𓁷𓏤𓂝𓏤", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "vo": [["ḥr-ꜥ", "en seguida"]], "tr": "jnj.jn.tw.f n.f ḥr-ꜥ|jn.jn.tw.f n.f ḥr-ꜥ", "es": "Y entonces se lo trajeron en seguida.", "an": "jnj.jn.tw.f: forma sḏm.jn.f en pasivo (sḏm.jn.tw.f), acción consecutiva.", "id": "22.12"}, {"t": "tt", "g": "𓅓 𓎼𓂋𓍅𓏛 𓇼𓄿𓇳 𓂜 𓇍𓇋𓏏𓂻 𓆑", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "vo": [["grg", "preparar, planear"], ["dwꜣ", "mañana"]], "tr": "m grg dwꜣ n jjt.f", "es": "No hagas planes para mañana antes de que llegue.", "an": "m grg: imperativo negativo. n jjt.f: n sḏmt.f, «antes de que haya venido».", "id": "22.13"}, {"t": "tt", "g": "𓊢𓂝𓈖 𓄫𓏲𓂡𓈖 𓈖 𓆑 𓇓𓏏𓈖𓅭 𓅃𓂞𓂞𓆑𓀻 𓂝𓏤𓏲𓏭 𓆑𓏭", "ref": "Papiro Westcar (el príncipe Dyedefhor y el mago Dyedi)", "vo": [["ꜣwj", "extender, tender"], ["zꜣ-nswt", "hijo del rey, príncipe"]], "tr": "ꜥḥꜥ.n ꜣwj.n n.f zꜣ-nswt ḏd.f-ḥr ꜥwj.fj", "es": "Entonces el príncipe Dyedefhor le tendió los dos brazos.", "an": "ꜥḥꜥ.n + sḏm.n.f con sujeto nominal. ꜥwj.fj: dual con sufijo.", "id": "22.14"}, {"t": "tt", "g": "𓇋𓂋 𓋴𓆑𓈖𓂉𓀁 𓏼 𓐍𓂋 𓎢 𓋴𓆑𓈖𓂉𓀁 𓎢", "ref": "El campesino elocuente", "vo": [["sfn", "ser clemente"]], "tr": "jr sfn 3 ḫr.k sfn.k", "es": "Si los tres son clementes, entonces tú también debes serlo.", "an": "jr + oración: condicional. ḫr.k sfn.k: construcción ḫr + sujeto + sḏm.f («entonces debes»).", "id": "22.15"}, {"t": "tt", "g": "𓅓 𓎛𓂝𓅱𓀢 𓂜 𓈖𓏏𓏏 𓂜 𓆣𓂋𓏏", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "vo": [["ḥꜥj", "alegrarse"]], "tr": "m ḥꜥ n ntt n ḫprt", "es": "No te alegres de lo que todavía no ha ocurrido.", "an": "m ḥꜥ: imperativo negativo. ntt n ḫprt: «lo que no ha sucedido aún» (n sḏmt.f).", "id": "22.16"}]}, {"id": "D", "title": "Ahmose hijo de Abana (Urk. IV)", "items": [{"t": "tr", "ref": "Autobiografía de Ahmose hijo de Abana, l. 8 (Urk. IV 1–11)", "vo": [["jty", "soberano"], ["swtwt", "pasearse, ir"], ["wrryt", "carro"]], "tr": "wn.ḫr.j ḥr šms jty ꜥ.w.s. ḥr rdwj.j m-ḫt swtwt.f ḥr wrryt.f|wn.ḫr.j ḥr šms jtj ꜥnḫ wḏꜣ snb ḥr rdwj.j m-ḫt swtwt.f ḥr wrryt.f", "es": "Seguía al soberano (¡vida, prosperidad, salud!) a pie cuando él iba en su carro.", "an": "wn.ḫr.j ḥr + infinitivo: acción repetida («solía seguir»). m-ḫt: «detrás de», con el infinitivo swtwt.f.", "id": "22.17"}, {"t": "tr", "ref": "Autobiografía de Ahmose hijo de Abana, l. 10 (Urk. IV 1–11)", "vo": [["ꜥḥꜣ", "combatir"], ["ḫfꜥ", "capturar"], ["ḏrt", "mano"]], "tr": "wn.jn.tw ḥr ꜥḥꜣ ḥr mw m pꜣ-ḏdkw n ḥwt-wꜥrt ꜥḥꜥ.n ḫfꜥ.n.j jn.j ḏrt", "es": "Se combatió en el agua, en el canal Padyedku de Ávaris; entonces hice una captura y traje una mano.", "an": "wn.jn.tw ḥr + infinitivo: narración impersonal. jn.j: sḏm.f que continúa a ḫfꜥ.n.j. ḏrt: la mano cortada al enemigo como prueba.", "id": "22.18"}, {"t": "tr", "ref": "Autobiografía de Ahmose hijo de Abana, l. 14 (Urk. IV 1–11)", "vo": [["ḥmw", "siervos"]], "tr": "wn.jn ḥm.f ḥr rdjt st n.j r ḥmw", "es": "Y su Majestad me los dio como siervos.", "an": "wn.jn + sujeto nominal + ḥr + infinitivo. st: pronombre dependiente («los»). r ḥmw: «como siervos».", "id": "22.19"}]}]}, "23": {"intro": "Los participios: «el que hace», «el hecho». Muy frecuentes en epítetos, himnos y autobiografías.", "secs": [{"id": "A", "title": "Translitera y traduce", "items": [{"t": "tt", "ref": "Llamada a los vivos (estelas del Reino Medio)", "vo": [["mrrw", "que aman"], ["msḏḏw", "que odian"], ["ḫpt", "muerte (literalmente «el ir»)"]], "tr": "j ꜥnḫw tpjw tꜣ mrrw ꜥnḫ msḏḏw ḫpt", "es": "¡Oh vivos que estáis sobre la tierra, que amáis la vida y odiáis la muerte!", "an": "mrrw y msḏḏw: participios imperfectivos plurales (geminados) que califican a ꜥnḫw.", "id": "23.1", "g": "𓇋𓀁 𓋹𓈖𓐍𓅱𓀀𓏥 𓁶𓊪𓅱𓏭𓏥 𓇾𓏤 𓌻𓂋𓂋𓅱𓀀𓏥 𓋹𓈖𓐍 𓅓𓋴𓆓𓆓𓅱𓅪 𓐍𓊪𓏏𓀐"}, {"t": "tt", "ref": "Himno a Hapy, comienzo", "vo": [["pr", "que sale"], ["jj", "que viene"], ["sꜥnḫ", "hacer vivir"]], "tr": "jnḏ ḥr.k ḥꜥpj pr m tꜣ jj r sꜥnḫ kmt|jnḏ-ḥr.k ḥꜥpj pr m tꜣ jj r sꜥnḫ kmt", "es": "¡Salve a ti, Hapy, que sales de la tierra y vienes para hacer vivir a Egipto!", "an": "pr y jj: participios perfectivos. r + infinitivo (sꜥnḫ): finalidad.", "id": "23.2", "g": "𓇋𓈖𓂧 𓎛𓁷𓏤𓎡 𓎛𓂝𓊪𓇋𓈗 𓉐𓂋𓂻 𓅓 𓇾𓏤 𓇍𓇋𓂻 𓂋 𓋴𓋹𓈖𓐍 𓆎𓏏𓊖"}, {"t": "tt", "ref": "Fórmula de ofrenda (estelas del Reino Medio)", "vo": [["ꜥnḫt", "de la que vive"]], "tr": "ḫt nbt nfrt wꜥbt ꜥnḫt nṯr jm", "es": "toda cosa buena y pura de la que vive un dios", "an": "ꜥnḫt: participio femenino que concuerda con ḫt; su sujeto propio es nṯr y jm remite a ḫt («de ella»).", "id": "23.3", "g": "𓐍𓏏 𓎟𓏏 𓄤𓏏 𓃂𓏏 𓋹𓈖𓐍𓏏 𓊹 𓇋𓅓"}, {"t": "tt", "ref": "Epíteto de Ajenatón en Amarna", "tr": "ꜥnḫ m mꜣꜥt", "es": "el que vive de Maat", "an": "Participio + complemento preposicional.", "id": "23.4", "g": "𓋹𓈖𓐍 𓅓 𓆄𓏏"}, {"t": "tt", "ref": "Epíteto dentro del cartucho de Ramsés II y otros reyes", "tr": "mrj-jmn|mrj jmn", "es": "amado de Amón", "an": "mrj: participio pasivo «amado». Amón se escribe delante por anteposición honorífica.", "id": "23.5", "g": "𓇋𓏠𓈖 𓌻𓂋𓇋"}]}, {"id": "B", "title": "Más textos reales", "items": [{"t": "tt", "ref": "Nombre del rey Merenptah", "tr": "mrj-n-ptḥ|mr-n-ptḥ|mrj ptḥ", "es": "Amado de Ptah (Merenptah)", "an": "Participio pasivo mrj + n + agente.", "id": "23.6", "g": "𓌻𓂋𓇋 𓊪𓏏𓎛𓀭"}, {"t": "tt", "ref": "Epíteto en el cartucho de Ramsés II", "tr": "stp-n-rꜥ|stp n rꜥ", "es": "Elegido de Ra", "an": "Participio pasivo stp «elegido» + n del agente.", "id": "23.7", "g": "𓍉𓊪 𓈖 𓂋𓂝𓇳"}, {"t": "tt", "ref": "Enseñanza para Kagemni (P. Prisse 1,3)", "vo": [["th", "transgredir"], ["mṯn", "camino"]], "tr": "th mṯn", "es": "el que se sale del camino", "an": "Participio activo th + objeto.", "id": "23.8", "g": "𓏏𓉔𓂻 𓅓𓍿𓈖𓈐"}, {"t": "tt", "ref": "Título frecuente de cortesanos", "tr": "rḫ nswt|rḫ-nswt", "es": "conocido del rey", "an": "Participio pasivo rḫ «conocido» + nswt (que se escribiría delante por respeto).", "id": "23.9", "g": "𓂋𓐍𓏛 𓇓𓏏𓈖"}, {"t": "tt", "ref": "El campesino elocuente B1, 134", "vo": [["rḫ-ḫt", "sabio (literalmente «el que conoce las cosas»)"]], "tr": "rḫ-ḫt n rmṯt nbt|rḫ ḫt n rmṯt nbt", "es": "el más sabio de toda la gente", "an": "rḫ: participio activo + objeto ḫt. n rmṯt nbt «de toda la gente» expresa el superlativo.", "id": "23.10", "g": "𓂋𓐍𓏛 𓐍𓏏 𓈖 𓂋𓅓𓍿𓏏𓀀𓁐𓏥 𓎟𓏏"}, {"t": "tt", "ref": "El náufrago 70–72 (habla la serpiente)", "vo": [["wdf", "tardar"], ["jn", "el que trajo"]], "tr": "jr wdf.k m ḏd n.j jn tw r jw pn", "es": "Si tardas en decirme quién te ha traído a esta isla…", "an": "jr + sḏm.f: condición. jn tw: participio «el que te ha traído», usado como pregunta indirecta («quién te trajo»).", "id": "23.11", "g": "𓇋𓂋 𓅱𓂧𓆑𓅪𓎡 𓅓 𓆓𓂧 𓈖𓀀 𓏎𓈖 𓏏𓅱 𓂋 𓇋𓅱𓈀 𓊪𓈖"}, {"t": "tt", "ref": "Sinuhé B 311 (colofón)", "vo": [["ḥꜣt", "principio"], ["pḥwj", "final"], ["gmyt", "lo que se encontró"]], "tr": "jw.f pw ḥꜣt.f r pḥwj.fj mj gmyt m sš|jwj.f pw ḥꜣt.f r pḥwj.fj mj gmyt m sš|jw.f pw ḥꜣt.f r pḥwj.f mj gmyt m sš", "es": "Así termina, de principio a fin, como se encontró por escrito.", "an": "gmyt: participio pasivo femenino sustantivado («lo encontrado»). pḥwj.fj: dual con sufijo.", "id": "23.12", "g": "𓂻𓏲 𓆑 𓊪𓅱 𓄂𓏏𓏤 𓆑 𓂋 𓄖 𓆑𓏭 𓏇𓇋 𓅠𓅓𓇋𓇋𓏏 𓅓 𓏞𓏛"}, {"t": "tt", "g": "𓂋𓈙𓂉𓀁𓅱𓏭 𓆓𓂧𓂧𓏭 𓈖 𓆑 𓇑𓇑", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "vo": [["rš", "alegrarse"], ["nn", "esto"]], "tr": "rš.wj ḏdd n.f nn|rš.wj ḏddw n.f nn", "es": "¡Qué feliz es aquel a quien se dice esto!", "an": "rš.wj: adjetivo exclamativo (-wj). ḏdd n.f nn: participio pasivo imperfectivo, «aquel a quien se dice esto».", "id": "23.13"}, {"t": "tt", "g": "𓅠𓅓𓈖 𓆑 𓊃𓀀𓏤 𓊢𓂝𓂻 𓁷𓏤 𓌻𓂋𓇋𓇋𓏏𓈇 𓅈𓏏𓏭𓀜𓀀 𓂋𓈖 𓆑", "ref": "El campesino elocuente (encuentro con Nemtynajt)", "vo": [["mryt", "orilla, ribera"], ["rn", "nombre"]], "tr": "gm.n.f z ꜥḥꜥ ḥr mryt nmtj-nḫt rn.f|gm.n.f s ꜥḥꜥ ḥr mryt nmtj-nḫt rn.f", "es": "Encontró a un hombre de pie en la orilla, llamado Nemtynajt.", "an": "ꜥḥꜥ: participio («que estaba de pie») que califica a z. nmtj-nḫt rn.f: oración nominal «Nemtynajt era su nombre».", "id": "23.14"}, {"t": "tt", "g": "𓇋𓈖 𓅭𓏤 𓆑 𓇍𓇋𓇋𓂻 𓐙𓊤︂ 𓋴𓋹 𓂋𓈖 𓆑", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "vo": [["sꜥnḫ", "hacer vivir"], ["rn", "nombre"]], "tr": "jn zꜣ.f jy mꜣꜥ-ḫrw sꜥnḫ rn.f", "es": "Es su hijo Iy, justificado, quien hace vivir su nombre.", "an": "jn + sujeto + participio: oración participial enfática («es X quien…»).", "id": "23.15"}]}]}, "24": {"intro": "Las formas relativas: «lo que él hizo», «que da el cielo». Muy frecuentes en fórmulas de ofrenda y autobiografías.", "secs": [{"id": "A", "title": "Translitera y traduce", "items": [{"t": "tt", "ref": "Fórmula autobiográfica frecuente (estelas del Reino Medio)", "vo": [["mrrt", "lo que ama"], ["ḥzzt", "lo que alaba"]], "tr": "jr.n.j mrrt rmṯ ḥzzt nṯrw", "es": "Hice lo que la gente ama y lo que los dioses alaban.", "an": "mrrt y ḥzzt: formas relativas imperfectivas en femenino (sentido neutro: «lo que»), con sujeto propio rmṯ y nṯrw.", "id": "24.1", "g": "𓁹𓈖𓀀 𓌻𓂋𓂋𓏏 𓂋𓅓𓍿𓀀𓁐𓏥 𓎿𓋴𓋴𓏏 𓊹𓊹𓊹"}, {"t": "tt", "ref": "Fórmula de ofrenda (estelas del Reino Medio)", "vo": [["dd", "que da"], ["qmꜣ", "que crea"], ["jnn", "que trae"]], "tr": "ḫt nbt nfrt wꜥbt dd pt qmꜣ tꜣ jnn ḥꜥpj", "es": "toda cosa buena y pura que da el cielo, que crea la tierra y que trae la crecida", "an": "dd, qmꜣ, jnn: formas relativas cuyo antecedente es ḫt. Sus sujetos son pt, tꜣ y ḥꜥpj.", "id": "24.2", "g": "𓐍𓏏 𓎟𓏏 𓄤𓏏 𓃂𓏏 𓂞𓂧 𓊪𓏏𓇯 𓈎𓅓𓄿𓌙 𓇾𓏤 𓏎𓈖𓈖 𓎛𓂝𓊪𓇋𓈗"}, {"t": "tt", "ref": "Fórmula autobiográfica de estelas del Reino Medio", "vo": [["wḥm", "repetir"]], "tr": "ḏd nfrt wḥm mrrt|jnk ḏd nfrt wḥm mrrt", "es": "el que decía lo bueno y repetía lo que se ama", "an": "ḏd y wḥm: participios. mrrt: forma relativa sustantivada («lo que (la gente) ama»).", "id": "24.3", "g": "𓆓𓂧 𓄤𓏏 𓄙𓅓 𓌻𓂋𓂋𓏏"}]}, {"id": "B", "title": "Análisis", "items": [{"t": "mc", "q": "¿En qué se diferencia una forma relativa de un participio?", "op": ["La forma relativa tiene su propio sujeto, distinto del antecedente: «lo que la gente ama»", "El participio siempre es pasivo", "La forma relativa no concuerda", "No hay diferencia"], "ok": 0, "an": "En el participio el antecedente es el sujeto («el que ama»). En la forma relativa el antecedente es otro elemento, normalmente el objeto («lo que ama X»).", "id": "24.4"}]}, {"id": "C", "title": "Más textos reales", "items": [{"t": "tt", "ref": "El náufrago 121", "vo": [["skdw", "marineros"]], "tr": "skdw jm.s rḫ.n.k", "es": "con marineros en él a los que conoces", "an": "rḫ.n.k: forma relativa perfectiva («que has conocido, que conoces») sin pronombre de retorno, porque el antecedente es su objeto.", "id": "24.5", "g": "𓋴𓎡𓂧𓊛𓀀𓏥 𓇋𓅓𓋴 𓂋𓐍𓏛𓈖𓎡"}, {"t": "tt", "g": "𓂧𓎼𓁻𓏥 𓅓𓂞 𓏠𓈖𓏌𓏌𓏌𓏛𓏥 𓁹𓈖 𓀀", "ref": "Corpus del TLA, Reino Medio (finales de la dinastía XII)", "vo": [["dgꜣ", "mirar"], ["mnw", "monumentos"]], "tr": "dgꜣ m-dj mnw jrj.n.j|dgꜣw m-dj mnw jrj.n.j|dgꜣ m-dj mnw jr.n.j", "es": "¡Mirad los monumentos que he hecho!", "an": "jrj.n.j: forma relativa perfectiva; el antecedente mnw es su objeto, por eso no hay pronombre de retorno.", "id": "24.6"}, {"t": "tt", "g": "𓂜𓈖 𓋴𓇥𓂋𓁀 𓊃𓂋𓊃𓌘𓁹𓈖 𓎢", "ref": "El campesino elocuente", "vo": [["sḏr", "dormir; durmiente"], ["srs", "despertar"]], "tr": "nn sḏr srs.n.k", "es": "No sigue dormido nadie a quien tú hayas despertado.", "an": "nn + participio sḏr. srs.n.k: forma relativa, «a quien despertaste».", "id": "24.7"}, {"t": "tt", "g": "𓂜𓈖 𓍃𓅓 𓂋𓏤 𓃹𓈖𓉿𓂝𓈖 𓎢", "ref": "El campesino elocuente", "vo": [["tm", "cerrado"], ["wn", "abrir"]], "tr": "nn tm rꜣ wn.n.k|nn tm r wn.n.k", "es": "No queda con la boca cerrada nadie a quien tú hayas abierto (la boca).", "an": "tm rꜣ: «cerrado de boca». wn.n.k: forma relativa perfectiva.", "id": "24.8"}, {"t": "tt", "g": "𓂜𓈖 𓏏𓍃𓅓𓏏𓈖 𓀀 𓁹", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "vo": [["tm", "no hacer (verbo negativo)"]], "tr": "nn tmt.n.j jrj", "es": "No hay nada que yo no haya hecho.", "an": "tmt.n.j: forma relativa del verbo negativo tm, seguida del complemento negativo jrj: «lo que no hice».", "id": "24.9"}, {"t": "tt", "g": "𓈟𓏏 𓆑 𓌻𓂋𓏏 𓆑", "ref": "Corpus del TLA, Reino Medio (finales de la dinastía XII)", "vo": [["ḥmt", "esposa"]], "tr": "ḥmt.f mrjt.f|ḥmt.f mrt.f", "es": "Su esposa, a la que ama.", "an": "mrjt.f: forma relativa femenina, concordando con ḥmt; el antecedente es el objeto.", "id": "24.10"}, {"t": "tt", "g": "𓂜𓈖 𓏲𓆼𓄿𓅪 𓋴𓃀𓇼𓀜𓈖 𓎢", "ref": "El campesino elocuente", "vo": [["sbꜣ", "enseñar"]], "tr": "nn wḫꜣ sbꜣ.n.k", "es": "No sigue siendo necio nadie a quien tú hayas enseñado.", "an": "sbꜣ.n.k: forma relativa perfectiva, sin pronombre de retorno.", "id": "24.11"}, {"t": "tt", "g": "𓅓𓂝 𓎢 𓁹𓂋𓏏 𓋴𓈖𓏥 𓊪𓏲", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "vo": [["mk", "mira"]], "tr": "mk jrrt.sn pw", "es": "Mira, es lo que ellos suelen hacer.", "an": "jrrt.sn: forma relativa imperfectiva sustantivada («lo que hacen habitualmente»), predicado de pw.", "id": "24.12"}, {"t": "tt", "g": "𓃹𓈖𓇋𓈖 𓊃 𓁷𓏤 𓄙𓅓𓀁 𓄔𓅓𓏏𓈖 𓊃 𓎟𓏏 𓈖 𓂋𓂧𓌗𓏛𓊽𓂧𓏏𓁐", "ref": "Papiro Westcar (la sirvienta y Reddyedet)", "vo": [["wḥm", "repetir"]], "tr": "wn.jn.s ḥr wḥm sḏmt.n.s nbt n rwd-ḏdt", "es": "Entonces repitió a Reddyedet todo lo que había oído.", "an": "sḏmt.n.s: forma relativa perfectiva sustantivada («lo que oyó»), con nbt concertando en femenino.", "id": "24.13"}, {"t": "tt", "g": "𓂜𓈖 𓐍𓅓𓅪 𓂋𓂝𓈖 𓎢 𓂋𓐍𓏛 𓆑", "ref": "El campesino elocuente", "vo": [["ḫm", "ignorante"]], "tr": "nn ḫm rdj.n.k rḫ.f", "es": "No queda ignorante a quien hayas hecho saber.", "an": "rdj.n.k: forma relativa («a quien diste que supiera»), con subjuntivo rḫ.f.", "id": "24.14"}, {"t": "tt", "g": "𓂜𓈖 𓎼𓂋𓀁 𓂋𓂝𓈖 𓎢 𓌃𓂧𓅱𓀁 𓆑", "ref": "El campesino elocuente", "vo": [["gr", "callado"], ["mdw", "hablar"]], "tr": "nn gr rdj.n.k mdw.f", "es": "No queda callado a quien hayas hecho hablar.", "an": "rdj.n.k: forma relativa + subjuntivo mdw.f.", "id": "24.15"}, {"t": "tt", "g": "𓂜 𓂋𓐍𓏛𓈖 𓏏𓅱 𓆣𓂋𓏏𓏥 𓁹𓂋𓏏 𓊹𓏤 𓐍𓏏𓆑 𓍚𓀜 𓆑", "ref": "Enseñanza de Ptahhotep", "vo": [["ḫsf", "castigar, rechazar"]], "tr": "n rḫ.n.tw ḫprt jrrt nṯr ḫft ḫsf.f", "es": "No se sabe lo que ocur
