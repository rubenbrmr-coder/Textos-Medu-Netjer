<!DOCTYPE html>
<html lang="es">
<head>
<meta name="medu-version" content="20261120221905">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medu Netjer · Textos reales</title>
<link href="fuentes.css" rel="stylesheet">
<style>

:root{--pap:#f4ecdb;--pap2:#ebe0c8;--card:#fffaf0;--ink:#2b2418;--muted:#6f6350;--line:#dccfb2;--lapis:#1f3b6f;--lapis2:#2c5299;--gold:#b8862b;--gold2:#d9a944;--red:#a3402a;--green:#3d7a4a;--shadow:0 2px 10px rgba(60,40,10,.08)}
[data-theme=dark]{--pap:#16171c;--pap2:#1e2027;--card:#23262f;--ink:#ece4d2;--muted:#a59c8a;--line:#383c48;--lapis:#7fa3e6;--lapis2:#9db8ef;--gold:#d9a944;--gold2:#e8bf62;--red:#e07a5f;--green:#7cc08a;--shadow:0 2px 10px rgba(0,0,0,.3)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--pap);color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif;font-size:16px;line-height:1.5}
.tr{font-family:"Gentium Book Plus",serif;font-style:italic}
.hg{font-family:"Noto Sans Egyptian Hieroglyphs",serif;font-style:normal}
h1,h2,h3{font-family:"Cormorant Garamond",serif;color:var(--lapis);margin:.2em 0 .4em;line-height:1.15}
h1{font-size:2rem}h2{font-size:1.6rem}h3{font-size:1.3rem}
a{color:var(--lapis2)}
button{font:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
aside{background:var(--lapis);color:#f4ecdb;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
[data-theme=dark] aside{background:#121a2e}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.brand .hg{font-size:2rem;color:var(--gold2)}
.brand b{font-family:"Cormorant Garamond",serif;font-size:1.3rem;line-height:1.05;display:block}
.brand small{opacity:.75;font-size:.8rem}
.nav a{display:flex;gap:10px;align-items:center;color:#f4ecdb;text-decoration:none;padding:9px 12px;border-radius:9px;font-weight:600}
.nav a:hover{background:rgba(255,255,255,.08)}
.nav a.on{background:var(--gold);color:#1a1408}
.nav .ic{width:22px;text-align:center}
aside .foot{margin-top:auto;font-size:.8rem;opacity:.8}
aside .foot button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#f4ecdb;border-radius:8px;padding:5px 10px}
main{min-width:0;padding:26px clamp(14px,3vw,40px) 90px}
.wrap{max-width:980px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.btn{background:var(--lapis);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:600}
[data-theme=dark] .btn{color:#10131a}
.btn.ghost{background:transparent;color:var(--lapis);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:#1a1408}
.btn.green{background:var(--green);color:#fff}
.btn.red{background:var(--red);color:#fff}
.btn.sm{padding:5px 11px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}.small{font-size:.88rem}
.hero{display:flex;gap:16px;align-items:center;margin-bottom:14px}
.hero .hg{font-size:2.8rem;color:var(--gold)}
.hero p{margin:0;color:var(--muted)}
.les{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;text-decoration:none;color:var(--ink)}
.les:hover{border-color:var(--gold)}
.les .num{width:38px;height:38px;border-radius:50%;background:var(--pap2);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--lapis);flex:none}
.les.cur .num{background:var(--gold);color:#1a1408}
.les .ti{font-weight:600}
.bar{height:6px;background:var(--pap2);border-radius:4px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--green)}
.list{display:flex;flex-direction:column;gap:8px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec .ic{font-size:1.6rem}
.tag{display:inline-block;font-size:.75rem;font-weight:700;border-radius:6px;padding:1px 7px;background:var(--pap2);color:var(--muted);border:1px solid var(--line)}
.tag.ok{background:var(--green);color:#fff;border-color:var(--green)}
.tag.gold{background:var(--gold2);color:#1a1408;border-color:var(--gold2)}
/* quiz */
.quiz{max-width:760px;margin:0 auto}
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.qtop .bar{flex:1;height:8px}
.qbox{text-align:center;padding:24px 20px}
.qprompt{font-size:1.1rem;color:var(--muted);margin-bottom:10px}
.qbig{font-size:clamp(2rem,7vw,3.2rem);line-height:1.25;margin:6px 0 10px;word-break:break-all}
.qtr{font-size:1.5rem;color:var(--lapis);font-weight:700;margin:4px 0}
.qes{font-size:1.25rem;font-weight:600;margin:6px 0}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{text-align:left;padding:13px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:1.05rem}
.opt:hover:not([disabled]){border-color:var(--lapis)}
.opt .hg{font-size:1.7rem}
.opt.right{border-color:var(--green);background:rgba(61,122,74,.13)}
.opt.wrong{border-color:var(--red);background:rgba(163,64,42,.1)}
.inp{width:100%;padding:12px 14px;font-size:1.2rem;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-family:"Gentium Book Plus",serif}
.inp:focus{outline:none;border-color:var(--gold)}
textarea.inp{font-family:"Source Sans 3",sans-serif;font-size:1.05rem;min-height:84px;resize:vertical}
.kb{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px;margin:10px 0;max-width:560px;margin-left:auto;margin-right:auto}
.kb button{min-width:0;padding:7px 0;border-radius:8px;border:1px solid var(--line);background:var(--pap2);color:var(--red);font-family:"Gentium Book Plus","Noto Serif","DejaVu Serif","Segoe UI",serif;font-style:italic;font-size:1.1rem}
.fb{margin-top:16px;padding:14px 16px;border-radius:12px;text-align:left}
.fb.ok{background:rgba(61,122,74,.13);border:1px solid var(--green)}
.fb.ko{background:rgba(163,64,42,.1);border:1px solid var(--red)}
.fb b.t{display:block;margin-bottom:4px}
.gl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.gl span{background:var(--pap2);border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:.9rem}
.gl span i{font-family:"Gentium Book Plus",serif;color:var(--lapis)}
.ord{min-height:54px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;justify-content:center}
.chip{border:1px solid var(--line);background:var(--card);color:var(--lapis);border-radius:10px;padding:6px 12px;font-family:"Gentium Book Plus",serif;font-style:italic;font-size:1.15rem}
.chip.used{opacity:.25}
.sumbig{font-size:3rem;font-family:"Cormorant Garamond",serif;color:var(--lapis);font-weight:700}
/* textos */
.tline{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.tline .hg{font-size:clamp(1.7rem,5vw,2.4rem);line-height:1.3;word-break:break-all}
.tline .tr{font-size:1.2rem;color:var(--lapis);margin:4px 0}
.tline .es{font-weight:600}
.tline .note{font-size:.9rem;color:var(--muted);margin-top:6px;border-left:3px solid var(--gold);padding-left:10px}
.tline.done{border-color:var(--green)}
.hide{display:none}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--pap);padding:8px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:.95}
table.st{border-collapse:collapse;width:100%;font-size:.95rem}
table.st td,table.st th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
table.st th{color:var(--muted);font-weight:600}
select.inp{font-family:inherit;font-size:1rem;padding:8px}
.bottom{display:none}
.mtop{display:none;justify-content:space-between;align-items:center;margin-bottom:10px}
.mtop b{font-family:"Cormorant Garamond",serif;font-size:1.3rem;color:var(--lapis)}
@media (max-width:820px){
 .app{grid-template-columns:minmax(0,1fr)}
 aside{display:none}
 main{padding:14px 12px 92px}
 .bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--lapis);z-index:40;justify-content:space-around;padding:6px 2px calc(6px + env(safe-area-inset-bottom))}
 [data-theme=dark] .bottom{background:#121a2e}
 .bottom a{color:#f4ecdb;text-decoration:none;display:flex;flex-direction:column;align-items:center;font-size:.7rem;padding:4px 6px;border-radius:8px;flex:1}
 .bottom a .ic{font-size:1.2rem}
 .bottom a.on{background:var(--gold);color:#1a1408}
 .mtop{display:flex}
 h1{font-size:1.6rem}
 .hero .hg{font-size:2.2rem}
 .qbox{padding:18px 12px}
}

.les.off{opacity:.55;cursor:default}
.tag.bad{background:var(--red);color:#fff;border-color:var(--red)}
.exrow{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;text-decoration:none;color:var(--ink)}
.exrow:hover{border-color:var(--gold)}
.exn{width:26px;color:var(--muted);font-weight:700;flex:none}
.exm{flex:1;min-width:0;display:flex;flex-direction:column}
.exg{font-size:1.5rem;line-height:1.3;word-break:break-all}
.exref{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mir{display:inline-block;transform:scaleX(-1)}
.src{font-size:.88rem;color:var(--muted);font-style:italic;margin:4px 0 6px}
.sol{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.an{font-size:.95rem;margin-top:6px;border-left:3px solid var(--gold);padding-left:10px;text-align:left}
.qes{white-space:normal}
.prose p{margin:.2em 0 .9em}
.vt{display:none}.vt.on{display:inline}
.qtop a{text-decoration:none;font-size:1.2rem}
</style>
</head>

<script>
const TITLES=[{"n": 1, "title": "La lengua y la escritura egipcias", "sub": "Qué es el egipcio medio y cómo funcionan los jeroglíficos"}, {"n": 2, "title": "Los sonidos del egipcio medio", "sub": "El «alfabeto» de signos unilíteros y la transliteración"}, {"n": 3, "title": "Los signos multilíteros", "sub": "Bilíteros, trilíteros, complementos fonéticos e ideogramas"}, {"n": 4, "title": "Los sustantivos", "sub": "Género, número, dual y sintagmas nominales"}, {"n": 5, "title": "Los pronombres", "sub": "Pronombres sufijos, dependientes e independientes; demostrativos e interrogativos"}, {"n": 6, "title": "Los adjetivos", "sub": "Concordancia, adjetivos sustantivados, «todo», «otro» y comparaciones"}, {"n": 7, "title": "Oraciones adjetivales y nominales", "sub": "Tus primeras frases completas: «es bueno», «yo soy tu hijo»"}, {"n": 8, "title": "Preposiciones y adverbios", "sub": "m, n, r, ḥr y compañía; nisbes y adverbios"}, {"n": 9, "title": "Los números", "sub": "Cifras, ordinales, fracciones, medidas y fechas"}, {"n": 10, "title": "Oraciones adverbiales", "sub": "«Está en casa», «tiene una casa»: la partícula jw"}, {"n": 11, "title": "Las oraciones no verbales: negación y preguntas", "sub": "nn, n… js, jn: decir que no y preguntar"}, {"n": 12, "title": "Oraciones subordinadas no verbales", "sub": "Relativas con ntj y jwtj, sustantivas con ntt y circunstanciales"}, {"n": 13, "title": "El verbo", "sub": "Clases de verbos, raíces y visión general del sistema verbal"}, {"n": 14, "title": "Las formas de infinitivo", "sub": "El infinitivo, el infinitivo negativo y el complemento negativo"}, {"n": 15, "title": "La construcción pseudoverbal", "sub": "«Está oyendo», «oirá»: sujeto + ḥr/r + infinitivo"}, {"n": 16, "title": "El imperativo y las partículas", "sub": "Dar órdenes, prohibir, exclamar e invocar"}, {"n": 17, "title": "El estativo", "sub": "La forma del estado: «está vivo», «he venido»"}, {"n": 18, "title": "El perfecto: sḏm.n.f", "sub": "La forma de la acción completada"}, {"n": 19, "title": "El subjuntivo", "sub": "Deseos, órdenes indirectas y finalidad"}, {"n": 20, "title": "El perfectivo y el imperfectivo", "sub": "Acción puntual frente a acción habitual o continua"}, {"n": 21, "title": "El prospectivo y el pasivo", "sub": "El futuro del sḏm.f y las formas pasivas"}, {"n": 22, "title": "Las demás formas de la conjugación sufijal", "sub": "sḏm.jn.f, sḏm.ḫr.f, sḏm.kꜣ.f, sḏmt.f y los parentéticos"}, {"n": 23, "title": "Los participios", "sub": "«El que ama», «el amado»: adjetivos verbales"}, {"n": 24, "title": "Las formas relativas", "sub": "«Lo que él hizo», «el que su señor ama»"}, {"n": 25, "title": "Usos especiales de las formas relativas", "sub": "Oraciones sustantivas y oraciones enfáticas"}, {"n": 26, "title": "La gramática del egipcio medio", "sub": "Síntesis final y cómo seguir aprendiendo"}];
const DATA={"1": {"intro": "Como en el primer ejercicio de un manual: observar inscripciones reales antes de saber leerlas. Fíjate en hacia dónde miran los signos, en qué orden se agrupan y qué signos no se pronuncian.", "secs": [{"id": "A", "title": "Dirección y orden de lectura", "items": [{"t": "mc", "mir": true, "ref": "Fórmula de ofrenda, comienzo habitual de las estelas del Reino Medio", "q": "Esta línea está escrita, como en muchas estelas, en dirección contraria a la nuestra. ¿En qué dirección se lee?", "op": ["De derecha a izquierda", "De izquierda a derecha", "De abajo arriba", "Da igual: el orden no importa"], "ok": 0, "an": "Los signos que tienen cara (aves, personas, el ojo) miran hacia el principio de la línea. Aquí miran a la derecha, así que se empieza por la derecha. Es el mismo principio que verás en cualquier estela: lees «hacia las caras».", "id": "1.1", "g": "𓇓𓏏𓈖 𓊵𓏏𓊪 𓏙 𓊨𓁹𓀭"}, {"t": "mc", "ref": "Fórmula de ofrenda (ḥtp-dj-nswt)", "q": "Esta expresión se lee ḥtp-dj-nswt «ofrenda que da el rey». ¿Qué palabra está escrita primero aunque se lea al final?", "op": ["nswt «rey» (𓇓𓏏𓈖)", "ḥtp «ofrenda» (𓊵𓏏𓊪)", "dj «da» (𓏙)", "Ninguna: se escribe en el mismo orden en que se lee"], "ok": 0, "an": "Es la anteposición honorífica: las palabras «rey», «dios» o el nombre de un dios se escriben delante por respeto, aunque gramaticalmente vayan después.", "id": "1.2", "g": "𓇓𓏏𓈖 𓊵𓏏𓊪 𓏙"}, {"t": "mc", "ref": "ḥwt-nṯr «templo», palabra frecuentísima en inscripciones", "q": "La palabra se lee ḥwt-nṯr «casa del dios, templo». ¿Qué signo se ha adelantado por respeto?", "op": ["𓊹 nṯr «dios»", "𓉗 ḥwt «recinto»", "𓏏 t", "𓉐 pr «casa»"], "ok": 0, "an": "Otra vez anteposición honorífica: nṯr «dios» se escribe primero, pero se lee ḥwt-nṯr.", "id": "1.3", "g": "𓊹 𓉗𓏏𓉐"}, {"t": "mc", "ref": "Título de los príncipes («hijo del rey»)", "q": "El título se lee zꜣ nswt «hijo del rey». ¿Qué palabra se lee primero?", "op": ["zꜣ «hijo» (𓅭), aunque esté escrita en segundo lugar", "nswt «rey», porque va delante", "Se leen a la vez", "Depende de la dirección de la línea"], "ok": 0, "an": "nswt «rey» se antepone por respeto (anteposición honorífica), pero la lectura es zꜣ nswt.", "id": "1.4", "g": "𓇓𓏏𓈖 𓅭𓏤𓀀"}]}, {"id": "B", "title": "Tipos de signos", "items": [{"t": "mc", "ref": "ḥr «rostro», en textos de todas las épocas", "q": "¿Qué indica el trazo vertical 𓏤 que acompaña al signo del rostro?", "op": ["Que el signo vale por lo que representa (ideograma): «rostro»", "Que la palabra está en plural", "El número 1", "Que hay que leerlo dos veces"], "ok": 0, "an": "El trazo marca un ideograma: el dibujo significa lo que representa. Así se escribe ḥr «rostro».", "id": "1.5", "g": "𓁷𓏤"}, {"t": "mc", "ref": "zꜣ «hijo», p. ej. en filiaciones de estelas", "q": "En esta grafía de zꜣ «hijo», ¿qué función tiene el hombre sentado 𓀀 del final?", "op": ["Es un determinativo: indica que se habla de una persona y no se pronuncia", "Se lee «j», «yo»", "Es un complemento fonético", "Indica plural"], "ok": 0, "an": "Es un determinativo: clasifica la palabra («hombre, persona») sin añadir sonido. El pato 𓅭 da el sonido zꜣ.", "id": "1.6", "g": "𓅭𓏤𓀀"}, {"t": "mc", "ref": "ꜥnḫ wḏꜣ snb «¡vida, prosperidad, salud!», fórmula tras el nombre del rey", "q": "En la primera palabra, ꜥnḫ «vida», ¿qué hacen 𓈖 n y 𓐍 ḫ después de 𓋹?", "op": ["Son complementos fonéticos: repiten sonidos que 𓋹 ya contiene", "Añaden sonidos nuevos: se lee ꜥnḫnḫ", "Son determinativos", "Indican que es un verbo"], "ok": 0, "an": "𓋹 ya vale ꜥnḫ; 𓈖 y 𓐍 confirman la lectura (complementos fonéticos). Se lee ꜥnḫ, no ꜥnḫnḫ.", "id": "1.7", "g": "𓋹𓈖𓐍 𓍑𓄿 𓋴𓈖𓃀"}]}, {"id": "C", "title": "Primeras lecturas guiadas", "items": [{"t": "tt", "ref": "Epíteto real, en inscripciones de todas las épocas", "vo": [["nb", "señor (𓎟)"], ["tꜣ", "tierra (𓇾); escrito dos veces: dual"]], "tr": "nb tꜣwj", "es": "señor de las Dos Tierras", "an": "Las «Dos Tierras» son el Alto y el Bajo Egipto. El signo repetido indica dual (tema 4).", "id": "1.8", "g": "𓎟 𓇾𓇾"}, {"t": "tt", "ref": "Tras el nombre de los difuntos en estelas y ataúdes", "vo": [["mꜣꜥ", "justo, verdadero (𓐙)"], ["ḫrw", "voz (𓊤)"]], "tr": "mꜣꜥ-ḫrw", "es": "justificado (literalmente «justo de voz»)", "an": "Califica al difunto que ha superado el juicio de Osiris. Dos ideogramas, sin complementos.", "id": "1.9", "g": "𓐙𓊤"}, {"t": "tt", "ref": "Al final de las fórmulas reales («vivo …»)", "vo": [["ḏ", "cobra 𓆓"], ["t", "pan 𓏏"], ["—", "𓇿 tierra: determinativo"]], "tr": "ḏt", "es": "eternamente, para siempre", "an": "Dos signos fonéticos (ḏ, t) y un determinativo que no se lee.", "id": "1.10", "g": "𓆓𓏏𓇿"}]}, {"id": "D", "title": "Más textos reales", "items": [{"t": "mc", "ref": "Título sacerdotal; p. ej. «sacerdote ordinario» (estela de Leiden, Les. 70,4)", "q": "El título se lee ḥm-nṯr «siervo del dios, sacerdote». ¿Qué signo se ha escrito delante por respeto?", "op": ["𓊹 nṯr «dios»", "𓌨 ḥm «siervo»", "Ninguno", "Los dos a la vez"], "ok": 0, "an": "Anteposición honorífica: nṯr va delante aunque se lea en segundo lugar.", "id": "1.11", "g": "𓊹𓍛"}, {"t": "mc", "ref": "Sinuhé B 89 («la caza del desierto»)", "q": "En la segunda palabra, ¿qué indica el signo 𓈉 del final?", "op": ["Que es una tierra extranjera o el desierto (determinativo)", "Que se lee «montaña»", "Que es plural", "Que es un verbo"], "ok": 0, "an": "𓈉 es el determinativo de las tierras extranjeras y del desierto; no se pronuncia.", "id": "1.12", "g": "𓂝𓅱𓏏𓃙𓏥 𓆼𓄿𓋴𓏏𓈉"}, {"t": "tt", "ref": "Libro de los Muertos 2,2 y passim", "vo": [["nb", "señor (𓎟)"], ["pt", "cielo: p 𓊪 + t 𓏏 + determinativo 𓇯"]], "tr": "nb pt", "es": "señor del cielo", "an": "Genitivo directo: dos sustantivos seguidos.", "id": "1.13", "g": "𓎟 𓊪𓏏𓇯"}, {"t": "tt", "ref": "Diálogo del desesperado 142", "vo": [["nṯr", "dios (𓊹)"], ["ꜥnḫ", "vivo (𓋹 + complementos 𓈖 𓐍)"]], "tr": "nṯr ꜥnḫ", "es": "un dios vivo", "an": "Sustantivo + adjetivo (participio) detrás. 𓈖 y 𓐍 son complementos fonéticos de 𓋹.", "id": "1.14", "g": "𓊹𓀭 𓋹𓈖𓐍"}]}]}, "2": {"intro": "Nombres y palabras reales escritos (casi) solo con signos unilíteros. Translitera con el alfabeto egiptológico. Las vocales no se escriben.", "secs": [{"id": "A", "title": "Nombres propios", "items": [{"t": "tt", "ref": "Nombre del rey de la IV dinastía que construyó la Gran Pirámide", "tr": "ḫwfw", "es": "Jufu (Keops)", "an": "ḫ (𓐍) + w (𓅱) + f (𓆑) + w (𓅱). Los griegos lo llamaron Keops.", "id": "2.1", "g": "𓍹 𓐍𓅱𓆑𓅱 𓍺"}, {"t": "tt", "ref": "Nombre del dios de Menfis, frecuente en fórmulas de ofrenda", "tr": "ptḥ", "es": "Ptah", "an": "p (𓊪) + t (𓏏) + ḥ (𓎛) + determinativo de dios.", "id": "2.2", "g": "𓊪𓏏𓎛𓀭"}, {"t": "tt", "ref": "Primer rey de la VI dinastía (pirámide de Saqqara)", "tr": "ttj", "es": "Teti", "an": "t + t + j. La j final (𓇋) suele leerse «i».", "id": "2.3", "g": "𓍹 𓏏𓏏𓇋 𓍺"}, {"t": "tt", "ref": "Nombre de dos reyes de la VI dinastía", "tr": "ppj", "es": "Pepi", "an": "p + p + j. Mismo esquema que Teti.", "id": "2.4", "g": "𓍹 𓊪𓊪𓇋 𓍺"}, {"t": "tt", "ref": "El mago del papiro Westcar", "tr": "ḏdj", "es": "Dyedi (Djedi)", "an": "ḏ (𓆓) + d (𓂧) + j (𓇋) + determinativo de hombre.", "id": "2.5", "g": "𓆓𓂧𓇋𓀀"}, {"t": "tt", "ref": "Nombre del astro y del dios lunar; aparece también en el nombre de Ahmose", "tr": "jꜥḥ", "es": "luna; el dios Iah", "an": "j + ꜥ + ḥ + determinativo de la luna. Ojo con distinguir 𓂝 ꜥ (brazo) de 𓂡.", "id": "2.6", "g": "𓇋𓂝𓎛𓇹"}, {"t": "tt", "ref": "El dios de la crecida del Nilo (himnos a Hapy)", "tr": "ḥꜥpj", "es": "Hapy (la crecida)", "an": "ḥ + ꜥ + p + j + determinativo de agua (𓈗).", "id": "2.7", "g": "𓎛𓂝𓊪𓇋𓈗"}]}, {"id": "B", "title": "Palabras", "items": [{"t": "tt", "ref": "Pronombre independiente, en cualquier texto narrativo", "tr": "jnk", "es": "yo", "an": "j + n + k. Lo verás a fondo en el tema 5.", "id": "2.8", "g": "𓇋𓈖𓎡"}, {"t": "tt", "ref": "Verbo de habla, en todos los textos", "tr": "ḏd", "es": "decir", "an": "ḏ + d + determinativo de la boca (hablar, comer, pensar).", "id": "2.9", "g": "𓆓𓂧𓀁"}, {"t": "tt", "ref": "Palabra muy frecuente", "tr": "ḫt", "es": "cosa", "an": "ḫ + t + determinativo abstracto (papiro enrollado).", "id": "2.10", "g": "𓐍𓏏𓏛"}, {"t": "tt", "ref": "Verbo frecuente, p. ej. en el título «conocido del rey»", "tr": "rḫ", "es": "saber, conocer", "an": "r + ḫ + determinativo abstracto.", "id": "2.11", "g": "𓂋𓐍𓏛"}, {"t": "tt", "ref": "Palabra frecuente, p. ej. en el epíteto «señor del cielo»", "tr": "pt", "es": "cielo", "an": "p + t + determinativo del cielo 𓇯.", "id": "2.12", "g": "𓊪𓏏𓇯"}, {"t": "tt", "ref": "La palabra para «barco» en El náufrago", "tr": "dpt", "es": "barco", "an": "d + p + t + determinativo de barco.", "id": "2.13", "g": "𓂧𓊪𓏏𓊛"}, {"t": "tt", "ref": "Palabra frecuente en textos literarios y sapienciales", "tr": "rmṯ", "es": "gente, personas", "an": "r + m + ṯ + determinativos de hombre y mujer + trazos de plural.", "id": "2.14", "g": "𓂋𓅓𓍿𓀀𓁐𓏥"}]}, {"id": "C", "title": "Del sonido al signo", "items": [{"t": "mc", "q": "¿Cuál es la grafía correcta de ḥtp «ofrenda; estar satisfecho» con unilíteros?", "op": ["𓎛𓏏𓊪", "𓉔𓏏𓊪", "𓐍𓏏𓊪", "𓎛𓍿𓊪"], "ok": 0, "ref": "Grafía alternativa (unilítera) de ḥtp", "an": "ḥ es 𓎛 (mecha retorcida); 𓉔 es h, 𓐍 es ḫ, 𓍿 es ṯ.", "id": "2.15"}, {"t": "mc", "q": "¿Qué signo representa ḏ?", "op": ["𓆓 (cobra)", "𓂧 (mano)", "𓍿 (cuerda para atar)", "𓊃 (cerrojo)"], "ok": 0, "an": "𓆓 = ḏ; 𓂧 = d; 𓍿 = ṯ; 𓊃 = z.", "id": "2.16"}, {"t": "mc", "q": "¿Cuál es la transliteración de 𓋴𓈖𓃀?", "op": ["snb", "šnb", "znb", "sbn"], "ok": 0, "ref": "snb «estar sano», en la fórmula ꜥnḫ wḏꜣ snb", "an": "𓋴 s (tela doblada) + 𓈖 n + 𓃀 b.", "id": "2.17"}]}, {"id": "D", "title": "Más textos reales", "items": [{"t": "tt", "ref": "Libro de los Muertos 125 y textos sapienciales", "tr": "jsft", "es": "injusticia, mal", "an": "j + s + f + t + determinativo del pájaro malo 𓅪 (cosas malas o pequeñas).", "id": "2.18", "g": "𓇋𓋴𓆑𓏏𓅪"}, {"t": "tt", "ref": "Libro de los Muertos 30B", "tr": "ḏꜣḏꜣt", "es": "tribunal, consejo", "an": "ḏ + ꜣ + ḏ + ꜣ + t + determinativo de edificio.", "id": "2.19", "g": "𓆓𓄿𓆓𓄿𓏏𓉐"}, {"t": "tt", "ref": "Fórmulas autobiográficas («el que no tenía barca»)", "tr": "mḫnt", "es": "transbordador, barca de pasaje", "an": "m + ḫ + n + t + determinativo de barco.", "id": "2.20", "g": "𓅓𓐍𓈖𓏏𓊛"}, {"t": "tt", "ref": "Fórmulas autobiográficas («di pan al hambriento»)", "tr": "ḥqr", "es": "hambriento; hambre", "an": "ḥ + q + r + determinativo de la boca.", "id": "2.21", "g": "𓎛𓈎𓂋𓀁"}, {"t": "tt", "ref": "El náufrago, passim («¡no temas!»)", "tr": "snḏ", "es": "temer; miedo", "an": "s + n + ḏ + determinativo de hombre cansado.", "id": "2.22", "g": "𓋴𓈖𓆓𓀉"}, {"t": "tt", "ref": "Papiros de Kahun 29,43 («actuar conforme a»)", "tr": "ḫft", "es": "conforme a; frente a", "an": "ḫ + f + t: una preposición escrita solo con unilíteros.", "id": "2.23", "g": "𓐍𓆑𓏏"}]}]}, "3": {"intro": "Como en el ejercicio del tema 3 de un manual: palabras sueltas sacadas de textos reales (estelas, El náufrago, Sinuhé, fórmulas de ofrenda). Se da el significado y, entre paréntesis, qué indica el determinativo. Escribe la transliteración.", "secs": [{"id": "A", "title": "Translitera", "items": [{"t": "t", "q": "«dios» (dios)", "tr": "nṯr", "an": "𓊹 nṯr ideograma + determinativo de dios.", "id": "3.1", "g": "𓊹𓀭"}, {"t": "t", "q": "«bueno, perfecto»", "tr": "nfr", "an": "𓄤 trilítero nfr + complementos f, r.", "id": "3.2", "g": "𓄤𓆑𓂋"}, {"t": "t", "q": "«vivir; vida»", "tr": "ꜥnḫ", "an": "𓋹 trilítero ꜥnḫ + complementos n, ḫ.", "id": "3.3", "g": "𓋹𓈖𓐍"}, {"t": "t", "q": "«estar satisfecho; ofrenda»", "tr": "ḥtp", "an": "𓊵 trilítero ḥtp + complementos t, p.", "id": "3.4", "g": "𓊵𓏏𓊪"}, {"t": "t", "q": "«permanecer»", "tr": "mn", "an": "𓏠 bilítero mn + complemento n.", "id": "3.5", "g": "𓏠𓈖"}, {"t": "t", "q": "«Amón» (dios)", "tr": "jmn", "an": "j + 𓏠 mn + complemento n + determinativo de dios.", "id": "3.6", "g": "𓇋𓏠𓈖𓀭"}, {"t": "t", "q": "«llegar a ser, transformarse»", "tr": "ḫpr", "an": "𓆣 trilítero ḫpr + complemento r.", "id": "3.7", "g": "𓆣𓂋"}, {"t": "t", "q": "«fuerte, poderoso»", "tr": "wsr", "an": "𓄊 trilítero wsr + complementos s, r.", "id": "3.8", "g": "𓄊𓋴𓂋"}, {"t": "t", "q": "«oír»", "tr": "sḏm", "an": "𓄔 trilítero sḏm + complemento m.", "id": "3.9", "g": "𓄔𓅓"}, {"t": "t", "q": "«palabra; hablar» (boca)", "tr": "mdw", "an": "𓌃 bilítero md + d + w + determinativo de la boca.", "id": "3.10", "g": "𓌃𓂧𓅱𓀁"}, {"t": "t", "q": "«dar a luz» (mujer dando a luz)", "tr": "ms", "an": "𓄟 bilítero ms + complemento s + determinativo.", "id": "3.11", "g": "𓄟𓋴𓁒"}, {"t": "t", "q": "«fuerte, victorioso» (fuerza)", "tr": "nḫt", "an": "n + 𓆱 ḫt + ḫ + t + determinativo de fuerza (brazo con bastón).", "id": "3.12", "g": "𓈖𓆱𓐍𓏏𓂡"}, {"t": "t", "q": "«recinto, mansión» (casa)", "tr": "ḥwt", "an": "𓉗 ḥwt + t + determinativo de edificio.", "id": "3.13", "g": "𓉗𓏏𓉐"}, {"t": "t", "q": "«ka (fuerza vital)»", "tr": "kꜣ", "an": "𓂓 bilítero kꜣ como ideograma.", "id": "3.14", "g": "𓂓𓏤"}, {"t": "t", "q": "«ba (alma)»", "tr": "bꜣ", "an": "𓅡 bilítero bꜣ + complemento ꜣ.", "id": "3.15", "g": "𓅡𓄿"}, {"t": "t", "q": "«espíritu; eficaz»", "tr": "ꜣḫ", "an": "𓅜 bilítero ꜣḫ + complemento ḫ.", "id": "3.16", "g": "𓅜𓐍"}, {"t": "t", "q": "«corazón»", "tr": "jb", "an": "𓄣 ideograma jb.", "id": "3.17", "g": "𓄣𓏤"}, {"t": "t", "q": "«lengua»", "tr": "ns", "an": "𓄓 ideograma ns.", "id": "3.18", "g": "𓄓𓏤"}, {"t": "t", "q": "«campesino» (hombre); el protagonista de El campesino elocuente", "tr": "sḫtj", "an": "𓇏 sḫt «campo» + t + 𓏭 y (nisbe -j) + determinativo: «el del campo».", "id": "3.19", "g": "𓇏𓏏𓏭𓀀"}, {"t": "t", "q": "«gobernante» (hombre)", "tr": "ḥqꜣ", "an": "𓋾 trilítero ḥqꜣ + complemento ꜣ + determinativo.", "id": "3.20", "g": "𓋾𓄿𓀀"}, {"t": "t", "q": "«codo (medida)», como en El náufrago «un barco de 120 codos»", "tr": "mḥ", "an": "𓂣 ideograma mḥ «codo».", "id": "3.21", "g": "𓂣"}, {"t": "t", "q": "«seguir» (movimiento)", "tr": "šms", "an": "𓌞 trilítero šms + complemento s + piernas en marcha.", "id": "3.22", "g": "𓌞𓋴𓂻"}, {"t": "t", "q": "«amar, Gran Verde»)", "an": "Compuesto fijo: wꜣḏ «verde» + wr «grande».", "id": "4.21", "g": "𓇅𓅨𓂋𓈗"}, {"t": "tt", "ref": "Inscripciones de templos tebanos", "tr": "ḥwt-nṯr nt jmn", "es": "el templo de Amón", "an": "Genitivo indirecto: nt concuerda con ḥwt-nṯr (femenino).", "id": "4.22", "g": "𓊹 𓉗𓏏𓉐 𓈖𓏏 𓇋𓏠𓈖𓀭"}, {"t": "tt", "ref": "Título de altos funcionarios del Reino Medio", "tr": "jmj-r pr wr", "es": "gran mayordomo", "an": "jmj-r «supervisor» (literalmente «el que está en la boca») + pr wr «la casa grande».", "id": "4.23", "g": "𓄓 𓉐 𓅨𓂋"}, {"t": "tt", "ref": "El campesino elocuente R 1,1", "tr": "sḫt-ḥmꜣt", "es": "el Campo de la Sal (Uadi Natrun)", "an": "Topónimo formado por dos sustantivos en genitivo directo: «el campo de la sal».", "id": "4.24", "g": "𓇏𓏏𓈅 𓎛𓅓𓄿𓏏𓈓"}]}, {"id": "C", "title": "Más textos reales", "items": [{"t": "tt", "ref": "Urk. IV 1295,1 (inscripciones de la XVIII dinastía)", "vo": [["kꜣt", "obra, trabajo"], ["nḥḥ", "eternidad"]], "tr": "kꜣt nḥḥ", "es": "obra de eternidad (una obra eterna)", "an": "Genitivo directo. Se dice de los monumentos de piedra.", "id": "4.25", "g": "𓂓𓏏𓀋 𓈖𓎛𓎛𓇳"}, {"t": "tt", "ref": "Beni Hasan I, 26 (tumbas de nomarcas)", "tr": "pr n nḥḥ", "es": "casa de eternidad (la tumba)", "an": "Genitivo indirecto con n (pr es masculino).", "id": "4.26", "g": "𓉐 𓈖 𓈖𓎛𓎛𓇳"}, {"t": "tt", "ref": "Sinuhé B 241", "vo": [["bnr", "dulce; dátil"]], "tr": "ḫt bnr", "es": "árbol frutal (literalmente «árbol de dulzor»)", "an": "Genitivo directo: ḫt «árbol» + bnr.", "id": "4.27", "g": "𓆱𓏏 𓃀𓈖𓂋𓆭"}, {"t": "tt", "ref": "Sinuhé B 89", "vo": [["ꜥwt", "ganado menor, animales"]], "tr": "ꜥwt ḫꜣst", "es": "la caza del desierto", "an": "Genitivo directo: «animales (del) desierto».", "id": "4.28", "g": "𓂝𓅱𓏏𓃙𓏥 𓆼𓄿𓋴𓏏𓈉"}, {"t": "tt", "ref": "Diálogo del desesperado 60", "vo": [["jnr", "piedra"], ["mꜣṯ", "granito"]], "tr": "jnr n mꜣṯ", "es": "granito (literalmente «piedra de granito»)", "an": "Genitivo indirecto: el segundo término indica el material.", "id": "4.29", "g": "𓇋𓈖𓂋𓊌 𓈖 𓌳𓄿𓍿𓊌"}, {"t": "tt", "ref": "Urk. IV 52 (títulos de la XVIII dinastía)", "vo": [["kꜣt", "obras"]], "tr": "jmj-r kꜣt", "es": "supervisor de las obras", "an": "Título: jmj-r «supervisor» + genitivo directo.", "id": "4.30", "g": "𓄓 𓂓𓏏𓀋"}, {"t": "tt", "ref": "Beni Hasan I, 17 (títulos de cortesanos)", "vo": [["smr", "compañero, cortesano"], ["wꜥtj", "único"]], "tr": "smr wꜥtj", "es": "Compañero Único (título de corte)", "an": "Sustantivo + adjetivo nisbe wꜥtj.", "id": "4.31", "g": "𓋴𓍋𓂋𓀀 𓌡𓏏𓏭"}, {"t": "tt", "ref": "Inscripciones de Asiut (contratos de Dyefaihapy)", "tr": "ḫt pr", "es": "los bienes de la casa, la hacienda", "an": "Genitivo directo.", "id": "4.32", "g": "𓆱𓏏 𓉐𓏤"}, {"t": "tt", "ref": "Papiro Edwin Smith 5,10", "vo": [["jwn", "pilar, columna"], ["fnḏ", "nariz"]], "tr": "jwn n fnḏ", "es": "el hueso de la nariz (literalmente «pilar de la nariz»)", "an": "Genitivo indirecto. Así llama el tratado médico al tabique nasal.", "id": "4.33", "g": "𓉺𓈖 𓈖 𓆑𓈖𓆓𓂉"}]}]}, "5": {"intro": "Pronombres en frases reales. Se dan en el vocabulario las formas verbales que aún no conoces, igual que hace un manual en los primeros temas.", "secs": [{"id": "A", "title": "Translitera y traduce", "items": [{"t": "tt", "ref": "Sinuhé R 2 (tras los títulos del protagonista)", "tr": "ḏd.f", "es": "dice él / él dice", "an": "Verbo + pronombre sufijo .f «él». Con este verbo se introduce el relato en primera persona.", "id": "5.1", "g": "𓆓𓂧𓆑"}, {"t": "tt", "ref": "El náufrago 1–2", "vo": [["ḏd.jn", "entonces dijo (tema 22)"], ["šmsw", "seguidor"], ["jqr", "excelente"], ["wḏꜣ", "que esté bien (subjuntivo)"], ["ḥꜣtj-ꜥ", "gobernador"]], "tr": "ḏd.jn šmsw jqr wḏꜣ jb.k ḥꜣtj-ꜥ", "es": "Entonces dijo el seguidor excelente: «¡Que tu corazón esté bien, gobernador!»", "an": "jb.k: sustantivo + sufijo .k «tu» (2.ª masc.). ḥꜣtj-ꜥ es un vocativo.", "id": "5.2", "g": "𓆓𓂧𓇋𓈖 𓌞𓋴𓅱𓀀 𓇋𓈎𓂋 𓍑𓄿 𓄣𓏤𓎡 𓄂𓏏𓏭 𓂝"}, {"t": "tt", "ref": "El náufrago 28", "vo": [["mꜣ.sn", "(si) miraban ellos"]], "tr": "mꜣ.sn pt mꜣ.sn tꜣ", "es": "Miraran al cielo o miraran a la tierra…", "an": "El sufijo .sn «ellos» repetido en dos frases paralelas. Se dice de los marineros: veían venir la tormenta.", "id": "5.3", "g": "𓌳𓁹𓋴𓈖 𓊪𓏏𓇯 𓌳𓁹𓋴𓈖 𓇾𓏤"}, {"t": "tt", "ref": "El náufrago 53–54", "vo": [["ꜥḥꜥ.n", "entonces (tema 22)"], ["sꜣ.n.j", "sacié (yo)"]], "tr": "ꜥḥꜥ.n sꜣ.n.j wj", "es": "Entonces me sacié.", "an": "wj es pronombre dependiente de 1.ª persona («me»), objeto del verbo. Literalmente «sacié a mí mismo».", "id": "5.4", "g": "𓊢𓂝𓈖 𓋴𓄿𓈖𓀀 𓅱𓀀"}, {"t": "tt", "ref": "Sinuhé R 2", "vo": [["šmsw", "seguidor"], ["šms", "que seguía (participio, tema 23)"]], "tr": "jnk šmsw šms nb.f", "es": "Yo era un seguidor que seguía a su señor.", "an": "jnk: pronombre independiente de 1.ª persona, sujeto de una oración nominal. nb.f «su señor».", "id": "5.5", "g": "𓇋𓈖𓎡 𓌞𓋴𓅱𓀀 𓌞𓋴𓂻 𓎟𓆑"}, {"t": "tt", "ref": "Fórmula autobiográfica frecuente en estelas", "vo": [["mrrw", "amado de (participio)"], ["ḥzzw", "alabado de (participio)"]], "tr": "jnk mrrw jt.f ḥzzw mwt.f|jnk mrr jt.f ḥzz mwt.f", "es": "Yo era el amado de su padre, el alabado de su madre.", "an": "El sufijo .f se refiere al propio difunto: en egipcio la frase pasa de «yo» a «su». En español se traduce a menudo «de mi padre».", "id": "5.6", "g": "𓇋𓈖𓎡 𓌻𓂋𓂋𓅱 𓇋𓏏𓆑𓀀𓆑 𓎿𓋴𓋴𓅱 𓅐𓏏𓁐𓆑"}, {"t": "tt", "ref": "Libro de los Muertos, cap. 17 (fórmula de las glosas)", "vo": [["pw-tr", "¿quién (es)?"], ["r.f", "pues, entonces"]], "tr": "pw-tr r.f sw|pw tr r.f sw", "es": "¿Quién es él, pues?", "an": "sw: pronombre dependiente de 3.ª persona masculino. pw-tr es interrogativo.", "id": "5.7", "g": "𓊪𓅱 𓏏𓂋 𓂋𓆑 𓇓𓅱"}, {"t": "tt", "ref": "Estela de Semna de Senuseret III (Berlín 1157)", "tr": "zꜣ.j pw|sꜣ.j pw", "es": "es mi hijo", "an": "zꜣ.j «mi hijo» (sufijo .j «mi») + pw «él / es»: oración nominal (tema 7).", "id": "5.8", "g": "𓅭𓀀 𓊪𓅱"}, {"t": "tt", "ref": "El campesino elocuente, passim", "tr": "sḫtj pn", "es": "este campesino", "an": "pn: demostrativo masculino singular «este», detrás del sustantivo.", "id": "5.9", "g": "𓇏𓏏𓏭𓀀 𓊪𓈖"}, {"t": "tt", "ref": "Papiro Westcar, passim", "vo": [["ḏd.jn", "entonces dijo"]], "tr": "ḏd.jn ḥm.f", "es": "Entonces dijo Su Majestad.", "an": "ḥm.f: «su majestad» (ḥm + sufijo .f). Es la manera de referirse al rey.", "id": "5.10", "g": "𓆓𓂧𓇋𓈖 𓍛𓆑"}, {"t": "tt", "ref": "Prólogo de las Enseñanzas de Ptahhotep", "tr": "ḥm n nṯr pn", "es": "la majestad de este dios", "an": "Genitivo indirecto n + demostrativo pn. «Este dios» es el rey.", "id": "5.11", "g": "𓍛 𓈖 𓊹 𓊪𓈖"}, {"t": "tt", "ref": "Himno a Osiris de la estela Louvre C 286, primera línea", "vo": [["jnḏ ḥr.k", "salve a ti (literalmente «saludado esté tu rostro»)"], ["nḥḥ", "eternidad"]], "tr": "jnḏ ḥr.k wsjr nb nḥḥ nswt nṯrw|jnḏ-ḥr.k wsjr nb nḥḥ nswt nṯrw", "es": "¡Salve a ti, Osiris, señor de la eternidad, rey de los dioses!", "an": "ḥr.k: sustantivo ḥr «rostro» + sufijo .k. Siguen aposiciones con genitivo directo.", "id": "5.12", "g": "𓇋𓈖𓂧 𓎛𓁷𓏤𓎡 𓊨𓁹𓀭 𓎟 𓎛𓎛𓇳 𓇓𓏏𓈖 𓊹𓊹𓊹"}, {"t": "tt", "ref": "Sinuhé B 78–79 (el príncipe Amunenshi acoge a Sinuhé)", "vo": [["rdj.n.f", "puso"], ["m ḥꜣt", "al frente de"], ["ẖrdw", "hijos"], ["mnj.n.f", "casó (literalmente «amarró»)"], ["wrt", "mayor (femenino)"]], "tr": "rdj.n.f wj m ḥꜣt ẖrdw.f mnj.n.f wj m zꜣt.f wrt|rdj.n.f wj m ḥꜣt ẖrdw.f mnj.n.f wj m sꜣt.f wrt", "es": "Me puso al frente de sus hijos y me casó con su hija mayor.", "an": "wj, pronombre dependiente de 1.ª persona, es el objeto de los dos verbos. ẖrdw.f «sus hijos», zꜣt.f «su hija»: sufijo .f.", "id": "5.13", "g": "𓂋𓂞𓈖𓆑 𓅱𓀀 𓅓 𓄂𓏏 𓄡𓂋𓂧𓀔𓏥𓆑 𓏠𓈖𓇋𓊧𓈖𓆑 𓅱𓀀 𓅓 𓅭𓏏𓁐𓆑 𓅨𓂋𓏏"}, {"t": "tt", "ref": "El campesino elocuente, passim (así se dirige el campesino a Rensi)", "tr": "jmj-r pr wr nb.j", "es": "Gran mayordomo, mi señor", "an": "nb.j: sustantivo + sufijo .j «mi». Toda la expresión es un vocativo.", "id": "5.14", "g": "𓄓 𓉐 𓅨𓂋 𓎟𓀀"}]}, {"id": "B", "title": "Más textos reales", "items": [{"t": "tt", "ref": "Urk. IV 115,4 (inscripción de la XVIII dinastía)", "vo": [["ḥꜣtj", "corazón"], ["jmj-ḥꜣt", "anterior, de antes"]], "tr": "ḥꜣtj.k n jmj-ḥꜣt", "es": "tu corazón de antes", "an": "Sufijo .k «tu» unido al sustantivo. n jmj-ḥꜣt es un genitivo indirecto.", "id": "5.15", "g": "𓄂𓏏𓏭𓄣𓎡 𓈖 𓄓𓄂𓏏"}, {"t": "tt", "ref": "Admoniciones de Ipuur 12,3", "tr": "nfꜣ pw", "es": "así fue, eso es", "an": "nfꜣ: demostrativo neutro «eso». pw: «es».", "id": "5.16", "g": "𓆑𓈖𓄿 𓊪𓅱"}, {"t": "tt", "ref": "Papiro Westcar 9,13 (el rey ve triste a su hijo)", "vo": [["pty", "¿qué?"], ["jrf", "pues"], ["pꜣ", "este (demostrativo)"]], "tr": "pty jrf pꜣ jb", "es": "¿Qué es, pues, este estado de ánimo?", "an": "Interrogativo pty + partícula jrf + demostrativo pꜣ, que en el egipcio medio tardío sustituye a pn.", "id": "5.17", "g": "𓊪𓏏𓇋 𓇋𓂋𓆑 𓅮𓄿 𓄣"}, {"t": "tt", "ref": "Sinuhé B 267–268 (el rey confirma a la reina que es Sinuhé)", "tr": "ntf pw", "es": "es él", "an": "ntf: pronombre independiente de 3.ª persona masculino + pw.", "id": "5.18", "g": "𓈖𓏏𓆑 𓊪𓅱"}]}]}, "6": {"intro": "Adjetivos en epítetos, fórmulas y pasajes literarios: concordancia, nb «todo», ky «otro», comparación con r.", "secs": [{"id": "A", "title": "Translitera y traduce", "items": [{"t": "tt", "ref": "Epíteto de Osiris y de otros dioses en estelas", "tr": "nṯr ꜥꜣ", "es": "el gran dios", "an": "El adjetivo va detrás del sustantivo y concuerda con él (masc. sing.).", "id": "6.1", "g": "𓊹 𓉻𓂝"}, {"t": "tt", "ref": "Epíteto real (passim)", "tr": "nṯr nfr nb tꜣwj", "es": "el dios perfecto, señor de las Dos Tierras", "an": "nṯr nfr: sustantivo + adjetivo. Le sigue una aposición.", "id": "6.2", "g": "𓊹 𓄤 𓎟 𓇾𓇾"}, {"t": "tt", "ref": "Himnos y fórmulas de ofrenda", "tr": "nṯrw nbw", "es": "todos los dioses", "an": "nb «todo» se comporta como adjetivo: concuerda en plural masculino (nbw).", "id": "6.3", "g": "𓊹𓊹𓊹 𓎟𓅱𓏥"}, {"t": "tt", "ref": "Fórmula de ofrenda: «… toda cosa buena y pura»", "tr": "ḫt nbt nfrt wꜥbt", "es": "toda cosa buena y pura", "an": "ḫt «cosa» es femenino: todos los adjetivos llevan -t.", "id": "6.4", "g": "𓐍𓏏 𓎟𓏏 𓄤𓏏 𓃂𓏏"}, {"t": "tt", "ref": "El náufrago 48–49", "vo": [["jꜣqt", "verduras"]], "tr": "jꜣqt nbt špst", "es": "toda clase de verduras finas", "an": "Colectivo femenino: nbt y špst concuerdan en femenino.", "id": "6.5", "g": "𓇋𓄿𓈎𓏏𓆰𓏥 𓎟𓏏 𓈙𓊪𓋴𓏏"}, {"t": "tt", "ref": "Inscripciones reales (fórmulas de dominio universal)", "tr": "tꜣw nbw ḫꜣswt nbt", "es": "todas las tierras y todos los países extranjeros", "an": "tꜣw es masculino plural → nbw; ḫꜣswt es femenino → nbt. El femenino plural suele usar la forma singular del adjetivo.", "id": "6.6", "g": "𓇾𓅱𓏥 𓎟𓅱 𓆼𓄿𓋴𓏏𓈉𓏥 𓎟𓏏"}, {"t": "tt", "ref": "Nombre de Horus de Tutmosis III", "vo": [["ḫꜥ", "que aparece (participio)"], ["wꜣst", "Tebas"]], "tr": "kꜣ nḫt ḫꜥ m wꜣst", "es": "Toro victorioso que aparece en Tebas", "an": "kꜣ nḫt: sustantivo + adjetivo; luego un participio con complemento.", "id": "6.7", "g": "𓃒 𓈖𓆱𓐍𓏏𓂡 𓈍𓂝 𓅓 𓋆𓏏𓊖"}, {"t": "tt", "ref": "Epíteto de Ptah (passim)", "tr": "nfr ḥr", "es": "el de rostro perfecto, hermoso de rostro", "an": "Construcción adjetivo + sustantivo («bueno en cuanto al rostro»): el adjetivo funciona como sustantivo y el segundo término lo especifica.", "id": "6.8", "g": "𓄤 𓁷𓏤"}, {"t": "tt", "ref": "Papiro Westcar y textos administrativos", "tr": "pr ꜥꜣ|pr-ꜥꜣ", "es": "la Gran Casa, el palacio", "an": "Sustantivo + adjetivo. Más tarde designará al propio rey («faraón»).", "id": "6.9", "g": "𓉐 𓉻𓂝"}, {"t": "tt", "ref": "Enseñanza para Merikare (E 32)", "vo": [["mdt", "palabra, discurso"], ["ꜥḥꜣ", "combate"]], "tr": "wsr mdt r ꜥḥꜣ nb", "es": "La palabra es más poderosa que cualquier combate.", "an": "Comparación: adjetivo + r «más que». Es una oración adjetival (tema 7): el adjetivo va primero como predicado.", "id": "6.10", "g": "𓄊𓋴𓂋 𓌃𓂧𓏏𓀁 𓂋 𓂚 𓎟"}, {"t": "tt", "ref": "Glosas de los Textos de los Sarcófagos y del Libro de los Muertos", "tr": "ky ḏd", "es": "otra versión (literalmente «otro decir»)", "an": "ky «otro» va delante del sustantivo, a diferencia de casi todos los adjetivos.", "id": "6.11", "g": "𓎡𓇋𓇋 𓆓𓂧"}, {"t": "tt", "ref": "El náufrago 65–66", "vo": [["jnḥwj", "las dos cejas"], ["ḫsbḏ", "lapislázuli"]], "tr": "jnḥwj.f m ḫsbḏ mꜣꜥ", "es": "Sus cejas eran de lapislázuli auténtico.", "an": "mꜣꜥ «verdadero» sigue al sustantivo. m indica el material (tema 8).", "id": "6.12", "g": "𓇋𓈖𓎛𓅱𓂃𓂃𓆑 𓅓 𓐍𓋴𓃀𓆓𓈓 𓐙𓂝"}, {"t": "tt", "ref": "Fórmula real tras el nombre del rey (passim)", "vo": [["dj", "dotado de (participio pasivo)"]], "tr": "dj ꜥnḫ mj rꜥ ḏt", "es": "dotado de vida como Ra, para siempre", "an": "mj «como»; ḏt es un sustantivo usado como adverbio.", "id": "6.13", "g": "𓏙 𓋹𓈖𓐍 𓏇𓇋 𓂋𓂝𓇳 𓆓𓏏𓇿"}, {"t": "tt", "ref": "Sinuhé B 79 (fragmento)", "tr": "zꜣt.f wrt|sꜣt.f wrt", "es": "su hija mayor", "an": "El adjetivo wr toma la -t del femenino: wrt.", "id": "6.14", "g": "𓅭𓏏𓁐𓆑 𓅨𓂋𓏏"}, {"t": "tt", "ref": "Nombre de trono de Tutmosis I", "tr": "ꜥꜣ-ḫpr-kꜣ-rꜥ|ꜥꜣ ḫpr kꜣ rꜥ", "es": "Grande es la forma del ka de Ra", "an": "Adjetivo ꜥꜣ en función de predicado + sujeto. Lo verás como oración en el tema 7.", "id": "6.15", "g": "𓍹 𓇳 𓉻𓂝 𓆣 𓂓 𓍺"}]}, {"id": "B", "title": "Más textos reales", "items": [{"t": "tt", "ref": "Estelas del Reino Medio (Les. 80,21)", "vo": [["ꜣw", "largo"], ["ḏrt", "mano"]], "tr": "ꜣw ḏrt", "es": "generoso (literalmente «largo de mano»)", "an": "Adjetivo + sustantivo que lo especifica: «largo en cuanto a la mano».", "id": "6.16", "g": "𓄿𓅱𓏛 𓂧𓂋𓏏"}, {"t": "tt", "ref": "El campesino elocuente B1, 241", "vo": [["ꜣw", "largo"], ["ḥr", "rostro, vista"]], "tr": "ꜣw ḥr", "es": "previsor (literalmente «largo de vista»)", "an": "Misma construcción adjetivo + sustantivo.", "id": "6.17", "g": "𓄿𓅱𓏛 𓁷𓏤"}, {"t": "tt", "ref": "Urk. IV 111,14", "vo": [["wsr", "fuerte"], ["jb", "corazón"]], "tr": "wsr jb", "es": "valiente (literalmente «fuerte de corazón»)", "an": "Adjetivo + sustantivo especificador.", "id": "6.18", "g": "𓄊𓋴𓂋 𓄣𓏤"}, {"t": "tt", "ref": "Urk. IV 970,5", "vo": [["ꜥrq", "sabio, experto"], ["jb", "corazón"]], "tr": "ꜥrq jb", "es": "inteligente (literalmente «experto de corazón»)", "an": "Adjetivo + sustantivo.", "id": "6.19", "g": "𓂝𓂋𓈎𓍼 𓄣𓏤"}, {"t": "tt", "ref": "Enseñanzas de Ptahhotep (P. Prisse 5,8)", "tr": "ꜥꜣ jb", "es": "arrogante (literalmente «grande de corazón»)", "an": "Mismo tipo de expresión. Ptahhotep aconseja no serlo.", "id": "6.20", "g": "𓉻𓂝 𓄣𓏤"}, {"t": "tt", "ref": "Estelas del Reino Medio (Les. 82,6)", "vo": [["wn", "rápido"], ["ꜥwj", "las dos manos"]], "tr": "wn ꜥwj", "es": "rápido de manos, diestro", "an": "Adjetivo + sustantivo en dual.", "id": "6.21", "g": "𓃹𓈖 𓂝𓂝"}, {"t": "tt", "ref": "Enseñanzas de Ptahhotep (P. Prisse 7,1)", "tr": "nfr ḥr jb", "es": "agradable (literalmente «bueno para el corazón»)", "an": "Adjetivo + preposición ḥr: «bueno sobre el corazón».", "id": "6.22", "g": "𓄤 𓁷𓏤 𓄣𓏤"}, {"t": "tt", "ref": "Estelas del Reino Medio (Les. 84,4)", "vo": [["ḥm", "cobarde"]], "tr": "ḥm mꜣꜥ", "es": "un verdadero cobarde", "an": "Sustantivo + adjetivo mꜣꜥ «verdadero», detrás.", "id": "6.23", "g": "𓍛𓀀 𓐙𓂝"}, {"t": "tt", "ref": "Urk. IV 127,14", "vo": [["jqr", "excelente"]], "tr": "sš jqr", "es": "un escriba excelente", "an": "Sustantivo + adjetivo.", "id": "6.24", "g": "𓏞𓀀 𓇋𓈎𓂋"}, {"t": "tt", "ref": "Papiro Westcar 6,15", "vo": [["bw", "lugar, cosa"]], "tr": "bw nb nfr", "es": "todo lo bueno", "an": "bw «lugar, cosa» + nb + adjetivo: «toda cosa buena». Los dos adjetivos van detrás.", "id": "6.25", "g": "𓃀𓅱 𓎟 𓄤𓆑𓂋"}, {"t": "tt", "ref": "Estela BM 552", "vo": [["psḏt", "Enéada"], ["nḏs", "pequeño"]], "tr": "psḏt nḏst", "es": "la Enéada menor", "an": "psḏt es femenino: el adjetivo toma -t (nḏst).", "id": "6.26", "g": "𓊪𓋴𓆓𓏏𓊹𓊹𓊹 𓈖𓆓𓋴𓏏"}, {"t": "tt", "ref": "El campesino elocuente B1, 92", "tr": "nb wr", "es": "un gran señor", "an": "Sustantivo + adjetivo.", "id": "6.27", "g": "𓎟 𓅨𓂋"}, {"t": "tt", "ref": "Sinuhé B 101", "tr": "ḫꜣst nbt", "es": "todo país extranjero", "an": "ḫꜣst es femenino: nbt.", "id": "6.28", "g": "𓆼𓄿𓋴𓏏𓈉 𓎟𓏏"}, {"t": "tt", "ref": "Textos de las Pirámides 306", "vo": [["smsw", "mayor, primogénito"]], "tr": "smsw r", "es": "mayor que", "an": "Comparación: adjetivo + r.", "id": "6.29", "g": "𓋴𓅓𓋴𓅱𓀙 𓂋"}, {"t": "tt", "ref": "El campesino elocuente B1, 75", "vo": [["mdw", "hablar, palabra"], ["n wn-mꜣꜥ", "de verdad"]], "tr": "sḫtj nfr mdw n wn-mꜣꜥ", "es": "un campesino verdaderamente elocuente (literalmente «bueno de palabra de verdad»)", "an": "nfr mdw: adjetivo + sustantivo especificador, que califica a sḫtj.", "id": "6.30", "g": "𓇏𓏏𓏭𓀀 𓄤 𓌃𓂧𓅱𓀁 𓈖 𓃹𓈖𓐙𓂝"}, {"t": "tt", "ref": "Urk. IV 968,4", "vo": [["ẖrt", "parte, competencia"], ["ḥsb", "cálculo"], ["ṯnw", "números"]], "tr": "wr ẖrt m ḥsb ṯnw", "es": "muy competente en el cálculo de los números", "an": "Adjetivo wr + sustantivo especificador ẖrt + complemento con m.", "id": "6.31", "g": "𓅨𓂋 𓄡𓂋𓏏 𓅓 𓎛𓋴𓃀𓏛 𓍿𓈖𓏌𓅱𓏥"}]}]}, "7": {"intro": "Oraciones adjetivales y nominales, el corazón de los textos sapienciales y de las autopresentaciones. Subraya mentalmente el predicado de cada frase.", "secs": [{"id": "A", "title": "Nombres reales que son oraciones", "items": [{"t": "tt", "ref": "Nombre de trono del rey de la IV dinastía constructor de la tercera pirámide de Guiza", "tr": "mn-kꜣw-rꜥ|mn kꜣw rꜥ", "es": "Permanentes son los kas de Ra (Micerino)", "an": "Oración adjetival: predicado mn «permanente» + sujeto kꜣw rꜥ. Ra se escribe primero por anteposición honorífica.", "id": "7.1", "g": "𓍹 𓇳 𓏠 𓂓𓂓𓂓 𓍺"}, {"t": "tt", "ref": "Nombre de trono de Pepi II", "tr": "nfr-kꜣ-rꜥ|nfr kꜣ rꜥ", "es": "Perfecto es el ka de Ra", "an": "Adjetival: nfr + sujeto kꜣ rꜥ.", "id": "7.2", "g": "𓍹 𓇳 𓄤 𓂓 𓍺"}, {"t": "tt", "ref": "Nombre de trono de Senuseret III", "tr": "ḫꜥ-kꜣw-rꜥ|ḫꜥ kꜣw rꜥ", "es": "Los kas de Ra aparecen gloriosos", "an": "ḫꜥ «aparecer, brillar» como predicado; sujeto kꜣw rꜥ.", "id": "7.3", "g": "𓍹 𓇳 𓈍 𓂓𓂓𓂓 𓍺"}, {"t": "tt", "ref": "Nombre de trono de Tutmosis III", "tr": "mn-ḫpr-rꜥ|mn ḫpr rꜥ", "es": "Permanente es la manifestación de Ra", "an": "Adjetival: mn + ḫpr rꜥ.", "id": "7.4", "g": "𓍹 𓇳 𓏠 𓆣 𓍺"}, {"t": "tt", "ref": "Nombre de trono de Amenhotep III", "tr": "nb-mꜣꜥt-rꜥ|nb mꜣꜥt rꜥ", "es": "Ra es señor de Maat", "an": "Oración nominal: sujeto rꜥ + predicado nb mꜣꜥt.", "id": "7.5", "g": "𓍹 𓇳 𓆄 𓎟 𓍺"}, {"t": "tt", "ref": "Nombre de trono de Mentuhotep II", "tr": "nb-ḥpt-rꜥ|nb ḥpt rꜥ", "es": "Ra es señor del timón", "an": "Oración nominal: sujeto rꜥ + predicado nb ḥpt. El signo del remo 𓊤, que en mꜣꜥ-ḫrw se lee ḫrw, aquí se lee ḥpt «timón».", "id": "7.6", "g": "𓍹 𓇳 𓎟 𓊤 𓍺"}, {"t": "tt", "ref": "Nombre de trono de Senuseret II", "tr": "ḫꜥ-ḫpr-rꜥ|ḫꜥ ḫpr rꜥ", "es": "Aparece gloriosa la manifestación de Ra", "an": "Predicado ḫꜥ + sujeto ḫpr rꜥ.", "id": "7.7", "g": "𓍹 𓇳 𓈍𓂝 𓆣 𓍺"}]}, {"id": "B", "title": "Translitera y traduce", "items": [{"t": "tt", "ref": "Sinuhé B 84 (descripción de la tierra de Yaa)", "vo": [["ꜥšꜣ", "abundante"], ["bjt", "miel"], ["bꜣq", "aceite de oliva"]], "tr": "ꜥšꜣ bjt.f ꜥšꜣ bꜣq.f", "es": "Abundante era su miel, abundante su aceite.", "an": "Dos oraciones adjetivales: predicado ꜥšꜣ + sujeto. El sufijo .f es la tierra.", "id": "7.8", "g": "𓂝𓈙𓄿𓏥 𓆤𓏏𓏊𓆑 𓂝𓈙𓄿𓏥 𓅡𓄿𓈎𓎯𓆑"}, {"t": "tt", "ref": "Sinuhé B 47–48 (sobre Senuseret I)", "vo": [["grt", "además, en verdad"], ["nn snnw.f", "sin igual (literalmente «no hay su segundo»)"]], "tr": "nṯr pw grt nn snnw.f", "es": "Es un dios, en verdad, que no tiene igual.", "an": "Oración nominal con pw: «un dios (es) él».", "id": "7.9", "g": "𓊹𓀭 𓊪𓅱 𓎼𓂋𓏏 𓂜𓈖 𓌢𓈖𓈖𓅱𓀀𓆑"}, {"t": "tt", "ref": "El campesino elocuente B1, 62–63", "vo": [["n", "pues (conjunción)"], ["nmḥ", "huérfano"], ["hꜣj", "marido"], ["ḫꜣrt", "viuda"]], "tr": "n ntk jt n nmḥ hꜣj n ḫꜣrt", "es": "Pues tú eres padre para el huérfano, marido para la viuda.", "an": "Oración nominal con pronombre independiente ntk como sujeto: «tú (eres) padre…». El primer n es una conjunción; los otros, la preposición «para».", "id": "7.10", "g": "𓈖 𓈖𓏏𓎡 𓇋𓏏𓆑𓀀 𓈖 𓈖𓅓𓎛𓀀 𓉔𓄿𓇋𓀀 𓈖 𓆼𓄿𓂋𓏏𓁐"}, {"t": "tt", "ref": "Enseñanza para Merikare (E 32)", "vo": [["ḫpš", "brazo fuerte, fuerza"]], "tr": "ḫpš pw n nswt ns.f", "es": "La fuerza de un rey es su lengua.", "an": "Nominal A pw B: «una fuerza para el rey (es) su lengua».", "id": "7.11", "g": "𓐍𓊪𓈙𓄗 𓊪𓅱 𓈖 𓇓𓏏𓈖 𓄓𓏤𓆑"}, {"t": "tt", "ref": "Estela de Semna de Senuseret III (Berlín 1157)", "vo": [["kꜣꜣt", "lo que planea"], ["ḫprt", "lo que sucede"]], "tr": "kꜣꜣt jb.j pw ḫprt m ꜥ.j", "es": "Lo que planea mi corazón es lo que se cumple por mi mano.", "an": "A pw B con dos expresiones verbales sustantivadas.", "id": "7.12", "g": "𓂓𓄿𓄿𓏏𓀁 𓄣𓏤𓀀 𓊪𓅱 𓆣𓂋𓏏 𓅓 𓂝𓀀"}, {"t": "tt", "ref": "Libro de los Muertos, cap. 17 (respuesta de una glosa)", "tr": "rꜥ pw", "es": "Es Ra.", "an": "Nominal mínima: sustantivo + pw. Responde a preguntas como pw-tr r.f sw «¿quién es él?».", "id": "7.13", "g": "𓂋𓂝𓇳𓀭 𓊪𓅱"}, {"t": "tt", "ref": "Libro de los Muertos, cap. 17 (y Textos de los Sarcófagos 335)", "vo": [["ḫꜥw", "apariciones"], ["tpjw", "primeras (nisbe)"]], "tr": "jnk rꜥ m ḫꜥw.f tpjw", "es": "Yo soy Ra en sus primeras apariciones.", "an": "jnk + sustantivo: oración nominal. m ḫꜥw.f amplía el predicado.", "id": "7.14", "g": "𓇋𓈖𓎡 𓂋𓂝𓇳𓀭 𓅓 𓈍𓂝𓅱𓏥𓆑 𓁶𓊪𓅱𓏭𓏥"}, {"t": "tt", "ref": "Libro de los Muertos, cap. 17", "vo": [["ḫpr", "que llegó a ser (participio)"], ["ḏs.f", "él mismo"]], "tr": "jnk nṯr ꜥꜣ ḫpr ḏs.f", "es": "Yo soy el gran dios que llegó a existir por sí mismo.", "an": "Nominal con jnk; el predicado es nṯr ꜥꜣ ampliado con un participio.", "id": "7.15", "g": "𓇋𓈖𓎡 𓊹𓀭 𓉻𓂝 𓆣𓂋𓂻 𓆓𓋴𓆑"}]}, {"id": "C", "title": "Más textos reales", "items": [{"t": "tt", "ref": "Nombre de trono de Ramsés II", "tr": "wsr-mꜣꜥt-rꜥ|wsr mꜣꜥt rꜥ", "es": "Poderosa es la Maat de Ra", "an": "Oración adjetival: wsr + sujeto mꜣꜥt rꜥ.", "id": "7.16", "g": "𓍹 𓇳 𓄊 𓆄 𓍺"}, {"t": "tt", "ref": "Nombre de trono de Tutankamón", "tr": "nb-ḫprw-rꜥ|nb ḫprw rꜥ", "es": "Ra es el señor de las manifestaciones", "an": "Oración nominal: rꜥ + predicado nb ḫprw.", "id": "7.17", "g": "𓍹 𓇳 𓆣𓏥 𓎟 𓍺"}, {"t": "tt", "ref": "Nombre de trono de Amenhotep I", "tr": "ḏsr-kꜣ-rꜥ|ḏsr kꜣ rꜥ", "es": "Sagrado es el ka de Ra", "an": "Adjetival: ḏsr + kꜣ rꜥ.", "id": "7.18", "g": "𓍹 𓇳 𓂦 𓂓 𓍺"}, {"t": "tt", "ref": "Nombre de trono de Seti I", "tr": "mn-mꜣꜥt-rꜥ|mn mꜣꜥt rꜥ", "es": "Permanente es la Maat de Ra", "an": "Adjetival: mn + mꜣꜥt rꜥ.", "id": "7.19", "g": "𓍹 𓇳 𓏠 𓆄 𓍺"}, {"t": "tt", "ref": "Nombre de trono de Amenhotep II", "tr": "ꜥꜣ-ḫprw-rꜥ|ꜥꜣ ḫprw rꜥ", "es": "Grandes son las manifestaciones de Ra", "an": "Adjetival: ꜥꜣ + ḫprw rꜥ.", "id": "7.20", "g": "𓍹 𓇳 𓉻𓂝 𓆣𓏥 𓍺"}, {"t": "tt", "ref": "Nombre de trono de Ajenatón", "tr": "nfr-ḫprw-rꜥ|nfr ḫprw rꜥ", "es": "Perfectas son las manifestaciones de Ra", "an": "Adjetival: nfr + ḫprw rꜥ.", "id": "7.21", "g": "𓍹 𓇳 𓄤 𓆣𓏥 𓍺"}, {"t": "tt", "ref": "Papiro Ebers 63,3 (tras una receta)", "vo": [["wn-mꜣꜥ", "verdadero, auténtico"]], "tr": "wn-mꜣꜥ pw", "es": "Es (un remedio) verdadero.", "an": "Oración nominal con pw. Es la garantía con la que acaban muchas recetas.", "id": "7.22", "g": "𓃹𓈖𓐙𓂝 𓊪𓅱"}, {"t": "tt", "ref": "El campesino elocuente B1, 130", "vo": [["snb", "estar sano, estar libre"], ["mryt", "orilla"]], "tr": "snb mryt", "es": "La orilla está despejada.", "an": "Oración adjetival: predicado snb + sujeto mryt. Es una frase hecha: «no hay peligro».", "id": "7.23", "g": "𓋴𓈖𓃀 𓌻𓂋𓇋𓏏𓈘"}, {"t": "tt", "ref": "Papiros de Kahun 32,12 (carta)", "tr": "bjn wj", "es": "¡Qué malo es…!", "an": "Adjetival exclamativa: adjetivo + wj.", "id": "7.24", "g": "𓃀𓇋𓈖𓅪 𓅱𓇋"}, {"t": "tt", "ref": "Sinuhé B 51", "vo": [["jr", "que actúa"], ["ḫpš", "brazo fuerte"]], "tr": "nḫt pw grt jr m ḫpš.f", "es": "Es un valiente, en verdad, que actúa con su brazo fuerte.", "an": "Nominal con pw; el resto amplía el predicado.", "id": "7.25", "g": "𓈖𓆱𓐍𓏏𓂡 𓊪𓅱 𓎼𓂋𓏏 𓁹𓂋 𓅓 𓐍𓊪𓈙𓄗𓆑"}, {"t": "tt", "ref": "El campesino elocuente R 1,1", "vo": [["wn", "que existía"], ["ḫw-n-jnpw", "Junanup"]], "tr": "zj pw wn ḫw-n-jnpw rn.f", "es": "Había una vez un hombre llamado Junanup.", "an": "Literalmente «un hombre (es) él, que existía, Junanup su nombre». Así empiezan los cuentos.", "id": "7.26", "g": "𓊃𓇋𓀀 𓊪𓅱 𓃹𓈖 𓐍𓅱 𓈖 𓇋𓈖𓊪𓅱𓃢 𓂋𓈖𓆑"}, {"t": "tt", "ref": "El campesino elocuente R 1,1", "tr": "sḫtj pw n sḫt-ḥmꜣt", "es": "Era un campesino del Campo de la Sal.", "an": "Nominal con pw + genitivo indirecto n.", "id": "7.27", "g": "𓇏𓏏𓏭𓀀 𓊪𓅱 𓈖 𓇏𓏏𓈅 𓎛𓅓𓄿𓏏𓈓"}, {"t": "tt", "ref": "Estela de Semna de Senuseret III (Berlín 1157)", "vo": [["ḏd", "que habla"], ["jrr", "que actúa"]], "tr": "jnk nswt ḏd jrr|jnk nswt ḏdw jrrw|jnk nswt ḏdw jrr", "es": "Soy un rey que habla y actúa.", "an": "jnk + predicado: oración nominal. Dos participios califican a nswt.", "id": "7.28", "g": "𓇋𓈖𓎡 𓇓𓏏𓈖 𓆓𓂧𓀁 𓁹𓂋𓂋"}, {"t": "tt", "ref": "Fórmula de epítetos (estelas)", "tr": "wsr rn.f", "es": "Su nombre es poderoso.", "an": "Oración adjetival: wsr + sujeto rn.f.", "id": "7.29", "g": "𓄊𓋴𓂋 𓂋𓈖𓆑"}, {"t": "tt", "ref": "Glosas del Libro de los Muertos, cap. 17", "tr": "pt pw", "es": "Es el cielo.", "an": "Nominal mínima: sustantivo + pw.", "id": "7.30", "g": "𓊪𓏏𓇯 𓊪𓅱"}, {"t": "tt", "g": "𓄤𓆑𓂋𓅱𓏭 𓊏𓊪𓂝 𓅭𓏏 𓆓𓂧 𓇋𓏏𓆑𓀀 𓆑", "ref": "Enseñanza de Ptahhotep (epílogo)", "vo": [["šzp", "recibir, aceptar"]], "tr": "nfr.wj šzp zꜣ ḏd jt.f", "es": "¡Qué bueno es que el hijo acepte lo que dice su padre!", "an": "nfr.wj: adjetivo exclamativo. ḏd jt.f: «lo que dice su padre» (forma relativa).", "id": "7.31"}, {"t": "tt", "g": "𓅱𓊃𓐍𓎺𓏛 𓊨𓏏𓉐 𓈖𓏏 𓉔𓂋𓏛𓀀", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "vo": [["wsḫ", "amplio"], ["hrw", "estar tranquilo"]], "tr": "wsḫ st nt hrw", "es": "Amplio es el lugar del que está en paz.", "an": "Oración adjetival: adjetivo wsḫ + sujeto. hrw: participio («el tranquilo»).", "id": "7.32"}]}]}, "8": {"intro": "Preposiciones, nisbes y adverbios en El náufrago, Sinuhé, estelas y Textos de los Sarcófagos. En el vocabulario se dan las formas verbales que aún no conoces.", "secs": [{"id": "A", "title": "Translitera y traduce", "items": [{"t": "tt", "ref": "El náufrago 25–27", "vo": [["hꜣ.kw", "bajé (estativo, tema 17)"], ["ꜣw", "longitud"], ["sḫw", "anchura"], ["120 / 40", "𓍢𓎆𓎆 / 𓎆𓎆𓎆𓎆"]], "tr": "hꜣ.kw r wꜣḏ-wr m dpt nt mḥ 120 m ꜣw.s mḥ 40 m sḫw.s", "es": "Bajé al mar en un barco de 120 codos de largo y 40 codos de anc .32", "g": "𓃛𓅱 𓄡𓏌𓅱𓉐 𓅓 𓋴𓎼𓂋𓀁 𓄣𓏥 𓅓 𓅠𓅱𓀁"}, {"t": "tt", "ref": "Textos de los Sarcófagos, conjuro 1130 (CT VII 464)", "vo": [["jw jr.n.j", "hice (habla el dios creador)"], ["snw", "compañero, semejante"]], "tr": "jw jr.n.j zj nb mj snw.f", "es": "Hice a cada hombre igual que su semejante.", "an": "mj «como, igual que».", "id": "8.33", "g": "𓃛𓅱 𓁹𓈖𓀀 𓊃𓇋𓀀 𓎟 𓏇𓇋 𓌢𓈖𓅱𓀀𓆑"}, {"t": "tt", "ref": "Titulatura real del Reino Nuevo (passim)", "vo": [["ẖt", "cuerpo, vientre"], ["mrj.f", "a quien ama (forma relativa, tema 24)"]], "tr": "zꜣ rꜥ n ẖt.f mrj.f|sꜣ rꜥ n ẖt.f mrj.f|zꜣ rꜥ n ẖt.f mr.f", "es": "hijo de Ra, de su cuerpo, al que ama", "an": "n ẖt.f: «de su cuerpo», genitivo indirecto.", "id": "8.34", "g": "𓇳 𓅭 𓈖 𓄡𓏏𓆑 𓌻𓂋𓇋𓆑"}]}]}, "9": {"intro": "Números, fechas y cantidades en documentos reales: estelas fechadas, fórmulas de ofrenda, relatos y autobiografías.", "secs": [{"id": "A", "title": "Lee las cifras", "items": [{"t": "mc", "q": "¿Qué número está escrito?", "op": ["232", "322", "223", "2320"], "ok": 0, "an": "𓍢 = 100 (dos veces), 𓎆 = 10 (tres veces), 𓏤 = 1 (dos veces): 200 + 30 + 2. Las cifras se escriben de mayor a menor.", "id": "9.1", "g": "𓍢𓍢 𓎆𓎆𓎆 𓏤𓏤"}, {"t": "mc", "q": "¿Qué número está escrito?", "op": ["1115", "1150", "11 015", "215"], "ok": 0, "an": "𓆼 = 1000, 𓍢 = 100, 𓎆 = 10 y cinco trazos: 1000 + 100 + 10 + 5.", "id": "9.2", "g": "𓆼 𓍢 𓎆 𓏤𓏤𓏤𓏤𓏤"}, {"t": "mc", "q": "¿Qué fracción es?", "op": ["1/3", "3", "2/3", "1/30"], "ok": 0, "an": "𓂋 (r, «parte») sobre un número indica la fracción con numerador 1: r 3 = 1/3.", "id": "9.3", "g": "𓂋 𓏤𓏤𓏤"}, {"t": "mc", "q": "¿Qué fracción representa este signo?", "op": ["1/2 (gs)", "1/4", "2/3", "1/10"], "ok": 0, "an": "𓐛 gs «lado, mitad» = 1/2.", "id": "9.4", "g": "𓐛"}]}, {"id": "B", "title": "Translitera y traduce", "items": [{"t": "tt", "ref": "Estela de Semna de Senuseret III (Berlín 1157), línea 1", "vo": [["rnpt-zp", "año de reinado"], ["ꜣbd", "mes"], ["prt", "estación de la siembra"]], "tr": "rnpt-zp 16 ꜣbd 3 prt", "es": "Año de reinado 16, tercer mes de la estación de la siembra", "an": "Las fechas dan año de reinado, mes (1 a 4) y una de las tres estaciones. El número sigue al sustantivo.", "id": "9.5", "g": "𓆳𓏏𓏤 𓎆𓏤𓏤𓏤𓏤𓏤𓏤 𓇹𓇼 𓏤𓏤𓏤 𓉐𓂋𓏏𓇳"}, {"t": "tt", "ref": "Fórmula de ofrenda (estelas del Reino Medio)", "vo": [["ḫꜣ", "mil"]], "tr": "ḫꜣ m t ḫꜣ m ḥnqt ḫꜣ m kꜣ ꜣpd", "es": "mil (raciones) de pan, mil de cerveza, mil de bueyes y aves", "an": "ḫꜣ m: «mil de». La m es partitiva. Es lo que el difunto pide que se le recite.", "id": "9.6", "g": "𓆼 𓅓 𓏐 𓆼 𓅓 𓏊 𓆼 𓅓 𓃾 𓅾"}, {"t": "tt", "ref": "Autobiografía de Harjuf (Asuán), tercer viaje a Yam", "vo": [["hꜣ.n.j", "bajé"], ["ꜥꜣ", "asno"]], "tr": "hꜣ.n.j ḥnꜥ ꜥꜣ 300", "es": "Bajé (el río) con 300 asnos.", "an": "El número va detrás del sustantivo, que suele quedar en singular.", "id": "9.7", "g": "𓉔𓄿𓂻𓈖𓀀 𓎛𓈖𓂝 𓃘𓏥 𓍢𓍢𓍢"}, {"id": "9.8", "t": "tt", "g": "𓁹𓈖𓀀 𓆳𓏏𓏤 𓍢 𓎆 𓅓 𓋹𓈖𓐍", "ref": "Enseñanzas de Ptahhotep, epílogo", "vo": [["jr.n.j", "alcancé (literalmente «hice»)"]], "tr": "jr.n.j rnpt 110 m ꜥnḫ", "es": "He alcanzado ciento diez años de vida.", "an": "rnpt 110: sustantivo + número. 110 años era la vida ideal para un egipcio. jr.n.j es un perfecto (tema 18)."}]}, {"id": "C", "title": "Ordinales", "items": [{"t": "tt", "ref": "Inscripciones de Amenhotep III sobre su primer jubileo (tumba de Jeruef y Soleb)", "vo": [["ḥb-sd", "fiesta Sed (jubileo)"], ["tpj", "primero"]], "tr": "ḥb-sd tpj", "es": "el primer jubileo", "an": "tpj «primero» es una nisbe de tp «cabeza» y se comporta como adjetivo: va detrás.", "id": "9.9", "g": "𓎱𓉳 𓁶𓊪𓅱𓏭"}, {"t": "tt", "ref": "Textos de la creación (Textos de los Sarcófagos, inscripciones de templos)", "tr": "zp tpj|sp tpj", "es": "la Primera Vez (el momento de la creación)", "an": "zp «ocasión» + tpj «primero». Es la expresión egipcia para el principio del mundo.", "id": "9.10", "g": "𓊗𓊪 𓁶𓊪𓅱𓏭"}]}, {"id": "D", "title": "Más textos reales", "items": [{"t": "mc", "q": "¿Qué número está escrito?", "op": ["327", "372", "3207", "237"], "ok": 0, "an": "Tres 𓍢 (300), dos 𓎆 (20) y siete trazos.", "id": "9.11", "g": "𓍢𓍢𓍢 𓎆𓎆 𓏤𓏤𓏤𓏤𓏤𓏤𓏤"}, {"t": "mc", "q": "¿Qué número está escrito?", "op": ["2104", "2140", "1204", "2014"], "ok": 0, "an": "Dos 𓆼 (2000), un 𓍢 (100) y cuatro trazos.", "id": "9.12", "g": "𓆼𓆼 𓍢 𓏤𓏤𓏤𓏤"}, {"t": "mc", "q": "¿Qué fracción es?", "op": ["1/10", "10", "1/100", "10/1"], "ok": 0, "an": "r + 10 = 1/10.", "id": "9.13", "g": "𓂋 𓎆"}, {"t": "tt", "ref": "Inscripción del obelisco de Hatshepsut en Karnak", "vo": [["ꜣbd", "mes"], ["šꜥt", "corte (de la piedra)"], ["ḏw", "montaña, cantera"]], "tr": "ꜣbd 7 m šꜥt m ḏw", "es": "siete meses de corte en la cantera", "an": "Sustantivo + número; m «en» dos veces. El obelisco se extrajo en siete meses.", "id": "9.14", "g": "𓇹𓇼 𓏤𓏤𓏤𓏤𓏤𓏤𓏤 𓅓 𓈙𓂝𓏏𓌪 𓅓 𓈋"}, {"t": "tt", "ref": "Primera estela de Kamose (Karnak)", "vo": [["rnpt-zp", "año de reinado"]], "tr": "rnpt-zp 3", "es": "año de reinado 3", "an": "Fecha mínima: solo el año.", "id": "9.15", "g": "𓆳𓏏𓏤 𓊗𓏤 𓏤𓏤𓏤"}, {"t": "tt", "ref": "Papiro Westcar 7,2–3 (el mago Dyedi)", "vo": [["wnm", "comer"], ["ḫpš", "pata (de buey)"], ["jwf", "carne"], ["swr", "beber"], ["ds", "jarra"]], "tr": "jw.f ḥr wnm t 500 ḫpš m jwf ḥnꜥ swr ḥnqt ds 100", "es": "Come quinientos panes y una pata de buey en carne, y bebe cien jarras de cerveza.", "an": "jw.f ḥr + infinitivo (wnm, swr): acción habitual. t 500, ds 100: sustantivo + número; en ḥnqt ds 100 la unidad de medida va detrás de la mercancía («cerveza: 100 jarras»).", "id": "9.16", "g": "𓃛𓅱𓆑 𓁷𓏤 𓃹𓈖𓅓𓀁 𓏐 𓍢𓍢𓍢𓍢𓍢 𓐍𓊪𓈙𓄗 𓅓 𓇋𓅱𓆑𓄹 𓎛𓈖𓂝 𓋴𓅱𓂋𓀁 𓎛𓈖𓈎𓏏𓏊 𓂧𓋴𓏊 𓍢"}]}, {"id": "E", "title": "Ahmose hijo de Abana (Urk. IV)", "items": [{"t": "tr", "ref": "Autobiografía de Ahmose hijo de Abana, l. 15 (Urk. IV 1–11)", "vo": [["šrḥn", "Sharuhen"], ["rnpt", "año"]], "tr": "wn.jn.tw ḥr ḥmst ḥr šrḥn m rnpwt 3 wn.jn ḥm.f ḥr ḥꜣq.s|wn.jn.tw ḥr ḥmst ḥr šrḥn m rnpt 3 wn.jn ḥm.f ḥr ḥꜣq.s", "es": "Se asedió Sharuhen durante tres años, y su Majestad la saqueó.", "an": "m rnpwt 3: sustantivo + número («durante tres años»). ḥꜣq.s: infinitivo con sufijo objeto.", "id": "9.17"}]}]}, "10": {"intro": "Oraciones adverbiales: sujeto + predicado preposicional o adverbial, con o sin jw. Fuentes: Sinuhé, el Diálogo del desesperado, el papiro Westcar, los Textos de las Pirámides, el Gran Himno a Atón y nombres reales.", "secs": [{"id": "A", "title": "Translitera y traduce", "items": [{"t": "tt", "ref": "Sinuhé B 85–86 (la tierra de Yaa)", "vo": [["jt", "cebada"], ["bdt", "escanda"]], "tr": "jw jt jm ḥnꜥ bdt", "es": "Había allí cebada y escanda.", "an": "jw + sujeto + adverbio jm: «existía allí». ḥnꜥ coordina.", "id": "10.1", "g": "𓃛𓅱 𓇋𓏏𓇠 𓇋𓅓 𓎛𓈖𓂝 𓃀𓂧𓏏𓇣"}, {"t": "tt", "ref": "Diálogo del desesperado con su ba 130–131", "vo": [["mwt", "muerte"], ["mjn", "hoy"], ["snb", "curación"], ["mr", "enfermo"]], "tr": "mwt m ḥr.j mjn mj snb mr", "es": "La muerte está hoy ante mí como la curación de un enfermo.", "an": "Sin jw: sujeto mwt + predicado m ḥr.j «ante mí»; mjn es adverbio. mj introduce la comparación.", "id": "10.2", "g": "𓅓𓅱𓏏𓀐 𓅓 𓁷𓏤𓀀 𓅓𓇋𓈖𓇳 𓏇𓇋 𓋴𓈖𓃀 𓌻𓂋𓀉"}, {"t": "tt", "ref": "Nombre de un hijo de Ramsés II (Amenherjepeshef)", "vo": [["ḫpš", "brazo fuerte"]], "tr": "jmn-ḥr-ḫpš.f|jmn ḥr ḫpš.f", "es": "Amón está sobre su brazo fuerte", "an": "Sujeto jmn + predicado ḥr ḫpš.f.", "id": "10.3", "g": "𓇋𓏠𓈖 𓁷𓏤 𓐍𓊪𓈙𓄗𓆑"}, {"t": "tt", "ref": "Gran Himno a Atón (tumba de Ay en Amarna)", "vo": [["ḥtp.k", "cuando te pones"], ["jmntt", "occidental"], ["kkw", "oscuridad"], ["sḫr", "manera"], ["mt", "muerte"]], "tr": "ḥtp.k m ꜣḫt jmntt tꜣ m kkw m sḫr mt", "es": "Cuando te pones en el horizonte occidental, la tierra queda en tinieblas, a la manera de la muerte.", "an": "tꜣ m kkw: oración adverbial sin jw. Depende de la primera parte (ḥtp.k «cuando te pones»).", "id": "10.4", "g": "𓊵𓏏𓊪𓎡 𓅓 𓅜𓐍𓏏𓈌 𓋀𓏏 𓇾𓏤 𓅓 𓎡𓎡𓅱𓇰 𓅓 𓋴𓐍𓂋𓏛 𓅓𓏏𓀐"}, {"t": "tt", "ref": "Papiro Westcar 7,17–18 (Dyedefhor saluda al mago Dyedi)", "vo": [["ḫrt", "estado, condición"], ["tp-ꜥ", "antes de"], ["jꜣw", "vejez"]], "tr": "jw ḫrt.k mj ꜥnḫ tp-ꜥ jꜣw", "es": "Tu estado es como el de quien vive antes de la vejez.", "an": "jw + sujeto ḫrt.k + predicado mj ꜥnḫ «como un vivo».", "id": "10.5", "g": "𓃛𓅱 𓐍𓂋𓏏𓏛𓎡 𓏇𓇋 𓋹𓈖𓐍 𓁶𓂝 𓀗𓅱𓏲"}, {"t": "tt", "ref": "Textos de las Pirámides, conjuro 213 (Pyr. 135)", "vo": [["ꜥwj", "los dos brazos"], ["jtm", "Atum"], ["ẖt", "vientre"]], "tr": "ꜥwj.k m jtm ẖt.k m jtm", "es": "Tus brazos son Atum, tu vientre es Atum.", "an": "m de identidad: «en (forma de) Atum». Cada parte del rey muerto se identifica con el dios.", "id": "10.6", "g": "𓂝𓂝𓎡 𓅓 𓇋𓏏𓅓𓀭 𓄡𓏏𓎡 𓅓 𓇋𓏏𓅓𓀭"}, {"t": "tt", "ref": "Gran Himno a Atón", "tr": "tꜣ m kkw", "es": "La tierra está en tinieblas.", "an": "La oración adverbial mínima: sujeto + m + sustantivo.", "id": "10.7", "g": "𓇾𓏤 𓅓 𓎡𓎡𓅱𓇰"}]}, {"id": "B", "title": "Análisis", "items": [{"t": "mc", "q": "En jw jt jm ḥnꜥ bdt (Sinuhé B 85–86), ¿cuál es el predicado?", "op": ["jm «allí»", "jt «cebada»", "jw", "ḥnꜥ bdt «y escanda»"], "ok": 0, "an": "El predicado de una oración adverbial es la expresión adverbial o preposicional: jm. jw introduce la oración; jt ḥnꜥ bdt es el sujeto.", "id": "10.8"}, {"t": "mc", "q": "¿Por qué mwt m ḥr.j mjn no lleva jw?", "op": ["Porque jw no es obligatorio: la oración adverbial puede ir sin él", "Porque está en pasado", "Porque mwt es femenino", "Porque es una pregunta"], "ok": 0, "an": "jw añade una afirmación sobre la situación, pero muchas oraciones adverbiales, sobre todo en poesía, van sin él.", "id": "10.9"}]}, {"id": "C", "title": "Más textos reales", "items": [{"t": "tt", "ref": "Profecía de Neferti 37", "vo": [["jṯt", "ir, tomar"], ["jnt", "traer, venir"]], "tr": "jw tꜣ pn m jṯt jnt", "es": "Esta tierra va y viene (está desquiciada).", "an": "jw + sujeto + m + infinitivos: oración adverbial (y pseudoverbal) que describe un estado de desorden.", "id": "10.10", "g": "𓃛𓅱 𓇾𓏤 𓊪𓈖 𓅓 𓇋𓍿𓏏𓂻 𓏎𓈖𓏏"}, {"t": "tt", "ref": "Nombre del rey Horemheb", "vo": [["ḥb", "fiesta"]], "tr": "ḥr-m-ḥb|ḥrw-m-ḥb", "es": "Horus está de fiesta (Horemheb)", "an": "Oración adverbial completa como nombre propio.", "id": "10.11", "g": "𓍹 𓅃 𓅓 𓎱 𓍺"}, {"t": "tt", "ref": "Nombre del autor de la Enseñanza de Amenemope", "vo": [["jpt", "Ipet (Luxor)"]], "tr": "jmn-m-jpt|jmn m jpt", "es": "Amón está en Ipet (Amenemope)", "an": "Sujeto jmn + predicado m jpt.", "id": "10.12", "g": "𓇋𓏠𓈖 𓅓 𓊒𓏏"}, {"t": "tt", "ref": "Textos de las Pirámides, conjuro 213 (Pyr. 135)", "tr": "ḥr.k m jnpw", "es": "Tu rostro es Anubis.", "an": "m de identidad, como en ꜥwj.k m jtm.", "id": "10.13", "g": "𓁷𓏤𓎡 𓅓 𓃢"}, {"t": "tt", "ref": "Sinuhé B 310–311 (última frase del relato)", "vo": [["ẖr", "bajo, cargado de"], ["ḥzwt", "favor"], ["ḫr", "junto a, ante"], ["mnj", "atracar; morir"]], "tr": "jw.j ẖr ḥzwt nt ḫr nswt r jwt hrw n mnj|jw.j ẖr ḥswt nt ḫr nswt r jwt hrw n mnj", "es": "Estuve en el favor del rey hasta que llegó el día de atracar (de morir).", "an": "jw + sujeto + predicado preposicional ẖr ḥzwt: oración adverbial («estuve bajo el favor»). r jwt: r + infinitivo «hasta la venida». «Atracar» es un eufemismo de morir.", "id": "10.14", "g": "𓇋𓏲 𓀀 𓌨𓂋 𓎿𓋴𓏏𓀁𓏥 𓈖𓏏 𓇓𓏏𓈖𓐍𓂋 𓂋 𓂻𓅱𓏏 𓉔𓂋𓏲𓇳𓏤 𓈖 𓏠𓈖𓇋𓊧𓏱"}, {"t": "tt", "ref": "Nombre de los reyes Amenemhat de la XII dinastía", "tr": "jmn-m-ḥꜣt|jmn m ḥꜣt", "es": "Amón está al frente (Amenemhat)", "an": "Oración adverbial completa: sujeto jmn + predicado m ḥꜣt «al frente».", "id": "10.15", "g": "𓍹 𓇋𓏠𓈖 𓅓 𓄂𓏏 𓍺"}, {"t": "tt", "g": "𓆣𓂋𓈖 𓂋 𓋴 𓂜𓈖 𓅱𓀀 𓎛𓈖𓂝", "ref": "El náufrago (relato de la serpiente)", "vo": [["ḫpr", "ocurrir"]], "tr": "ḫpr.n r.s nn wj ḥnꜥ", "es": "Ocurrió cuando yo no estaba con ellos.", "an": "nn wj ḥnꜥ: oración adverbial negativa con pronombre dependiente (wj) usada como circunstancial.", "id": "10.16"}]}, {"id": "D", "title": "Ahmose hijo de Abana (Urk. IV)", "items": [{"t": "tr", "ref": "Autobiografía de Ahmose hijo de Abana, l. 5 (Urk. IV 1–11)", "vo": [["wꜥw", "soldado"], ["sqnj.n-rꜥ", "Seqenenra (rey)"]], "tr": "jw jt.j m wꜥw n nswt-bjtj sqnj.n-rꜥ mꜣꜥ-ḫrw bꜣbꜣ zꜣ rꜣ-jnt rn.f|jw jt.j m wꜥw n nswt-bjt sqnn-rꜥ mꜣꜥ-ḫrw bꜣbꜣ zꜣ rꜣ-jnt rn.f", "es": "Mi padre era soldado del rey del Alto y Bajo Egipto Seqenenra, justificado; Baba, hijo de Rainet, era su nombre.", "an": "jw + sujeto + m de predicación: «era soldado». bꜣbꜣ zꜣ rꜣ-jnt rn.f: oración nominal («Baba… era su nombre»).", "id": "10.17"}]}]}, "11": {"intro": "Negación y preguntas en oraciones no verbales: nn, n … js y las partículas interrogativas.", "secs": [{"id": "A", "title": "Translitera y traduce", "items": [{"t": "tt", "ref": "Enseñanzas de Ptahhotep 56", "vo": [["ḥmww", "artesano"], ["ꜥpr", "completo, equipado"], ["ꜣḫw", "maestría, eficacia"]], "tr": "nn ḥmww ꜥpr ꜣḫw.f", "es": "No hay artesano cuya maestría sea completa.", "an": "nn + sustantivo: «no existe». ꜥpr ꜣḫw.f califica al artesano («completo en cuanto a su maestría»).", "id": "11.1", "g": "𓂜𓈖 𓍍𓅱𓅱𓀀 𓂝𓊪𓂋𓏛 𓅜𓐍𓅱𓏛𓆑"}, {"t": "tt", "ref": "Sinuhé B 48 (elogio de Senuseret I)", "vo": [["ky", "otro"], ["ḫpr", "que existiera"], ["ẖr-ḥꜣt", "antes de"]], "tr": "nn ky ḫpr ẖr-ḥꜣt.f", "es": "No hubo otro que existiera antes que él.", "an": "nn ky: «no hay otro». ḫpr es un participio que califica a ky.", "id": "11.2", "g": "𓂜𓈖 𓎢𓇋𓇋𓀀 𓆣𓂋 𓌨𓂋𓄂𓏏𓏤 𓆑"}, {"t": "tt", "ref": "Enseñanza de Amenemhat I a su hijo, §3", "vo": [["mḥ-jb", "persona de confianza"], ["hrw", "día"], ["qsn", "desgracia"]], "tr": "nn mḥ-jb m hrw qsn", "es": "No hay hombre de confianza en el día de la desgracia.", "an": "nn + sustantivo + complemento adverbial.", "id": "11.3", "g": "𓂜𓈖 𓎔𓄣 𓅓 𓉔𓂋𓅱𓇳 𓈎𓋴𓈖𓅪"}, {"t": "tt", "ref": "Libro de los Muertos, cap. 17 (pregunta de las glosas)", "vo": [["jšst", "¿qué?"], ["r.f", "pues"]], "tr": "jšst r.f sj", "es": "¿Qué es eso, pues?", "an": "Pregunta nominal: interrogativo jšst + pronombre dependiente sj.", "id": "11.4", "g": "𓇋𓋴𓋴𓏏𓏛 𓂋𓆑 𓋴𓇋"}]}, {"id": "B", "title": "Análisis", "items": [{"t": "mc", "q": "¿Cuál es la diferencia entre nn ḥmww «no hay artesano» y n ḥmww js pw «no es un artesano»?", "op": ["nn niega la existencia; n … js niega una oración nominal", "Ninguna: son sinónimos", "nn es pasado y n … js presente", "n … js solo se usa con verbos"], "ok": 0, "an": "nn + sustantivo niega que algo exista. n … js niega la oración nominal: js va tras la primera palabra del predicado.", "id": "11.5"}, {"t": "mc", "q": "¿Qué hace la partícula jn al principio de una oración no verbal?", "op": ["La convierte en pregunta de sí o no", "La niega", "Indica pasado", "Introduce un vocativo"], "ok": 0, "an": "jn + oración = pregunta: «¿es…?». Además, jn introduce el agente: «por».", "id": "11.6"}]}, {"id": "C", "title": "Más textos reales", "items": [{"t": "tt", "ref": "Papiro Edwin Smith 3,17", "vo": [["jṯt jnt", "ir y venir"]], "tr": "nn jṯt jnt", "es": "sin ir y venir (sin moverse)", "an": "nn + infinitivo: «no hay ir y venir». Se dice de un miembro inmóvil.", "id": "11.7", "g": "𓂜𓈖 𓇋𓍿𓏏 𓏎𓈖𓏏"}, {"t": "tt", "ref": "Urk. IV 1280,7", "vo": [["sḫn", "descansar, detenerse"], ["jṯt", "marcha"]], "tr": "nn jrt sḫn m jṯt", "es": "sin detenerse en la marcha", "an": "nn + infinitivo: «no hay hacer descanso».", "id": "11.8", "g": "𓂜𓈖 𓁹𓏏 𓋴𓐍𓈖𓂻 𓅓 𓇋𓍿𓏏𓂻"}, {"t": "tt", "g": "𓂜𓈖 𓆎𓅓𓏛 𓈖 𓀻𓋴𓋴𓏛𓏥 𓅓𓐍𓂸𓏏𓏫𓏛 𓋴𓈖𓏥", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "vo": [["km", "completar, estar completo"], ["špss", "riqueza"], ["m-ḫmt", "sin"]], "tr": "nn km n špss m-ḫmt.sn|nn km n šps m-ḫmt.sn", "es": "La riqueza no está completa sin ellos.", "an": "nn + sustantivo (aquí el infinitivo km): «no hay compleción de la riqueza». m-ḫmt.sn: preposición compuesta con sufijo.", "id": "11.9"}, {"t": "tt", "g": "𓂜 𓅨𓂋 𓇋𓋴 𓊪𓏲 𓅨𓂋 𓇋𓅓 𓂝𓃹𓈖𓂝 𓄣𓏤", "ref": "El campesino elocuente", "vo": [["ꜥwn-jb", "codicioso (literalmente «de corazón voraz»)"], ["jm", "allí; aquel"]], "tr": "n wr js pw wr jm ꜥwn jb|n wr js pw wr jm ꜥwn-jb", "es": "No es un grande ese grande que es codicioso.", "an": "n … js niega una oración con pw: «no es un grande». wr jm ꜥwn-jb es el sujeto: «aquel grande codicioso».", "id": "11.10"}, {"t": "tt", "g": "𓇋𓈖 𓇋𓏲 𓎢 𓂋 𓊃𓀀𓏤 𓈖 𓈖𓅘𓎛𓎛𓇳", "ref": "El campesino elocuente", "vo": [["nḥḥ", "eternidad"]], "tr": "jn jw.k r z n nḥḥ", "es": "¿Acaso vas a ser un hombre de la eternidad?", "an": "jn jw convierte la oración en pregunta. jw.k r + sustantivo: «estás destinado a (ser)», futuro.", "id": "11.11"}, {"t": "tt", "g": "𓇋𓈖 𓇋𓏲 𓂋 𓆑 𓅝𓏏𓏭𓅆 𓊃𓆑𓈖𓂉𓀁 𓆑", "ref": "El campesino elocuente", "vo": [["sfn", "ser clemente"], ["r.f", "pues (enclítico)"]], "tr": "jn jw r.f ḏḥwtj sfn.f", "es": "¿Es que Thot es clemente?", "an": "jn jw + enclítico r.f: pregunta. Sujeto ḏḥwtj + sḏm.f sfn.f: acción general («suele ser clemente»).", "id": "11.12"}, {"t": "tt", "g": "𓂜𓈖 𓅱𓐍𓆼𓄿𓅪𓀀 𓅓𓁷𓂋𓄣 𓋴𓈖𓏥", "ref": "El náufrago (descripción de la tripulación)", "vo": [["wḫꜣ", "necio"], ["m-ḥrj-jb", "en medio de"]], "tr": "nn wḫꜣ m-ḥrj-jb.sn|nn wḫꜣ m ḥrj-jb.sn", "es": "No había ningún necio entre ellos.", "an": "nn + sustantivo: inexistencia («no había necio»). m-ḥrj-jb.sn: «en medio de ellos».", "id": "11.13"}, {"t": "tt", "g": "𓂜𓈖 𓃛𓅱𓂝𓅱𓀀𓁐𓏥 𓆑 𓁶 𓇾𓈇𓏤", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "vo": [["jwꜥw", "herederos"], ["tp tꜣ", "en la tierra"]], "tr": "nn jwꜥw.f tp tꜣ", "es": "No tiene herederos en la tierra.", "an": "nn + sustantivo con sufijo: «no existen sus herederos». Expresa la posesión negada.", "id": "11.14"}, {"t": "tt", "g": "𓂜𓈖 𓂋𓈖 𓆑 𓅓𓅓𓂞 𓋹𓈖𓐍𓅱𓀀𓏥", "ref": "Corpus del TLA, Reino Medio (finales de la dinastía XII)", "vo": [["m-m", "entre"], ["ꜥnḫw", "los vivos"]], "tr": "nn rn.f m-m ꜥnḫw", "es": "Su nombre no estará entre los vivos.", "an": "nn + sujeto + predicado adverbial: negación de una oración adverbial. Fórmula de maldición.", "id": "11.15"}, {"t": "tt", "g": "𓂜 𓈖𓏏𓎢 𓇋𓋴 𓊃𓀀𓏤", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "vo": [["ntk", "tú (pronombre independiente)"]], "tr": "n ntk js z|n ntk js s", "es": "¡Tú no eres un hombre (de bien)!", "an": "n … js niega la oración de predicado nominal ntk z «tú eres un hombre».", "id": "11.16"}, {"t": "tt", "g": "𓇋𓈖 𓅓𓂝𓆼𓄿𓏏𓍸𓆱 𓊪𓏲", "ref": "El campesino elocuente", "vo": [["mḫꜣt", "balanza"]], "tr": "jn mḫꜣt pw", "es": "¿Es una balanza?", "an": "jn convierte en pregunta la oración nominal con pw.", "id": "11.17"}, {"t": "tt", "g": "𓇋𓈖 𓇋𓏲 𓅯𓄿 𓉐𓏤 𓋴𓋴𓊪𓂧𓇮𓏛", "ref": "Corpus del TLA, Reino Medio (dinastía XIII)", "vo": [["pꜣ", "este, el"], ["sspd", "equipado, provisto"]], "tr": "jn jw pꜣ pr sspd|jn jw pꜣ pr spd", "es": "¿Está provista esta casa?", "an": "jn jw + sujeto + estativo sspd: pregunta sobre un estado.", "id": "11.18"}, {"t": "tt", "g": "𓈖𓅓𓂝 𓏎𓈖 𓏏𓅱", "ref": "El náufrago 69", "vo": [["jnj", "traer"]], "tr": "jn-m jn tw|jn m jnj tw|jn-m jnj tw", "es": "¿Quién te ha traído?", "an": "jn-m: pronombre interrogativo «¿quién?». jn: participio («el que trajo»). tw: «te».", "id": "11.19"}, {"t": "tt", "g": "𓊪𓆑𓄿 𓈝𓅓𓂻 𓎛𓈖𓂝 𓆑 𓂜𓈖 𓇓𓏲 𓃹𓈖", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "vo": [["pfꜣ", "aquel"], ["wn", "existir"]], "tr": "pfꜣ šm ḥnꜥ.f nn sw wn", "es": "Aquel con quien se iba ya no existe.", "an": "nn sw wn: oración negativa de existencia (nn + pronombre dependiente + participio wn).", "id": "11.20"}]}]}, "12": {"intro": "Oraciones subordinadas no verbales: relativas con ntj y jwtj, y oraciones circunstanciales sin verbo.", "secs": [{"id": "A", "title": "Translitera y traduce", "items": [{"t": "tt", "ref": "Fórmula autobiográfica del Imperio Antiguo y del Primer Período Intermedio", "vo": [["ḏꜣ.n.j", "crucé, transporté"], ["jwtj", "el que no tiene"], ["mḫnt", "barca"]], "tr": "ḏꜣ.n.j jwtj mḫnt.f", "es": "Transporté al que no tenía barca.", "an": "jwtj: relativo negativo «el que no…». jwtj mḫnt.f: «el que no tiene su barca».", "id": "12.1", "g": "𓍑𓄿𓇋𓇋𓊛𓈖𓀀 𓇋𓅱𓏏𓏭 𓅓𓐍𓈖𓏏𓊛𓆑"}, {"t": "tt", "ref": "El campesino elocuente B1, 64", "vo": [["šnḏyt", "faldellín, delantal"]], "tr": "šnḏyt nt jwtj mwt.f", "es": "delantal del que no tiene madre", "an": "nt: genitivo femenino. jwtj mwt.f «el que no tiene madre». El campesino halaga así a Rensi: lo protege todo.", "id": "12.2", "g": "𓈙𓈖𓆓𓇋𓇋𓏏𓋳 𓈖𓏏 𓇋𓅱𓏏𓏭 𓅐𓏏𓁐𓆑"}, {"t": "tt", "ref": "Libro de los Muertos, cap. 125 (introducción)", "vo": [["rḫ.kw", "conozco (estativo)"], ["ntjw", "que están"], ["wsḫt", "sala"], ["mꜣꜥtj", "las Dos Verdades"]], "tr": "rḫ.kw rn n nṯrw 42 ntjw ḥnꜥ.k m wsḫt tn nt mꜣꜥtj", "es": "Conozco el nombre de los 42 dioses que están contigo en esta sala de las Dos Verdades.", "an": "ntjw: relativo plural; su predicado es adverbial (ḥnꜥ.k m wsḫt…). tn: demostrativo femenino.", "id": "12.3", "g": "𓂋𓐍𓏛𓎡𓅱 𓂋𓈖 𓈖 𓊹𓊹𓊹 𓎆𓎆𓎆𓎆𓏤𓏤 𓈖𓏏𓅱𓏥 𓎛𓈖𓂝𓎡 𓅓 𓅱𓋴𓐍𓏏𓉐 𓏏𓈖 𓈖𓏏 𓐙𓏏𓆄𓆄"}]}, {"id": "B", "title": "Análisis", "items": [{"t": "mc", "q": "¿Qué concuerda con su antecedente: ntj o jwtj?", "op": ["Los dos: ntj, ntt, ntjw / jwtj, jwtt, jwtjw", "Solo ntj", "Solo jwtj", "Ninguno"], "ok": 0, "an": "Ambos son adjetivos relativos y concuerdan en género y número con el antecedente.", "id": "12.4"}, {"t": "mc", "q": "En una oración circunstancial sin jw, como tꜣ m kkw tras ḥtp.k m ꜣḫt jmntt (Gran Himno a Atón), ¿cómo se reconoce que es circunstancial?", "op": ["Va tras una oración principal sin conjunción y describe la situación que la acompaña", "Porque empieza por jw", "Porque tiene un verbo en perfecto", "Porque está en plural"], "ok": 0, "an": "Las oraciones circunstanciales no necesitan marca: se reconocen por su posición tras la principal y por su sentido («mientras…, estando…»).", "id": "12.5"}]}, {"id": "C", "title": "Más textos reales", "items": [{"t": "tt", "ref": "Papiros de Kahun 17,13 (cuentas)", "vo": [["ḏꜣt", "saldo, resto"], ["ꜥḥꜥ", "quedar pendiente"]], "tr": "ḏꜣt ntt ꜥḥꜥ", "es": "el saldo que queda pendiente", "an": "ntt: relativo femenino (concuerda con ḏꜣt), seguido de un verbo.", "id": "12.6", "g": "𓆓𓄿𓏏 𓈖𓏏𓏏 𓊢𓂝"}, {"t": "tt", "ref": "Sinuhé B 26–27", "vo": [["sjꜣ", "reconocer"], ["mtn", "jeque"], ["ntj m kmt", "que había estado en Egipto"]], "tr": "sjꜣ wj mtn jm.sn ntj m kmt|sjꜣ wj mtn jm.sn ntj m kmt", "es": "Me reconoció un jeque de entre ellos que había estado en Egipto.", "an": "ntj m kmt: relativa con ntj y predicado adverbial (m kmt). wj, pronombre dependiente, es el objeto de sjꜣ.", "id": "12.7", "g": "𓋴𓇋𓄿𓁹 𓅱𓀀 𓅓𓏏𓈖𓀀 𓇋𓅓𓋴𓈖𓏥 𓈖𓏏𓏭 𓅓 𓆎𓏏𓊖"}, {"t": "tt", "g": "𓂧𓂋𓀜 𓎃𓏲𓏛𓏥 𓅓 𓂜𓏏𓏭𓅪 𓎃𓏲𓏛𓏥 𓆑", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "vo": [["dr", "expulsar"], ["zꜣw", "protección"]], "tr": "dr zꜣw m jwtj zꜣw.f|dr zꜣw m jwtw zꜣw.f|dr sꜣw m jwtj sꜣw.f|dr zꜣ m jwtj zꜣ.f", "es": "Quien expulsa la protección es alguien sin protección.", "an": "dr: participio («el que expulsa»). m de predicación. jwtj zꜣw.f: nisbe negativa jwtj, «uno cuya protección no existe».", "id": "12.8"}, {"t": "tt", "ref": "Sinuhé R 11–13", "vo": [["jst r.f", "ahora bien, entretanto"], ["zb", "enviar"], ["ṯmḥjw", "libios"], ["ḥrj jrj", "el que está al frente de él"]], "tr": "jst r.f zb.n ḥm.f mšꜥ r tꜣ ṯmḥjw zꜣ.f smsw m ḥrj jrj|jst r.f zb.n ḥm.f mšꜥ r tꜣ ṯmḥw zꜣ.f smsw m ḥrj jrj", "es": "Entretanto, Su Majestad había enviado un ejército a la tierra de los libios, con su hijo mayor al frente.", "an": "jst r.f introduce una circunstancia de fondo. zb.n ḥm.f: sḏm.n.f. zꜣ.f smsw m ḥrj jrj: oración adverbial con m de predicación, «su hijo mayor (estaba) como el que está sobre él».", "id": "12.9", "g": "𓇋𓋴𓏏 𓂋𓆑 𓊄𓂻𓈖 𓍛𓆑 𓀎𓏥 𓂋 𓇾 𓍿𓅓𓎛𓅱𓌙𓏥 𓅭𓆑 𓋴𓅓𓋴𓅱𓀙 𓅓 𓁷𓂋𓀀 𓁹𓂋𓏭"}, {"t": "tt", "g": "𓇋𓏲 𓀀 𓇓𓏲𓏏 𓂋𓐍𓏛𓎢𓏲𓀀 𓃀𓏲 𓈖𓏏𓏭 𓋴𓏏 𓇋𓅓", "ref": "Papiro Westcar (Dyedi y la cámara de Thot)", "vo": [["bw", "lugar"], ["swt", "pero"]], "tr": "jw.j swt rḫ.kw bw ntj st jm", "es": "Pero yo conozco el lugar donde está.", "an": "bw ntj st jm: «el lugar que ello (está) allí»: relativa con ntj y pronombre de retorno jm.", "id": "12.10"}, {"t": "tt", "g": "𓈖𓏏𓅂𓏥 𓇋𓅓 𓋴 𓂜 𓊃𓊪𓊗 𓌡𓏲𓂝𓀀𓏤 𓇋𓅓", "ref": "El náufrago (el naufragio)", "vo": [["spj", "quedar, sobrar"]], "tr": "ntjw jm.s n sp wꜥ jm", "es": "De los que estaban en él no quedó ni uno.", "an": "ntjw jm.s: relativa sustantivada («los que estaban en él»). n sp: «no quedó» (n + sḏm.f de spj).", "id": "12.11"}, {"t": "tt", "g": "𓇥𓂋𓈖𓏏𓏏 𓄔𓅓 𓈖𓅘𓎛𓋴𓀏 𓂋 𓐍𓂋𓀒 𓈖 𓂋", "ref": "Estela de Semna de Senuseret III (Berlín 1157)", "vo": [["nḥsj", "nubio"], ["ḫr", "caer"]], "tr": "ḏr-ntt sḏm nḥsj r ḫr n r", "es": "Porque el nubio obedece en cuanto la boca habla.", "an": "ḏr-ntt introduce una oración sustantiva («porque»). ḫr n r: «la caída de la boca».", "id": "12.12"}, {"t": "tt", "g": "𓅓 𓋴𓎛𓆓𓈖𓏌𓅱𓅪 𓄣𓏤 𓈖 𓈖𓏏𓏭 𓄿𓏏𓊪𓅱𓀋𓂝", "ref": "Enseñanza de Ptahhotep", "vo": [["sḥḏn", "irritar"], ["ꜣtp", "estar cargado, atareado"]], "tr": "m sḥḏn jb n ntj ꜣtp", "es": "No irrites el corazón del que está atareado.", "an": "ntj ꜣtp: relativa con ntj + estativo.", "id": "12.13"}, {"t": "tt", "g": "𓅓 𓇋𓂝𓈗 𓄣𓏤 𓈖 𓈖𓏏𓏭 𓐍𓏏𓆑 𓎢", "ref": "Enseñanza de Ptahhotep", "vo": [["jꜥ jb", "complacer (lit. lavar el corazón)"], ["ḫft", "frente a, contra"]], "tr": "m jꜥ jb n ntj ḫft.k", "es": "No complazcas (literalmente «laves el corazón») a quien está contra ti.", "an": "ntj ḫft.k: relativa con ntj y predicado preposicional.", "id": "12.14"}, {"t": "tt", "g": "𓅓 𓏏𓍯𓄿𓀁 𓈖 𓂜𓏏𓅱𓅪 𓄟𓋴𓅱𓁓𓀀𓁐𓏥 𓆑", "ref": "Corpus del TLA, Reino Medio (dinastía XII)", "vo": [["twꜣ", "despreciar"], ["msw", "hijos"]], "tr": "m twꜣ n jwtw msw.f|m twꜣ n jwtj msw.f", "es": "No desprecies a quien no tiene hijos.", "an": "jwtw msw.f: nisbe negativa jwtj, «aquel cuyos hijos no existen».", "id": "12.15"}]}, {"id": "D", "title": "Ahmose hijo de Abana (Urk. IV)", "items": [{"t": "tr", "ref": "Autobiografía de Ahmose hijo de Abana, l. 6 (Urk. IV 1–11)", "vo": [["šrj", "muchacho"], ["sḏr", "dormir"], ["šnw", "red"]], "tr": "jw.j m šrj n jrt.j ḥmt jw sḏr.j m smt šnw", "es": "Yo era un muchacho, no había tomado esposa, y dormía en una red (hamaca).", "an": "Dos oraciones circunstanciales con jw. n jrt.j ḥmt: «antes de que tomara esposa» (n sḏmt.f).", "id": "12.16"}, {"t": "tr", "ref": "Autobiografía de Ahmose hijo de Abana, l. 26 (Urk. IV 1–11)", "vo": [["tp", "cabeza"], ["wn-mꜣꜥ", "verdad"]], "tr": "jst wj m tp n mšꜥ.n jw ꜥḥꜣ.n.j r wn-mꜣꜥ mꜣ.n ḥm.f qnt.j", "es": "Yo estaba a la cabeza de nuestro ejército y combatí de verdad; su Majestad vio mi valentía.", "an": "jst + pronombre dependiente + predicado adverbial: circunstancial. r wn-mꜣꜥ: «de verdad».", "id": "12.17"}]}]}, "13": {"intro": "El verbo: clases de raíces. Los verbos están tomados de los textos de los t
