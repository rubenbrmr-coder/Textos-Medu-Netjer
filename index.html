l sufijo -tw (sḏm.tw.f)", "La -n del perfecto", "La geminación", "La partícula jn"], "ok": 0, "an": "-tw puede añadirse a varias formas: sḏm.tw.f, sḏm.n.tw.f. Existe además un pasivo sḏm.f sin marca.", "id": "21.3"}, {"t": "mc", "q": "¿Qué expresa el prospectivo sḏm(w).f?", "op": ["Una acción futura o esperada: «oirá, que oiga»", "Una acción habitual", "Una acción pasada", "Un estado"], "ok": 0, "an": "El prospectivo mira hacia delante; en los verbos débiles puede llevar -w o -y.", "id": "21.4"}]}]}, "22": {"intro": "Las demás formas de la conjugación: sḏm.jn.f, sḏm.ḫr.f, sḏm.kꜣ.f y el participio prospectivo sḏmtj.fj.", "secs": [{"id": "A", "title": "Translitera y traduce", "items": [{"t": "tt", "ref": "Papiro Edwin Smith, comienzo de cada caso (passim)", "vo": [["ḫꜣj", "examinar"], ["ḏd.ḫr.k", "dirás (entonces)"]], "tr": "jr ḫꜣj.k zj ḏd.ḫr.k r.f|jr ḫꜣ.k zj ḏd.ḫr.k r.f|jr ḫꜣj.k sj ḏd.ḫr.k r.f", "es": "Si examinas a un hombre (con tal herida), entonces dirás acerca de él…", "an": "jr + sḏm.f: condición. sḏm.ḫr.f: consecuencia necesaria o habitual: «entonces dirás».", "id": "22.1", "g": "𓇋𓂋 𓆼𓄿𓇋𓇋𓏛𓎡 𓊃𓇋𓀀 𓆓𓂧𓐍𓂋𓎡 𓂋𓆑"}, {"t": "tt", "ref": "Estela de Semna de Senuseret III (Berlín 1157)", "vo": [["grt", "además, ahora bien"], ["srwḏ.tj.fj", "que mantenga (participio prospectivo)"], ["tꜣš", "frontera"], ["jrj.n", "que ha hecho (forma relativa)"]], "tr": "jr grt zꜣ.j nb srwḏ.tj.fj tꜣš pn jrj.n ḥm.j zꜣ.j pw|jr grt sꜣ.j nb srwḏ.tj.fj tꜣš pn jrj.n ḥm.j sꜣ.j pw", "es": "En cuanto a todo hijo mío que mantenga esta frontera que ha hecho Mi Majestad, ése es mi hijo.", "an": "srwḏ.tj.fj: sḏmtj.fj, participio prospectivo («que mantendrá»). jr … introduce el tema; zꜣ.j pw es la oración principal.", "id": "22.2", "g": "𓇋𓂋 𓎼𓂋𓏏 𓅭𓀀 𓎟 𓋴𓂋𓅱𓆓𓂡𓏏𓏭𓆑𓏭 𓏏𓄿𓈙𓈇 𓊪𓈖 𓁹𓂋𓈖 𓍛𓀀 𓅭𓀀 𓊪𓅱"}, {"t": "tt", "ref": "Estela de Semna de Senuseret III (Berlín 1157)", "vo": [["fḫ.tj.fj", "quien la pierda"], ["n … js", "no (negación de oración nominal)"]], "tr": "jr grt fḫ.tj.fj sw n zꜣ.j js n ms.tw.f n.j js|jr grt fḫ.tj.fj sw n sꜣ.j js n ms.tw.f n.j js", "es": "Pero quien la pierda no es mi hijo, no ha nacido de mí.", "an": "Otro sḏmtj.fj, con sw como objeto (la frontera, tꜣš, es masculino). n zꜣ.j js: oración nominal negada con n … js (tema 11).", "id": "22.3", "g": "𓇋𓂋 𓎼𓂋𓏏 𓆑𓐍𓏏𓏭𓆑𓏭 𓇓𓅱 𓂜 𓅭𓀀 𓇋𓋴 𓂜 𓄟𓋴𓏏𓅱𓆑 𓈖𓀀 𓇋𓋴"}]}, {"id": "B", "title": "Análisis", "items": [{"t": "mc", "q": "¿Qué indica la forma sḏm.ḫr.f en los textos médicos y legales?", "op": ["Una consecuencia necesaria o la acción que corresponde hacer: «entonces harás»", "Una acción pasada", "Un deseo", "Una pregunta"], "ok": 0, "an": "Es la forma de las instrucciones: «si ocurre X, entonces harás Y».", "id": "22.4"}, {"t": "mc", "q": "¿En qué se diferencian ꜥḥꜥ.n sḏm.n.f y sḏm.jn.f?", "op": ["Ambas narran acciones sucesivas en el pasado; sḏm.jn.f es una forma conjugada del propio verbo", "ꜥḥꜥ.n es futuro", "sḏm.jn.f es negativa", "Son formas pasivas"], "ok": 0, "an": "ꜥḥꜥ.n y la forma sḏm.jn.f («entonces oyó») hacen avanzar la narración.", "id": "22.5"}]}]}, "23": {"intro": "Los participios: «el que hace», «el hecho». Muy frecuentes en epítetos, himnos y autobiografías.", "secs": [{"id": "A", "title": "Translitera y traduce", "items": [{"t": "tt", "ref": "Llamada a los vivos (estelas del Reino Medio)", "vo": [["mrrw", "que aman"], ["msḏḏw", "que odian"], ["ḫpt", "muerte (literalmente «el ir»)"]], "tr": "j ꜥnḫw tpjw tꜣ mrrw ꜥnḫ msḏḏw ḫpt", "es": "¡Oh vivos que estáis sobre la tierra, que amáis la vida y odiáis la muerte!", "an": "mrrw y msḏḏw: participios imperfectivos plurales (geminados) que califican a ꜥnḫw.", "id": "23.1", "g": "𓇋𓀁 𓋹𓈖𓐍𓅱𓀀𓏥 𓁶𓊪𓅱𓏭𓏥 𓇾𓏤 𓌻𓂋𓂋𓅱𓀀𓏥 𓋹𓈖𓐍 𓅓𓋴𓆓𓆓𓅱𓅪 𓐍𓊪𓏏𓀐"}, {"t": "tt", "ref": "Himno a Hapy, comienzo", "vo": [["pr", "que sale"], ["jj", "que viene"], ["sꜥnḫ", "hacer vivir"]], "tr": "jnḏ ḥr.k ḥꜥpj pr m tꜣ jj r sꜥnḫ kmt|jnḏ-ḥr.k ḥꜥpj pr m tꜣ jj r sꜥnḫ kmt", "es": "¡Salve a ti, Hapy, que sales de la tierra y vienes para hacer vivir a Egipto!", "an": "pr y jj: participios perfectivos. r + infinitivo (sꜥnḫ): finalidad.", "id": "23.2", "g": "𓇋𓈖𓂧 𓎛𓁷𓏤𓎡 𓎛𓂝𓊪𓇋𓈗 𓉐𓂋𓂻 𓅓 𓇾𓏤 𓇍𓇋𓂻 𓂋 𓋴𓋹𓈖𓐍 𓆎𓏏𓊖"}, {"t": "tt", "ref": "Fórmula de ofrenda (estelas del Reino Medio)", "vo": [["ꜥnḫt", "de la que vive"]], "tr": "ḫt nbt nfrt wꜥbt ꜥnḫt nṯr jm", "es": "toda cosa buena y pura de la que vive un dios", "an": "ꜥnḫt: participio femenino que concuerda con ḫt; su sujeto propio es nṯr y jm remite a ḫt («de ella»).", "id": "23.3", "g": "𓐍𓏏 𓎟𓏏 𓄤𓏏 𓃂𓏏 𓋹𓈖𓐍𓏏 𓊹 𓇋𓅓"}, {"t": "tt", "ref": "Epíteto de Ajenatón en Amarna", "tr": "ꜥnḫ m mꜣꜥt", "es": "el que vive de Maat", "an": "Participio + complemento preposicional.", "id": "23.4", "g": "𓋹𓈖𓐍 𓅓 𓆄𓏏"}, {"t": "tt", "ref": "Epíteto dentro del cartucho de Ramsés II y otros reyes", "tr": "mrj-jmn|mrj jmn", "es": "amado de Amón", "an": "mrj: participio pasivo «amado». Amón se escribe delante por anteposición honorífica.", "id": "23.5", "g": "𓇋𓏠𓈖 𓌻𓂋𓇋"}]}]}, "24": {"intro": "Las formas relativas: «lo que él hizo», «que da el cielo». Muy frecuentes en fórmulas de ofrenda y autobiografías.", "secs": [{"id": "A", "title": "Translitera y traduce", "items": [{"t": "tt", "ref": "Fórmula autobiográfica frecuente (estelas del Reino Medio)", "vo": [["mrrt", "lo que ama"], ["ḥzzt", "lo que alaba"]], "tr": "jr.n.j mrrt rmṯ ḥzzt nṯrw", "es": "Hice lo que la gente ama y lo que los dioses alaban.", "an": "mrrt y ḥzzt: formas relativas imperfectivas en femenino (sentido neutro: «lo que»), con sujeto propio rmṯ y nṯrw.", "id": "24.1", "g": "𓁹𓈖𓀀 𓌻𓂋𓂋𓏏 𓂋𓅓𓍿𓀀𓁐𓏥 𓎿𓋴𓋴𓏏 𓊹𓊹𓊹"}, {"t": "tt", "ref": "Fórmula de ofrenda (estelas del Reino Medio)", "vo": [["dd", "que da"], ["qmꜣ", "que crea"], ["jnn", "que trae"]], "tr": "ḫt nbt nfrt wꜥbt dd pt qmꜣ tꜣ jnn ḥꜥpj", "es": "toda cosa buena y pura que da el cielo, que crea la tierra y que trae la crecida", "an": "dd, qmꜣ, jnn: formas relativas cuyo antecedente es ḫt. Sus sujetos son pt, tꜣ y ḥꜥpj.", "id": "24.2", "g": "𓐍𓏏 𓎟𓏏 𓄤𓏏 𓃂𓏏 𓂞𓂧 𓊪𓏏𓇯 𓈎𓅓𓄿𓌙 𓇾𓏤 𓏎𓈖𓈖 𓎛𓂝𓊪𓇋𓈗"}, {"t": "tt", "ref": "Fórmula autobiográfica de estelas del Reino Medio", "vo": [["wḥm", "repetir"]], "tr": "ḏd nfrt wḥm mrrt|jnk ḏd nfrt wḥm mrrt", "es": "el que decía lo bueno y repetía lo que se ama", "an": "ḏd y wḥm: participios. mrrt: forma relativa sustantivada («lo que (la gente) ama»).", "id": "24.3", "g": "𓆓𓂧 𓄤𓏏 𓄙𓅓 𓌻𓂋𓂋𓏏"}]}, {"id": "B", "title": "Análisis", "items": [{"t": "mc", "q": "¿En qué se diferencia una forma relativa de un participio?", "op": ["La forma relativa tiene su propio sujeto, distinto del antecedente: «lo que la gente ama»", "El participio siempre es pasivo", "La forma relativa no concuerda", "No hay diferencia"], "ok": 0, "an": "En el participio el antecedente es el sujeto («el que ama»). En la forma relativa el antecedente es otro elemento, normalmente el objeto («lo que ama X»).", "id": "24.4"}]}]}, "25": {"intro": "Usos especiales de las formas relativas: oraciones sustantivas y oraciones enfáticas que ponen de relieve un complemento.", "secs": [{"id": "A", "title": "Análisis de frases reales", "items": [{"t": "mc", "ref": "Fórmula autobiográfica (tema 24): jr.n.j mrrt rmṯ «hice lo que la gente ama»", "q": "En jr.n.j mrrt rmṯ, ¿qué función cumple la forma relativa mrrt rmṯ?", "op": ["Es un sustantivo: el objeto de jr.n.j («lo que la gente ama»)", "Es un adjetivo que califica a un sustantivo anterior", "Es el predicado de una oración nominal", "Es una oración circunstancial"], "ok": 0, "an": "La forma relativa sin antecedente funciona como sustantivo (uso no atributivo): aquí es el complemento directo.", "id": "25.1", "g": "𓁹𓈖𓀀 𓌻𓂋𓂋𓏏 𓂋𓅓𓍿𓀀𓁐𓏥"}, {"t": "mc", "ref": "Estela de Semna (tema 7): kꜣꜣt jb.j pw ḫprt m ꜥ.j", "q": "¿Qué es kꜣꜣt jb.j en esta oración?", "op": ["Una forma relativa sustantivada que funciona como sujeto de A pw B", "Un infinitivo", "Un participio activo concertado", "Un imperativo"], "ok": 0, "an": "«Lo que planea mi corazón» es una forma relativa usada como sustantivo; ḫprt m ꜥ.j es un participio sustantivado («lo que sucede por mi mano»).", "id": "25.2", "g": "𓂓𓄿𓄿𓏏𓀁 𓄣𓏤𓀀 𓊪𓅱 𓆣𓂋𓏏 𓅓 𓂝𓀀"}, {"t": "mc", "ref": "Fórmula de ofrenda (tema 24): ḫt nbt nfrt wꜥbt dd pt", "q": "En ḫt nbt nfrt wꜥbt dd pt, ¿el uso de la forma relativa dd es atributivo o no atributivo?", "op": ["Atributivo: califica a ḫt («que da el cielo»)", "No atributivo: es una oración enfática", "No atributivo: es el sujeto", "No es una forma relativa"], "ok": 0, "an": "Tiene antecedente (ḫt) y lo califica: es el uso normal, atributivo. Los usos especiales del tema 25 son los que no tienen antecedente.", "id": "25.3", "g": "𓐍𓏏 𓎟𓏏 𓄤𓏏 𓃂𓏏 𓂞𓂧 𓊪𓏏𓇯"}]}, {"id": "B", "title": "Teoría", "items": [{"t": "mc", "q": "¿Qué caracteriza a una oración enfática (forma relativa no atributiva)?", "op": ["El verbo pasa a ser el tema y la información nueva está en un complemento adverbial", "Siempre empieza por jw", "No tiene sujeto", "Es una pregunta"], "ok": 0, "an": "En mrr.f sw m ḥrw «es en la cara donde lo ama», lo que importa es m ḥrw, no el hecho de amar.", "id": "25.4"}]}]}, "26": {"intro": "Pasajes más largos para reunir todo lo aprendido. Translitera y traduce cada pasaje completo; las soluciones analizan las construcciones principales.", "secs": [{"id": "A", "title": "Lecturas", "items": [{"t": "tt", "ref": "Fórmulas autobiográficas de tumbas y estelas (Imperio Antiguo – Reino Medio), reunidas en un solo pasaje", "vo": [["ḥqr", "hambriento"], ["ḥbs", "ropa"], ["ḥꜣy", "desnudo"], ["ḏꜣ", "transportar"], ["mḫnt", "barca"], ["mrrt", "lo que ama"], ["ḥzzt", "lo que alaba"]], "tr": "rdj.n.j tꜣ n ḥqr ḥbs n ḥꜣy ḏꜣ.n.j jwtj mḫnt.f jr.n.j mrrt rmṯ ḥzzt nṯrw|rdj.n.j tꜣ n ḥqr ḥbsw n ḥꜣy ḏꜣ.n.j jwtj mḫnt.f jr.n.j mrrt rmṯ ḥzzt nṯrw", "es": "Di pan al hambriento y ropa al desnudo; transporté al que no tenía barca; hice lo que la gente ama y lo que los dioses alaban.", "an": "Perfectos (tema 18), preposición n (tema 8), jwtj (tema 12) y formas relativas sustantivadas (temas 24 y 25).", "id": "26.1", "g": "𓂋𓂞𓈖𓀀 𓏏𓄿𓏐 𓈖 𓎛𓈎𓂋𓀁 𓎛𓃀𓋴𓋳 𓈖 𓎛𓄿𓇋𓇋𓀀 𓍑𓄿𓇋𓇋𓊛𓈖𓀀 𓇋𓅱𓏏𓏭 𓅓𓐍𓈖𓏏𓊛𓆑 𓁹𓈖𓀀 𓌻𓂋𓂋𓏏 𓂋𓅓𓍿𓀀𓁐𓏥 𓎿𓋴𓋴𓏏 𓊹𓊹𓊹"}, {"t": "tt", "ref": "Libro de los Muertos, cap. 30B", "vo": [["ḥꜣtj", "corazón (otra palabra)"], ["ḫprw", "formas, transformaciones"], ["mtrw", "testigo"], ["ḏꜣḏꜣt", "tribunal"]], "tr": "jb.j n mwt.j jb.j n mwt.j ḥꜣtj.j n ḫprw.j m ꜥḥꜥ r.j m mtrw m ḫsf r.j m ḏꜣḏꜣt", "es": "¡Mi corazón de mi madre, mi corazón de mi madre, mi corazón de mis transformaciones! ¡No te levantes contra mí como testigo, no te opongas a mí en el tribunal!", "an": "Vocativos (tema 16) e imperativos negativos con m (tema 16). Se inscribía en el escarabeo de corazón.", "id": "26.2", "g": "𓄣𓏤𓀀 𓈖 𓅐𓏏𓁐𓀀 𓄣𓏤𓀀 𓈖 𓅐𓏏𓁐𓀀 𓄂𓏏𓏭𓄣𓀀 𓈖 𓆣𓂋𓅱𓏥𓀀 𓅓𓂝 𓊢𓂝𓂻 𓂋𓀀 𓅓 𓅓𓏏𓂋𓅱𓀀𓏥 𓅓𓂝 𓐍𓋴𓆑𓂡 𓂋𓀀 𓅓 𓆓𓄿𓆓𓄿𓏏𓉐"}, {"t": "tt", "ref": "Llamada a los vivos (estelas del Reino Medio)", "vo": [["mrrw", "que aman"], ["msḏḏw", "que odian"], ["ḫpt", "muerte"], ["ḏd.ṯn", "que digáis"], ["jmꜣḫy", "venerado"]], "tr": "j ꜥnḫw tpjw tꜣ mrrw ꜥnḫ msḏḏw ḫpt ḏd.ṯn ḫꜣ m t ḥnqt ḫꜣ m kꜣ ꜣpd n kꜣ n jmꜣḫy", "es": "¡Oh vivos que estáis sobre la tierra, que amáis la vida y odiáis la muerte: decid «mil de pan y cerveza, mil de bueyes y aves para el ka del venerado»!", "an": "Vocativo con participios (temas 16 y 23) y subjuntivo de petición ḏd.ṯn (tema 19).", "id": "26.3", "g": "𓇋𓀁 𓋹𓈖𓐍𓅱𓀀𓏥 𓁶𓊪𓅱𓏭𓏥 𓇾𓏤 𓌻𓂋𓂋𓅱𓀀𓏥 𓋹𓈖𓐍 𓅓𓋴𓆓𓆓𓅱𓅪 𓐍𓊪𓏏𓀐 𓆓𓂧𓍿𓈖𓏥 𓆼 𓅓 𓏐 𓏊 𓆼 𓅓 𓃾 𓅾 𓈖 𓂓𓏤 𓈖 𓄪𓇋𓇋"}, {"t": "tt", "ref": "Estela de Semna de Senuseret III (Berlín 1157), final", "vo": [["grt", "además"], ["srwḏ.tj.fj", "que mantenga"], ["tꜣš", "frontera"], ["fḫ.tj.fj", "quien la pierda"]], "tr": "jr grt zꜣ.j nb srwḏ.tj.fj tꜣš pn jrj.n ḥm.j zꜣ.j pw jr grt fḫ.tj.fj sw n zꜣ.j js n ms.tw.f n.j js|jr grt sꜣ.j nb srwḏ.tj.fj tꜣš pn jrj.n ḥm.j sꜣ.j pw jr grt fḫ.tj.fj sw n sꜣ.j js n ms.tw.f n.j js", "es": "En cuanto a todo hijo mío que mantenga esta frontera que ha hecho Mi Majestad, ése es mi hijo. Pero quien la pierda no es mi hijo, no ha nacido de mí.", "an": "sḏmtj.fj (tema 22), forma relativa jrj.n (tema 24), oración nominal con pw (tema 7), negación n … js (tema 11) y pasivo ms.tw.f (tema 21).", "id": "26.4", "g": "𓇋𓂋 𓎼𓂋𓏏 𓅭𓀀 𓎟 𓋴𓂋𓅱𓆓𓂡𓏏𓏭𓆑𓏭 𓏏𓄿𓈙𓈇 𓊪𓈖 𓁹𓂋𓈖 𓍛𓀀 𓅭𓀀 𓊪𓅱 𓇋𓂋 𓎼𓂋𓏏 𓆑𓐍𓏏𓏭𓆑𓏭 𓇓𓅱 𓂜 𓅭𓀀 𓇋𓋴 𓂜 𓄟𓋴𓏏𓅱𓆑 𓈖𓀀 𓇋𓋴"}, {"t": "tt <script>
/* ================= Medu Netjer · Textos reales ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const H=s=>`<span class="hg">${esc(s)}</span>`;
const T=s=>`<span class="tr">${esc(s)}</span>`;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1700)}
const MDC={A:'ꜣ',a:'ꜥ',i:'j',H:'ḥ',x:'ḫ',X:'ẖ',S:'š',T:'ṯ',D:'ḏ',z:'s',Z:'s'};
function canon(s,mdc){s=(s||'').normalize('NFC');let o='';for(const ch of s){if(mdc&&MDC[ch]){o+=MDC[ch];continue}const l=ch.toLowerCase();if(l==='z'){o+='s';continue}if(l==='i'||l==='ꞽ'){o+='j';continue}if(/[a-zꜣꜥḥḫẖšṯḏ0-9]/.test(l))o+=l}return o}
function foldTr(s){return s.replace(/[ꜣꜥ]/g,'a').replace(/[ḥḫẖ]/g,'h').replace(/š/g,'s').replace(/ṯ/g,'t').replace(/ḏ/g,'d').replace(/q/g,'k').replace(/y/g,'j').replace(/u/g,'w').replace(/[eo]/g,'')}
function digraphs(s){return s.toLowerCase().replace(/sh/g,'š').replace(/kh/g,'ḫ').replace(/dj/g,'ḏ').replace(/tch|ch/g,'ṯ')}
/* 2 = exacta, 1 = correcta sin diacríticos, 0 = incorrecta */
function trScore(a,sol){
 const alts=sol.split('|');let best=0;
 for(const b of alts){
  const e=canon(b,false);const c=[canon(a,ST.mdc),canon(a,false)];
  if(c.includes(e))return 2;
  const f=foldTr(e);if([...c,canon(digraphs(a),false)].some(x=>x&&foldTr(x)===f))best=1;
 }
 return best;
}
const dayNum=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5);
/* ================= estado ================= */
const LSK='mnej.textos.v1';
let ST={mdc:true,theme:'',r:{},last:null};
try{const s=JSON.parse(localStorage.getItem(LSK)||'null');if(s)Object.assign(ST,s)}catch(e){}
let DOC=null,saveT=null;
function save(){
 try{localStorage.setItem(LSK,JSON.stringify(ST))}catch(e){}
 clearTimeout(saveT);saveT=setTimeout(async()=>{if(DOC){try{await DOC.set({json:JSON.stringify(ST),updated:Date.now()})}catch(e){}}},1200);
}
async function initDB(){
 try{
  if(!window.claude||!claude.use)return;
  const db=await claude.use('db'),user=await claude.use('user');if(!db||!user)return;
  const id=await user.id();if(!id)return;
  DOC=db.doc('data/users/'+id+'/textos/estado');
  const snap=await DOC.get();const d=snap&&(typeof snap.data==='function'?snap.data():snap);
  if(d&&d.json){
   const r=JSON.parse(d.json);
   if(Object.keys(r.r||{}).length>Object.keys(ST.r).length){ST=Object.assign(ST,r);try{localStorage.setItem(LSK,JSON.stringify(ST))}catch(e){};applyTheme();route()}
   else save();
  }else save();
 }catch(e){}
}
function applyTheme(){document.documentElement.dataset.theme=ST.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
function toggleTheme(){ST.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';applyTheme();save()}
/* ================= datos ================= */
const ITEMS={};
for(const n in DATA)for(const s of DATA[n].secs)for(const it of s.items){it.les=+n;it.sec=s.id;ITEMS[it.id]=it}
const lesItems=n=>DATA[n]?DATA[n].secs.flatMap(s=>s.items):[];
const IV=[0,1,3,7,16,35,80];
function rate(id,q){ /* q: 0 mal, 1 casi, 2 bien */
 const r=ST.r[id]||{lv:0,n:0,ok:0};r.n++;
 if(q===2){r.lv=Math.min(r.lv+1,IV.length-1);r.ok++}else if(q===1){r.lv=Math.max(1,Math.min(r.lv,1))}else r.lv=0;
 r.q=q;r.due=dayNum()+(q===0?0:IV[r.lv]||1);ST.r[id]=r;save();
}
function lesProg(n){const it=lesItems(n);if(!it.length)return null;const done=it.filter(x=>ST.r[x.id]).length,good=it.filter(x=>ST.r[x.id]&&ST.r[x.id].q===2).length;return{tot:it.length,done,good}}
const dueList=()=>Object.keys(ST.r).filter(id=>ITEMS[id]&&ST.r[id].due<=dayNum());
/* ================= navegación ================= */
const VIEWS={home:viewHome,tema:viewTema,ej:viewEj,repaso:viewRepaso,info:viewInfo,ajustes:viewAjustes};
function go(h){location.hash=h}
function route(){
 const [v,a,b]=(location.hash.slice(1)||'home').split('/');
 (VIEWS[v]||viewHome)(a,b);
 document.querySelectorAll('[data-nav]').forEach(e=>e.classList.toggle('on',e.dataset.nav===(v==='tema'||v==='ej'?'home':v)));
 const n=dueList().length;document.querySelectorAll('.duec').forEach(e=>e.textContent=n?` (${n})`:'');

}
window.addEventListener('hashchange',route);
function render(h){$('#main').innerHTML=`<div class="wrap">${h}</div>`}
/* ================= vistas ================= */
function viewHome(){
 let h=`<div class="hero">${H('𓂋𓈖𓏏𓏭𓊹')}<div><h1>Textos reales</h1><p>Ejercicios de lectura sacados de inscripciones y papiros egipcios, ordenados por los 26 temas de Medu Netjer.</p></div></div>`;
 const nd=dueList().length;
 if(nd)h+=`<div class="card row" style="justify-content:space-between;margin-bottom:14px"><div><b>Tienes ${nd} ejercicio${nd>1?'s':''} para repasar hoy.</b><div class="small muted">Los que fallaste o marcaste como dudosos vuelven en el momento oportuno.</div></div><button class="btn gold" onclick="go('repaso')">Repasar</button></div>`;
 h+=`<div class="list">`;
 for(const L of TITLES){
  const p=lesProg(L.n);
  if(p){const pc=Math.round(100*p.good/p.tot);
   h+=`<a class="les" href="#tema/${L.n}"><div class="num">${L.n}</div><div style="flex:1;min-width:0"><div class="ti">${esc(L.title)}</div><div class="small muted">${p.tot} ejercicios · ${p.done} hechos · ${p.good} bien</div><div class="bar"><i style="width:${pc}%"></i></div></div></a>`;
  }else h+=`<div class="les off"><div class="num">${L.n}</div><div style="flex:1"><div class="ti">${esc(L.title)}</div><div class="small muted">En preparación</div></div></div>`;
 }
 render(h+`</div>`);
}
function viewTema(n){
 n=+n;const L=TITLES.find(x=>x.n===n),D=DATA[n];if(!D)return go('home');
 let h=`<p><a href="#home">← Temas</a></p><h2>Tema ${n}. ${esc(L.title)}</h2><p class="muted">${esc(D.intro)}</p>`;

 h+=`<div class="row" style="margin:10px 0 18px"><button class="btn gold" onclick="startRun(${n},'todo')">Hacer el tema completo</button><button class="btn ghost" onclick="startRun(${n},'pend')">Solo pendientes y fallados</button></div>`;
 for(const s of D.secs){
  h+=`<h3>${esc(s.id)}. ${esc(s.title)}</h3><div class="list" style="margin-bottom:16px">`;
  s.items.forEach((it,i)=>{

   const head=it.g?`<span class="hg exg${it.mir?' mir':''}">${esc(it.g)}</span>`:`<span>${esc(it.q||'')}</span>`;

  });
  h+=`</div>`;
 }
 render(h);
}
/* ---- recorrido ---- */

function startRun(n,mode){

 if(mode==='pend')ids=ids.filter(id=>!ST.r[id]||ST.r[id].q!==2);

 history.back();
}

 else top+=`<span class="small muted">Tema ${it.les} · ${esc(L.title)}</span>`;

  if(tv&&it.vo.some(v=>/[a-zꜣꜥḥḫẖšṯḏ]/i.test(v[0])))h+=`<button class="btn ghost sm" style="margin-top:6px" onclick="document.querySelectorAll('.vt').forEach(e=>e.classList.add('on'));this.remove()">Mostrar la transliteración de las pistas</button>`;
 }

  const ord=shuffle(it.op.map((o,i)=>i));
  h+=`<div class="opts">${ord.map(i=>`<button class="opt" data-i="${i}" onclick="ansMC('${id}',${i},this)">${esc(it.op[i])}</button>`).join('')}</div><div id="fb"></div>`;
 }else{
  h+=`<div style="text-align:left;margin-top:14px"><label class="small muted">Transliteración</label><input id="itr" class="inp trin" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="${ST.mdc?'p. ej. ḏd.f  o  Dd.f':'p. ej. ḏd.f'}">${kb()}`;
  if(it.t==='tt')h+=`<label class="small muted">Traducción</label><textarea id="ies" class="inp" placeholder="Tu traducción"></textarea>`;
  h+=`</div><div class="row" style="justify-content:center;margin-top:12px"><button class="btn" id="chk" onclick="checkEj('${id}')">Comprobar</button><button class="btn ghost" onclick="checkEj('${id}',true)">Ver solución</button></div><div id="fb"></div>`;
 }
 h+=`</div></div>`;render(h);
 const i=$('#itr');if(i){i.addEventListener('keydown',e=>{if(e.key==='Enter'&&it.t==='t'){e.preventDefault();checkEj(id)}});if(matchMedia('(min-width:821px)').matches)i.focus()}
}
function kb(){
 const k=['ꜣ','j','y','ꜥ','w','b','p','f','m','n','r','h','ḥ','ḫ','ẖ','z','s','š','q','k','g','t','ṯ','d','ḏ','.','-','␣','⌫'];
 return `<div class="kb">${k.map(c=>`<button type="button" onmousedown="event.preventDefault()" onclick="kbPress('${c}')">${c}</button>`).join('')}</div>`;
}
function kbPress(c){
 const i=$('#itr');if(!i)return;const a=i.selectionStart??i.value.length,b=i.selectionEnd??i.value.length;
 if(c==='⌫'){if(a===b&&a>0){i.value=i.value.slice(0,a-1)+i.value.slice(b);i.setSelectionRange(a-1,a-1)}else{i.value=i.value.slice(0,a)+i.value.slice(b);i.setSelectionRange(a,a)}}
 else{const t=c==='␣'?' ':c;i.value=i.value.slice(0,a)+t+i.value.slice(b);i.setSelectionRange(a+t.length,a+t.length)}
 i.focus();
}
function solBox(it){
 return `<div class="sol"><div class="qtr">${esc(it.tr.split('|')[0])}</div>${it.es?`<div class="qes">${esc(it.es)}</div>`:''}${it.an?`<div class="an">${esc(it.an)}</div>`:''}${it.ref&&it.t==='t'?'':''}</div>`;
}
function checkEj(id,reveal){
 const it=ITEMS[id];const a=$('#itr').value.trim();
 const sc=reveal?0:trScore(a,it.tr);
 let msg;
 if(reveal)msg=`<b class="t">Solución</b>`;
 else if(sc===2)msg=`<b class="t">✓ Transliteración correcta</b>`;
 else if(sc===1)msg=`<b class="t">✓ Correcta, salvo los signos especiales</b><div class="small">Revisa los puntos y rayas: ḥ/h, ḫ/ẖ, ꜣ/ꜥ, š/s…</div>`;
 else msg=`<b class="t">✗ La transliteración no coincide</b>${a?`<div class="small">Has escrito: ${T(a)}</div>`:''}`;
 let rateH='';
 if(it.t==='tt'){
  const yours=($('#ies')||{}).value||'';
  rateH=`${yours.trim()?`<div class="small" style="margin-top:8px">Tu traducción: <i>${esc(yours)}</i></div>`:''}<div class="small muted" style="margin-top:10px">Compara tu traducción con la solución y valora tu respuesta:</div><div class="row" style="justify-content:center;margin-top:6px"><button class="btn green sm" onclick="rateGo('${id}',2)">Bien</button><button class="btn gold sm" onclick="rateGo('${id}',1)">Casi</button><button class="btn red sm" onclick="rateGo('${id}',0)">Mal</button></div>`;
 }else{
  rate(id,sc===2?2:sc===1?1:0);
  rateH=`<div class="row" style="justify-content:center;margin-top:10px"><button class="btn" onclick="nextInRun()">Siguiente →</button></div>`;
 }
 $('#fb').innerHTML=`<div class="fb ${sc?'ok':'ko'}">${msg}${solBox(it)}${rateH}</div>`;
 $('#chk')&&($('#chk').disabled=true);
 $('#fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function rateGo(id,q){rate(id,q);nextInRun()}
function ansMC(id,i,el){
 const it=ITEMS[id];if(document.querySelector('.opt[disabled]'))return;
 document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(+b.dataset.i===it.ok)b.classList.add('right')});
 const ok=i===it.ok;if(!ok)el.classList.add('wrong');
 rate(id,ok?2:0);
 $('#fb').innerHTML=`<div class="fb ${ok?'ok':'ko'}"><b class="t">${ok?'✓ Correcto':'✗ No es esa'}</b>${it.an?`<div class="an">${esc(it.an)}</div>`:''}<div class="row" style="justify-content:center;margin-top:10px"><button class="btn" onclick="nextInRun()">Siguiente →</button></div></div>`;
}
function viewRepaso(){
 const ids=dueList();
 if(!ids.length){render(`<h2>Repaso</h2><div class="card"><p>No tienes nada pendiente hoy.</p><p class="muted small">Aquí vuelven los ejercicios que fallaste o marcaste como «casi», y más adelante también los que te salieron bien, cada vez más espaciados.</p></div>`);return}
 render(`<h2>Repaso</h2><div class="card"><p><b>${ids.length}</b> ejercicio${ids.length>1?'s':''} para hoy, de ${new Set(ids.map(i=>ITEMS[i].les)).size} tema(s).</p><button class="btn gold" onclick="startRep()">Empezar</button></div>`);
}
function startRep(){const ids=shuffle(dueList());RUN={ids,i:0,back:'repaso'};go('ej/'+ids[0])}
function viewInfo(){
 render(`<h2>Sobre los ejercicios</h2><div class="card prose">
 <p><b>De dónde salen.</b> Todas las frases son egipcias auténticas: inscripciones reales, estelas, títulos y nombres de reyes, y pasajes de obras como <i>El náufrago</i>, <i>Sinuhé</i>, <i>El campesino elocuente</i>, la <i>Enseñanza para Merikare</i>, la estela de Semna, los Textos de los Sarcófagos y el Libro de los Muertos. Cada ejercicio indica su fuente. En los primeros temas hay además ejercicios de práctica con palabras sueltas.</p>
 <p><b>Cómo se cita.</b> Las referencias siguen la numeración habitual de las ediciones: El náufrago por líneas (p. ej. «El náufrago 25–27»), Sinuhé por manuscrito y línea («Sinuhé B 84»), El campesino elocuente por manuscrito («R 1,1», «B1, 62»), Merikare por la línea del papiro de San Petersburgo («E 32»). Así puedes buscar cada frase en una edición o en el Thesaurus Linguae Aegyptiae.</p>
 <p><b>La escritura.</b> Los jeroglíficos están en grafía normalizada: se respetan las palabras y su ortografía habitual, pero en una sola línea de izquierda a derecha, sin la disposición en cuadrados del original. Muchos textos literarios están en hierático, de modo que cualquier versión en jeroglíficos es ya una transcripción.</p>
 <p><b>Las soluciones.</b> La transliteración y la traducción de la solución son las mías. Las traducciones egiptológicas varían. Si la tuya dice lo mismo con otras palabras, márcala como bien. Si algo te parece un error, compruébalo con la referencia.</p>
 <p><b>Cómo trabajar.</b> Haz primero el tema en Medu Netjer y el Cuaderno. Luego ven aquí y trata cada frase como en un manual: transliteración y traducción completas antes de mirar la solución, con papel y lápiz si quieres.</p>
 </div>`);
}
function viewAjustes(){
 render(`<h2>Ajustes</h2><div class="card list">
 <label class="row"><input type="checkbox" ${ST.mdc?'checked':''} onchange="ST.mdc=this.checked;save()"> Aceptar transliteración con teclado normal (Manuel de Codage: A=ꜣ, a=ꜥ, H=ḥ, x=ḫ, X=ẖ, S=š, T=ṯ, D=ḏ)</label>
 <div class="row"><button class="btn ghost" onclick="toggleTheme()">Cambiar tema claro/oscuro</button></div>
 <div class="row"><button class="btn red sm" onclick="if(confirm('¿Borrar todo tu progreso en esta app?')){ST.r={};save();toast('Progreso borrado')}">Borrar progreso</button></div></div>`);
}

applyTheme();route();initDB();
