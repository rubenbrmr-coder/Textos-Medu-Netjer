<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medu Netjer · Textos reales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&family=Noto+Sans+Egyptian+Hieroglyphs&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>

:root{--pap:#f4ecdb;--pap2:#ebe0c8;--card:#fffaf0;--ink:#2b2418;--muted:#6f6350;--line:#dccfb2;--lapis:#1f3b6f;--lapis2:#2c5299;--gold:#b8862b;--gold2:#d9a944;--red:#a3402a;--green:#3d7a4a;--shadow:0 2px 10px rgba(60,40,10,.08)}
[data-theme=dark]{--pap:#16171c;--pap2:#1e2027;--card:#23262f;--ink:#ece4d2;--muted:#a59c8a;--line:#383c48;--lapis:#7fa3e6;--lapis2:#9db8ef;--gold:#d9a944;--gold2:#e8bf62;--red:#e07a5f;--green:#7cc08a;--shadow:0 2px 10px rgba(0,0,0,.3)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--pap);color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif;font-size:16px;line-height:1.5}
.tr{font-family:"Gentium Book Plus",serif;font-style:italic}
.hg{font-family:"Noto Sans Egyptian Hieroglyphs",serif;font-style:normal}
h1,h2,h3{font-family:"Cormorant Garamond",serif;color:var(--lapis);margin:.2em 0 .4em;line-height:1.15}
h1{font-size:2rem}h2{font-size:1.6rem}h3{font-size:1.3rem}
a{color:var(--lapis2)}
button{font:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
aside{background:var(--lapis);color:#f4ecdb;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
[data-theme=dark] aside{background:#121a2e}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.brand .hg{font-size:2rem;color:var(--gold2)}
.brand b{font-family:"Cormorant Garamond",serif;font-size:1.3rem;line-height:1.05;display:block}
.brand small{opacity:.75;font-size:.8rem}
.nav a{display:flex;gap:10px;align-items:center;color:#f4ecdb;text-decoration:none;padding:9px 12px;border-radius:9px;font-weight:600}
.nav a:hover{background:rgba(255,255,255,.08)}
.nav a.on{background:var(--gold);color:#1a1408}
.nav .ic{width:22px;text-align:center}
aside .foot{margin-top:auto;font-size:.8rem;opacity:.8}
aside .foot button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#f4ecdb;border-radius:8px;padding:5px 10px}
main{min-width:0;padding:26px clamp(14px,3vw,40px) 90px}
.wrap{max-width:980px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.btn{background:var(--lapis);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:600}
[data-theme=dark] .btn{color:#10131a}
.btn.ghost{background:transparent;color:var(--lapis);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:#1a1408}
.btn.green{background:var(--green);color:#fff}
.btn.red{background:var(--red);color:#fff}
.btn.sm{padding:5px 11px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}.small{font-size:.88rem}
.hero{display:flex;gap:16px;align-items:center;margin-bottom:14px}
.hero .hg{font-size:2.8rem;color:var(--gold)}
.hero p{margin:0;color:var(--muted)}
.les{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;text-decoration:none;color:var(--ink)}
.les:hover{border-color:var(--gold)}
.les .num{width:38px;height:38px;border-radius:50%;background:var(--pap2);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--lapis);flex:none}
.les.cur .num{background:var(--gold);color:#1a1408}
.les .ti{font-weight:600}
.bar{height:6px;background:var(--pap2);border-radius:4px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--green)}
.list{display:flex;flex-direction:column;gap:8px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec .ic{font-size:1.6rem}
.tag{display:inline-block;font-size:.75rem;font-weight:700;border-radius:6px;padding:1px 7px;background:var(--pap2);color:var(--muted);border:1px solid var(--line)}
.tag.ok{background:var(--green);color:#fff;border-color:var(--green)}
.tag.gold{background:var(--gold2);color:#1a1408;border-color:var(--gold2)}
/* quiz */
.quiz{max-width:760px;margin:0 auto}
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.qtop .bar{flex:1;height:8px}
.qbox{text-align:center;padding:24px 20px}
.qprompt{font-size:1.1rem;color:var(--muted);margin-bottom:10px}
.qbig{font-size:clamp(2rem,7vw,3.2rem);line-height:1.25;margin:6px 0 10px;word-break:break-all}
.qtr{font-size:1.5rem;color:var(--lapis);font-weight:700;margin:4px 0}
.qes{font-size:1.25rem;font-weight:600;margin:6px 0}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{text-align:left;padding:13px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:1.05rem}
.opt:hover:not([disabled]){border-color:var(--lapis)}
.opt .hg{font-size:1.7rem}
.opt.right{border-color:var(--green);background:rgba(61,122,74,.13)}
.opt.wrong{border-color:var(--red);background:rgba(163,64,42,.1)}
.inp{width:100%;padding:12px 14px;font-size:1.2rem;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-family:"Gentium Book Plus",serif}
.inp:focus{outline:none;border-color:var(--gold)}
textarea.inp{font-family:"Source Sans 3",sans-serif;font-size:1.05rem;min-height:84px;resize:vertical}
.kb{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px;margin:10px 0;max-width:560px;margin-left:auto;margin-right:auto}
.kb button{min-width:0;padding:7px 0;border-radius:8px;border:1px solid var(--line);background:var(--pap2);color:var(--red);font-family:"Gentium Book Plus","Noto Serif","DejaVu Serif","Segoe UI",serif;font-style:italic;font-size:1.1rem}
.fb{margin-top:16px;padding:14px 16px;border-radius:12px;text-align:left}
.fb.ok{background:rgba(61,122,74,.13);border:1px solid var(--green)}
.fb.ko{background:rgba(163,64,42,.1);border:1px solid var(--red)}
.fb b.t{display:block;margin-bottom:4px}
.gl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.gl span{background:var(--pap2);border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:.9rem}
.gl span i{font-family:"Gentium Book Plus",serif;color:var(--lapis)}
.ord{min-height:54px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;justify-content:center}
.chip{border:1px solid var(--line);background:var(--card);color:var(--lapis);border-radius:10px;padding:6px 12px;font-family:"Gentium Book Plus",serif;font-style:italic;font-size:1.15rem}
.chip.used{opacity:.25}
.sumbig{font-size:3rem;font-family:"Cormorant Garamond",serif;color:var(--lapis);font-weight:700}
/* textos */
.tline{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.tline .hg{font-size:clamp(1.7rem,5vw,2.4rem);line-height:1.3;word-break:break-all}
.tline .tr{font-size:1.2rem;color:var(--lapis);margin:4px 0}
.tline .es{font-weight:600}
.tline .note{font-size:.9rem;color:var(--muted);margin-top:6px;border-left:3px solid var(--gold);padding-left:10px}
.tline.done{border-color:var(--green)}
.hide{display:none}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--pap);padding:8px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:.95}
table.st{border-collapse:collapse;width:100%;font-size:.95rem}
table.st td,table.st th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
table.st th{color:var(--muted);font-weight:600}
select.inp{font-family:inherit;font-size:1rem;padding:8px}
.bottom{display:none}
.mtop{display:none;justify-content:space-between;align-items:center;margin-bottom:10px}
.mtop b{font-family:"Cormorant Garamond",serif;font-size:1.3rem;color:var(--lapis)}
@media (max-width:820px){
 .app{grid-template-columns:minmax(0,1fr)}
 aside{display:none}
 main{padding:14px 12px 92px}
 .bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--lapis);z-index:40;justify-content:space-around;padding:6px 2px calc(6px + env(safe-area-inset-bottom))}
 [data-theme=dark] .bottom{background:#121a2e}
 .bottom a{color:#f4ecdb;text-decoration:none;display:flex;flex-direction:column;align-items:center;font-size:.7rem;padding:4px 6px;border-radius:8px;flex:1}
 .bottom a .ic{font-size:1.2rem}
 .bottom a.on{background:var(--gold);color:#1a1408}
 .mtop{display:flex}
 h1{font-size:1.6rem}
 .hero .hg{font-size:2.2rem}
 .qbox{padding:18px 12px}
}

.les.off{opacity:.55;cursor:default}
.tag.bad{background:var(--red);color:#fff;border-color:var(--red)}
.exrow{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;text-decoration:none;color:var(--ink)}
.exrow:hover{border-color:var(--gold)}
.exn{width:26px;color:var(--muted);font-weight:700;flex:none}
.exm{flex:1;min-width:0;display:flex;flex-direction:column}
.exg{font-size:1.5rem;line-height:1.3;word-break:break-all}
.exref{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mir{display:inline-block;transform:scaleX(-1)}
.src{font-size:.88rem;color:var(--muted);font-style:italic;margin:4px 0 6px}
.sol{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.an{font-size:.95rem;margin-top:6px;border-left:3px solid var(--gold);padding-left:10px;text-align:left}
.qes{white-space:normal}
.prose p{margin:.2em 0 .9em}
.vt{display:none}.vt.on{display:inline}
.qtop a{text-decoration:none;font-size:1.2rem}
</style>
</head>
<body>

<script>
const TITLES=[{"n": 1, "title": "La lengua y la escritura egipcias", "sub": "Qué es el egipcio medio y cómo funcionan los jeroglíficos"}, {"n": 2, "title": "Los sonidos del egipcio medio", "sub": "El «alfabeto» de signos unilíteros y la transliteración"}, {"n": 3, "title": "Los signos multilíteros", "sub": "Bilíteros, trilíteros, complementos fonéticos e ideogramas"}, {"n": 4, "title": "Los sustantivos", "sub": "Género, número, dual y sintagmas nominales"}, {"n": 5, "title": "Los pronombres", "sub": "Pronombres sufijos, dependientes e independientes; demostrativos e interrogativos"}, {"n": 6, "title": "Los adjetivos", "sub": "Concordancia, adjetivos sustantivados, «todo», «otro» y comparaciones"}, {"n": 7, "title": "Oraciones adjetivales y nominales", "sub": "Tus primeras frases completas: «es bueno», «yo soy tu hijo»"}, {"n": 8, "title": "Preposiciones y adverbios", "sub": "m, n, r, ḥr y compañía; nisbes y adverbios"}, {"n": 9, "title": "Los números", "sub": "Cifras, ordinales, fracciones, medidas y fechas"}, {"n": 10, "title": "Oraciones adverbiales", "sub": "«Está en casa», «tiene una casa»: la partícula jw"}, {"n": 11, "title": "Las oraciones no verbales: negación y preguntas", "sub": "nn, n… js, jn: decir que no y preguntar"}, {"n": 12, "title": "Oraciones subordinadas no verbales", "sub": "Relativas con ntj y jwtj, sustantivas con ntt y circunstanciales"}, {"n": 13, "title": "El verbo", "sub": "Clases de verbos, raíces y visión general del sistema verbal"}, {"n": 14, "title": "Las formas de infinitivo", "sub": "El infinitivo, el infinitivo negativo y el complemento negativo"}, {"n": 15, "title": "La construcción pseudoverbal", "sub": "«Está oyendo», «oirá»: sujeto + ḥr/r + infinitivo"}, {"n": 16, "title": "El imperativo y las partículas", "sub": "Dar órdenes, prohibir, exclamar e invocar"}, {"n": 17, "title": "El estativo", "sub": "La forma del estado: «está vivo», «he venido»"}, {"n": 18, "title": "El perfecto: sḏm.n.f", "sub": "La forma de la acción completada"}, {"n": 19, "title": "El subjuntivo", "sub": "Deseos, órdenes indirectas y finalidad"}, {"n": 20, "title": "El perfectivo y el imperfectivo", "sub": "Acción puntual frente a acción habitual o continua"}, {"n": 21, "title": "El prospectivo y el pasivo", "sub": "El futuro del sḏm.f y las formas pasivas"}, {"n": 22, "title": "Las demás formas de la conjugación sufijal", "sub": "sḏm.jn.f, sḏm.ḫr.f, sḏm.kꜣ.f, sḏmt.f y los parentéticos"}, {"n": 23, "title": "Los participios", "sub": "«El que ama», «el amado»: adjetivos verbales"}, {"n": 24, "title": "Las formas relativas", "sub": "«Lo que él hizo», «el que su señor ama»"}, {"n": 25, "title": "Usos especiales de las formas relativas", "sub": "Oraciones sustantivas y oraciones enfáticas"}, {"n": 26, "title": "La gramática del egipcio medio", "sub": "Síntesis final y cómo seguir aprendiendo"}];
const DATA={"1": {"intro": "Como en el primer ejercicio de un manual: observar inscripciones reales antes de saber leerlas. Fíjate en hacia dónde miran los signos, en qué orden se agrupan y qué signos no se pronuncian.", "secs": [{"id": "A", "title": "Dirección y orden de lectura", "items": [{"t": "mc", "mir": true, "ref": "Fórmula de ofrenda, comienzo habitual de las estelas del Reino Medio", "q": "Esta línea está escrita, como en muchas estelas, en dirección contraria a la nuestra. ¿En qué dirección se lee?", "op": ["De derecha a izquierda", "De izquierda a derecha", "De abajo arriba", "Da igual: el orden no importa"], "ok": 0, "an": "Los signos que tienen cara (aves, personas, el ojo) miran hacia el principio de la línea. Aquí miran a la derecha, así que se empieza por la derecha. Es el mismo principio que verás en cualquier estela: lees «hacia las caras».", "id": "1.1", "g": "𓇓𓏏𓈖 𓊵𓏏𓊪 𓏙 𓊨𓁹𓀭"}, {"t": "mc", "ref": "Fórmula de ofrenda (ḥtp-dj-nswt)", "q": "Esta expresión se lee ḥtp-dj-nswt «ofrenda que da el rey». ¿Qué palabra está escrita primero aunque se lea al final?", "op": ["nswt «rey» (𓇓𓏏𓈖)", "ḥtp «ofrenda» (𓊵𓏏𓊪)", "dj «da» (𓏙)", "Ninguna: se escribe en el mismo orden en que se lee"], "ok": 0, "an": "Es la anteposición honorífica: las palabras «rey», «dios» o el nombre de un dios se escriben delante por respeto, aunque gramaticalmente vayan después.", "id": "1.2", "g": "𓇓𓏏𓈖 𓊵𓏏𓊪 𓏙"}, {"t": "mc", "ref": "ḥwt-nṯr «templo», palabra frecuentísima en inscripciones", "q": "La palabra se lee ḥwt-nṯr «casa del dios, templo». ¿Qué signo se ha adelantado por respeto?", "op": ["𓊹 nṯr «dios»", "𓉗 ḥwt «recinto»", "𓏏 t", "𓉐 pr «casa»"], "ok": 0, "an": "Otra vez anteposición honorífica: nṯr «dios» se escribe primero, pero se lee ḥwt-nṯr.", "id": "1.3", "g": "𓊹 𓉗𓏏𓉐"}, {"t": "mc", "ref": "Título de los príncipes («hijo del rey»)", "q": "El título se lee zꜣ nswt «hijo del rey». ¿Qué palabra se lee primero?", "op": ["zꜣ «hijo» (𓅭), aunque esté escrita en segundo lugar", "nswt «rey», porque va delante", "Se leen a la vez", "Depende de la dirección de la línea"], "ok": 0, "an": "nswt «rey» se antepone por respeto (anteposición honorífica), pero la lectura es zꜣ nswt.", "id": "1.4", "g": "𓇓𓏏𓈖 𓅭𓏤𓀀"}]}, {"id": "B", "title": "Tipos de signos", "items": [{"t": "mc", "ref": "ḥr «rostro», en textos de todas las épocas", "q": "¿Qué indica el trazo vertical 𓏤 que acompaña al signo del rostro?", "op": ["Que el signo vale por lo que representa (ideograma): «rostro»", "Que la palabra está en plural", "El número 1", "Que hay que leerlo dos veces"], "ok": 0, "an": "El trazo marca un ideograma: el dibujo significa lo que representa. Así se escribe ḥr «rostro».", "id": "1.5", "g": "𓁷𓏤"}, {"t": "mc", "ref": "zꜣ «hijo», p. ej. en filiaciones de estelas", "q": "En esta grafía de zꜣ «hijo», ¿qué función tiene el hombre sentado 𓀀 del final?", "op": ["Es un determinativo: indica que se habla de una persona y no se pronuncia", "Se lee «j», «yo»", "Es un complemento fonético", "Indica plural"], "ok": 0, "an": "Es un determinativo: clasifica la palabra («hombre, persona») sin añadir sonido. El pato 𓅭 da el sonido zꜣ.", "id": "1.6", "g": "𓅭𓏤𓀀"}, {"t": "mc", "ref": "ꜥnḫ wḏꜣ snb «¡vida, prosperidad, salud!», fórmula tras el nombre del rey", "q": "En la primera palabra, ꜥnḫ «vida», ¿qué hacen 𓈖 n y 𓐍 ḫ después de 𓋹?", "op": ["Son complementos fonéticos: repiten sonidos que 𓋹 ya contiene", "Añaden sonidos nuevos: se lee ꜥnḫnḫ", "Son determinativos", "Indican que es un verbo"], "ok": 0, "an": "𓋹 ya vale ꜥnḫ; 𓈖 y 𓐍 confirman la lectura (complementos fonéticos). Se lee ꜥnḫ, no ꜥnḫnḫ.", "id": "1.7", "g": "𓋹𓈖𓐍 𓍑𓄿 𓋴𓈖𓃀"}]}, {"id": "C", "title": "Primeras lecturas guiadas", "items": [{"t": "tt", "ref": "Epíteto real, en inscripciones de todas las épocas", "vo": [["nb", "señor (𓎟)"], ["tꜣ", "tierra (𓇾); escrito dos veces: dual"]], "tr": "nb tꜣwj", "es": "señor de las Dos Tierras", "an": "Las «Dos Tierras» son el Alto y el Bajo Egipto. El signo repetido indica dual (tema 4).", "id": "1.8", "g": "𓎟 𓇾𓇾"}, {"t": "tt", "ref": "Tras el nombre de los difuntos en estelas y ataúdes", "vo": [["mꜣꜥ", "justo, verdadero (𓐙)"], ["ḫrw", "voz (𓊤)"]], "tr": "mꜣꜥ-ḫrw", "es": "justificado (literalmente «justo de voz»)", "an": "Califica al difunto que ha superado el juicio de Osiris. Dos ideogramas, sin complementos.", "id": "1.9", "g": "𓐙𓊤"}, {"t": "tt", "ref": "Al final de las fórmulas reales («vivo …»)", "vo": [["ḏ", "cobra 𓆓"], ["t", "pan 𓏏"], ["—", "𓇿 tierra: determinativo"]], "tr": "ḏt", "es": "eternamente, para siempre", "an": "Dos signos fonéticos (ḏ, t) y un determinativo que no se lee.", "id": "1.10", "g": "𓆓𓏏𓇿"}]}]}, "2": {"intro": "Nombres y palabras reales escritos (casi) solo con signos unilíteros. Translitera con el alfabeto egiptológico. Las vocales no se escriben.", "secs": [{"id": "A", "title": "Nombres propios", "items": [{"t": "tt", "ref": "Nombre del rey de la IV dinastía que construyó la Gran Pirámide", "tr": "ḫwfw", "es": "Jufu (Keops)", "an": "ḫ (𓐍) + w (𓅱) + f (𓆑) + w (𓅱). Los griegos lo llamaron Keops.", "id": "2.1", "g": "𓍹 𓐍𓅱𓆑𓅱 𓍺"}, {"t": "tt", "ref": "Nombre del dios de Menfis, frecuente en fórmulas de ofrenda", "tr": "ptḥ", "es": "Ptah", "an": "p (𓊪) + t (𓏏) + ḥ (𓎛) + determinativo de dios.", "id": "2.2", "g": "𓊪𓏏𓎛𓀭"}, {"t": "tt", "ref": "Primer rey de la VI dinastía (pirámide de Saqqara)", "tr": "ttj", "es": "Teti", "an": "t + t + j. La j final (𓇋) suele leerse «i».", "id": "2.3", "g": "𓍹 𓏏𓏏𓇋 𓍺"}, {"t": "tt", "ref": "Nombre de dos reyes de la VI dinastía", "tr": "ppj", "es": "Pepi", "an": "p + p + j. Mismo esquema que Teti.", "id": "2.4", "g": "𓍹 𓊪𓊪𓇋 𓍺"}, {"t": "tt", "ref": "El mago del papiro Westcar", "tr": "ḏdj", "es": "Dyedi (Djedi)", "an": "ḏ (𓆓) + d (𓂧) + j (𓇋) + determinativo de hombre.", "id": "2.5", "g": "𓆓𓂧𓇋𓀀"}, {"t": "tt", "ref": "Nombre del astro y del dios lunar; aparece también en el nombre de Ahmose", "tr": "jꜥḥ", "es": "luna; el dios Iah", "an": "j + ꜥ + ḥ + determinativo de la luna. Ojo con distinguir 𓂝 ꜥ (brazo) de 𓂡.", "id": "2.6", "g": "𓇋𓂝𓎛𓇹"}, {"t": "tt", "ref": "El dios de la crecida del Nilo (himnos a Hapy)", "tr": "ḥꜥpj", "es": "Hapy (la crecida)", "an": "ḥ + ꜥ + p + j + determinativo de agua (𓈗).", "id": "2.7", "g": "𓎛𓂝𓊪𓇋𓈗"}]}, {"id": "B", "title": "Palabras", "items": [{"t": "tt", "ref": "Pronombre independiente, en cualquier texto narrativo", "tr": "jnk", "es": "yo", "an": "j + n + k. Lo verás a fondo en el tema 5.", "id": "2.8", "g": "𓇋𓈖𓎡"}, {"t": "tt", "ref": "Verbo de habla, en todos los textos", "tr": "ḏd", "es": "decir", "an": "ḏ + d + determinativo de la boca (hablar, comer, pensar).", "id": "2.9", "g": "𓆓𓂧𓀁"}, {"t": "tt", "ref": "Palabra muy frecuente", "tr": "ḫt", "es": "cosa", "an": "ḫ + t + determinativo abstracto (papiro enrollado).", "id": "2.10", "g": "𓐍𓏏𓏛"}, {"t": "tt", "ref": "Verbo frecuente, p. ej. en el título «conocido del rey»", "tr": "rḫ", "es": "saber, conocer", "an": "r + ḫ + determinativo abstracto.", "id": "2.11", "g": "𓂋𓐍𓏛"}, {"t": "tt", "ref": "Palabra frecuente, p. ej. en el epíteto «señor del cielo»", "tr": "pt", "es": "cielo", "an": "p + t + determinativo del cielo 𓇯.", "id": "2.12", "g": "𓊪𓏏𓇯"}, {"t": "tt", "ref": "La palabra para «barco» en El náufrago", "tr": "dpt", "es": "barco", "an": "d + p + t + determinativo de barco.", "id": "2.13", "g": "𓂧𓊪𓏏𓊛"}, {"t": "tt", "ref": "Palabra frecuente en textos literarios y sapienciales", "tr": "rmṯ", "es": "gente, personas", "an": "r + m + ṯ + determinativos de hombre y mujer + trazos de plural.", "id": "2.14", "g": "𓂋𓅓𓍿𓀀𓁐𓏥"}]}, {"id": "C", "title": "Del sonido al signo", "items": [{"t": "mc", "q": "¿Cuál es la grafía correcta de ḥtp «ofrenda; estar satisfecho» con unilíteros?", "op": ["𓎛𓏏𓊪", "𓉔𓏏𓊪", "𓐍𓏏𓊪", "𓎛𓍿𓊪"], "ok": 0, "ref": "Grafía alternativa (unilítera) de ḥtp", "an": "ḥ es 𓎛 (mecha retorcida); 𓉔 es h, 𓐍 es ḫ, 𓍿 es ṯ.", "id": "2.15"}, {"t": "mc", "q": "¿Qué signo representa ḏ?", "op": ["𓆓 (cobra)", "𓂧 (mano)", "𓍿 (cuerda para atar)", "𓊃 (cerrojo)"], "ok": 0, "an": "𓆓 = ḏ; 𓂧 = d; 𓍿 = ṯ; 𓊃 = z.", "id": "2.16"}, {"t": "mc", "q": "¿Cuál es la transliteración de 𓋴𓈖𓃀?", "op": ["snb", "šnb", "znb", "sbn"], "ok": 0, "ref": "snb «estar sano», en la fórmula ꜥnḫ wḏꜣ snb", "an": "𓋴 s (tela doblada) + 𓈖 n + 𓃀 b.", "id": "2.17"}]}]}, "3": {"intro": "Como en el ejercicio del tema 3 de un manual: palabras sueltas sacadas de textos reales (estelas, El náufrago, Sinuhé, fórmulas de ofrenda). Se da el significado y, entre paréntesis, qué indica el determinativo. Escribe la transliteración.", "secs": [{"id": "A", "title": "Translitera", "items": [{"t": "t", "q": "«dios» (dios)", "tr": "nṯr", "an": "𓊹 nṯr ideograma + determinativo de dios.", "id": "3.1", "g": "𓊹𓀭"}, {"t": "t", "q": "«bueno, perfecto»", "tr": "nfr", "an": "𓄤 trilítero nfr + complementos f, r.", "id": "3.2", "g": "𓄤𓆑𓂋"}, {"t": "t", "q": "«vivir; vida»", "tr": "ꜥnḫ", "an": "𓋹 trilítero ꜥnḫ + complementos n, ḫ.", "id": "3.3", "g": "𓋹𓈖𓐍"}, {"t": "t", "q": "«estar satisfecho; ofrenda»", "tr": "ḥtp", "an": "𓊵 trilítero ḥtp + complementos t, p.", "id": "3.4", "g": "𓊵𓏏𓊪"}, {"t": "t", "q": "«permanecer»", "tr": "mn", "an": "𓏠 bilítero mn + complemento n.", "id": "3.5", "g": "𓏠𓈖"}, {"t": "t", "q": "«Amón» (dios)", "tr": "jmn", "an": "j + 𓏠 mn + complemento n + determinativo de dios.", "id": "3.6", "g": "𓇋𓏠𓈖𓀭"}, {"t": "t", "q": "«llegar a ser, transformarse»", "tr": "ḫpr", "an": "𓆣 trilítero ḫpr + complemento r.", "id": "3.7", "g": "𓆣𓂋"}, {"t": "t", "q": "«fuerte, poderoso»", "tr": "wsr", "an": "𓄊 trilítero wsr + complementos s, r.", "id": "3.8", "g": "𓄊𓋴𓂋"}, {"t": "t", "q": "«oír»", "tr": "sḏm", "an": "𓄔 trilítero sḏm + complemento m.", "id": "3.9", "g": "𓄔𓅓"}, {"t": "t", "q": "«palabra; hablar» (boca)", "tr": "mdw", "an": "𓌃 bilítero md + d + w + determinativo de la boca.", "id": "3.10", "g": "𓌃𓂧𓅱𓀁"}, {"t": "t", "q": "«dar a luz» (mujer dando a luz)", "tr": "ms", "an": "𓄟 bilítero ms + complemento s + determinativo.", "id": "3.11", "g": "𓄟𓋴𓁒"}, {"t": "t", "q": "«fuerte, victorioso» (fuerza)", "tr": "nḫt", "an": "n + 𓆱 ḫt + ḫ + t + determinativo de fuerza (brazo con bastón).", "id": "3.12", "g": "𓈖𓆱𓐍𓏏𓂡"}, {"t": "t", "q": "«recinto, mansión» (casa)", "tr": "ḥwt", "an": "𓉗 ḥwt + t + determinativo de edificio.", "id": "3.13", "g": "𓉗𓏏𓉐"}, {"t": "t", "q": "«ka (fuerza vital)»", "tr": "kꜣ", "an": "𓂓 bilítero kꜣ como ideograma.", "id": "3.14", "g": "𓂓𓏤"}, {"t": "t", "q": "«ba (alma)»", "tr": "bꜣ", "an": "𓅡 bilítero bꜣ + complemento ꜣ.", "id": "3.15", "g": "𓅡𓄿"}, {"t": "t", "q": "«espíritu; eficaz»", "tr": "ꜣḫ", "an": "𓅜 bilítero ꜣḫ + complemento ḫ.", "id": "3.16", "g": "𓅜𓐍"}, {"t": "t", "q": "«corazón»", "tr": "jb", "an": "𓄣 ideograma jb.", "id": "3.17", "g": "𓄣𓏤"}, {"t": "t", "q": "«lengua»", "tr": "ns", "an": "𓄓 ideograma ns.", "id": "3.18", "g": "𓄓𓏤"}, {"t": "t", "q": "«campesino» (hombre); el protagonista de El campesino elocuente", "tr": "sḫtj", "an": "𓇏 sḫt «campo» + t + 𓏭 y (nisbe -j) + determinativo: «el del campo».", "id": "3.19", "g": "𓇏𓏏𓏭𓀀"}, {"t": "t", "q": "«gobernante» (hombre)", "tr": "ḥqꜣ", "an": "𓋾 trilítero ḥqꜣ + complemento ꜣ + determinativo.", "id": "3.20", "g": "𓋾𓄿𓀀"}, {"t": "t", "q": "«codo (medida)», como en El náufrago «un barco de 120 codos»", "tr": "mḥ", "an": "𓂣 ideograma mḥ «codo».", "id": "3.21", "g": "𓂣"}, {"t": "t", "q": "«seguir» (movimiento)", "tr": "šms", "an": "𓌞 trilítero šms + complemento s + piernas en marcha.", "id": "3.22", "g": "𓌞𓋴𓂻"}, {"t": "t", "q": "«amar, desear» (boca)", "tr": "mr|mrj", "an": "𓌸 bilítero mr + complemento r + determinativo. Es verbo de tercera débil (mrj).", "id": "3.23", "g": "𓌻𓂋𓀁"}, {"t": "t", "q": "«sano, estar sano» (enfermedad)", "tr": "snb", "an": "s + n + b + determinativo.", "id": "3.24", "g": "𓋴𓈖𓃀𓐎"}, {"t": "t", "q": "«sacerdote» («siervo del dios»)", "tr": "ḥm-nṯr|ḥmnṯr", "an": "Anteposición honorífica: se escribe nṯr primero; 𓌨 ḥm «siervo».", "id": "3.25", "g": "𓊹𓍛"}, {"t": "t", "q": "«grande»", "tr": "ꜥꜣ", "an": "𓉻 bilítero ꜥꜣ + complemento ꜥ.", "id": "3.26", "g": "𓉻𓂝"}, {"t": "t", "q": "«grande; jefe»", "tr": "wr", "an": "𓅨 bilítero wr + complemento r.", "id": "3.27", "g": "𓅨𓂋"}, {"t": "t", "q": "«hijo» (hombre)", "tr": "zꜣ|sꜣ", "an": "𓅭 bilítero zꜣ + determinativo.", "id": "3.28", "g": "𓅭𓏤𓀀"}, {"t": "t", "q": "«padre» (hombre)", "tr": "jt|jtj", "an": "j + t + 𓆑 f + determinativo. La f es una grafía tradicional (jt(f)) y no se lee.", "id": "3.29", "g": "𓇋𓏏𓆑𓀀"}, {"t": "t", "q": "«madre» (mujer)", "tr": "mwt", "an": "𓅐 bilítero mw(t) + t + determinativo femenino.", "id": "3.30", "g": "𓅐𓏏𓁐"}, {"t": "t", "q": "«rojo» (flamenco)", "tr": "dšr", "an": "d + š + r + 𓅟 flamenco, que también es dšr.", "id": "3.31", "g": "𓂧𓈙𓂋𓅟"}, {"t": "t", "q": "«blanco; plata»", "tr": "ḥḏ", "an": "𓌉 maza ḥḏ + complemento d.", "id": "3.32", "g": "𓌉𓂧"}, {"t": "t", "q": "«camino» (camino)", "tr": "wꜣt", "an": "𓍯 bilítero wꜣ + ꜣ + t + determinativo de camino.", "id": "3.33", "g": "𓍯𓄿𓏏𓈐"}, {"t": "t", "q": "«país extranjero, desierto» (colinas)", "tr": "ḫꜣst", "an": "𓆼 bilítero ḫꜣ + ꜣ + s + t + 𓈉 determinativo de tierra extranjera.", "id": "3.34", "g": "𓆼𓄿𓋴𓏏𓈉"}, {"t": "t", "q": "«ciudad»", "tr": "njwt", "an": "𓊖 ideograma njwt + t.", "id": "3.35", "g": "𓊖𓏏𓏤"}, {"t": "t", "q": "«salir» (movimiento)", "tr": "prj|pr", "an": "𓉐 bilítero pr + complemento r + piernas en marcha. Verbo de tercera débil.", "id": "3.36", "g": "𓉐𓂋𓂻"}, {"t": "t", "q": "«eternidad» (tierra)", "tr": "ḏt", "an": "ḏ + t + determinativo.", "id": "3.37", "g": "𓆓𓏏𓇿"}, {"t": "t", "q": "«como» (preposición)", "tr": "mj", "an": "𓎳 bilítero mj + complemento j.", "id": "3.38", "g": "𓏇𓇋"}]}]}, "4": {"intro": "Sustantivos de inscripciones reales: plurales, duales y expresiones de títulos, epítetos y fórmulas de ofrenda.", "secs": [{"id": "A", "title": "Plural y dual: translitera y traduce indicando el número", "items": [{"t": "tt", "ref": "Grafía arcaizante frecuente en himnos y fórmulas", "tr": "nṯrw", "es": "dioses", "an": "Plural por triplicación del ideograma. Masculino plural en -w.", "id": "4.1", "g": "𓊹𓊹𓊹"}, {"t": "tt", "ref": "En el título real «señor de las Dos Tierras»", "tr": "tꜣwj", "es": "las Dos Tierras", "an": "Dual por duplicación del ideograma. Masculino dual en -wj.", "id": "4.2", "g": "𓇾𓇾"}, {"t": "tt", "ref": "Textos funerarios y médicos", "tr": "jrtj", "es": "los dos ojos", "an": "jrt es femenino: el dual femenino termina en -tj.", "id": "4.3", "g": "𓁹𓁹"}, {"t": "tt", "ref": "Textos funerarios («tus dos pies»)", "tr": "rdwj", "es": "los dos pies", "an": "rd «pie», masculino: dual rdwj.", "id": "4.4", "g": "𓂾𓂾"}, {"t": "tt", "ref": "Textos históricos y reales", "tr": "ḫꜣswt", "es": "los países extranjeros", "an": "ḫꜣst es femenino: plural -wt. La w no se escribe, pero se translitera.", "id": "4.5", "g": "𓆼𓄿𓋴𓏏𓈉𓏥"}, {"t": "tt", "ref": "Listas de familia en estelas", "tr": "zꜣwt|sꜣwt", "es": "hijas", "an": "zꜣt «hija» → plural zꜣwt.", "id": "4.6", "g": "𓅭𓏏𓁐𓏥"}, {"t": "tt", "ref": "Textos literarios (Westcar, Sinuhé)", "tr": "ḥmwt", "es": "mujeres", "an": "ḥmt «mujer, esposa» → plural ḥmwt.", "id": "4.7", "g": "𓈞𓏏𓁐𓏥"}, {"t": "tt", "ref": "Textos históricos y geográficos", "tr": "njwwt|njwt", "es": "ciudades", "an": "Plural por triplicación de njwt; transliteración convencional njwwt.", "id": "4.8", "g": "𓊖𓊖𓊖"}, {"t": "tt", "ref": "Fórmulas autobiográficas («amado de sus hermanos»)", "tr": "snw", "es": "hermanos", "an": "sn «hermano» → plural snw.", "id": "4.9", "g": "𓌢𓈖𓀀𓏥"}, {"t": "tt", "ref": "Textos administrativos", "tr": "prw", "es": "casas", "an": "pr «casa» → plural prw.", "id": "4.10", "g": "𓉐𓏥"}]}, {"id": "B", "title": "Expresiones nominales: translitera y traduce", "items": [{"t": "tt", "ref": "Título de reinas (passim)", "tr": "ḥmt nswt", "es": "esposa del rey", "an": "Genitivo directo: «la esposa (del) rey». nswt va delante por anteposición honorífica.", "id": "4.11", "g": "𓇓𓏏𓈖 𓈞𓏏𓁐"}, {"t": "tt", "ref": "Título de príncipes", "tr": "zꜣ nswt|sꜣ nswt", "es": "hijo del rey, príncipe", "an": "Genitivo directo con anteposición honorífica.", "id": "4.12", "g": "𓇓𓏏𓈖 𓅭𓏤𓀀"}, {"t": "tt", "ref": "Título de los reyes hicsos (escarabeos de Jayan y Apofis)", "tr": "ḥqꜣ ḫꜣswt", "es": "gobernante de los países extranjeros", "an": "Genitivo directo. De esta expresión deriva el término «hicsos».", "id": "4.13", "g": "𓋾𓄿 𓆼𓄿𓋴𓏏𓈉𓏥"}, {"t": "tt", "ref": "Título habitual de mujeres en estelas del Reino Medio", "tr": "nbt pr", "es": "señora de la casa", "an": "nbt, femenino de nb, + pr: genitivo directo.", "id": "4.14", "g": "𓎟𓏏 𓉐𓏤"}, {"t": "tt", "ref": "Títulos administrativos (Urkunden, estelas)", "tr": "pr-ḥḏ", "es": "el Tesoro («la casa blanca/de plata»)", "an": "Compuesto de dos sustantivos en genitivo directo.", "id": "4.15", "g": "𓉐 𓌉𓂧"}, {"t": "tt", "ref": "Títulos de funcionarios", "tr": "sš nswt|zš nswt", "es": "escriba real", "an": "«Escriba (del) rey», con anteposición honorífica de nswt.", "id": "4.16", "g": "𓇓𓏏𓈖 𓏞𓀀"}, {"t": "tt", "ref": "Fórmula de ofrenda («ofrenda invocada de …»)", "tr": "t ḥnqt", "es": "pan y cerveza", "an": "Coordinación sin conjunción: el egipcio suele yuxtaponer sustantivos («pan, cerveza»).", "id": "4.17", "g": "𓏐𓏊"}, {"t": "tt", "ref": "Fórmula de ofrenda", "tr": "kꜣ ꜣpd", "es": "bueyes y aves", "an": "Grafías abreviadas: cabeza de buey 𓄀 y ganso desplumado 𓅿. Coordinación por yuxtaposición.", "id": "4.18", "g": "𓃾 𓅾"}, {"t": "tt", "ref": "Epíteto de Osiris en las estelas de Abidos", "tr": "nb ꜣbḏw", "es": "señor de Abidos", "an": "Genitivo directo con topónimo (determinativo de ciudad).", "id": "4.19", "g": "𓎟 𓄿𓃀𓆓𓅱𓊖"}, {"t": "tt", "ref": "Epíteto de Osiris en fórmulas de ofrenda", "tr": "nb ḏdw", "es": "señor de Busiris", "an": "Genitivo directo. ḏdw es Busiris, en el Delta.", "id": "4.20", "g": "𓎟 𓊽𓊽𓂧𓅱𓊖"}, {"t": "tt", "ref": "El náufrago 25 y passim", "tr": "wꜣḏ-wr", "es": "el mar (literalmente «el Gran Verde»)", "an": "Compuesto fijo: wꜣḏ «verde» + wr «grande».", "id": "4.21", "g": "𓇅𓅨𓂋𓈗"}, {"t": "tt", "ref": "Inscripciones de templos tebanos", "tr": "ḥwt-nṯr nt jmn", "es": "el templo de Amón", "an": "Genitivo indirecto: nt concuerda con ḥwt-nṯr (femenino).", "id": "4.22", "g": "𓊹 𓉗𓏏𓉐 𓈖𓏏 𓇋𓏠𓈖𓀭"}, {"t": "tt", "ref": "Título de altos funcionarios del Reino Medio", "tr": "jmj-r pr wr", "es": "gran mayordomo", "an": "jmj-r «supervisor» (literalmente «el que está en la boca») + pr wr «la casa grande».", "id": "4.23", "g": "𓄓 𓉐 𓅨𓂋"}, {"t": "tt", "ref": "El campesino elocuente R 1,1", "tr": "sḫt-ḥmꜣt", "es": "el Campo de la Sal (Uadi Natrun)", "an": "Topónimo formado por dos sustantivos en genitivo directo: «el campo de la sal».", "id": "4.24", "g": "𓇏𓏏𓈅 𓎛𓅓𓄿𓏏𓈓"}]}]}, "5": {"intro": "Pronombres en frases reales. Se dan en el vocabulario las formas verbales que aún no conoces, igual que hace un manual en los primeros temas.", "secs": [{"id": "A", "title": "Translitera y traduce", "items": [{"t": "tt", "ref": "Sinuhé R 2 (tras los títulos del protagonista)", "tr": "ḏd.f", "es": "dice él / él dice", "an": "Verbo + pronombre sufijo .f «él». Con este verbo se introduce el relato en primera persona.", "id": "5.1", "g": "𓆓𓂧𓆑"}, {"t": "tt", "ref": "El náufrago 1–2", "vo": [["ḏd.jn", "entonces dijo (tema 22)"], ["šmsw", "seguidor"], ["jqr", "excelente"], ["wḏꜣ", "que esté bien (subjuntivo)"], ["ḥꜣtj-ꜥ", "gobernador"]], "tr": "ḏd.jn šmsw jqr wḏꜣ jb.k ḥꜣtj-ꜥ", "es": "Entonces dijo el seguidor excelente: «¡Que tu corazón esté bien, gobernador!»", "an": "jb.k: sustantivo + sufijo .k «tu» (2.ª masc.). ḥꜣtj-ꜥ es un vocativo.", "id": "5.2", "g": "𓆓𓂧𓇋𓈖 𓌞𓋴𓅱𓀀 𓇋𓈎𓂋 𓍑𓄿 𓄣𓏤𓎡 𓄂𓏏𓏭 𓂝"}, {"t": "tt", "ref": "El náufrago 28", "vo": [["mꜣ.sn", "(si) miraban ellos"]], "tr": "mꜣ.sn pt mꜣ.sn tꜣ", "es": "Miraran al cielo o miraran a la tierra…", "an": "El sufijo .sn «ellos» repetido en dos frases paralelas. Se dice de los marineros: veían venir la tormenta.", "id": "5.3", "g": "𓌳𓁹𓋴𓈖 𓊪𓏏𓇯 𓌳𓁹𓋴𓈖 𓇾𓏤"}, {"t": "tt", "ref": "El náufrago 53–54", "vo": [["ꜥḥꜥ.n", "entonces (tema 22)"], ["sꜣ.n.j", "sacié (yo)"]], "tr": "ꜥḥꜥ.n sꜣ.n.j wj", "es": "Entonces me sacié.", "an": "wj es pronombre dependiente de 1.ª persona («me»), objeto del verbo. Literalmente «sacié a mí mismo».", "id": "5.4", "g": "𓊢𓂝𓈖 𓋴𓄿𓈖𓀀 𓅱𓀀"}, {"t": "tt", "ref": "Sinuhé R 2", "vo": [["šmsw", "seguidor"], ["šms", "que seguía (participio, tema 23)"]], "tr": "jnk šmsw šms nb.f", "es": "Yo era un seguidor que seguía a su señor.", "an": "jnk: pronombre independiente de 1.ª persona, sujeto de una oración nominal. nb.f «su señor».", "id": "5.5", "g": "𓇋𓈖𓎡 𓌞𓋴𓅱𓀀 𓌞𓋴𓂻 𓎟𓆑"}, {"t": "tt", "ref": "Fórmula autobiográfica frecuente en estelas", "vo": [["mrrw", "amado de (participio)"], ["ḥzzw", "alabado de (participio)"]], "tr": "jnk mrrw jt.f ḥzzw mwt.f|jnk mrr jt.f ḥzz mwt.f", "es": "Yo era el amado de su padre, el alabado de su madre.", "an": "El sufijo .f se refiere al propio difunto: en egipcio la frase pasa de «yo» a «su». En español se traduce a menudo «de mi padre».", "id": "5.6", "g": "𓇋𓈖𓎡 𓌻𓂋𓂋𓅱 𓇋𓏏𓆑𓀀𓆑 𓎿𓋴𓋴𓅱 𓅐𓏏𓁐𓆑"}, {"t": "tt", "ref": "Libro de los Muertos, cap. 17 (fórmula de las glosas)", "vo": [["pw-tr", "¿quién (es)?"], ["r.f", "pues, entonces"]], "tr": "pw-tr r.f sw|pw tr r.f sw", "es": "¿Quién es él, pues?", "an": "sw: pronombre dependiente de 3.ª persona masculino. pw-tr es interrogativo.", "id": "5.7", "g": "𓊪𓅱 𓏏𓂋 𓂋𓆑 𓇓𓅱"}, {"t": "tt", "ref": "Estela de Semna de Senuseret III (Berlín 1157)", "tr": "zꜣ.j pw|sꜣ.j pw", "es": "es mi hijo", "an": "zꜣ.j «mi hijo» (sufijo .j «mi») + pw «él / es»: oración nominal (tema 7).", "id": "5.8", "g": "𓅭𓀀 𓊪𓅱"}, {"t": "tt", "ref": "El campesino elocuente, passim", "tr": "sḫtj pn", "es": "este campesino", "an": "pn: demostrativo masculino singular «este», detrás del sustantivo.", "id": "5.9", "g": "𓇏𓏏𓏭𓀀 𓊪𓈖"}, {"t": "tt", "ref": "Papiro Westcar, passim", "vo": [["ḏd.jn", "entonces dijo"]], "tr": "ḏd.jn ḥm.f", "es": "Entonces dijo Su Majestad.", "an": "ḥm.f: «su majestad» (ḥm + sufijo .f). Es la manera de referirse al rey.", "id": "5.10", "g": "𓆓𓂧𓇋𓈖 𓍛𓆑"}, {"t": "tt", "ref": "Prólogo de las Enseñanzas de Ptahhotep", "tr": "ḥm n nṯr pn", "es": "la majestad de este dios", "an": "Genitivo indirecto n + demostrativo pn. «Este dios» es el rey.", "id": "5.11", "g": "𓍛 𓈖 𓊹 𓊪𓈖"}, {"t": "tt", "ref": "Himno a Osiris de la estela Louvre C 286, primera línea", "vo": [["jnḏ ḥr.k", "salve a ti (literalmente «saludado esté tu rostro»)"], ["nḥḥ", "eternidad"]], "tr": "jnḏ ḥr.k wsjr nb nḥḥ nswt nṯrw|jnḏ-ḥr.k wsjr nb nḥḥ nswt nṯrw", "es": "¡Salve a ti, Osiris, señor de la eternidad, rey de los dioses!", "an": "ḥr.k: sustantivo ḥr «rostro» + sufijo .k. Siguen aposiciones con genitivo directo.", "id": "5.12", "g": "𓇋𓈖𓂧 𓎛𓁷𓏤𓎡 𓊨𓁹𓀭 𓎟 𓎛𓎛𓇳 𓇓𓏏𓈖 𓊹𓊹𓊹"}, {"t": "tt", "ref": "Sinuhé B 78–79 (el príncipe Amunenshi acoge a Sinuhé)", "vo": [["rdj.n.f", "puso"], ["m ḥꜣt", "al frente de"], ["ẖrdw", "hijos"], ["mnj.n.f", "casó (literalmente «amarró»)"], ["wrt", "mayor (femenino)"]], "tr": "rdj.n.f wj m ḥꜣt ẖrdw.f mnj.n.f wj m zꜣt.f wrt|rdj.n.f wj m ḥꜣt ẖrdw.f mnj.n.f wj m sꜣt.f wrt", "es": "Me puso al frente de sus hijos y me casó con su hija mayor.", "an": "wj, pronombre dependiente de 1.ª persona, es el objeto de los dos verbos. ẖrdw.f «sus hijos», zꜣt.f «su hija»: sufijo .f.", "id": "5.13", "g": "𓂋𓂞𓈖𓆑 𓅱𓀀 𓅓 𓄂𓏏 𓄡𓂋𓂧𓀔𓏥𓆑 𓏠𓈖𓇋𓊧𓈖𓆑 𓅱𓀀 𓅓 𓅭𓏏𓁐𓆑 𓅨𓂋𓏏"}, {"t": "tt", "ref": "El campesino elocuente, passim (así se dirige el campesino a Rensi)", "tr": "jmj-r pr wr nb.j", "es": "Gran mayordomo, mi señor", "an": "nb.j: sustantivo + sufijo .j «mi». Toda la expresión es un vocativo.", "id": "5.14", "g": "𓄓 𓉐 𓅨𓂋 𓎟𓀀"}]}]}, "6": {"intro": "Adjetivos en epítetos, fórmulas y pasajes literarios: concordancia, nb «todo», ky «otro», comparación con r.", "secs": [{"id": "A", "title": "Translitera y traduce", "items": [{"t": "tt", "ref": "Epíteto de Osiris y de otros dioses en estelas", "tr": "nṯr ꜥꜣ", "es": "el gran dios", "an": "El adjetivo va detrás del sustantivo y concuerda con él (masc. sing.).", "id": "6.1", "g": "𓊹 𓉻𓂝"}, {"t": "tt", "ref": "Epíteto real (passim)", "tr": "nṯr nfr nb tꜣwj", "es": "el dios perfecto, señor de las Dos Tierras", "an": "nṯr nfr: sustantivo + adjetivo. Le sigue una aposición.", "id": "6.2", "g": "𓊹 𓄤 𓎟 𓇾𓇾"}, {"t": "tt", "ref": "Himnos y fórmulas de ofrenda", "tr": "nṯrw nbw", "es": "todos los dioses", "an": "nb «todo» se comporta como adjetivo: concuerda en plural masculino (nbw).", "id": "6.3", "g": "𓊹𓊹𓊹 𓎟𓅱𓏥"}, {"t": "tt", "ref": "Fórmula de ofrenda: «… toda cosa buena y pura»", "tr": "ḫt nbt nfrt wꜥbt", "es": "toda cosa buena y pura", "an": "ḫt «cosa» es femenino: todos los adjetivos llevan -t.", "id": "6.4", "g": "𓐍𓏏 𓎟𓏏 𓄤𓏏 𓃂𓏏"}, {"t": "tt", "ref": "El náufrago 48–49", "vo": [["jꜣqt", "verduras"]], "tr": "jꜣqt nbt špst", "es": "toda clase de verduras finas", "an": "Colectivo femenino: nbt y špst concuerdan en femenino.", "id": "6.5", "g": "𓇋𓄿𓈎𓏏𓆰𓏥 𓎟𓏏 𓈙𓊪𓋴𓏏"}, {"t": "tt", "ref": "Inscripciones reales (fórmulas de dominio universal)", "tr": "tꜣw nbw ḫꜣswt nbt", "es": "todas las tierras y todos los países extranjeros", "an": "tꜣw es masculino plural → nbw; ḫꜣswt es femenino → nbt. El femenino plural suele usar la forma singular del adjetivo.", "id": "6.6", "g": "𓇾𓅱𓏥 𓎟𓅱 𓆼𓄿𓋴𓏏𓈉𓏥 𓎟𓏏"}, {"t": "tt", "ref": "Nombre de Horus de Tutmosis III", "vo": [["ḫꜥ", "que aparece (participio)"], ["wꜣst", "Tebas"]], "tr": "kꜣ nḫt ḫꜥ m wꜣst", "es": "Toro victorioso que aparece en Tebas", "an": "kꜣ nḫt: sustantivo + adjetivo; luego un participio con complemento.", "id": "6.7", "g": "𓃒 𓈖𓆱𓐍𓏏𓂡 𓈍𓂝 𓅓 𓋆𓏏𓊖"}, {"t": "tt", "ref": "Epíteto de Ptah (passim)", "tr": "nfr ḥr", "es": "el de rostro perfecto, hermoso de rostro", "an": "Construcción adjetivo + sustantivo («bueno en cuanto al rostro»): el adjetivo funciona como sustantivo y el segundo término lo especifica.", "id": "6.8", "g": "𓄤 𓁷𓏤"}, {"t": "tt", "ref": "Papiro Westcar y textos administrativos", "tr": "pr ꜥꜣ|pr-ꜥꜣ", "es": "la Gran Casa, el palacio", "an": "Sustantivo + adjetivo. Más tarde designará al propio rey («faraón»).", "id": "6.9", "g": "𓉐 𓉻𓂝"}, {"t": "tt", "ref": "Enseñanza para Merikare (E 32)", "vo": [["mdt", "palabra, discurso"], ["ꜥḥꜣ", "combate"]], "tr": "wsr mdt r ꜥḥꜣ nb", "es": "La palabra es más poderosa que cualquier combate.", "an": "Comparación: adjetivo + r «más que». Es una oración adjetival (tema 7): el adjetivo va primero como predicado.", "id": "6.10", "g": "𓄊𓋴𓂋 𓌃𓂧𓏏𓀁 𓂋 𓂚 𓎟"}, {"t": "tt", "ref": "Glosas de los Textos de los Sarcófagos y del Libro de los Muertos", "tr": "ky ḏd", "es": "otra versión (literalmente «otro decir»)", "an": "ky «otro» va delante del sustantivo, a diferencia de casi todos los adjetivos.", "id": "6.11", "g": "𓎡𓇋𓇋 𓆓𓂧"}, {"t": "tt", "ref": "El náufrago 65–66", "vo": [["jnḥwj", "las dos cejas"], ["ḫsbḏ", "lapislázuli"]], "tr": "jnḥwj.f m ḫsbḏ mꜣꜥ", "es": "Sus cejas eran de lapislázuli auténtico.", "an": "mꜣꜥ «verdadero» sigue al sustantivo. m indica el material (tema 8).", "id": "6.12", "g": "𓇋𓈖𓎛𓅱𓂃𓂃𓆑 𓅓 𓐍𓋴𓃀𓆓𓈓 𓐙𓂝"}, {"t": "tt", "ref": "Fórmula real tras el nombre del rey (passim)", "vo": [["dj", "dotado de (participio pasivo)"]], "tr": "dj ꜥnḫ mj rꜥ ḏt", "es": "dotado de vida como Ra, para siempre", "an": "mj «como»; ḏt es un sustantivo usado como adverbio.", "id": "6.13", "g": "𓏙 𓋹𓈖𓐍 𓏇𓇋 𓂋𓂝𓇳 𓆓𓏏𓇿"}, {"t": "tt", "ref": "Sinuhé B 79 (fragmento)", "tr": "zꜣt.f wrt|sꜣt.f wrt", "es": "su hija mayor", "an": "El adjetivo wr toma la -t del femenino: wrt.", "id": "6.14", "g": "𓅭𓏏𓁐𓆑 𓅨𓂋𓏏"}, {"t": "tt", "ref": "Nombre de trono de Tutmosis I", "tr": "ꜥꜣ-ḫpr-kꜣ-rꜥ|ꜥꜣ ḫpr kꜣ rꜥ", "es": "Grande es la forma del ka de Ra", "an": "Adjetivo ꜥꜣ en función de predicado + sujeto. Lo verás como oración en el tema 7.", "id": "6.15", "g": "𓍹 𓇳 𓉻𓂝 𓆣 𓂓 𓍺"}]}]}, "7": {"intro": "Oraciones adjetivales y nominales, el corazón de los textos sapienciales y de las autopresentaciones. Subraya mentalmente el predicado de cada frase.", "secs": [{"id": "A", "title": "Nombres reales que son oraciones", "items": [{"t": "tt", "ref": "Nombre de trono del rey de la IV dinastía constructor de la tercera pirámide de Guiza", "tr": "mn-kꜣw-rꜥ|mn kꜣw rꜥ", "es": "Permanentes son los kas de Ra (Micerino)", "an": "Oración adjetival: predicado mn «permanente» + sujeto kꜣw rꜥ. Ra se escribe primero por anteposición honorífica.", "id": "7.1", "g": "𓍹 𓇳 𓏠 𓂓𓂓𓂓 𓍺"}, {"t": "tt", "ref": "Nombre de trono de Pepi II", "tr": "nfr-kꜣ-rꜥ|nfr kꜣ rꜥ", "es": "Perfecto es el ka de Ra", "an": "Adjetival: nfr + sujeto kꜣ rꜥ.", "id": "7.2", "g": "𓍹 𓇳 𓄤 𓂓 𓍺"}, {"t": "tt", "ref": "Nombre de trono de Senuseret III", "tr": "ḫꜥ-kꜣw-rꜥ|ḫꜥ kꜣw rꜥ", "es": "Los kas de Ra aparecen gloriosos", "an": "ḫꜥ «aparecer, brillar» como predicado; sujeto kꜣw rꜥ.", "id": "7.3", "g": "𓍹 𓇳 𓈍 𓂓𓂓𓂓 𓍺"}, {"t": "tt", "ref": "Nombre de trono de Tutmosis III", "tr": "mn-ḫpr-rꜥ|mn ḫpr rꜥ", "es": "Permanente es la manifestación de Ra", "an": "Adjetival: mn + ḫpr rꜥ.", "id": "7.4", "g": "𓍹 𓇳 𓏠 𓆣 𓍺"}, {"t": "tt", "ref": "Nombre de trono de Amenhotep III", "tr": "nb-mꜣꜥt-rꜥ|nb mꜣꜥt rꜥ", "es": "Ra es señor de Maat", "an": "Oración nominal: sujeto rꜥ + predicado nb mꜣꜥt.", "id": "7.5", "g": "𓍹 𓇳 𓆄 𓎟 𓍺"}, {"t": "tt", "ref": "Nombre de trono de Mentuhotep II", "tr": "nb-ḥpt-rꜥ|nb ḥpt rꜥ", "es": "Ra es señor del timón", "an": "Oración nominal: sujeto rꜥ + predicado nb ḥpt. El signo del remo 𓊤, que en mꜣꜥ-ḫrw se lee ḫrw, aquí se lee ḥpt «timón».", "id": "7.6", "g": "𓍹 𓇳 𓎟 𓊤 𓍺"}, {"t": "tt", "ref": "Nombre de trono de Senuseret II", "tr": "ḫꜥ-ḫpr-rꜥ|ḫꜥ ḫpr rꜥ", "es": "Aparece gloriosa la manifestación de Ra", "an": "Predicado ḫꜥ + sujeto ḫpr rꜥ.", "id": "7.7", "g": "𓍹 𓇳 𓈍𓂝 𓆣 𓍺"}]}, {"id": "B", "title": "Translitera y traduce", "items": [{"t": "tt", "ref": "Sinuhé B 84 (descripción de la tierra de Yaa)", "vo": [["ꜥšꜣ", "abundante"], ["bjt", "miel"], ["bꜣq", "aceite de oliva"]], "tr": "ꜥšꜣ bjt.f ꜥšꜣ bꜣq.f", "es": "Abundante era su miel, abundante su aceite.", "an": "Dos oraciones adjetivales: predicado ꜥšꜣ + sujeto. El sufijo .f es la tierra.", "id": "7.8", "g": "𓂝𓈙𓄿𓏥 𓆤𓏏𓏊𓆑 𓂝𓈙𓄿𓏥 𓅡𓄿𓈎𓎯𓆑"}, {"t": "tt", "ref": "Sinuhé B 47–48 (sobre Senuseret I)", "vo": [["grt", "además, en verdad"], ["nn snnw.f", "sin igual (literalmente «no hay su segundo»)"]], "tr": "nṯr pw grt nn snnw.f", "es": "Es un dios, en verdad, que no tiene igual.", "an": "Oración nominal con pw: «un dios (es) él».", "id": "7.9", "g": "𓊹𓀭 𓊪𓅱 𓎼𓂋𓏏 𓂜𓈖 𓌢𓈖𓈖𓅱𓀀𓆑"}, {"t": "tt", "ref": "El campesino elocuente B1, 62–63", "vo": [["n", "pues (conjunción)"], ["nmḥ", "huérfano"], ["hꜣj", "marido"], ["ḫꜣrt", "viuda"]], "tr": "n ntk jt n nmḥ hꜣj n ḫꜣrt", "es": "Pues tú eres padre para el huérfano, marido para la viuda.", "an": "Oración nominal con pronombre independiente ntk como sujeto: «tú (eres) padre…». El primer n es una conjunción; los otros, la preposición «para».", "id": "7.10", "g": "𓈖 𓈖𓏏𓎡 𓇋𓏏𓆑𓀀 𓈖 𓈖𓅓𓎛𓀀 𓉔𓄿𓇋𓀀 𓈖 𓆼𓄿𓂋𓏏𓁐"}, {"t": "tt", "ref": "Enseñanza para Merikare (E 32)", "vo": [["ḫpš", "brazo fuerte, fuerza"]], "tr": "ḫpš pw n nswt ns.f", "es": "La fuerza de un rey es su lengua.", "an": "Nominal A pw B: «una fuerza para el rey (es) su lengua».", "id": "7.11", "g": "𓐍𓊪𓈙𓄗 𓊪𓅱 𓈖 𓇓𓏏𓈖 𓄓𓏤𓆑"}, {"t": "tt", "ref": "Estela de Semna de Senuseret III (Berlín 1157)", "vo": [["kꜣꜣt", "lo que planea"], ["ḫprt", "lo que sucede"]], "tr": "kꜣꜣt jb.j pw ḫprt m ꜥ.j", "es": "Lo que planea mi corazón es lo que se cumple por mi mano.", "an": "A pw B con dos expresiones verbales sustantivadas.", "id": "7.12", "g": "𓂓𓄿𓄿𓏏𓀁 𓄣𓏤𓀀 𓊪𓅱 𓆣𓂋𓏏 𓅓 𓂝𓀀"}, {"t": "tt", "ref": "Libro de los Muertos, cap. 17 (respuesta de una glosa)", "tr": "rꜥ pw", "es": "Es Ra.", "an": "Nominal mínima: sustantivo + pw. Responde a preguntas como pw-tr r.f sw «¿quién es él?».", "id": "7.13", "g": "𓂋𓂝𓇳𓀭 𓊪𓅱"}, {"t": "tt", "ref": "Libro de los Muertos, cap. 17 (y Textos de los Sarcófagos 335)", "vo": [["ḫꜥw", "apariciones"], ["tpjw", "primeras (nisbe)"]], "tr": "jnk rꜥ m ḫꜥw.f tpjw", "es": "Yo soy Ra en sus primeras apariciones.", "an": "jnk + sustantivo: oración nominal. m ḫꜥw.f amplía el predicado.", "id": "7.14", "g": "𓇋𓈖𓎡 𓂋𓂝𓇳𓀭 𓅓 𓈍𓂝𓅱𓏥𓆑 𓁶𓊪𓅱𓏭𓏥"}, {"t": "tt", "ref": "Libro de los Muertos, cap. 17", "vo": [["ḫpr", "que llegó a ser (participio)"], ["ḏs.f", "él mismo"]], "tr": "jnk nṯr ꜥꜣ ḫpr ḏs.f", "es": "Yo soy el gran dios que llegó a existir por sí mismo.", "an": "Nominal con jnk; el predicado es nṯr ꜥꜣ ampliado con un participio.", "id": "7.15", "g": "𓇋𓈖𓎡 𓊹𓀭 𓉻𓂝 𓆣𓂋𓂻 𓆓𓋴𓆑"}]}]}, "8": {"intro": "Preposiciones, nisbes y adverbios en El náufrago, Sinuhé, estelas y Textos de los Sarcófagos. En el vocabulario se dan las formas verbales que aún no conoces.", "secs": [{"id": "A", "title": "Translitera y traduce", "items": [{"t": "tt", "ref": "El náufrago 25–27", "vo": [["hꜣ.kw", "bajé (estativo, tema 17)"], ["ꜣw", "longitud"], ["sḫw", "anchura"], ["120 / 40", "𓍢𓎆𓎆 / 𓎆𓎆𓎆𓎆"]], "tr": "hꜣ.kw r wꜣḏ-wr m dpt nt mḥ 120 m ꜣw.s mḥ 40 m sḫw.s", "es": "Bajé al mar en un barco de 120 codos de largo y 40 codos de ancho.", "an": "r «hacia», m «en», nt genitivo femenino (dpt es femenino), m «en cuanto a» con sufijo .s «su (del barco)».", "id": "8.1", "g": "𓉔𓄿𓂻𓎡𓅱 𓂋 𓇅𓅨𓂋𓈗 𓅓 𓂧𓊪𓏏𓊛 𓈖𓏏 𓂣 𓍢𓎆𓎆 𓅓 𓄿𓅱𓏛𓋴 𓂣 𓎆𓎆𓎆𓎆 𓅓 𓋴𓐍𓅱𓏛𓋴"}, {"t": "tt", "ref": "El náufrago 27–28", "vo": [["skdw", "marineros"], ["stp", "lo escogido, la élite"]], "tr": "skdw 120 jm.s m stp n kmt", "es": "Había en él 120 marineros de lo mejor de Egipto.", "an": "jm.s: preposición m con sufijo («en ella», el barco). m stp n: «de lo escogido de».", "id": "8.2", "g": "𓋴𓎡𓂧𓊛𓀀𓏥 𓍢𓎆𓎆 𓇋𓅓𓋴 𓅓 𓍉𓏏𓊪 𓈖 𓆎𓏏𓊖"}, {"t": "tt", "ref": "El náufrago 47–48", "vo": [["gm.n.j", "encontré"], ["dꜣbw", "higos"], ["jꜣrrt", "uvas"]], "tr": "gm.n.j dꜣbw jꜣrrt jm", "es": "Encontré allí higos y uvas.", "an": "jm «allí» es un adverbio: la forma de la preposición m sin complemento.", "id": "8.3", "g": "𓅠𓅓𓈖𓀀 𓂧𓄿𓃀𓅱𓆭𓏥 𓇋𓄿𓂋𓂋𓏏𓇭 𓇋𓅓"}, {"t": "tt", "ref": "El náufrago 49–50", "vo": [["kꜣw", "higos de sicomoro"], ["nqwt", "higos de sicomoro sajados"]], "tr": "kꜣw jm ḥnꜥ nqwt", "es": "Había allí higos de sicomoro y higos sajados.", "an": "ḥnꜥ «junto con, y» coordina sustantivos.", "id": "8.4", "g": "𓂓𓅱𓆭𓏥 𓇋𓅓 𓎛𓈖𓂝 𓈖𓈎𓅱𓏏𓆭𓏥"}, {"t": "tt", "ref": "El náufrago 56", "vo": [["jr.n.j", "hice"], ["sbt", "ofrenda quemada"]], "tr": "jr.n.j sbt n nṯrw", "es": "Hice una ofrenda quemada a los dioses.", "an": "n «para, a» introduce al destinatario.", "id": "8.5", "g": "𓁹𓈖𓀀 𓋴𓃀𓏏𓊮 𓈖 𓊹𓊹𓊹"}, {"t": "tt", "ref": "Sinuhé B 85", "vo": [["dqrw", "frutos"]], "tr": "dqrw nb ḥr ḫt.f|dqr nb ḥr ḫt.f", "es": "Toda clase de frutos estaba en sus árboles.", "an": "ḥr «sobre, en» + ḫt.f «sus árboles».", "id": "8.6", "g": "𓂧𓈎𓂋𓆭𓏥 𓎟 𓁷𓏤 𓆱𓏏𓏥𓆑"}, {"t": "tt", "ref": "Fórmula habitual de las estelas", "vo": [["jmꜣḫy", "venerado"]], "tr": "jmꜣḫy ḫr nṯr ꜥꜣ nb pt", "es": "venerado ante el gran dios, señor del cielo", "an": "ḫr «ante, junto a» (en presencia de una persona importante).", "id": "8.7", "g": "𓄪𓇋𓇋 𓐍𓂋 𓊹 𓉻𓂝 𓎟 𓊪𓏏𓇯"}, {"t": "tt", "ref": "El náufrago 64–65 (la serpiente)", "vo": [["ḥꜥw", "cuerpo"], ["sḫr", "recubierto"]], "tr": "ḥꜥw.f sḫr m nbw", "es": "Su cuerpo estaba recubierto de oro.", "an": "m introduce el material.", "id": "8.8", "g": "𓎛𓂝𓅱𓄹𓏥𓆑 𓋴𓐍𓂋 𓅓 𓋞"}, {"t": "tt", "ref": "El náufrago 21–22", "vo": [["sḏd.j", "que te cuente"], ["r.f", "pues"], ["mjtt", "algo semejante"]], "tr": "sḏd.j r.f n.k mjtt jrj", "es": "Déjame contarte algo semejante.", "an": "n.k «a ti». jrj es una nisbe de r: «relativo a ello, semejante».", "id": "8.9", "g": "𓋴𓆓𓂧𓀁𓀀 𓂋𓆑 𓈖𓎡 𓏇𓏏𓏏𓏛 𓁹𓂋𓏭"}, {"t": "tt", "ref": "Epíteto de Osiris (Abidos)", "tr": "ḫntj jmntjw", "es": "el que preside a los occidentales", "an": "ḫntj: nisbe de la preposición ḫnt «delante de»: «el que está delante». Los «occidentales» son los muertos.", "id": "8.10", "g": "𓏃𓈖𓏏𓏭 𓋀𓏏𓏭𓀀𓏥"}, {"t": "tt", "ref": "Fórmula de ofrenda típica de las estelas de Abidos (Reino Medio)", "vo": [["dj.f", "que él dé (forma relativa imperfectiva)"], ["prt-ḫrw", "ofrenda invocada"]], "tr": "ḥtp-dj-nswt wsjr nb ḏdw dj.f prt-ḫrw t ḥnqt kꜣ ꜣpd n kꜣ n jmꜣḫy", "es": "Ofrenda que da el rey (y) Osiris, señor de Busiris, para que dé una ofrenda invocada de pan, cerveza, bueyes y aves al ka del venerado.", "an": "n kꜣ n jmꜣḫy: preposición n «para» + genitivo indirecto n. dj.f se analiza mejor como forma relativa: «que él da».", "id": "8.11", "g": "𓇓𓏏𓈖 𓊵𓏏𓊪 𓏙 𓊨𓁹𓀭 𓎟 𓊽𓊽𓂧𓅱𓊖 𓏙𓆑 𓉐𓂋𓏏𓊤 𓏐𓏊 𓃾 𓅾 𓈖 𓂓𓏤 𓈖 𓄪𓇋𓇋"}, {"t": "tt", "ref": "El náufrago 34–35 (la tormenta)", "vo": [["nwyt", "ola"]], "tr": "nwyt jm.f nt mḥ 8", "es": "Había en ella una ola de ocho codos.", "an": "jm.f: preposición m + sufijo («en él», el viento). nt mḥ 8: genitivo indirecto femenino.", "id": "8.12", "g": "𓈖𓅱𓏭𓏏𓈗 𓅓𓆑 𓈖𓏏 𓂣 𓏤𓏤𓏤𓏤𓏤𓏤𓏤𓏤"}, {"t": "tt", "ref": "Autobiografía de Harjuf (Asuán)", "vo": [["rdj.n.j", "di"]], "tr": "rdj.n.j tꜣ n ḥqr ḥbs n ḥꜣy|rdj.n.j tꜣ n ḥqr ḥbsw n ḥꜣy", "es": "Di pan al hambriento y ropa al desnudo.", "an": "Dos veces n «a, para». Es la declaración de virtud típica de las autobiografías, que se repitió durante siglos.", "id": "8.13", "g": "𓂋𓂞𓈖𓀀 𓏏𓄿𓏐 𓈖 𓎛𓈎𓂋𓀁 𓎛𓃀𓋴𓋳 𓈖 𓎛𓄿𓇋𓇋𓀀"}, {"t": "tt", "ref": "Textos de las Pirámides y de los Sarcófagos (passim)", "tr": "nṯrw jmjw pt", "es": "los dioses que están en el cielo", "an": "jmjw: nisbe plural de la preposición m: «los que están en».", "id": "8.14", "g": "𓊹𓊹𓊹 𓇋𓅓𓏭𓅱 𓊪𓏏𓇯"}, {"t": "tt", "ref": "Título militar (estelas y textos históricos)", "tr": "jmj-r mšꜥ", "es": "general (literalmente «el que está en la boca del ejército»)", "an": "jmj-r: nisbe jmj + r «boca»: «supervisor».", "id": "8.15", "g": "𓄓 𓀎𓏥"}, {"t": "tt", "ref": "Epíteto del dios creador en Textos de los Sarcófagos e himnos", "tr": "nb-r-ḏr|nb r ḏr", "es": "el Señor de Todo", "an": "r-ḏr «hasta el límite, entero»: preposición r + sustantivo ḏr.", "id": "8.16", "g": "𓎟 𓂋 𓇥𓂋𓏛"}]}]}, "9": {"intro": "Números, fechas y cantidades en documentos reales: estelas fechadas, fórmulas de ofrenda, relatos y autobiografías.", "secs": [{"id": "A", "title": "Lee las cifras", "items": [{"t": "mc", "q": "¿Qué número está escrito?", "op": ["232", "322", "223", "2320"], "ok": 0, "an": "𓍢 = 100 (dos veces), 𓎆 = 10 (tres veces), 𓏤 = 1 (dos veces): 200 + 30 + 2. Las cifras se escriben de mayor a menor.", "id": "9.1", "g": "𓍢𓍢 𓎆𓎆𓎆 𓏤𓏤"}, {"t": "mc", "q": "¿Qué número está escrito?", "op": ["1115", "1150", "11 015", "215"], "ok": 0, "an": "𓆼 = 1000, 𓍢 = 100, 𓎆 = 10 y cinco trazos: 1000 + 100 + 10 + 5.", "id": "9.2", "g": "𓆼 𓍢 𓎆 𓏤𓏤𓏤𓏤𓏤"}, {"t": "mc", "q": "¿Qué fracción es?", "op": ["1/3", "3", "2/3", "1/30"], "ok": 0, "an": "𓂋 (r, «parte») sobre un número indica la fracción con numerador 1: r 3 = 1/3.", "id": "9.3", "g": "𓂋 𓏤𓏤𓏤"}, {"t": "mc", "q": "¿Qué fracción representa este signo?", "op": ["1/2 (gs)", "1/4", "2/3", "1/10"], "ok": 0, "an": "𓐛 gs «lado, mitad» = 1/2.", "id": "9.4", "g": "𓐛"}]}, {"id": "B", "title": "Translitera y traduce", "items": [{"t": "tt", "ref": "Estela de Semna de Senuseret III (Berlín 1157), línea 1", "vo": [["rnpt-zp", "año de reinado"], ["ꜣbd", "mes"], ["prt", "estación de la siembra"]], "tr": "rnpt-zp 16 ꜣbd 3 prt", "es": "Año de reinado 16, tercer mes de la estación de la siembra", "an": "Las fechas dan año de reinado, mes (1 a 4) y una de las tres estaciones. El número sigue al sustantivo.", "id": "9.5", "g": "𓆳𓏏𓏤 𓎆𓏤𓏤𓏤𓏤𓏤𓏤 𓇹𓇼 𓏤𓏤𓏤 𓉐𓂋𓏏𓇳"}, {"t": "tt", "ref": "Fórmula de ofrenda (estelas del Reino Medio)", "vo": [["ḫꜣ", "mil"]], "tr": "ḫꜣ m t ḫꜣ m ḥnqt ḫꜣ m kꜣ ꜣpd", "es": "mil (raciones) de pan, mil de cerveza, mil de bueyes y aves", "an": "ḫꜣ m: «mil de». La m es partitiva. Es lo que el difunto pide que se le recite.", "id": "9.6", "g": "𓆼 𓅓 𓏐 𓆼 𓅓 𓏊 𓆼 𓅓 𓃾 𓅾"}, {"t": "tt", "ref": "Autobiografía de Harjuf (Asuán), tercer viaje a Yam", "vo": [["hꜣ.n.j", "bajé"], ["ꜥꜣ", "asno"]], "tr": "hꜣ.n.j ḥnꜥ ꜥꜣ 300", "es": "Bajé (el río) con 300 asnos.", "an": "El número va detrás del sustantivo, que suele quedar en singular.", "id": "9.7", "g": "𓉔𓄿𓂻𓈖𓀀 𓎛𓈖𓂝 𓃘𓏥 𓍢𓍢𓍢"}, {"t": "tt", "ref": "Papiro Westcar 7,2–3 (el mago Dyedi)", "vo": [["jw.f wnm.f", "come"], ["ḫpš", "pata (de buey)"], ["jwf", "carne"], ["swr.f", "bebe"], ["ds", "jarra"]], "tr": "jw.f wnm.f t 500 ḫpš m jwf ḥnꜥ swr.f ḥnqt ds 100|jw.f wnm.f t 500 ḫpš m jwf ḥnꜥ swr ḥnqt ds 100", "es": "Come quinientos panes y una pata de buey en carne, y bebe cien jarras de cerveza.", "an": "t 500, ds 100: sustantivo + número. ḥnqt ds 100: «cerveza: 100 jarras», con la unidad de medida detrás de la mercancía.", "id": "9.8", "g": "𓃛𓅱𓆑 𓅱𓈖𓅓𓆑 𓏐 𓍢𓍢𓍢𓍢𓍢 𓐍𓊪𓈙𓄗 𓅓 𓇋𓅱𓆑𓄹 𓎛𓈖𓂝 𓋴𓅱𓂋𓆑 𓎛𓈖𓈎𓏏𓏊 𓂧𓋴𓏊 𓍢"}]}, {"id": "C", "title": "Ordinales", "items": [{"t": "tt", "ref": "Inscripciones de Amenhotep III sobre su primer jubileo (tumba de Jeruef y Soleb)", "vo": [["ḥb-sd", "fiesta Sed (jubileo)"], ["tpj", "primero"]], "tr": "ḥb-sd tpj", "es": "el primer jubileo", "an": "tpj «primero» es una nisbe de tp «cabeza» y se comporta como adjetivo: va detrás.", "id": "9.9", "g": "𓎱𓉳 𓁶𓊪𓅱𓏭"}, {"t": "tt", "ref": "Textos de la creación (Textos de los Sarcófagos, inscripciones de templos)", "tr": "zp tpj|sp tpj", "es": "la Primera Vez (el momento de la creación)", "an": "zp «ocasión» + tpj «primero». Es la expresión egipcia para el principio del mundo.", "id": "9.10", "g": "𓊗𓊪 𓁶𓊪𓅱𓏭"}]}]}, "10": {"intro": "Oraciones adverbiales: sujeto + predicado preposicional o adverbial, con o sin jw. Fuentes: Sinuhé, el Diálogo del desesperado, el papiro Westcar, los Textos de las Pirámides, el Gran Himno a Atón y nombres reales.", "secs": [{"id": "A", "title": "Translitera y traduce", "items": [{"t": "tt", "ref": "Sinuhé B 85–86 (la tierra de Yaa)", "vo": [["jt", "cebada"], ["bdt", "escanda"]], "tr": "jw jt jm ḥnꜥ bdt", "es": "Había allí cebada y escanda.", "an": "jw + sujeto + adverbio jm: «existía allí». ḥnꜥ coordina.", "id": "10.1", "g": "𓃛𓅱 𓇋𓏏𓇠 𓇋𓅓 𓎛𓈖𓂝 𓃀𓂧𓏏𓇣"}, {"t": "tt", "ref": "Diálogo del desesperado con su ba 130–131", "vo": [["mwt", "muerte"], ["mjn", "hoy"], ["snb", "curación"], ["mr", "enfermo"]], "tr": "mwt m ḥr.j mjn mj snb mr", "es": "La muerte está hoy ante mí como la curación de un enfermo.", "an": "Sin jw: sujeto mwt + predicado m ḥr.j «ante mí»; mjn es adverbio. mj introduce la comparación.", "id": "10.2", "g": "𓅓𓅱𓏏𓀐 𓅓 𓁷𓏤𓀀 𓅓𓇋𓈖𓇳 𓏇𓇋 𓋴𓈖𓃀 𓌻𓂋𓀉"}, {"t": "tt", "ref": "Nombre de un hijo de Ramsés II (Amenherjepeshef)", "vo": [["ḫpš", "brazo fuerte"]], "tr": "jmn-ḥr-ḫpš.f|jmn ḥr ḫpš.f", "es": "Amón está sobre su brazo fuerte", "an": "Sujeto jmn + predicado ḥr ḫpš.f.", "id": "10.3", "g": "𓇋𓏠𓈖 𓁷𓏤 𓐍𓊪𓈙𓄗𓆑"}, {"t": "tt", "ref": "Gran Himno a Atón (tumba de Ay en Amarna)", "vo": [["ḥtp.k", "cuando te pones"], ["jmntt", "occidental"], ["kkw", "oscuridad"], ["sḫr", "manera"], ["mt", "muerte"]], "tr": "ḥtp.k m ꜣḫt jmntt tꜣ m kkw m sḫr mt", "es": "Cuando te pones en el horizonte occidental, la tierra queda en tinieblas, a la manera de la muerte.", "an": "tꜣ m kkw: oración adverbial sin jw. Depende de la primera parte (ḥtp.k «cuando te pones»).", "id": "10.4", "g": "𓊵𓏏𓊪𓎡 𓅓 𓅜𓐍𓏏𓈌 𓋀𓏏 𓇾𓏤 𓅓 𓎡𓎡𓅱𓇰 𓅓 𓋴𓐍𓂋𓏛 𓅓𓏏𓀐"}, {"t": "tt", "ref": "Papiro Westcar 7,17–18 (Dyedefhor saluda al mago Dyedi)", "vo": [["ḫrt", "estado, condición"], ["tp-ꜥ", "antes de"], ["jꜣw", "vejez"]], "tr": "jw ḫrt.k mj ꜥnḫ tp-ꜥ jꜣw", "es": "Tu estado es como el de quien vive antes de la vejez.", "an": "jw + sujeto ḫrt.k + predicado mj ꜥnḫ «como un vivo».", "id": "10.5", "g": "𓃛𓅱 𓐍𓂋𓏏𓏛𓎡 𓏇𓇋 𓋹𓈖𓐍 𓁶𓂝 𓀗𓅱𓏲"}, {"t": "tt", "ref": "Textos de las Pirámides, conjuro 213 (Pyr. 135)", "vo": [["ꜥwj", "los dos brazos"], ["jtm", "Atum"], ["ẖt", "vientre"]], "tr": "ꜥwj.k m jtm ẖt.k m jtm", "es": "Tus brazos son Atum, tu vientre es Atum.", "an": "m de identidad: «en (forma de) Atum». Cada parte del rey muerto se identifica con el dios.", "id": "10.6", "g": "𓂝𓂝𓎡 𓅓 𓇋𓏏𓅓𓀭 𓄡𓏏𓎡 𓅓 𓇋𓏏𓅓𓀭"}, {"t": "tt", "ref": "Gran Himno a Atón", "tr": "tꜣ m kkw", "es": "La tierra está en tinieblas.", "an": "La oración adverbial mínima: sujeto + m + sustantivo.", "id": "10.7", "g": "𓇾𓏤 𓅓 𓎡𓎡𓅱𓇰"}]}, {"id": "B", "title": "Análisis", "items": [{"t": "mc", "q": "En jw jt jm ḥnꜥ bdt (Sinuhé B 85–86), ¿cuál es el predicado?", "op": ["jm «allí»", "jt «cebada»", "jw", "ḥnꜥ bdt «y escanda»"], "ok": 0, "an": "El predicado de una oración adverbial es la expresión adverbial o preposicional: jm. jw introduce la oración; jt ḥnꜥ bdt es el sujeto.", "id": "10.8"}, {"t": "mc", "q": "¿Por qué mwt m ḥr.j mjn no lleva jw?", "op": ["Porque jw no es obligatorio: la oración adverbial puede ir sin él", "Porque está en pasado", "Porque mwt es femenino", "Porque es una pregunta"], "ok": 0, "an": "jw añade una afirmación sobre la situación, pero muchas oraciones adverbiales, sobre todo en poesía, van sin él.", "id": "10.9"}]}]}, "11": {"intro": "Negación y preguntas en oraciones no verbales: nn, n … js y las partículas interrogativas.", "secs": [{"id": "A", "title": "Translitera y traduce", "items": [{"t": "tt", "ref": "Enseñanzas de Ptahhotep 56", "vo": [["ḥmww", "artesano"], ["ꜥpr", "completo, equipado"], ["ꜣḫw", "maestría, eficacia"]], "tr": "nn ḥmww ꜥpr ꜣḫw.f", "es": "No hay artesano cuya maestría sea completa.", "an": "nn + sustantivo: «no existe». ꜥpr ꜣḫw.f califica al artesano («completo en cuanto a su maestría»).", "id": "11.1", "g": "𓂜𓈖 𓍍𓅱𓅱𓀀 𓂝𓊪𓂋𓏛 𓅜𓐍𓅱𓏛𓆑"}, {"t": "tt", "ref": "Sinuhé B 48 (elogio de Senuseret I)", "vo": [["ky", "otro"], ["ḫpr", "que existiera"], ["ḥr-ḥꜣt", "antes de"]], "tr": "nn ky ḫpr ḥr-ḥꜣt.f", "es": "No hubo otro que existiera antes que él.", "an": "nn ky: «no hay otro». ḫpr es un participio que califica a ky.", "id": "11.2", "g": "𓂜𓈖 𓎡𓇋𓇋 𓆣𓂋 𓁷𓏤 𓄂𓏏𓆑"}, {"t": "tt", "ref": "Enseñanza de Amenemhat I a su hijo, §3", "vo": [["mḥ-jb", "persona de confianza"], ["hrw", "día"], ["qsn", "desgracia"]], "tr": "nn mḥ-jb m hrw qsn", "es": "No hay hombre de confianza en el día de la desgracia.", "an": "nn + sustantivo + complemento adverbial.", "id": "11.3", "g": "𓂜𓈖 𓎔𓄣 𓅓 𓉔𓂋𓅱𓇳 𓈎𓋴𓈖𓅪"}, {"t": "tt", "ref": "Libro de los Muertos, cap. 17 (pregunta de las glosas)", "vo": [["jšst", "¿qué?"], ["r.f", "pues"]], "tr": "jšst r.f sj", "es": "¿Qué es eso, pues?", "an": "Pregunta nominal: interrogativo jšst + pronombre dependiente sj.", "id": "11.4", "g": "𓇋𓋴𓋴𓏏𓏛 𓂋𓆑 𓋴𓇋"}]}, {"id": "B", "title": "Análisis", "items": [{"t": "mc", "q": "¿Cuál es la diferencia entre nn ḥmww «no hay artesano» y n ḥmww js pw «no es un artesano»?", "op": ["nn niega la existencia; n … js niega una oración nominal", "Ninguna: son sinónimos", "nn es pasado y n … js presente", "n … js solo se usa con verbos"], "ok": 0, "an": "nn + sustantivo niega que algo exista. n … js niega la oración nominal: js va tras la primera palabra del predicado.", "id": "11.5"}, {"t": "mc", "q": "¿Qué hace la partícula jn al principio de una oración no verbal?", "op": ["La convierte en pregunta de sí o no", "La niega", "Indica pasado", "Introduce un vocativo"], "ok": 0, "an": "jn + oración = pregunta: «¿es…?». Además, jn introduce el agente: «por».", "id": "11.6"}]}]}, "12": {"intro": "Oraciones subordinadas no verbales: relativas con ntj y jwtj, y oraciones circunstanciales sin verbo.", "secs": [{"id": "A", "title": "Translitera y traduce", "items": [{"t": "tt", "ref": "Fórmula autobiográfica del Imperio Antiguo y del Primer Período Intermedio", "vo": [["ḏꜣ.n.j", "crucé, transporté"], ["jwtj", "el que no tiene"], ["mḫnt", "barca"]], "tr": "ḏꜣ.n.j jwtj mḫnt.f", "es": "Transporté al que no tenía barca.", "an": "jwtj: relativo negativo «el que no…». jwtj mḫnt.f: «el que no tiene su barca».", "id": "12.1", "g": "𓍑𓄿𓇋𓇋𓊛𓈖𓀀 𓇋𓅱𓏏𓏭 𓅓𓐍𓈖𓏏𓊛𓆑"}, {"t": "tt", "ref": "El campesino elocuente B1, 64", "vo": [["šnḏyt", "faldellín, delantal"]], "tr": "šnḏyt nt jwtj mwt.f", "es": "delantal del que no tiene madre", "an": "nt: genitivo femenino. jwtj mwt.f «el que no tiene madre». El campesino halaga así a Rensi: lo protege todo.", "id": "12.2", "g": "𓈙𓈖𓆓𓇋𓇋𓏏𓋳 𓈖𓏏 𓇋𓅱𓏏𓏭 𓅐𓏏𓁐𓆑"}, {"t": "tt", "ref": "Libro de los Muertos, cap. 125 (introducción)", "vo": [["rḫ.kw", "conozco (estativo)"], ["ntjw", "que están"], ["wsḫt", "sala"], ["mꜣꜥtj", "las Dos Verdades"]], "tr": "rḫ.kw rn n nṯrw 42 ntjw ḥnꜥ.k m wsḫt tn nt mꜣꜥtj", "es": "Conozco el nombre de los 42 dioses que están contigo en esta sala de las Dos Verdades.", "an": "ntjw: relativo plural; su predicado es adverbial (ḥnꜥ.k m wsḫt…). tn: demostrativo femenino.", "id": "12.3", "g": "𓂋𓐍𓏛𓎡𓅱 𓂋𓈖 𓈖 𓊹𓊹𓊹 𓎆𓎆𓎆𓎆𓏤𓏤 𓈖𓏏𓅱𓏥 𓎛𓈖𓂝𓎡 𓅓 𓅱𓋴𓐍𓏏𓉐 𓏏𓈖 𓈖𓏏 𓐙𓏏𓆄𓆄"}]}, {"id": "B", "title": "Análisis", "items": [{"t": "mc", "q": "¿Qué concuerda con su antecedente: ntj o jwtj?", "op": ["Los dos: ntj, ntt, ntjw / jwtj, jwtt, jwtjw", "Solo ntj", "Solo jwtj", "Ninguno"], "ok": 0, "an": "Ambos son adjetivos relativos y concuerdan en género y número con el antecedente.", "id": "12.4"}, {"t": "mc", "q": "En una oración circunstancial sin jw, como tꜣ m kkw tras ḥtp.k m ꜣḫt jmntt (Gran Himno a Atón), ¿cómo se reconoce que es circunstancial?", "op": ["Va tras una oración principal sin conjunción y describe la situación que la acompaña", "Porque empieza por jw", "Porque tiene un verbo en perfecto", "Porque está en plural"], "ok": 0, "an": "Las oraciones circunstanciales no necesitan marca: se reconocen por su posición tras la principal y por su sentido («mientras…, estando…»).", "id": "12.5"}]}]}, "13": {"intro": "El verbo: clases de raíces. Los verbos están tomados de los textos de los temas anteriores. Identifica la clase.", "secs": [{"id": "A", "title": "¿A qué clase pertenece?", "items": [{"t": "mc", "q": "sḏm «oír»", "op": ["Trilítero fuerte", "Tercera débil", "Segunda geminada", "Anómalo"], "ok": 0, "an": "Tres radicales fuertes s-ḏ-m: no cambia en ninguna forma.", "id": "13.1", "g": "𓄔𓅓"}, {"t": "mc", "q": "mrj «amar»", "op": ["Tercera débil (3ae inf.)", "Bilítero", "Segunda geminada", "Cuatrilítero"], "ok": 0, "an": "La tercera radical j es débil: desaparece en muchas formas (mr.f) y se duplica la r en otras (mrr.f).", "id": "13.2", "g": "𓌻𓂋𓀁"}, {"t": "mc", "q": "mꜣꜣ «ver», como en mꜣ.sn pt (El náufrago 28)", "op": ["Segunda geminada (2ae gem.)", "Tercera débil", "Trilítero fuerte", "Causativo"], "ok": 0, "an": "La segunda radical se repite: mꜣꜣ. En algunas formas aparece mꜣ.f y en otras mꜣꜣ.f.", "id": "13.3", "g": "𓌳𓄿𓁹"}, {"t": "mc", "q": "rdj «dar, poner», como en rdj.n.j tꜣ n ḥqr", "op": ["Anómalo", "Trilítero fuerte", "Bilítero", "Segunda geminada"], "ok": 0, "an": "rdj alterna con dj según la forma: es uno de los verbos anómalos, junto con jj/jwj «venir».", "id": "13.4", "g": "𓂋𓂞"}, {"t": "mc", "q": "jj «venir», como en jj.n.j m njwt.j", "op": ["Anómalo", "Tercera débil regular", "Bilítero", "Causativo"], "ok": 0, "an": "jj y jwj se reparten las formas del verbo «venir»: anómalo.", "id": "13.5", "g": "𓇍𓇋𓂻"}, {"t": "mc", "q": "sꜥnḫ «hacer vivir», como en el Himno a Hapy", "op": ["Causativo (s- + ꜥnḫ)", "Cuatrilítero", "Tercera débil", "Bilítero"], "ok": 0, "an": "El prefijo s- forma causativos: ꜥnḫ «vivir» → sꜥnḫ «hacer vivir».", "id": "13.6", "g": "𓋴𓋹𓈖𓐍"}, {"t": "mc", "q": "prj «salir», como en prt m hrw «salir de día»", "op": ["Tercera débil", "Trilítero fuerte", "Segunda geminada", "Anómalo"], "ok": 0, "an": "pr-j: la j final débil hace aparecer la -t en el infinitivo (prt).", "id": "13.7", "g": "𓉐𓂋𓂻"}, {"t": "mc", "q": "ḏd «decir»", "op": ["Bilítero", "Tercera débil", "Segunda geminada", "Anómalo"], "ok": 0, "an": "Dos radicales fuertes: ḏ-d.", "id": "13.8", "g": "𓆓𓂧𓀁"}, {"t": "mc", "q": "ḫpr «llegar a ser»", "op": ["Trilítero fuerte", "Tercera débil", "Cuatrilítero", "Causativo"], "ok": 0, "an": "ḫ-p-r: tres radicales fuertes.", "id": "13.9", "g": "𓆣𓂋"}, {"t": "mc", "q": "jrj «hacer», como en jr.n.j sbt n nṯrw", "op": ["Tercera débil", "Bilítero", "Anómalo", "Segunda geminada"], "ok": 0, "an": "jr-j: en jr.n.j la j débil no se escribe; en el infinitivo aparece jrt.", "id": "13.10", "g": "𓁹𓂋"}]}, {"id": "B", "title": "Translitera la forma verbal", "items": [{"t": "t", "q": "«encontré» (El náufrago 47)", "tr": "gm.n.j", "an": "gmj «encontrar» (tercera débil) + n del perfecto + sufijo .j.", "id": "13.11", "g": "𓅠𓅓𓈖𓀀"}, {"t": "t", "q": "«hizo» (Enseñanza para Merikare)", "tr": "jr.n.f", "an": "jrj + n + .f: la j final no se escribe.", "id": "13.12", "g": "𓁹𓈖𓆑"}, {"t": "t", "q": "«el que ama, amado de» (fórmula autobiográfica)", "tr": "mrr", "an": "Forma geminada de mrj: se duplica la segunda radical.", "id": "13.13", "g": "𓌻𓂋𓂋"}]}]}, "14": {"intro": "El infinitivo: títulos de capítulos del Libro de los Muertos, enseñanzas y relatos. Fíjate en la -t de los verbos débiles y en el infinitivo negativo tm.", "secs": [{"id": "A", "title": "Translitera y traduce", "items": [{"t": "tt", "ref": "Libro de los Muertos, título general y de varios capítulos", "vo": [["rꜣ", "fórmula, capítulo (literalmente «boca»)"], ["hrw", "día"]], "tr": "rꜣ n prt m hrw|r n prt m hrw|rꜣw nw prt m hrw", "es": "Fórmula para salir de día", "an": "prt: infinitivo de prj (tercera débil, con -t), regido por n.", "id": "14.1", "g": "𓂋𓏤 𓈖 𓉐𓂋𓏏𓂻 𓅓 𓉔𓂋𓅱𓇳"}, {"t": "tt", "ref": "Libro de los Muertos, cap. 125, título", "vo": [["ꜥq", "entrar"], ["wsḫt", "sala"], ["mꜣꜥtj", "las Dos Verdades"]], "tr": "rꜣ n ꜥq r wsḫt tn nt mꜣꜥtj|r n ꜥq r wsḫt tn nt mꜣꜥtj", "es": "Fórmula para entrar en esta sala de las Dos Verdades", "an": "ꜥq: infinitivo de un verbo bilítero, sin -t.", "id": "14.2", "g": "𓂋𓏤 𓈖 𓅧𓈎𓂻 𓂋 𓅱𓋴𓐍𓏏𓉐 𓏏𓈖 𓈖𓏏 𓐙𓏏𓆄𓆄"}, {"t": "tt", "ref": "Libro de los Muertos, cap. 30B, título", "vo": [["tm", "no (infinitivo negativo)"], ["ḫsf", "oponerse"], ["ẖrt-nṯr", "la necrópolis"]], "tr": "rꜣ n tm rdj ḫsf jb n zj r.f m ẖrt-nṯr|r n tm rdj ḫsf jb n zj r.f m ẖrt-nṯr", "es": "Fórmula para no permitir que el corazón de un hombre se le oponga en la necrópolis", "an": "tm + rdj: infinitivo negativo «no dar, no permitir». rdj rige a su vez un subjuntivo (ḫsf jb…).", "id": "14.3", "g": "𓂋𓏤 𓈖 𓍃𓅓 𓂋𓂞 𓐍𓋴𓆑𓂡 𓄣𓏤 𓈖 𓊃𓇋𓀀 𓂋𓆑 𓅓 𓊹 𓄡𓂋𓏏"}, {"t": "tt", "ref": "El campesino elocuente R 1,3–4", "vo": [["jnt", "traer"], ["ꜥqw", "provisiones"], ["ẖrdw", "hijos"]], "tr": "r jnt ꜥqw jm n ẖrdw.j", "es": "para traer de allí provisiones para mis hijos", "an": "r + infinitivo: finalidad. jnt, infinitivo de jnj (tercera débil): por eso lleva -t.", "id": "14.4", "g": "𓂋 𓏎𓈖𓏏 𓂝𓈎𓅱𓏒𓏥 𓇋𓅓 𓈖 𓄡𓂋𓂧𓀔𓏥𓀀"}]}, {"id": "B", "title": "Análisis", "items": [{"t": "mc", "q": "¿Por qué prt «salir» lleva -t y ꜥq «entrar» no?", "op": ["Porque prj es tercera débil, y esos verbos forman el infinitivo en -t", "Porque prt es femenino plural", "Porque ꜥq está en pasado", "Es una variación sin regla"], "ok": 0, "an": "Los verbos de tercera débil (prj, jrj, jnj, mrj…) añaden -t en el infinitivo: prt, jrt, jnt, mrt.", "id": "14.5"}]}]}, "15": {"intro": "La construcción pseudoverbal: sujeto + ḥr/m + infinitivo (acción en curso) y sujeto + r + infinitivo (futuro).", "secs": [{"id": "A", "title": "Translitera y traduce", "items": [{"t": "tt", "ref": "El náufrago 6 (llegada a casa)", "vo": [["ḥpt", "abrazar"], ["snnw", "compañero"]], "tr": "s nb ḥr ḥpt snnw.f|zj nb ḥr ḥpt snnw.f|z nb ḥr ḥpt snnw.f", "es": "Cada uno abraza a su compañero.", "an": "Sujeto (s nb) + ḥr + infinitivo (ḥpt) + objeto: acción que está ocurriendo.", "id": "15.1", "g": "𓊃𓀀 𓎟 𓁷𓏤 𓎛𓊪𓏏𓂘 𓌢𓈖𓈖𓅱𓀀𓆑"}, {"t": "tt", "ref": "Autobiografía de Ahmose hijo de Abana (El Kab)", "vo": [["jty", "el soberano"], ["rdwj", "los dos pies"]], "tr": "jw.j ḥr šms jty ḥr rdwj.j|jw.j ḥr šms nswt ḥr rdwj.j", "es": "Yo seguía al soberano a pie.", "an": "jw + sujeto (.j) + ḥr + infinitivo: narración de una acción continuada en el pasado.", "id": "15.2", "g": "𓃛𓅱𓀀 𓁷𓏤 𓌞𓋴𓂻 𓍘𓇋𓅆 𓁷𓏤 𓂾𓂾𓀀"}]}, {"id": "B", "title": "Análisis", "items": [{"t": "mc", "q": "¿Qué diferencia hay entre jw.f ḥr sḏm y jw.f r sḏm?", "op": ["ḥr expresa acción en curso («está oyendo»); r, futuro («oirá»)", "Ninguna", "ḥr es pasado y r presente", "r expresa acción habitual"], "ok": 0, "an": "Son las dos variantes principales de la construcción pseudoverbal. También existe m + infinitivo con verbos de movimiento: jw.f m jjt «viene».", "id": "15.3"}, {"t": "mc", "q": "¿Por qué esta construcción se llama «pseudoverbal»?", "op": ["Porque tiene la forma de una oración adverbial (sujeto + preposición + sustantivo), aunque el sustantivo sea un infinitivo", "Porque no tiene sujeto", "Porque solo se usa con verbos falsos", "Porque es una forma del imperativo"], "ok": 0, "an": "ḥr sḏm es literalmente «sobre oír»: estructura adverbial con valor verbal.", "id": "15.4"}]}]}, "16": {"intro": "Imperativo, imperativo negativo, vocativos y partículas en himnos, fórmulas funerarias y textos de las pirámides.", "secs": [{"id": "A", "title": "Translitera y traduce", "items": [{"t": "tt", "ref": "Libro de los Muertos, cap. 30B (inscrito en escarabeos de corazón)", "tr": "jb.j n mwt.j jb.j n mwt.j", "es": "¡Mi corazón de mi madre! ¡Mi corazón de mi madre!", "an": "Vocativo sin partícula. n mwt.j: genitivo indirecto.", "id": "16.1", "g": "𓄣𓏤𓀀 𓈖 𓅐𓏏𓁐𓀀 𓄣𓏤𓀀 𓈖 𓅐𓏏𓁐𓀀"}, {"t": "tt", "ref": "Libro de los Muertos, cap. 30B", "vo": [["m", "¡no! (imperativo negativo)"], ["ꜥḥꜥ", "levantarse"], ["mtrw", "testigo"]], "tr": "m ꜥḥꜥ r.j m mtrw", "es": "¡No te levantes contra mí como testigo!", "an": "m (imperativo negativo de jmj) + complemento verbal: «no hagas…».", "id": "16.2", "g": "𓅓𓂝 𓊢𓂝𓂻 𓂋𓀀 𓅓 𓅓𓏏𓂋𓅱𓀀𓏥"}, {"t": "tt", "ref": "Libro de los Muertos, cap. 30B", "vo": [["ḫsf", "oponerse"], ["ḏꜣḏꜣt", "tribunal"]], "tr": "m ḫsf r.j m ḏꜣḏꜣt", "es": "¡No te opongas a mí en el tribunal!", "an": "Misma construcción. El difunto pide a su corazón que no lo acuse en el juicio.", "id": "16.3", "g": "𓅓𓂝 𓐍𓋴𓆑𓂡 𓂋𓀀 𓅓 𓆓𓄿𓆓𓄿𓏏𓉐"}, {"t": "tt", "ref": "Llamada a los vivos, en estelas y tumbas del Reino Medio", "vo": [["j", "¡oh!"], ["tpjw", "que están sobre (nisbe)"]], "tr": "j ꜥnḫw tpjw tꜣ", "es": "¡Oh vivos que estáis sobre la tierra!", "an": "j: partícula de vocativo. ꜥnḫw «los vivos» (participio sustantivado) + nisbe tpjw.", "id": "16.4", "g": "𓇋𓀁 𓋹𓈖𓐍𓅱𓀀𓏥 𓁶𓊪𓅱𓏭𓏥 𓇾𓏤"}, {"t": "tt", "ref": "Himno a Hapy, primera línea", "tr": "jnḏ ḥr.k ḥꜥpj|jnḏ-ḥr.k ḥꜥpj", "es": "¡Salve a ti, Hapy!", "an": "Fórmula fija de saludo con la que empiezan muchos himnos.", "id": "16.5", "g": "𓇋𓈖𓂧 𓎛𓁷𓏤𓎡 𓎛𓂝𓊪𓇋𓈗"}]}, {"id": "B", "title": "Análisis", "items": [{"t": "mc", "q": "¿Cómo se forma el imperativo negativo?", "op": ["Con m (imperativo de jmj) + complemento verbal: m ꜥḥꜥ", "Con nn + infinitivo", "Con n + sḏm.f", "Con tm + imperativo"], "ok": 0, "an": "m «¡no hagas!» va seguido de una forma verbal especial (el complemento negativo o el infinitivo, según el análisis).", "id": "16.6"}]}]}, "17": {"intro": "El estativo: estados resultantes y, con verbos intransitivos, acciones completadas. Fíjate en las terminaciones .kw, .tj, .w.", "secs": [{"id": "A", "title": "Translitera y traduce", "items": [{"t": "tt", "ref": "El náufrago 36–37", "vo": [["ꜥḥꜥ.n", "entonces"], ["mt", "morir"]], "tr": "ꜥḥꜥ.n dpt mt.tj", "es": "Entonces el barco pereció.", "an": "mt.tj: estativo 3.ª persona femenina (dpt es femenino). ꜥḥꜥ.n + sujeto + estativo es un esquema narrativo frecuente.", "id": "17.1", "g": "𓊢𓂝𓈖 𓂧𓊪𓏏𓊛 𓅓𓏏𓏏𓏭𓀐"}, {"t": "tt", "ref": "Textos de los Sarcófagos (CT I 187e)", "vo": [["šm.n.k", "te has ido"]], "tr": "šm.n.k ꜥnḫ.tj", "es": "Te has ido vivo.", "an": "ꜥnḫ.tj: estativo de 2.ª persona como complemento de estado («estando vivo»).", "id": "17.2", "g": "𓈙𓅓𓂻𓈖𓎡 𓋹𓈖𓐍𓏏𓏭"}, {"t": "tt", "ref": "Tras los nombres de las reinas (p. ej., Nefertiti)", "tr": "ꜥnḫ.tj ḏt", "es": "viva para siempre", "an": "Estativo de 3.ª persona femenina: «estando viva».", "id": "17.3", "g": "𓋹𓈖𓐍𓏏𓏭 𓆓𓏏𓇿"}, {"t": "tt", "ref": "Libro de los Muertos, cap. 125 (el difunto ante Osiris)", "tr": "rḫ.kw ṯw rḫ.kw rn.k", "es": "Te conozco, conozco tu nombre.", "an": "rḫ.kw: estativo de 1.ª persona. Con rḫ «llegar a saber», el estativo significa «sé»: el estado que resulta de haber aprendido.", "id": "17.4", "g": "𓂋𓐍𓏛𓎡𓅱 𓍿𓅱 𓂋𓐍𓏛𓎡𓅱 𓂋𓈖𓎡"}, {"t": "tt", "ref": "Libro de los Muertos, cap. 17", "vo": [["sf", "ayer"], ["dwꜣw", "mañana"]], "tr": "jnk sf jw.j rḫ.kw dwꜣw", "es": "Yo soy el ayer y conozco el mañana.", "an": "jw.j rḫ.kw: jw + sujeto + estativo.", "id": "17.5", "g": "𓇋𓈖𓎡 𓋴𓆑𓇳 𓃛𓅱𓀀 𓂋𓐍𓏛𓎡𓅱 𓇼𓅱𓇳"}, {"t": "tt", "ref": "Nombre de nacimiento de Amenhotep III", "vo": [["ḥqꜣ", "soberano"]], "tr": "jmn-ḥtp ḥqꜣ wꜣst|jmn ḥtp ḥqꜣ wꜣst", "es": "Amenhotep («Amón está satisfecho»), soberano de Tebas", "an": "jmn ḥtp(.w): sujeto + estativo. El nombre es una oración.", "id": "17.6", "g": "𓍹 𓇋𓏠𓈖 𓊵𓏏𓊪 𓋾 𓋆𓏏𓊖 𓍺"}]}, {"id": "B", "title": "Análisis", "items": [{"t": "mc", "q": "¿Qué terminación de estativo corresponde a la 1.ª persona del singular?", "op": [".kw", ".tj", ".w", ".n"], "ok": 0, "an": ".kw (1.ª sg.), .tj (2.ª sg. y 3.ª fem.), .w o sin terminación (3.ª masc.).", "id": "17.7"}]}]}, "18": {"intro": "El perfecto sḏm.n.f: la acción completada, la forma narrativa de las autobiografías y de El náufrago.", "secs": [{"id": "A", "title": "Translitera y traduce", "items": [{"t": "tt", "ref": "El náufrago 9–10", "vo": [["pḥwj", "extremo, final"], ["wꜣwꜣt", "Uauat (Baja Nubia)"], ["zn", "pasar"], ["snmwt", "Senmut (isla de Bigga)"]], "tr": "pḥ.n.n pḥwj wꜣwꜣt zn.n.n snmwt|pḥ.n.n pḥwj wꜣwꜣt sn.n.n snmwt", "es": "Hemos alcanzado el extremo de Uauat, hemos pasado Senmut.", "an": "Dos perfectos de 1.ª plural: verbo + n del perfecto + sufijo .n «nosotros».", "id": "18.1", "g": "𓄖𓂻𓈖𓈖𓏥 𓄖𓅱𓏭 𓍯𓄿𓍯𓄿𓏏𓈉 𓊃𓈖𓂻𓈖𓈖𓏥 𓋴𓈖𓅓𓅱𓏏𓈉"}, {"t": "tt", "ref": "El náufrago 43–44", "vo": [["qnj", "abrazar"], ["šwyt", "sombra"]], "tr": "qnj.n.j šwyt", "es": "Me abracé a la sombra.", "an": "Perfecto de un verbo de tercera débil: la j final no aparece ante -n.", "id": "18.2", "g": "𓈎𓈖𓇋𓂘𓈖𓀀 𓈙𓅱𓏭𓏏𓋺"}, {"t": "tt", "ref": "El náufrago 55–56", "vo": [["šd", "sacar, tomar"], ["dꜣ", "taladro de fuego"]], "tr": "šd.n.j dꜣ jr.n.j ḫt", "es": "Saqué un taladro de fuego y encendí fuego.", "an": "Dos perfectos seguidos: acciones sucesivas completadas.", "id": "18.3", "g": "𓈙𓂧𓈖𓀀 𓂧𓄿𓍒 𓁹𓈖𓀀 𓐍𓏏𓊮"}, {"t": "tt", "ref": "Estela de Semna de Senuseret III (Berlín 1157)", "vo": [["ḥꜣw", "exceso, añadido"], ["swdt", "herencia, lo legado"]], "tr": "rdj.n.j ḥꜣw ḥr swdt n.j", "es": "Añadí a lo que se me había legado.", "an": "rdj.n.j: perfecto del verbo anómalo rdj.", "id": "18.4", "g": "𓂋𓂞𓈖𓀀 𓇉𓄿𓅱𓏛 𓁷𓏤 𓋴𓅱𓂧𓏏𓏛 𓈖𓀀"}, {"t": "tt", "ref": "Fórmula autobiográfica de tumbas provinciales (Imperio Antiguo y Primer Período Intermedio)", "vo": [["jj", "venir"], ["hꜣj", "bajar"], ["spꜣt", "provincia, nomo"]], "tr": "jj.n.j m njwt.j hꜣ.n.j m spꜣt.j", "es": "Vine de mi ciudad, bajé de mi provincia.", "an": "Perfectos de verbos de movimiento con m «desde».", "id": "18.5", "g": "𓇍𓇋𓂻𓈖𓀀 𓅓 𓊖𓏏𓀀 𓉔𓄿𓂻𓈖𓀀 𓅓 𓋴𓊪𓄿𓏏𓈈𓀀"}]}]}, "19": {"intro": "El subjuntivo: deseos, finalidad, y como complemento de verbos como rdj «hacer que» o jmj «haz que».", "secs": [{"id": "A", "title": "Translitera y traduce", "items": [{"t": "tt", "ref": "Llamada a los vivos (estelas del Reino Medio)", "vo": [["ḏd.ṯn", "que digáis"], ["jmꜣḫy", "venerado"]], "tr": "ḏd.ṯn ḫꜣ m t ḥnqt ḫꜣ m kꜣ ꜣpd n kꜣ n jmꜣḫy", "es": "…que digáis: «Mil de pan y cerveza, mil de bueyes y aves, para el ka del venerado».", "an": "ḏd.ṯn: subjuntivo de deseo o petición («que digáis»), con sufijo de 2.ª plural .ṯn.", "id": "19.1", "g": "𓆓𓂧𓍿𓈖𓏥 𓆼 𓅓 𓏐 𓏊 𓆼 𓅓 𓃾 𓅾 𓈖 𓂓𓏤 𓈖 𓄪𓇋𓇋"}, {"t": "tt", "ref": "Enseñanza para Merikare E 46", "vo": [["wꜣḥ", "perdurar"], ["tp tꜣ", "sobre la tierra"]], "tr": "jr mꜣꜥt wꜣḥ.k tp tꜣ", "es": "Practica Maat, para que perdures sobre la tierra.", "an": "jr: imperativo. wꜣḥ.k: subjuntivo de finalidad.", "id": "19.2", "g": "𓁹𓂋 𓆄𓏏 𓎝𓎛𓎡 𓁶𓏤 𓇾𓏤"}]}, {"id": "B", "title": "Análisis", "items": [{"t": "mc", "q": "En jr mꜣꜥt wꜣḥ.k tp tꜣ, ¿qué valor tiene el subjuntivo wꜣḥ.k?", "op": ["Finalidad: «para que perdures»", "Pasado: «perduraste»", "Condición: «si perduras»", "Pregunta: «¿perduras?»"], "ok": 0, "an": "Tras un imperativo, el subjuntivo expresa la finalidad o la consecuencia deseada.", "id": "19.3"}, {"t": "mc", "q": "¿Qué forma tiene el subjuntivo de los verbos de tercera débil como mrj?", "op": ["Sin geminar: mr.f (con -j a veces escrita)", "Geminada: mrr.f", "Con -n: mr.n.f", "Con -t: mrt.f"], "ok": 0, "an": "El subjuntivo no gemina. La forma geminada mrr.f es imperfectiva.", "id": "19.4"}]}]}, "20": {"intro": "Perfectivo e imperfectivo: n sḏm.f para negar el pasado y el sḏm.f en himnos y descripciones.", "secs": [{"id": "A", "title": "Translitera y traduce", "items": [{"t": "tt", "ref": "Libro de los Muertos, cap. 125 (declaración de inocencia)", "vo": [["jsft", "mal, injusticia"]], "tr": "n jr.j jsft r rmṯ", "es": "No he cometido injusticia contra la gente.", "an": "n + sḏm.f (perfectivo): negación de una acción pasada. Se traduce como pretérito o como pretérito perfecto.", "id": "20.1", "g": "𓂜 𓁹𓀀 𓇋𓋴𓆑𓏏𓅪 𓂋 𓂋𓅓𓍿𓀀𓁐𓏥"}, {"t": "tt", "ref": "Libro de los Muertos, cap. 125", "vo": [["ḥqr", "hambre"], ["rmj", "llanto"]], "tr": "n rdj.j ḥqr n rdj.j rmj", "es": "No he causado hambre, no he causado llanto.", "an": "Dos n sḏm.f con rdj «dar, causar».", "id": "20.2", "g": "𓂜 𓂋𓂞𓀀 𓎛𓈎𓂋𓀁 𓂜 𓂋𓂞𓀀 𓂋𓅓𓁿"}, {"t": "tt", "ref": "Gran Himno a Atón, primera línea", "vo": [["wbn", "alzarse, salir (el sol)"]], "tr": "wbn.k nfr m ꜣḫt nt pt", "es": "Te alzas hermoso en el horizonte del cielo.", "an": "wbn.k: sḏm.f de acción general o repetida (imperfectivo). nfr es un adjetivo usado como adverbio.", "id": "20.3", "g": "𓅱𓃀𓈖𓇳𓎡 𓄤𓆑𓂋 𓅓 𓅜𓐍𓏏𓈌 𓈖𓏏 𓊪𓏏𓇯"}]}, {"id": "B", "title": "Análisis", "items": [{"t": "mc", "q": "¿Qué expresa n sḏm.f?", "op": ["La negación de una acción pasada: «no oyó, no ha oído»", "Un mandato negativo", "Futuro negativo", "Una pregunta"], "ok": 0, "an": "n sḏm.f niega el pasado; n sḏm.n.f, en cambio, suele negar la capacidad o lo general («no puede oír»).", "id": "20.4"}, {"t": "mc", "q": "¿Cómo se distingue a menudo el imperfectivo del perfectivo en los verbos de tercera débil?", "op": ["Por la geminación: mrr.f (imperfectivo) frente a mr.f (perfectivo)", "Por la -n", "Por la -t", "No se pueden distinguir nunca"], "ok": 0, "an": "La geminación marca la acción repetida o continua.", "id": "20.5"}]}]}, "21": {"intro": "El prospectivo y las formas pasivas (sḏm.tw.f y el pasivo sḏm.f).", "secs": [{"id": "A", "title": "Translitera y traduce", "items": [{"t": "tt", "ref": "Estela de Semna de Senuseret III (Berlín 1157)", "vo": [["ms", "dar a luz, nacer"]], "tr": "ms.tw.f n ḥm.j", "es": "Ha nacido para Mi Majestad.", "an": "ms.tw.f: forma pasiva con -tw: «es dado a luz». ḥm.j «Mi Majestad».", "id": "21.1", "g": "𓄟𓋴𓏏𓅱𓆑 𓈖 𓍛𓀀"}, {"t": "tt", "ref": "Autobiografía de Ahmose hijo de Abana (El Kab)", "vo": [["nbw n qnt", "«el oro del valor» (condecoración militar)"]], "tr": "jw rdj.tw n.j nbw n qnt", "es": "Se me concedió el oro del valor.", "an": "rdj.tw: pasivo con -tw. El sujeto lógico es nbw n qnt.", "id": "21.2", "g": "𓃛𓅱 𓂋𓂞𓏏𓅱 𓈖𓀀 𓋞 𓈖 𓈎𓈖𓏏𓂡"}]}, {"id": "B", "title": "Análisis", "items": [{"t": "mc", "q": "¿Cuál es la marca de la mayoría de las formas pasivas del verbo?", "op": ["E
